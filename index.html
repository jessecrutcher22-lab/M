<style>
:root{
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;

  --tap:44px;
  --tap-sm:40px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-ui);font-size:13px;background:#f1f5f9;color:#0f172a;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.sval,.plrow span,.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.display{font-family:var(--font-display);letter-spacing:-0.02em}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit;border:none;outline:none;transition:all 0.1s;touch-action:manipulation}
button:active{transform:scale(0.96)}
input{font-family:inherit;outline:none}
input[type=number]{-moz-appearance:textfield;background:#fff;border:1px solid #cbd5e1;border-radius:4px;color:#0f172a;font-size:11px;padding:5px 8px;width:100%}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=range]{accent-color:#2563eb;width:100%}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
.card{background:#fff;border-radius:10px;padding:13px 14px;margin-bottom:9px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sl{font-size:11px;color:#64748b;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;font-weight:700;margin-top:6px;font-family:var(--font-display)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sbox{background:#fff;border-radius:6px;padding:8px 10px;border:1px solid #e2e8f0}
.slbl{font-size:11px;color:#64748b;margin-bottom:3px;font-weight:500}
.sval{font-size:15px;font-weight:700;font-family:var(--font-display);font-variant-numeric:tabular-nums}
@keyframes popIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.35)}50%{box-shadow:0 0 0 6px rgba(22,163,74,0)}}
@keyframes countUp{from{transform:translateY(-3px);opacity:.5}to{transform:translateY(0);opacity:1}}
.affordable{animation:pulseGlow 2.2s ease-in-out infinite}
.cash-tick{animation:countUp .25s ease}
.aff-badge{font-size:11.5px;background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:.5px}
.mini-bar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:6px}
.mini-fill{height:100%;border-radius:3px;transition:width .5s ease}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e2e8f0;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.tab-btn{flex-shrink:0;padding:0 14px;min-height:var(--tap);background:none;border:none;border-bottom:3px solid transparent;font-size:12.5px;color:#64748b;white-space:nowrap;font-family:var(--font-ui);font-weight:600}
.tab-btn.on{color:#2563eb;border-bottom-color:#2563eb;font-weight:bold}
#flash{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;border-radius:6px;padding:8px 18px;font-size:12px;z-index:9999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);display:none}
@keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-200%)}}
.tick{display:inline-block;white-space:nowrap;animation:ticker 30s linear infinite}
.content{padding:10px;overflow-y:auto;flex:1}
.plrow{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #f1f5f9;font-size:12.5px;gap:10px}
.plrow.bold{font-weight:700;font-size:13px}
.plrow.ind{padding-left:20px}
.fin-nav{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.fn{padding:0 14px;min-height:var(--tap-sm);border-radius:8px;font-size:12.5px;font-family:var(--font-ui);border:1px solid #e2e8f0;background:#fff;color:#374151;cursor:pointer;font-weight:600}
.fn.on{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:bold}
@keyframes tutPulse{0%,100%{box-shadow:inset 0 -3px 0 0 #f59e0b}50%{box-shadow:inset 0 -3px 0 0 #fcd34d}}
.tab-btn.tut-hl{color:#b45309!important;animation:tutPulse 1.1s ease-in-out infinite}
.tab-btn.tut-hl::after{content:"●";color:#f59e0b;font-size:9px;margin-left:4px;vertical-align:middle}
#tutCoach button:active{transform:scale(0.97)}
</style>
</head>

const pmt=(P,r,n)=>{const rm=r/12;return P*rm/(1-Math.pow(1+rm,-n))};
const ts=()=>{const d=new Date();return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")+":"+d.getSeconds().toString().padStart(2,"0")};

// ── COMPUTED ──────────────────────────────────────────────────
function speed(){let s=1;if(G.exps.includes("autoLine"))s*=2;if(G.exps.includes("robotics2"))s*=2;s*=(1+(G.work.engineer||0)*0.05);G.acqs.forEach(id=>{const a=ACQ[id];if(a&&a.bonus&&a.bonus.speedBonus)s*=(1+a.bonus.speedBonus)});if(G.shop){s*=(1+0.12*(G.shop.speed||0));s*=(1+0.06*(G.shop.rnd||0))}return s}
function expB(){let b=1;if(G.exps.includes("isoQual"))b*=1.2;if(G.exps.includes("sixSigma"))b*=1.3;b*=(1+(G.ostaff.salesRep||0)*0.08);if(G.oequip.includes("crm"))b*=1.05;if(G.oequip.includes("comms"))b*=1.03;if(G.shop){b*=(1+0.08*(G.shop.sales||0));b*=(1+0.06*(G.shop.rnd||0))}return b}
function impD(){let d=1;if(G.exps.includes("logistics"))d*=0.9;d*=Math.pow(0.95,G.ostaff.procurement||0);if(G.oequip.includes("erp"))d*=0.92;if(G.shop)d*=Math.pow(0.95,G.shop.proc||0);return d}
function propCount(id){const v=G.props[id];return v===true?1:(v||0)}
function maxSlots(){return Object.entries(PROPS).reduce((a,[id,p])=>a+propCount(id)*p.slots,0)}
function usedSlots(){return Object.entries(MACH).reduce((a,[id,m])=>a+(G.mach[id]||0)*m.slots,0)}
function wareM(){return Object.entries(PROPS).reduce((a,[id,p])=>a+propCount(id)*p.wareM,0)}
function wareP(){return Object.entries(PROPS).reduce((a,[id,p])=>a+propCount(id)*p.wareP,0)}
function unlockedMachs(){return G.plines.flatMap(l=>PL[l]?PL[l].machs:[])}
// Raw materials / products the Trade Manager should handle = only those tied to unlocked machines
function tmMats(){const s=new Set();unlockedMachs().forEach(mid=>{const m=MACH[mid];const p=m&&PROD[m.prod];if(p)Object.keys(p.in).forEach(k=>{if(MAT[k])s.add(k)})});return Object.keys(MAT).filter(k=>s.has(k))}
function tmProds(){const s=new Set();unlockedMachs().forEach(mid=>{if(MACH[mid])s.add(MACH[mid].prod)});return Object.keys(PROD).filter(k=>s.has(k))}
function revPerSec(){let ops=G.work.operator||0,r=0,sp=speed(),eb=expB();Object.entries(MACH).forEach(([id,m])=>{const c=G.mach[id]||0;if(!c)return;const a=Math.min(c,Math.floor(ops/m.ops));ops-=a*m.ops;r+=a*(m.rpm/60)*sp*(G.prodP[m.prod]||0)*eb});return r}
function wageHr(){let w=Object.entries(WORK).reduce((a,[id,wt])=>a+(G.work[id]||0)*wt.wage,0)+Object.entries(OSTAFF).reduce((a,[id,wt])=>a+(G.ostaff[id]||0)*wt.wage,0);if(G.oequip.includes("robots2"))w-=200;return Math.max(0,w)}
function totalDebt(){return G.loans.reduce((a,l)=>a+l.remaining,0)}
function monthDebt(){return G.loans.reduce((a,l)=>a+l.monthly,0)}
function netWorth(){
  const mv=Object.entries(MACH).reduce((a,[id,m])=>a+(G.mach[id]||0)*m.cost,0);
  const pv=Object.entries(PROPS).reduce((a,[id,p])=>a+propCount(id)*p.cost,0);
  const ev=G.oequip.reduce((a,id)=>a+(OEQUIP[id]?OEQUIP[id].cost:0),0);
  const sv=Object.entries(G.sHold).reduce((a,[t,q])=>a+q*(G.sPrices[t]||0),0);
  const rv=Object.entries(G.reProps).filter(([,p])=>p.owned).reduce((a,[id])=>a+(RE[id]?RE[id].cost:0),0);
  const av=G.acqs.reduce((a,id)=>a+(ACQ[id]?ACQ[id].cost:0),0);
  return G.cash+mv+pv+ev+sv+rv+av-totalDebt();
}

// ── GAME LOOP ─────────────────────────────────────────────────
function tick(){
  if(screen!=="game")return;   // pause while on home screen
  const dt=TICK/1000;
  G.time+=dt;
  const sp=speed(),eb=expB(),id2=impD(),mxM=wareM(),mxP=wareP();

  // Production
  let ops=G.work.operator||0;
  const totProd=Object.values(G.inv).reduce((a,v)=>a+v,0);
  Object.entries(MACH).forEach(([mid,m])=>{
    const cnt=G.mach[mid]||0;if(!cnt)return;
    const act=Math.min(cnt,Math.floor(ops/m.ops));
    ops-=act*m.ops;if(!act)return;
    const p=PROD[m.prod];if(!p)return;
    if(totProd>=mxP)return;
    let make=(m.rpm/60)*dt*act*sp;
    make=Math.min(make,mxP-totProd);
    Object.entries(p.in).forEach(([mat,amt])=>{make=Math.min(make,(G.mats[mat]||0)/amt)});
    if(make<=0.0001)return;
    Object.entries(p.in).forEach(([mat,amt])=>{G.mats[mat]=Math.max(0,(G.mats[mat]||0)-make*amt)});
    G.inv[m.prod]=(G.inv[m.prod]||0)+make;
  });

  // Wages
  const wps=wageHr()/3600;
  G.cash-=wps*dt;G.spent+=wps*dt;G.wagesPaid+=wps*dt;

  // Monthly
  const doMo=G.time-G.lastLoan>=GM;
  if(doMo){
    G.lastLoan=G.time;
    // Loan repayments
    G.loans=G.loans.map(l=>{
      G.cash-=l.monthly;G.spent+=l.monthly;
      const int=l.remaining*(l.rate/12);G.intPaid+=int;
      const pp=Math.min(l.monthly-int,l.remaining);
      return{...l,remaining:Math.max(0,l.remaining-pp),monthsLeft:l.monthsLeft-1};
    }).filter(l=>l.monthsLeft>0&&l.remaining>0.01);
    // Real estate
    Object.entries(G.reProps).forEach(([id,prop])=>{
      if(!prop.owned)return;const def=RE[id];if(!def||!def.rent)return;
      const um=prop.upgrades.reduce((a,uid)=>a+(REUPG[uid]?REUPG[uid].rb:0),0);
      const uk=prop.upgrades.includes("solar")?0.9:1;
      const rent=def.rent*(1+um),upkeep=def.upkeep*uk;
      if(Math.random()<0.04){G.cash-=upkeep;G.spent+=upkeep;}
      else{G.cash+=rent-upkeep;G.earned+=rent;G.reRent+=rent;G.spent+=upkeep;}
    });
    // Acquisition revenue
    G.acqs.forEach(id=>{const a=ACQ[id];if(!a)return;G.cash+=a.revenue;G.earned+=a.revenue;G.acqRev+=a.revenue});
    // Full monthly income statement snapshot
    const prev=G.finHist[G.finHist.length-1];
    const mRev=G.earned-(prev?prev._e:0);
    const mExp=G.spent-(prev?prev._s:0);
    const mWages=G.wagesPaid-(prev?prev._w:0);
    const mMatCost=G.matCost-(prev?prev._m:0);
    const mIntPaid=G.intPaid-(prev?prev._i:0);
    const mReRent=G.reRent-(prev?prev._rr:0);
    const mAcqRev=G.acqRev-(prev?prev._ar:0);
    const mDivRev=G.divTotal-(prev?prev._dv:0);
    // Per-product revenue this month
    const mRevByP={};
    Object.keys(G.revByP).forEach(k=>{mRevByP[k]=(G.revByP[k]||0)-(prev&&prev._rbp?prev._rbp[k]||0:0)});
    const mCogsByP={};
    Object.keys(G.cogsByP).forEach(k=>{mCogsByP[k]=(G.cogsByP[k]||0)-(prev&&prev._cbp?prev._cbp[k]||0:0)});
    const mMfgRev=Object.values(mRevByP).reduce((a,v)=>a+v,0);
    const mCogs=Object.values(mCogsByP).reduce((a,v)=>a+v,0);
    const mGrossProfit=mMfgRev+mReRent+mAcqRev+mDivRev-mCogs;
    const mOpex=mWages+Math.max(0,mExp-mWages-mMatCost-mIntPaid-mCogs);
    const mEbitda=mGrossProfit-mOpex;
    const mDepn=(Object.entries(MACH).reduce((a,[id,m])=>a+(G.mach[id]||0)*m.cost,0)+Object.entries(PROPS).filter(([id])=>G.props[id]&&id!=="starter").reduce((a,[,p])=>a+p.cost,0))*0.05/12;
    const mEbit=mEbitda-mDepn;
    const mEbt=mEbit-mIntPaid;
    const mTax=Math.max(0,mEbt*0.21);
    const mNet=mEbt-mTax;
    const monthNum=Math.floor(G.time/GM);
    G.finHist.push({
      month:monthNum,yr:Math.floor((monthNum-1)/12)+1,mo:(monthNum-1)%12+1,
      cash:G.cash,
      // Revenue
      mfgRev:mMfgRev,reRev:mReRent,acqRev:mAcqRev,divRev:mDivRev,
      totalRev:mMfgRev+mReRent+mAcqRev+mDivRev,
      // Costs
      cogs:mCogs,wages:mWages,opex:mOpex,intPaid:mIntPaid,depn:mDepn,
      // Profit lines
      grossProfit:mGrossProfit,ebitda:mEbitda,ebit:mEbit,ebt:mEbt,tax:mTax,net:mNet,
      // Per product
      revByP:mRevByP,cogsByP:mCogsByP,
      // Cumulative markers
      _e:G.earned,_s:G.spent,_w:G.wagesPaid,_m:G.matCost,_i:G.intPaid,
      _rr:G.reRent,_ar:G.acqRev,_dv:G.divTotal,
      _rbp:{...G.revByP},_cbp:{...G.cogsByP},
    });
    if(G.finHist.length>36)G.finHist.shift(); // keep 3 years
  }

  // Dividends quarterly
  if(G.time-G.lastDiv>=GM*3){
    G.lastDiv=G.time;
    let dt2=0;
    Object.entries(G.sHold).forEach(([t,q])=>{if(!q)return;dt2+=q*(G.sPrices[t]*SHARES[t].div)/4});
    if(dt2>0){G.cash+=dt2;G.earned+=dt2;G.divTotal+=dt2}
  }

  // Trade Manager
  const tmCyc=(G.ostaff.itManager||0)>0?2:5;
  if(G.tmOn&&G.time-G.lastTM>=tmCyc){
    G.lastTM=G.time;
    const matStock=Object.values(G.mats).reduce((a,v)=>a+v,0);
    tmMats().forEach(mid=>{
      const m=MAT[mid];const c=G.tmCfg[mid];if(!c||!c.on)return;
      if((G.mats[mid]||0)>c.min)return;
      if(matStock>=mxM)return;
      const price=(G.matP[mid]||m.bp)*id2;
      if(price>c.maxP)return;
      const qty=Math.min(c.qty,c.target-(G.mats[mid]||0),mxM-matStock);
      if(qty<=0)return;const cost=qty*price;
      if(G.cash<cost+1000)return;
      G.mats[mid]=(G.mats[mid]||0)+qty;
      G.cash-=cost;G.spent+=cost;G.matCost+=cost;
      G.tmLog.unshift({time:ts(),type:"import",msg:m.emoji+" Imported "+qty+" "+m.name+" "+f(cost)});
    });
    Object.entries(PROD).forEach(([pid,p])=>{
      const c=G.tmCfg[pid];if(!c||!c.sell)return;
      const stock=G.inv[pid]||0;if(stock<0.5)return;
      const price=(G.prodP[pid]||p.bp)*eb,thr=p.bp*c.thresh;
      if(price<thr)return;
      const rev=stock*price,cogs=Object.entries(p.in).reduce((a,[mat,amt])=>a+amt*stock*(G.matP[mat]||0),0);
      G.inv[pid]=0;G.cash+=rev;G.earned+=rev;
      G.revByP[pid]=(G.revByP[pid]||0)+rev;G.cogsByP[pid]=(G.cogsByP[pid]||0)+cogs;
      G.tmLog.unshift({time:ts(),type:"export",msg:p.emoji+" Sold "+stock.toFixed(1)+" "+p.name+" "+f(rev)});
    });
    if(G.tmLog.length>60)G.tmLog.length=60;
  }

  // Share prices
  Object.entries(SHARES).forEach(([t,def])=>{G.sPrices[t]=Math.max(0.5,G.sPrices[t]*(1+(Math.random()-0.49)*def.vol))});
  if(Math.floor(G.time/10)>Math.floor((G.time-dt)/10)){
    Object.keys(SHARES).forEach(t=>{G.sHist[t]=[...G.sHist[t].slice(-19),G.sPrices[t]]});
  }
  // Market drift
  if(Math.floor(G.time/45)>Math.floor((G.time-dt)/45)){
    Object.entries(MAT).forEach(([k,v])=>{G.matP[k]=v.bp*(0.75+Math.random()*0.5)});
    Object.entries(PROD).forEach(([k,v])=>{G.prodP[k]=v.bp*(0.75+Math.random()*0.5)});
    G.news=HEADLINES[Math.floor(Math.random()*HEADLINES.length)];
  }
  Object.keys(G.cd).forEach(id=>{G.cd[id]=Math.max(0,G.cd[id]-dt)});
  checkNewUnlocks();
  // Auto-submit when a new wealth tier is reached
  const _nw=netWorth();
  const _tier=lbRank(_nw).t;
  if(G._lastTier&&G._lastTier!==_tier&&_nw>1e5)submitScore(true);
  G._lastTier=_tier;

  // Monthly event (every GM seconds = 1 game month)
  if(G.time-G.lastMonthEvent>=GM&&G.time>GM*2){
    G.lastMonthEvent=G.time;
    if(Math.random()<0.55){// 55% chance each month
      const pool=MONTHLY_EVENTS;
      const ev=pool[Math.floor(Math.random()*pool.length)];
      const result=ev.effect(G);
      showEventModal(ev,result);
    }
  }

  // Yearly event (every GM*12 seconds = 1 game year)
  if(G.time-G.lastYearEvent>=GM*12&&G.time>GM*12){
    G.lastYearEvent=G.time;
    const ev=YEARLY_EVENTS[Math.floor(Math.random()*YEARLY_EVENTS.length)];
    const result=ev.effect(G);
    showEventModal(ev,result,true);
  }

  tutCheck();
  render();
}

function machEcon(id){
  const m=MACH[id],p=PROD[m.prod];if(!m||!p)return null;
  const rate=m.rpm/60;
  let mc=0;Object.entries(p.in).forEach(([k,q])=>{mc+=q*(MAT[k]?(G.matP[k]||MAT[k].bp):(G.prodP[k]||PROD[k].bp))});
  const sell=(G.prodP[m.prod]||p.bp);
  const gross=rate*(sell-mc)*speed()*expB();
  const wage=(m.ops*WORK.operator.wage)/3600;
  const net=gross-wage;
  return{rate,matCost:mc,sell,gross,net,wage,
    margin:sell>0?((sell-mc)/sell*100):0,
    perSlot:net/m.slots,perOp:net/m.ops,
    payback:net>0?m.cost/net/60:null,
    roi:net>0?(net*60*60*24*365/m.cost*100):0};
}
function machineCount(){return Object.values(G.mach).reduce((a,v)=>a+v,0)}
function isTabUnlocked(id){const t=TABS.find(x=>x.id===id);return t?t.unlock():false}

function checkNewUnlocks(){
  if(!G.seenTabs)G.seenTabs=["factory","property","finance","help","support","leaderboard"];
  const newly=TABS.filter(t=>t.unlock()&&!G.seenTabs.includes(t.id));
  if(newly.length>0){
    newly.forEach(t=>G.seenTabs.push(t.id));
    const t=newly[0];
    showUnlockToast(t.label);
    trackEvent("tab_unlocked",{tab:t.id});
  }
}

// Submit the current run to the board
async function submitScore(silent){
  const entry={
    name:(G.company||"Anonymous").slice(0,28),
    net_worth:Math.round(netWorth()),
    revenue:Math.round(G.earned),
    months:Math.floor(G.time/GM),
    machines:Object.values(G.mach).reduce((a,v)=>a+v,0),
    acquisitions:G.acqs.length,
    created_at:new Date().toISOString(),
  };

  // Always record locally so the board is never empty
  let local=lbLocalScores();
  const existing=local.findIndex(s=>s.name===entry.name);
  if(existing>=0){ if(entry.net_worth>local[existing].net_worth) local[existing]=entry; }
  else local.push(entry);
  local.sort((a,b)=>b.net_worth-a.net_worth);
  lbSaveLocal(local.slice(0,100));

  trackEvent("submit_score",{net_worth:entry.net_worth});

  if(!LB_API){
    if(!silent)flash("🏆 Score saved to your local board");
    lbCache=null; render(); return;
  }
  try{
    const headers={"Content-Type":"application/json"};
    if(LB_KEY){headers["apikey"]=LB_KEY;headers["Authorization"]="Bearer "+LB_KEY;}
    const res=await fetch(LB_SUBMIT,{method:"POST",headers,body:JSON.stringify(entry)});
    if(!res.ok)throw new Error("HTTP "+res.status);
    if(!silent)flash("🏆 Submitted to the global leaderboard!");
    lbCache=null; lbLastFetch=0; fetchLeaderboard();
  }catch(e){
    console.warn("Leaderboard submit failed",e);
    if(!silent)flash("⚠ Couldn't reach the global board — saved locally");
    render();
  }
}

async function fetchLeaderboard(force){
  if(!LB_API){ lbCache=lbLocalScores(); render(); return; }
  if(lbLoading)return;
  if(!force&&lbCache&&Date.now()-lbLastFetch<30000)return;
  lbLoading=true; lbError=null; render();
  try{
    const headers={};
    if(LB_KEY){headers["apikey"]=LB_KEY;headers["Authorization"]="Bearer "+LB_KEY;}
    const url=LB_API+(LB_API.includes("?")?"&":"?")+"select=*&order=net_worth.desc&limit=100";
    const res=await fetch(url,{headers});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    lbCache=Array.isArray(data)?data:[];
    lbLastFetch=Date.now();
  }catch(e){
    lbError="Couldn't load the global board. Showing your local scores.";
    lbCache=lbLocalScores();
  }
  lbLoading=false; render();
}

// ── SAVE SYSTEM ───────────────────────────────────────────────
const SAVE_KEY="mfgTycoon_saves";
const MAX_SLOTS=3;
let screen="home";      // "home" | "game"
let activeSlot=null;
let autoSaveTimer=null;

let _memSaves=null;          // fallback when localStorage is blocked
let _storageOK=(()=>{try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}})();

function loadAllSaves(){
  if(!_storageOK)return _memSaves||{};
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return {};
    return JSON.parse(raw)||{};
  }catch(e){return _memSaves||{}}
}
function writeAllSaves(saves){
  _memSaves=saves;                      // always keep an in-memory copy
  if(!_storageOK)return true;           // succeed silently, session-only
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(saves));return true}
  catch(e){console.warn("Save failed",e);return false}
}
function saveGame(slot,silent){
  if(slot==null)return;
  const saves=loadAllSaves();
  saves[slot]={
    company:G.company||"My Factory",
    savedAt:Date.now(),
    gameMonth:Math.floor(G.time/GM),
    netWorth:netWorth(),
    cash:G.cash,
    revenue:G.earned,
    machines:Object.values(G.mach).reduce((a,v)=>a+v,0),
    plines:G.plines.length,
    acqs:G.acqs.length,
    data:G,
  };
  const ok=writeAllSaves(saves);
  if(ok&&!silent)flash("💾 Game saved");
  else if(!ok&&!silent)flash("⚠ Save failed — storage may be full");
}
function loadGame(slot){
  const saves=loadAllSaves();
  const s=saves[slot];
  if(!s||!s.data){flash("⚠ Save not found");return}
  G=s.data;
  // Backfill any missing fields from a fresh state (forward compatibility)
  const fresh=freshState();
  Object.keys(fresh).forEach(k=>{if(G[k]===undefined)G[k]=fresh[k]});
  // Migrate legacy boolean properties -> counts
  Object.keys(G.props||{}).forEach(k=>{if(G.props[k]===true)G.props[k]=1});
  if(!G.props||!Object.keys(G.props).length)G.props={starter:1};
  activeSlot=slot;
  screen="game";
  window._selMonth=null;
  startAutoSave();
  switchTab("factory");
  flash("✅ Loaded "+(s.company||"save"));
}
function deleteSave(slot){
  const saves=loadAllSaves();
  const name=saves[slot]?saves[slot].company:"save";
  delete saves[slot];
  writeAllSaves(saves);
  flash("🗑 Deleted "+name);
  render();
}
function newGame(slot,companyName){
  G=freshState();
  G.company=companyName||"My Factory";
  activeSlot=slot;
  screen="game";
  window._selMonth=null;
  saveGame(slot,true);
  startAutoSave();
  startTutorial();
}
function startAutoSave(){
  if(autoSaveTimer)clearInterval(autoSaveTimer);
  autoSaveTimer=setInterval(()=>{if(screen==="game"&&activeSlot!=null)saveGame(activeSlot,true)},20000);
}
function quitToHome(){
  if(activeSlot!=null){saveGame(activeSlot,true);submitScore(true);}
  if(autoSaveTimer)clearInterval(autoSaveTimer);
  screen="home";
  _ignoreHash=true;window.location.hash="home";setTimeout(()=>{_ignoreHash=false},0);
  document.title=SITE_NAME;
  trackEvent("quit_to_home");
  render();
}
function timeAgo(t){
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60)return "just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

// ── ROUTING & ANALYTICS ───────────────────────────────────────
function switchTab(t,skipHash){
  if(!ROUTES[t])t="factory";
  if(!isTabUnlocked(t))t="factory";
  tab=t;
  if(!skipHash){
    // Update URL without triggering hashchange loop
    _ignoreHash=true;
    window.location.hash=t;
    setTimeout(()=>{_ignoreHash=false},0);
  }
  trackPage(t);
  window.scrollTo(0,0);
  const c=document.getElementById("content");
  if(c)c.scrollTop=0;
  render();
}

let _ignoreHash=false;

function trackPage(t){
  const r=ROUTES[t];if(!r)return;
  const title=r.title+" · "+SITE_NAME;
  document.title=title;
  // Google Analytics 4
  if(typeof gtag==="function"){
    gtag("event","page_view",{page_title:r.title,page_location:window.location.origin+r.path,page_path:r.path});
  }
  // Plausible
  if(typeof plausible==="function"){plausible("pageview",{u:window.location.origin+r.path})}
  // Fathom
  if(window.fathom&&typeof window.fathom.trackPageview==="function"){window.fathom.trackPageview({url:r.path})}
  // Simple Analytics
  if(window.sa_pageview)window.sa_pageview(r.path);
}

// Track a custom event (used for support button clicks etc)
function trackEvent(name,params){
  if(typeof gtag==="function")gtag("event",name,params||{});
  if(typeof plausible==="function")plausible(name,{props:params||{}});
}

// Handle browser back/forward and direct links
window.addEventListener("hashchange",()=>{
  if(_ignoreHash)return;
  const t=window.location.hash.replace("#","")||"home";
  if(t==="home"){screen="home";render();return}
  if(screen==="home")return;   // ignore tab hashes while on home
  switchTab(t,true);
});

// On load: honour the URL hash so links deep-link correctly
function initRoute(){
  const t=window.location.hash.replace("#","");
  if(t&&t!=="home"&&ROUTES[t]){
    // Deep link into a tab — only valid if a save exists to resume
    const saves=loadAllSaves();
    const slots=Object.keys(saves);
    if(slots.length>0){loadGame(slots[0]);return}
  }
  screen="home";tab="factory";
  _ignoreHash=true;window.location.hash="home";setTimeout(()=>{_ignoreHash=false},0);
  document.title=SITE_NAME;
  if(typeof gtag==="function")gtag("event","page_view",{page_title:"Home",page_path:"/"});
}

function useQC(id){

}

function rBalance(){

function startTutorial(){G.tut={active:true,step:0};switchTab(TUT_STEPS[0].tab);flash("👋 Let's set up your first factory");render()}
function skipTutorial(){if(G.tut)G.tut.active=false;const e=document.getElementById("tutCoach");if(e)e.remove();flash("Tour skipped — replay it any time from 📖 Help");render()}
function finishTutorial(){if(G.tut)G.tut.active=false;const e=document.getElementById("tutCoach");if(e)e.remove();showTutDone();render()}
function tutGoto(t){switchTab(t)}
// Advances the tutorial when the current step's goal is met. Called from tick() to avoid render recursion.
function tutCheck(){
  if(!G.tut||!G.tut.active)return;
  const step=TUT_STEPS[G.tut.step];if(!step)return;
  if(step.done()){
    G.tut.step++;
    if(G.tut.step>=TUT_STEPS.length){finishTutorial();return}
    flash("✓ Nice — next step ↓");
    switchTab(TUT_STEPS[G.tut.step].tab);
  }
}

  const ex=document.getElementById("tutCoach");

  const el=ex||document.createElement("div");
  if(!ex){el.id="tutCoach";document.body.appendChild(el)}
  el.style.cssText="position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;background:#0f172a;color:#fff;border-radius:14px;padding:14px 16px;z-index:9997;box-shadow:0 12px 40px rgba(0,0,0,.4)";
  const onTab=tab===step.tab;
  const tabLabel=(TABS.find(t=>t.id===step.tab)||{}).label||step.tab;
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;letter-spacing:2px;color:#93c5fd;font-weight:700">GUIDED SETUP · ${G.tut.step+1}/${TUT_STEPS.length}</span>
      <button onclick="skipTutorial()" style="background:none;color:#94a3b8;font-size:11.5px;font-family:inherit">Skip tour ✕</button>

    <div style="font-size:12.5px;color:#cbd5e1;line-height:1.6;margin-bottom:10px">${step.body}</div>
    ${onTab
      ? `<div style="font-size:12px;color:#86efac;font-weight:600;display:flex;align-items:center;gap:6px">✓ You're on the right screen — do the action above to continue.</div>`
      : `<button onclick="tutGoto('${step.tab}')" style="width:100%;min-height:44px;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;font-size:13.5px;font-family:inherit">Open ${tabLabel} →</button>`}
    <div style="display:flex;gap:4px;margin-top:10px">${TUT_STEPS.map((_,i)=>`<div style="flex:1;height:4px;border-radius:2px;background:${i<G.tut.step?'#16a34a':i===G.tut.step?'#3b82f6':'#334155'}"></div>`).join("")}</div>`;
}
function showTutDone(){
  closeModal();
  const m=document.createElement("div");m.id="appModal";
  m.style.cssText="position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)";
  m.innerHTML=`
    <div style="background:#fff;border-radius:16px;padding:24px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center">
      <div style="font-size:46px;margin-bottom:8px">🎉</div>
      <div class="display" style="font-size:19px;font-weight:700;margin-bottom:6px">You're up and running!</div>
      <div style="font-size:12.5px;color:#64748b;line-height:1.7;margin-bottom:18px">Your factory is producing and the Trade Manager is selling for you. Watch your cash tick up, then reinvest in more machines and bigger premises. <b>New tabs unlock as you earn.</b><br><br>Goal: grow your net worth to <b>$1 Billion</b>. Full details are always in the <b>📖 Help</b> tab.</div>
      <button onclick="closeModal()" style="width:100%;min-height:48px;border-radius:10px;background:#16a34a;color:#fff;font-weight:700;font-size:14px;font-family:var(--font-ui)">Let's build 🚀</button>
    </div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{if(e.target===m)closeModal()});
}

// ── ACTIONS ───────────────────────────────────────────────────
function buyMach(id){
  const m=MACH[id],us=usedSlots(),ms=maxSlots();
  if(us+m.slots>ms){flash("🔒 Not enough slots — need "+(us+m.slots-ms)+" more. Upgrade your property.");return}
  if(G.cash<m.cost){flash("Insufficient funds");return}
  G.cash-=m.cost;G.spent+=m.cost;G.mach[id]=(G.mach[id]||0)+1;render();
}
function sellMach(id){
  const m=MACH[id];if(!m||(G.mach[id]||0)<1)return;
  const p=Math.floor(m.cost*.5);G.cash+=p;G.earned+=p;G.mach[id]--;
  flash("Sold 1x "+m.name+" for "+f(p));render();
}
function buyExp(id){
  const e=EXPS[id];if(G.cash<e.cost||G.exps.includes(id)){flash("Insufficient funds");return}
  G.cash-=e.cost;G.spent+=e.cost;G.exps.push(id);flash(e.name+" installed");render();
}
function buyShopItem(id){
  const s=SHOP[id];if(!s)return;
  if(!G.shop)G.shop={speed:0,sales:0,proc:0,rnd:0};
  const cost=shopCost(id);
  if(G.cash<cost){flash("Need "+f(cost)+" — "+f(cost-G.cash)+" short");return}
  G.cash-=cost;G.spent+=cost;G.shop[id]=(G.shop[id]||0)+1;
  flash(s.emoji+" "+s.name+" → Level "+G.shop[id]);
  trackEvent("shop_buy",{item:id,level:G.shop[id]});
  render();
}
function buyProp(id){
  const p=PROPS[id];
  if(p.unique&&propCount(id)>=1){flash("You only need one of these");return}
  if(G.cash<p.cost){flash("Need "+f(p.cost)+" — "+f(p.cost-G.cash)+" short");return}
  G.cash-=p.cost;G.spent+=p.cost;
  G.props[id]=propCount(id)+1;
  const n=propCount(id);
  flash("🏭 "+p.name+(n>1?" #"+n:"")+" acquired — +"+p.slots+" slots");
  trackEvent("buy_property",{property:id,count:n});
  render();
}
function sellProp(id){
  if(id==="starter"){flash("Can't sell the starter workshop");return}
  const p=PROPS[id];
  if(propCount(id)<1)return;
  const slotsAfter=maxSlots()-p.slots;
  if(usedSlots()>slotsAfter){
    flash("⚠ Selling this leaves "+usedSlots()+" machines in "+slotsAfter+" slots. Sell machines first.");
    return;
  }
  const pr=Math.floor(p.cost*.75);
  G.props[id]=propCount(id)-1;
  if(G.props[id]<=0)delete G.props[id];
  G.cash+=pr;G.earned+=pr;
  flash("Sold one "+p.name+" for "+f(pr));render();
}
function hireW(id,d){const n=Math.max(0,(G.work[id]||0)+d);G.work[id]=n;render()}
function hireO(id,d){const n=Math.max(0,(G.ostaff[id]||0)+d);G.ostaff[id]=n;render()}
function setW(id,val){const n=Math.max(0,parseInt(val)||0);G.work[id]=n;render()}
function setO(id,val){const n=Math.max(0,parseInt(val)||0);G.ostaff[id]=n;render()}
function buyOEquip(id){
  const eq=OEQUIP[id];if(G.oequip.includes(id)||G.cash<eq.cost){flash("Insufficient funds");return}
  G.cash-=eq.cost;G.spent+=eq.cost;G.oequip.push(id);flash(eq.name+" installed");render();
}
function takeLoan(id){
  const lt=LOANS.find(l=>l.id===id);if(!lt)return;
  const nw=netWorth();
  const annualRev=G.finHist.slice(-12).length>=12
    ? G.finHist.slice(-12).reduce((a,s)=>a+(s.totalRev||0),0)
    : revPerSec()*GM*12;
  if(annualRev<lt.minRev&&nw<lt.minNW){flash("Not eligible — need "+f(lt.minRev)+"/yr revenue or "+f(lt.minNW)+" net worth");return;}
  const monthly=pmt(lt.amount,lt.rate,lt.months);
  G.cash+=lt.amount;
  G.loans.push({id:Date.now(),name:lt.name,rate:lt.rate,col:lt.col,principal:lt.amount,remaining:lt.amount,monthly,monthsLeft:lt.months});
  flash(lt.name+" of "+f(lt.amount)+" approved");render();
}
function setPayA(lid,val){payA[lid]=val;render()}
function doPayLoan(lid){
  const loan=G.loans.find(l=>l.id==lid);if(!loan)return;
  const pa=parseFloat(payA[lid]||0)||0,pv=Math.min(pa,loan.remaining,G.cash);
  if(pv<1){flash("Not enough cash");return}
  G.cash-=pv;G.spent+=pv;
  loan.remaining=Math.max(0,loan.remaining-pv);
  if(loan.remaining<0.01)G.loans=G.loans.filter(l=>l.id!=lid);
  else loan.monthly=pmt(loan.remaining,loan.rate,loan.monthsLeft);
  payA[lid]="";flash("Paid "+f(pv)+" off "+loan.name);render();
}
function payAll(){
  let rem=Math.min(G.cash,totalDebt());if(rem<1){flash("Not enough cash");return}
  const paid=rem;
  G.loans=[...G.loans].sort((a,b)=>b.rate-a.rate).map(l=>{if(rem<=0)return l;const paying=Math.min(rem,l.remaining);rem-=paying;const nr=Math.max(0,l.remaining-paying);if(nr<0.01)return null;return{...l,remaining:nr,monthly:pmt(nr,l.rate,l.monthsLeft)}}).filter(Boolean);
  G.cash-=paid;G.spent+=paid;flash("Bulk payment of "+f(paid)+" applied");render();
}
function bulkPay(amt){
  let rem=Math.min(amt,totalDebt(),G.cash);if(rem<1){flash("Not enough cash");return}
  const paid=rem;
  G.loans=[...G.loans].sort((a,b)=>b.rate-a.rate).map(l=>{if(rem<=0)return l;const paying=Math.min(rem,l.remaining);rem-=paying;const nr=Math.max(0,l.remaining-paying);if(nr<0.01)return null;return{...l,remaining:nr,monthly:pmt(nr,l.rate,l.monthsLeft)}}).filter(Boolean);
  G.cash-=paid;G.spent+=paid;flash("Paid "+f(paid)+" off loans");render();
}
function toggleTM(){G.tmOn=!G.tmOn;render()}
function setTM(key,field,val){if(!G.tmCfg[key])G.tmCfg[key]={};G.tmCfg[key][field]=val;render()}
function buySh(tick,qty){
  const cost=qty*(G.sPrices[tick]||0);if(G.cash<cost){flash("Insufficient funds");return}
  if((G.ostaff.analyst||0)<1){flash("Hire a Financial Analyst first");return}
  const pb=G.sBasis[tick]||{totalCost:0,qty:0};
  G.cash-=cost;G.spent+=cost;
  G.sHold[tick]=(G.sHold[tick]||0)+qty;
  G.sBasis[tick]={totalCost:pb.totalCost+cost,qty:pb.qty+qty};
  flash("Bought "+qty+" "+tick);render();
}
function sellSh(tick,qty){
  const held=G.sHold[tick]||0;if(qty>held){flash("Don't own that many");return}
  const rev=qty*(G.sPrices[tick]||0),basis=G.sBasis[tick]||{totalCost:0,qty:held};
  const avg=basis.qty>0?basis.totalCost/basis.qty:0,pnl=rev-avg*qty;
  G.cash+=rev;G.earned+=rev;
  G.sHold[tick]=held-qty;
  const nq=held-qty;G.sBasis[tick]=nq>0?{totalCost:avg*nq,qty:nq}:{totalCost:0,qty:0};
  flash("Sold "+qty+" "+tick+" P&L: "+(pnl>=0?"+":"")+f(pnl));render();
}
function buyRE(id){
  const d=RE[id];if(G.reProps[id]&&G.reProps[id].owned){flash("Already owned");return}
  if(G.cash<d.cost){flash("Need "+f(d.cost));return}
  G.cash-=d.cost;G.spent+=d.cost;
  G.reProps[id]={owned:true,upgrades:[],boughtTime:G.time};
  flash(d.name+" purchased!");render();
}
// Resale value grows with how long you've held: 0.90x on day one → up to 1.08x after ~12 game months.
// This removes the old instant buy/sell money loop while still rewarding long-term holders.
function reSaleFactor(id){
  const p=G.reProps[id];if(!p)return 0.9;
  const held=Math.max(0,(G.time-(p.boughtTime||0))/GM); // months held
  return Math.max(0.9,Math.min(1.08,0.9+held*0.015));
}
function reSaleValue(id){const d=RE[id];return d?Math.floor(d.cost*reSaleFactor(id)):0}
function sellRE(id){
  const d=RE[id];if(!d||!G.reProps[id])return;
  const factor=reSaleFactor(id),gain=reSaleValue(id);
  delete G.reProps[id];G.cash+=gain;G.earned+=gain;
  flash("Sold "+d.name+" for "+f(gain)+(factor<1?" — early-sale loss":" (+"+Math.round((factor-1)*100)+"%)"));
  editRE=null;render();
}
function addREUpg(propId,ugId){
  const d=RE[propId],ug=REUPG[ugId];if(!d||!ug)return;
  const cost=d.cost*ug.cm;
  if(G.cash<cost){flash("Need "+f(cost));return}
  if(G.reProps[propId].upgrades.includes(ugId)){flash("Already installed");return}
  G.cash-=cost;G.spent+=cost;G.reProps[propId].upgrades.push(ugId);
  flash(ug.name+" added");render();
}
function unlockPL(id){
  const pl=PL[id];if(!pl)return;
  if(G.plines.includes(id)){flash("Already unlocked");return}
  if(pl.req&&!G.plines.includes(pl.req)){flash("Requires "+PL[pl.req].name+" first");return}
  if(G.cash<pl.cost){flash("Need "+f(pl.cost));return}
  G.cash-=pl.cost;G.spent+=pl.cost;G.plines.push(id);flash("Unlocked: "+pl.name+"!");render();
}
function acquire(id){
  const acq=ACQ[id];if(!acq)return;
  if(G.acqs.includes(id)){flash("Already acquired");return}
  if(acq.req&&!G.plines.includes(acq.req)){flash("Requires "+PL[acq.req].name+" product line first");return}
  if(G.cash<acq.cost){flash("Need "+f(acq.cost));return}
  G.cash-=acq.cost;G.spent+=acq.cost;G.acqs.push(id);
  if(acq.bonus){
    if(acq.bonus.mach){
      let skipped=0;
      Object.entries(acq.bonus.mach).forEach(([mid,qty])=>{
        const md=MACH[mid];if(!md)return;
        for(let n=0;n<qty;n++){
          if(usedSlots()+md.slots>maxSlots()){skipped++;continue}
          G.mach[mid]=(G.mach[mid]||0)+1;
        }
      });
      if(skipped>0)setTimeout(()=>flash("⚠ "+skipped+" acquired machine(s) couldn't be installed — no slots free"),1200);
    }
    if(acq.bonus.mats)Object.entries(acq.bonus.mats).forEach(([mid,qty])=>{G.mats[mid]=(G.mats[mid]||0)+qty});
    if(acq.bonus.productLine&&!G.plines.includes(acq.bonus.productLine))G.plines.push(acq.bonus.productLine);
  }
  flash("Acquired "+acq.name+"! +"+f(acq.revenue)+"/month");render();
}

// ── START ─────────────────────────────────────────────────────
G=freshState();
// Save on tab close / navigate away
window.addEventListener("beforeunload",()=>{if(screen==="game"&&activeSlot!=null)saveGame(activeSlot,true)});
// Save when tab is backgrounded (mobile safe)
document.addEventListener("visibilitychange",()=>{if(document.hidden&&screen==="game"&&activeSlot!=null)saveGame(activeSlot,true)});
initRoute();
render();
setInterval(tick, TICK);
</script>
