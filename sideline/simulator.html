<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>OSG Cup Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simulate the OneSchool Global Inter-Campus Cup: rugby, soccer and basketball leagues with squads, finals and season history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: OSG Sideline scoreboard identity. Sticky header + scrollable tabs; Match Centre is a scoreboard over a commentary feed; the other tabs are tables, brackets and a news feed */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#0f1b2d; --muted:#5a6779; --line:#d8dde5;
  --accent:#1446a0; --accent-ink:#ffffff; --accent-soft:#e3eafa;
  --board:#0b1424; --board-ink:#e9eef6; --board-line:#24344d; --board-muted:#a9b4c4; --amber:#ffb400;
  --live:#d62839; --good:#1d8348; --warn:#b26a00; --mine:#fff4d6;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a111c; --surface:#111b2a; --ink:#e7ecf3; --muted:#93a0b2; --line:#22324a;
  --accent:#78a6ff; --accent-ink:#0a111c; --accent-soft:#18284a;
  --board:#060c16; --board-ink:#e9eef6; --board-line:#1f2e45; --board-muted:#a9b4c4; --amber:#ffbf2e;
  --live:#ff5a66; --good:#4cc47e; --warn:#f0a63a; --mine:#2a2412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111c; --surface:#111b2a; --ink:#e7ecf3; --muted:#93a0b2; --line:#22324a;
  --accent:#78a6ff; --accent-ink:#0a111c; --accent-soft:#18284a;
  --board:#060c16; --board-ink:#e9eef6; --board-line:#1f2e45; --board-muted:#a9b4c4; --amber:#ffbf2e;
  --live:#ff5a66; --good:#4cc47e; --warn:#f0a63a; --mine:#2a2412; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--board);color:var(--board-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;background:var(--amber);color:#0b1424;padding:2px 8px;border-radius:4px}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;line-height:1}
.brand .sub{font-size:12.5px;color:var(--board-muted);flex-basis:100%;margin-top:-4px}
.mine-sel{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--board-muted)}
.mine-sel select{background:#16233a;border:1px solid var(--board-line);color:var(--board-ink);border-radius:6px;padding:4px 6px;font-size:12.5px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:var(--board-muted);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:8px 11px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--board-ink);border-color:var(--amber)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px 4px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select,input[type="number"],input[type="text"]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13.5px;font-weight:600;max-width:100%}
.spacer{flex:1}
main{padding-block:6px 56px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#0b1424}
.btn.danger{border-color:var(--live);color:var(--live)}

.progress{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.progress .meter{flex:1;min-width:140px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.progress .txt{font-size:13.5px;color:var(--muted);flex-basis:100%}
.progress .txt b{color:var(--ink)}

.h3{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.h3::after{content:"";flex:1;height:1px;background:var(--line)}
.code{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;color:#fff;flex:none;display:inline-block;line-height:1.35}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0;max-width:68ch}
.wait{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* match centre */
.mc-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.mc-pick select{flex:1;min-width:0}
.stage{background:var(--board);color:var(--board-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.side{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;text-align:center}
.side .tn{font-weight:600;font-size:14px;line-height:1.2;min-height:2.4em;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.rating{font-size:11.5px;color:var(--board-muted);letter-spacing:.04em}
.digits{font-family:var(--display);font-weight:800;font-size:clamp(60px,18vw,100px);line-height:.9;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,180,0,.25)}
.digits.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.12)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2.4em}
.clock{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.per{font-size:12px;color:var(--board-muted);text-transform:uppercase;letter-spacing:.1em;text-align:center}
.out{font-size:12px;color:var(--board-muted);line-height:1.35}
.out b{color:#ff8a93;font-weight:600}
.mom{display:flex;flex-direction:column;gap:4px}
.mom .lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--board-muted)}
.mom .bar{height:8px;border-radius:99px;background:#1b2a42;position:relative;overflow:hidden}
.mom .bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--amber);transition:all .4s}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--board-line);background:none;color:var(--board-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--board-ink);color:var(--board)}
.cta{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--amber);color:#0b1424}
.feed{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto;border-top:1px solid var(--board-line)}
.feed li{display:grid;grid-template-columns:4.4em 1fr auto;gap:10px;padding:8px 2px;border-bottom:1px solid var(--board-line);font-size:14px;align-items:baseline}
.feed .t{font-family:var(--display);font-weight:600;color:var(--board-muted);font-variant-numeric:tabular-nums}
.feed .s{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--amber)}
.feed li.sys{color:var(--board-muted);font-style:italic}
.feed li.big .txt{font-weight:700}
.feed li.bad .txt{color:#ff8a93}
.empty-feed{color:var(--board-muted);font-size:14px;padding:10px 2px}

/* results + tables */
.roundbar{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.roundbar .nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.roundbar .lbl{flex:1;min-width:0}
.roundbar .lbl b{font-family:var(--display);font-size:22px;font-weight:700;display:block;line-height:1.1}
.roundbar .lbl span{font-size:13px;color:var(--muted)}
.res{display:grid;gap:6px}
.r{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.r.mine{background:var(--mine)}
.r .h{display:flex;gap:6px;align-items:center;min-width:0}
.r .a{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-width:0;text-align:right}
.r .sc{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.r .sc small{display:block;font-family:var(--body);font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.r .w{color:var(--accent)}
.r .watch{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.r .nm{overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pts{font-family:var(--display);font-weight:800;font-size:18px}
td.pos{font-family:var(--display);font-weight:700;color:var(--muted);width:2.2em}
tr.q td.pos{color:var(--accent)}
tr.lead td.pos{color:var(--amber)}
tr.mine td{background:var(--mine)}
.form{display:inline-flex;gap:2px}
.form i{width:16px;height:16px;border-radius:3px;font-style:normal;font-size:10px;font-weight:700;display:inline-grid;place-items:center;color:#fff}
.form .W{background:var(--good)}.form .L{background:var(--live)}.form .D{background:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:1px}
.tag.inj{background:color-mix(in srgb,var(--live) 15%,transparent);color:var(--live)}
.tag.ban{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.gold{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--warn)}

/* finals */
.champ{background:var(--board);color:var(--board-ink);border-radius:14px;padding:18px;margin:12px 0}
.champ .cup{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.champ h2{font-family:var(--display);font-weight:800;font-size:34px;margin:2px 0 0;line-height:1}
.champ p{margin:4px 0 0;color:var(--board-muted);font-size:14px}
.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.col h4{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.m{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.m .tm{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 10px;font-size:14px}
.m .tm+.tm{border-top:1px solid var(--line)}
.m .tm.win{font-weight:700}
.m .tm .seed{font-size:11px;color:var(--muted);min-width:1.4em}
.m .tm .sc{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.m .xt{font-size:11.5px;color:var(--muted);padding:4px 10px;border-top:1px dashed var(--line)}
.m.bye{border-style:dashed;color:var(--muted);font-size:13px;padding:10px}
.cf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.cf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.cf h5{margin:0 0 6px;font-size:14px}
.cf .ln{display:grid;grid-template-columns:2.4em 1fr auto;gap:6px;font-size:13.5px;padding:3px 0;align-items:center}
.cf .ln .k{font-family:var(--display);font-weight:700;color:var(--muted);font-size:12.5px}
.cf .ln .s{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.cf .champline{margin-top:6px;font-size:13px;font-weight:700;color:var(--accent)}

/* news */
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.news li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.news .when{font-size:11.5px;color:var(--muted);grid-column:2}
.news .k{font-size:18px;line-height:1.2;grid-row:span 2}
.news .txt{font-size:14.5px}
.news li.big{border-color:var(--amber)}

.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.settings{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.settings .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.settings label{font-size:14px;font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--live)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:520px){
  nav.tabs button{font-size:15px;padding:8px 8px 10px}
  .feed li{grid-template-columns:3.8em 1fr auto;font-size:13.5px}
  .r{grid-template-columns:1fr auto 1fr}
  .r .watch{grid-column:1/-1;justify-self:center}
}
@media (prefers-reduced-motion:reduce){.digits.bump{animation:none}.progress .meter i,.mom .bar i{transition:none}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="mark">OSG</span>
      <h1>Cup Simulator</h1>
      <label class="mine-sel" for="mineSel">My campus <select id="mineSel"></select></label>
      <span class="sub" id="subline">Inter-Campus Cup · simulated results, not real games</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-match" data-tab="match" aria-selected="true">Match</button>
      <button role="tab" id="tab-season" data-tab="season" aria-selected="false">Season</button>
      <button role="tab" id="tab-finals" data-tab="finals" aria-selected="false">Finals</button>
      <button role="tab" id="tab-players" data-tab="players" aria-selected="false">Players</button>
      <button role="tab" id="tab-news" data-tab="news" aria-selected="false">News</button>
      <button role="tab" id="tab-history" data-tab="history" aria-selected="false">History</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters">
    <div class="pills" id="sportPills"></div>
    <span class="spacer"></span>
    <select id="confSel" aria-label="Conference"></select>
  </div>
  <div class="progress" id="progress"></div>
  <main>
    <section id="match"></section>
    <section id="season" hidden></section>
    <section id="finals" hidden></section>
    <section id="players" hidden></section>
    <section id="news" hidden></section>
    <section id="history" hidden></section>
  </main>
</div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

   sports.js — every sport is one settings object. Add a sport by adding
   an entry here; the engine reads nothing else.
   ===================================================================== */

  ["ALB","Albury","nswc","#b45309",1],["WAG","Wagga Wagga","nswc","#7c2d92",2],["LEE","Leeton","nswc","#15803d",0],

  ["MEL","Melton","vic","#1e3a8a",7],["BEN","Bendigo","vic","#9f1239",3],["HAM","Hamilton","vic","#166534",2],

/* =====================================================================
   rng.js — seeded Mulberry32. Every random number in the simulation comes
   from a stream keyed off D.seed, so a seed always replays the same league.
   ===================================================================== */
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rngFor=key=>mulberry32(hash(D.seed+"|"+key));
function gauss(rng){let u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function poisson(l,rng){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rng()}while(p>L&&k<200);return k-1}
function weighted(rng,items,w){let tot=0;const ws=items.map(x=>{const v=Math.max(0,w(x));tot+=v;return v});if(tot<=0)return items[Math.floor(rng()*items.length)];let r=rng()*tot;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

/* =====================================================================
   league setup: teams (attack/defence per sport) and squads
   ===================================================================== */
let D=null;
function blankStats(){return{ap:0,sc:0,as:0,pts:0}}
function makePlayer(code,sp,pos,yr,sk,rng){
  const id="p"+(D.nextPid++);
  D.players[id]={id,n:FIRST[Math.floor(rng()*FIRST.length)]+" "+LAST[Math.floor(rng()*LAST.length)],code,sp,pos,yr,sk:Math.round(clamp(sk,30,96)),st:blankStats(),car:blankStats(),out:0,why:""};
  return id;
}
function posTemplate(S,size){const list=[];S.pos.forEach(([p,c])=>{for(let i=0;i<c;i++)list.push(p)});const out=list.slice();let i=0;while(out.length<size){out.push(list[i%list.length]);i+=3}return out.slice(0,size)}
function newLeague(seed){
  D={app:"osg-cup-sim",v:3,seed:String(seed),season:2026,seasonNo:1,settings:{format:"knockout",homeAway:false},
     teams:{},players:{},squads:{},nextPid:1,weeks:[],wm:{},res:{},week:1,phase:"season",cfSeeds:{},nat:{},form:{},
     news:[],archive:[],rec:{},alumni:{}};
  SPORT_IDS.forEach(sp=>{D.rec[sp]={high:null,margin:null,pMatch:null,pSeason:null};D.alumni[sp]=[]});
  const rng=rngFor("setup");
  CAMPUSES.forEach(c=>{
    D.teams[c.code]={};
    SPORT_IDS.forEach(sp=>{
      const S=SPORTS[sp];
      const q=56+c.size*1.5+(rng()-.5)*10;
      D.teams[c.code][sp]={att:Math.round(50+c.size*1.2+(rng()-.5)*16),def:Math.round(50+c.size*1.2+(rng()-.5)*16),q,golden:0};
      D.squads[c.code+"_"+sp]=posTemplate(S,S.squad).map(pos=>{const yr=7+Math.min(5,Math.floor(Math.pow(rng(),.7)*6));return makePlayer(c.code,sp,pos,yr,q+(yr-9.5)*2.5+gauss(rng)*7,rng)});
    });
  });

/* =====================================================================
   fixtures.js — circle-method round robin, finals series, knockouts, groups
   ===================================================================== */
function roundRobin(teams){
  const t=teams.slice();if(t.length%2)t.push(null);
  const n=t.length,rounds=[];let arr=t.slice();
  for(let r=0;r<n-1;r++){
    const games=[];
    for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if(r%2===1&&i===0)[a,b]=[b,a];if(a&&b)games.push([a,b])}
    rounds.push(games);arr=[arr[0],arr[n-1]].concat(arr.slice(1,n-1));
  }
  return rounds;
}
function bracketOrder(n){let o=[1];while(o.length<n){const m=o.length*2+1;o=o.flatMap(s=>[s,m-s])}return o}
const KO_LABELS={2:["Grand final"],4:["Semi-finals","Grand final"],8:["Quarter-finals","Semi-finals","Grand final"],16:["Round of 16","Quarter-finals","Semi-finals","Grand final"]};

function seasonStart(year){const d=new Date(year,7,1);while(d.getDay()!==5)d.setDate(d.getDate()+1);return d}
function regRounds(){const base=Math.max.apply(null,CONFS.map(cf=>{const n=CAMPUSES.filter(c=>c.conf===cf.id).length;return n%2?n:n-1}));return D.settings.homeAway?base*2:base}
function startSeason(){
  D.weeks=[];D.wm={};D.res={};D.cfSeeds={};D.nat={};D.form={};D.week=1;D.phase="season";
  const R=regRounds();
  for(let r=1;r<=R;r++)D.weeks.push({stage:"reg",n:r,label:"Round "+r});
  FINALS_SERIES.forEach((f,i)=>D.weeks.push({stage:"cf",n:i+1,label:f.label}));
  if(D.settings.format==="groups"){["Group round 1","Group round 2","Group round 3","Semi-finals","Grand final"].forEach((l,i)=>D.weeks.push({stage:"nat",n:i+1,label:"National Finals · "+l}))}
  else KO_LABELS[8].forEach((l,i)=>D.weeks.push({stage:"nat",n:i+1,label:"National Finals · "+l}));
  Object.values(D.players).forEach(p=>{p.st=blankStats()});
  buildWeek(1);
}
function weekDate(w){
  const st=seasonStart(D.season),wk=D.weeks[w-1];const regCf=D.weeks.filter(x=>x.stage!=="nat").length;
  const d=new Date(st);d.setDate(d.getDate()+7*((wk.stage==="nat"?regCf+1:w)-1));return d;
}
const mid=(...p)=>D.season+"-"+p.join("-");
function confRounds(conf){
  const teams=CAMPUSES.filter(c=>c.conf===conf).map(c=>c.code);
  const rr=roundRobin(teams);
  return D.settings.homeAway?rr.concat(rr.map(g=>g.map(([h,a])=>[a,h]))):rr;
}
function winnerOf(id){const r=D.res[id];if(!r)return null;const m=findMatch(id);return r.pw!=null?(r.pw?m.a:m.h):(r.hs>r.as?m.h:m.a)}
function loserOf(id){const m=findMatch(id),w=winnerOf(id);return w===m.h?m.a:m.h}
let MATCH_INDEX={};
function findMatch(id){return MATCH_INDEX[id]}
function indexMatches(){MATCH_INDEX={};Object.values(D.wm).forEach(list=>list.forEach(m=>MATCH_INDEX[m.id]=m))}

function buildWeek(w){
  const wk=D.weeks[w-1],list=[];
  if(wk.stage==="reg"){
    CONFS.forEach(cf=>{const rr=confRounds(cf.id);const games=rr[wk.n-1]||[];
      games.forEach(([h,a])=>SPORT_IDS.forEach(sp=>list.push({id:mid("r"+wk.n,cf.id,sp,h,a),sp,h,a,conf:cf.id,stage:"reg",tag:"R"+wk.n,ko:false,neutral:false,w})))});
  }else if(wk.stage==="cf"){
    CONFS.forEach(cf=>SPORT_IDS.forEach(sp=>{
      const key=cf.id+"_"+sp;
      if(wk.n===1)D.cfSeeds[key]=confLadder(cf.id,sp).slice(0,4).map(r=>r.code);
      const seeds=D.cfSeeds[key];
      FINALS_SERIES[wk.n-1].games.forEach(g=>{
        const slot=s=>s[0]==="S"?seeds[+s.slice(1)-1]:(s[0]==="W"?winnerOf(mid("cf",cf.id,sp,s.slice(2))):loserOf(mid("cf",cf.id,sp,s.slice(2))));
        list.push({id:mid("cf",cf.id,sp,g.id),sp,h:slot(g.h),a:slot(g.a),conf:cf.id,stage:"cf",tag:g.id,ko:true,neutral:false,w});
      });
    }));
  }else{
    SPORT_IDS.forEach(sp=>{
      if(wk.n===1)setupNationals(sp);
      const N=D.nat[sp];
      if(N.format==="knockout"){
        const ri=wk.n-1;
        if(ri>0&&!N.rounds[ri]){const prev=N.rounds[ri-1],next=[];for(let i=0;i<prev.length;i+=2)next.push({h:pairWinner(sp,prev[i]),a:pairWinner(sp,prev[i+1])});N.rounds[ri]=next}
        N.rounds[ri].forEach((p,i)=>{if(p.bye)return;p.id=mid("nat",sp,"k"+ri,i);list.push({id:p.id,sp,h:p.h,a:p.a,conf:"nat",stage:"nat",tag:KO_LABELS[8][ri],ko:true,neutral:true,w})});
      }else{
        if(wk.n<=3){["A","B"].forEach(g=>{const rr=roundRobin(N.groups[g]);rr[wk.n-1].forEach(([h,a],i)=>list.push({id:mid("nat",sp,"g"+g,wk.n,i),sp,h,a,conf:"nat",stage:"nat",tag:"Group "+g,grp:g,ko:false,neutral:true,w}))})}
        else if(wk.n===4){const A=groupTable(sp,"A"),B=groupTable(sp,"B");N.sf=[[A[0].code,B[1].code],[B[0].code,A[1].code]];N.sf.forEach((p,i)=>list.push({id:mid("nat",sp,"sf",i),sp,h:p[0],a:p[1],conf:"nat",stage:"nat",tag:"Semi-final",ko:true,neutral:true,w}))}
        else{list.push({id:mid("nat",sp,"gf"),sp,h:winnerOf(mid("nat",sp,"sf",0)),a:winnerOf(mid("nat",sp,"sf",1)),conf:"nat",stage:"nat",tag:"Grand final",ko:true,neutral:true,w})}
      }
    });
  }
  D.wm[w]=list;list.forEach(m=>MATCH_INDEX[m.id]=m);
}
function pairWinner(sp,p){return p.bye?p.h:winnerOf(p.id)}
function regRecord(code,sp){const conf=CAMPUS[code].conf;return confLadder(conf,sp).find(r=>r.code===code)}
function natRank(list,sp){return list.map(code=>{const r=regRecord(code,sp);return{code,pct:r.p?(r.w+r.d/2)/r.p:0,pdg:r.p?(r.f-r.a)/r.p:0}}).sort((x,y)=>y.pct-x.pct||y.pdg-x.pdg||x.code.localeCompare(y.code)).map(x=>x.code)}
function setupNationals(sp){
  const champs=CONFS.map(cf=>winnerOf(mid("cf",cf.id,sp,"GF")));
  if(D.settings.format==="groups"){
    const runners=natRank(CONFS.map(cf=>loserOf(mid("cf",cf.id,sp,"GF"))),sp).slice(0,2);
    const seeds=natRank(champs,sp).concat(runners);
    const rng=rngFor("draw|"+D.season+"|"+sp),groups={A:[],B:[]};
    for(let p=0;p<4;p++){const pot=shuffle(seeds.slice(p*2,p*2+2),rng);groups.A.push(pot[0]);groups.B.push(pot[1])}
    D.nat[sp]={format:"groups",seeds,groups};
  }else{
    const seeds=natRank(champs,sp),size=8,order=bracketOrder(size),r0=[];
    for(let i=0;i<size;i+=2){const s1=order[i],s2=order[i+1];r0.push(s2>seeds.length?{h:seeds[s1-1],bye:true}:{h:seeds[s1-1],a:seeds[s2-1]})}
    D.nat[sp]={format:"knockout",seeds,rounds:[r0]};
  }
}

/* =====================================================================
   engine.js — ratings in, goals out
   ===================================================================== */
const posW=(S,pos)=>{const e=S.pos.find(x=>x[0]===pos);return e?e[2]:.5};
function lineupFor(code,sp,week){
  const S=SPORTS[sp],sq=D.squads[code+"_"+sp].map(id=>D.players[id]);
  const avail=sq.filter(p=>!(p.out>week)),used=new Set(),ids=[];
  S.pos.forEach(([pos,cnt])=>{for(let i=0;i<cnt;i++){
    let best=null;avail.forEach(p=>{if(!used.has(p.id)&&p.pos===pos&&(!best||p.sk>best.sk))best=p});
    if(!best)avail.forEach(p=>{if(!used.has(p.id)&&(!best||p.sk>best.sk))best=p});
    if(best){used.add(best.id);ids.push(best.id)}
  }});
  return{ids,missing:sq.filter(p=>p.out>week).map(p=>p.id)};
}
function strength(code,sp,week){
  const T=D.teams[code][sp],L=lineupFor(code,sp,week);
  const adj=(mean(L.ids.map(id=>D.players[id].sk))-62)*.5;
  return{att:T.att+adj,def:T.def+adj,lineup:L.ids,missing:L.missing,adj};
}
let AVG_CACHE={};
function leagueAvg(sp,week){
  const k=D.season+"|"+week+"|"+sp;if(AVG_CACHE[k])return AVG_CACHE[k];
  const all=CAMPUSES.map(c=>strength(c.code,sp,week));
  return AVG_CACHE[k]={att:mean(all.map(s=>s.att)),def:mean(all.map(s=>s.def))};
}
function expectedPlays(S,att,oppDef,avg,homeMul){return S.basePlays*Math.exp((att-avg.att)/S.spread)*Math.exp((avg.def-oppDef)/S.spread)*homeMul}
function rollPlays(S,l,rng){return S.dist==="poisson"?poisson(l,rng):Math.max(0,Math.round(l+gauss(rng)*S.sd*Math.sqrt(l)))}
function pickScorer(S,lineup,rng,exclude){return weighted(rng,lineup.filter(id=>id!==exclude),id=>{const p=D.players[id];return posW(S,p.pos)*Math.pow(p.sk/70,S.starPower)})}
function kickerOf(lineup){let best=null;lineup.forEach(id=>{const p=D.players[id];const sc=(p.pos==="Flyhalf"?20:p.pos==="Fullback"||p.pos==="Centre"?8:0)+p.sk;if(!best||sc>best.sc)best={id,sc}});return best&&best.id}

function simulateMatch(m){
  const S=SPORTS[m.sp],rng=rngFor("m|"+m.id);
  const H=strength(m.h,m.sp,m.w),A=strength(m.a,m.sp,m.w),avg=leagueAvg(m.sp,m.w);
  const hm=m.neutral?1:S.home[0],am=m.neutral?1:S.home[1];
  const eh=expectedPlays(S,H.att,A.def,avg,hm),ea=expectedPlays(S,A.att,H.def,avg,am);
  const ev=[],sc=[0,0],tries=[0,0],L=[H.lineup,A.lineup],len=S.clock.length;
  function scorePlay(side,v,min){
    const lu=L[side];let e={m:min,s:side,v};
    if(S.id==="ru"){
      if(v>=5){e.k="t";e.p=pickScorer(S,lu,rng);if(rng()<S.assist)e.a=pickScorer(S,lu,rng,e.p);if(v===7)e.c=kickerOf(lu);tries[side]++}
      else{e.k=rng()<.15?"d":"p";e.p=kickerOf(lu)}
    }else if(S.id==="so"){e.k="g";e.p=pickScorer(S,lu,rng);if(rng()<S.assist)e.a=pickScorer(S,lu,rng,e.p)}
    else{e.k="b";e.p=pickScorer(S,lu,rng);if(v>1&&rng()<S.assist)e.a=pickScorer(S,lu,rng,e.p)}
    sc[side]+=v;ev.push(e);
  }
  const unitPick=()=>weighted(rng,S.units,u=>u[1])[0];
  [eh,ea].forEach((l,side)=>{const n=rollPlays(S,l,rng);for(let i=0;i<n;i++)scorePlay(side,unitPick(),rng()*len)});
  // discipline and injuries: affect later weeks, never this match
  [0,1].forEach(side=>{
    L[side].forEach(id=>{
      if(rng()<S.injury)ev.push({m:rng()*len,s:side,k:"i",p:id,wk:1+Math.floor(rng()*3)});
      if(rng()<S.card)ev.push({m:rng()*len,s:side,k:"r",p:id,wk:S.banWeeks[0]+Math.floor(rng()*(S.banWeeks[1]-S.banWeeks[0]+1))});
    });
    if(S.yellow){const n=poisson(S.yellow,rng);for(let i=0;i<n;i++)ev.push({m:rng()*len,s:side,k:"y",p:L[side][Math.floor(rng()*L[side].length)]})}
  });
  ev.sort((x,y)=>x.m-y.m);
  let xt="",pw=null,pens=null,end=len+Math.floor(rng()*(S.clock.stoppage+1));
  const shootout=(p0,kicks)=>{const k=[0,0];const pk=side=>clamp(p0+(mean(L[side].map(id=>D.players[id].sk))-mean(L[1-side].map(id=>D.players[id].sk)))/300,.4,.92);
    for(let i=0;i<kicks;i++){if(rng()<pk(0))k[0]++;if(rng()<pk(1))k[1]++}
    let g=0;while(k[0]===k[1]&&g++<30){if(rng()<pk(0))k[0]++;if(rng()<pk(1))k[1]++}
    if(k[0]===k[1])k[rng()<.5?0:1]++;return k};
  if(sc[0]===sc[1]){
    if(S.tie==="overtime"){
      let ot=0;while(sc[0]===sc[1]&&ot<8){const from=len+4*ot;ot++;[eh,ea].forEach((l,side)=>{const n=rollPlays(S,l*4/len,rng);for(let i=0;i<n;i++)scorePlay(side,unitPick(),from+rng()*4)})}
      if(sc[0]===sc[1])scorePlay(rng()<eh/(eh+ea)?0:1,1,len+4*ot-0.1);
      xt=ot>1?ot+"OT":"OT";end=len+4*ot;ev.sort((x,y)=>x.m-y.m);
    }else if(m.ko&&S.tie==="shootout"){
      [eh,ea].forEach((l,side)=>{const n=poisson(l*10/len,rng);for(let i=0;i<n;i++)scorePlay(side,1,len+rng()*10)});
      ev.sort((x,y)=>x.m-y.m);end=len+10;xt="aet";
      if(sc[0]===sc[1]){pens=shootout(.74,5);pw=pens[0]>pens[1]?0:1;xt="pens"}
    }else if(m.ko&&S.tie==="golden"){
      const t=[eh,ea].map(l=>-Math.log(1-rng())/(Math.max(l,.05)/len));
      const side=t[0]<t[1]?0:1;
      if(t[side]<10){scorePlay(side,rng()<.65?3:5,len+t[side]);xt="golden point";end=len+t[side]}
      else{pens=shootout(.66,5);pw=pens[0]>pens[1]?0:1;xt="kicks";end=len+10}
    }
  }
  return{id:m.id,hs:sc[0],as:sc[1],th:tries[0],ta:tries[1],eh,ea,ev,xt,pw,pens,lu:L,end,miss:[H.missing,A.missing]};
}

/* =====================================================================
   results, records and milestones
   ===================================================================== */
const pname=id=>D.players[id]?D.players[id].n:"A player";
const cname=c=>CAMPUS[c]?CAMPUS[c].name:c;
function news(text,sp,kind,big){D.news.unshift({s:D.season,w:D.week,sp,t:text,k:kind,big:!!big});if(D.news.length>300)D.news.length=300}
const ICON={rec:"📈",star:"⭐",streak:"🔥",title:"🏆",gold:"✨",grad:"🎓",inj:"🩹",ban:"🟥",first:"🎉"};

function applyMatch(m,r){
  const S=SPORTS[m.sp];
  D.res[m.id]={hs:r.hs,as:r.as,th:r.th,ta:r.ta,eh:+r.eh.toFixed(2),ea:+r.ea.toFixed(2),xt:r.xt,pw:r.pw,pens:r.pens,end:r.end,
    ev:r.ev.map(e=>[+e.m.toFixed(2),e.s,e.v||0,e.k,e.p||"",e.a||"",e.c||"",e.wk||0])};
  const haul={};
  r.lu.forEach(lu=>lu.forEach(id=>{const p=D.players[id];p.st.ap++;p.car.ap++}));
  r.ev.forEach(e=>{
    const p=D.players[e.p];if(!p)return;
    if(e.k==="g"){p.st.sc++;p.car.sc++;p.st.pts++;p.car.pts++;haul[e.p]=(haul[e.p]||0)+1}
    else if(e.k==="t"){p.st.sc++;p.car.sc++;p.st.pts+=5;p.car.pts+=5;haul[e.p]=(haul[e.p]||0)+1;if(e.c&&D.players[e.c]){D.players[e.c].st.pts+=2;D.players[e.c].car.pts+=2}}
    else if(e.k==="p"||e.k==="d"){p.st.pts+=3;p.car.pts+=3}
    else if(e.k==="b"){p.st.sc+=e.v;p.car.sc+=e.v;p.st.pts+=e.v;p.car.pts+=e.v;haul[e.p]=(haul[e.p]||0)+e.v}

function milestones(m,r,haul){

  [[m.h,hsR],[m.a,asR]].forEach(([c,x])=>{

      if(f.filter(y=>y==="W").length===0&&m.stage==="reg"&&f.length>=2)news(`First win of the season for ${cname(c)} ${S.name}.`,m.sp,"first")}

/* =====================================================================
   tables — points or win %, configurable tiebreakers incl. head to head
   ===================================================================== */
function table(sp,codes,matches){
  const S=SPORTS[sp],P=S.points,rows={};
  codes.forEach(c=>rows[c]={code:c,p:0,w:0,d:0,l:0,f:0,a:0,bp:0,pts:0,form:[]});
  const played=matches.filter(m=>D.res[m.id]&&rows[m.h]&&rows[m.a]);
  played.forEach(m=>{
    const r=D.res[m.id],h=rows[m.h],a=rows[m.a];h.p++;a.p++;h.f+=r.hs;h.a+=r.as;a.f+=r.as;a.a+=r.hs;
    const hw=r.pw!=null?r.pw===0:r.hs>r.as,aw=r.pw!=null?r.pw===1:r.as>r.hs;
    if(hw){h.w++;a.l++;h.pts+=P.win;h.form.push("W");a.form.push("L")}
    else if(aw){a.w++;h.l++;a.pts+=P.win;a.form.push("W");h.form.push("L")}
    else{h.d++;a.d++;h.pts+=P.draw;a.pts+=P.draw;h.form.push("D");a.form.push("D")}
    if(P.bonusTries){
      if(r.th>=P.bonusTries){h.bp++;h.pts++}if(r.ta>=P.bonusTries){a.bp++;a.pts++}
      if(aw&&r.as-r.hs<=P.bonusLosing){h.bp++;h.pts++}if(hw&&r.hs-r.as<=P.bonusLosing){a.bp++;a.pts++}
    }
  });
  const list=Object.values(rows);
  list.forEach(r=>{r.pct=r.p?(r.w+r.d/2)/r.p:0;r.diff=r.f-r.a});
  const prim=r=>S.table==="pct"?r.pct:r.pts;
  list.sort((x,y)=>prim(y)-prim(x));
  const out=[];
  for(let i=0;i<list.length;){
    let j=i;while(j<list.length&&prim(list[j])===prim(list[i]))j++;
    const grp=list.slice(i,j);
    if(grp.length>1){
      const set=new Set(grp.map(r=>r.code)),h2h={};grp.forEach(r=>h2h[r.code]=0);
      played.forEach(m=>{if(set.has(m.h)&&set.has(m.a)){const r=D.res[m.id];const hw=r.pw!=null?r.pw===0:r.hs>r.as,aw=r.pw!=null?r.pw===1:r.as>r.hs;if(hw)h2h[m.h]+=3;else if(aw)h2h[m.a]+=3;else{h2h[m.h]++;h2h[m.a]++}}});
      const key={gd:r=>r.diff,pd:r=>r.diff,gf:r=>r.f,pf:r=>r.f,h2h:r=>h2h[r.code]};
      grp.sort((x,y)=>{for(const t of S.tiebreak){const d=key[t](y)-key[t](x);if(d)return d}return x.code.localeCompare(y.code)});
    }
    out.push(...grp);i=j;
  }
  return out;
}
function allMatches(){return Object.values(D.wm).flat()}
function confLadder(conf,sp){return table(sp,CAMPUSES.filter(c=>c.conf===conf).map(c=>c.code),allMatches().filter(m=>m.stage==="reg"&&m.conf===conf&&m.sp===sp))}
function groupTable(sp,g){return table(sp,D.nat[sp].groups[g],allMatches().filter(m=>m.stage==="nat"&&m.sp===sp&&m.grp===g))}

const weekMatches=w=>D.wm[w]||[];
const unplayed=w=>weekMatches(w).filter(m=>!D.res[m.id]).sort((x,y)=>x.id<y.id?-1:1);
function advance(){
  while(D.phase==="season"&&!unplayed(D.week).length){
    if(D.week>=D.weeks.length){finishSeason();break}
    if(D.weeks[D.week-1].stage==="reg"&&D.weeks[D.week].stage==="cf")news(`Regular season wrapped. Top four in every conference head into finals.`,"","first");
    D.week++;buildWeek(D.week);

}
function playWeek(){if(D.phase!=="season")return;unplayed(D.week).forEach(m=>applyMatch(m,simulateMatch(m)));advance()}
function simToEnd(){let g=0;while(D.phase==="season"&&g++<60)playWeek()}
function titleHistory(sp,kind,code){return D.archive.filter(a=>a.champs[sp]&&(kind==="nat"?a.champs[sp].nat===code:Object.values(a.champs[sp].conf).includes(code))).map(a=>a.season)}
function natChampion(sp){const N=D.nat[sp];if(!N)return null;if(N.format==="knockout"){if(N.rounds.length<KO_LABELS[8].length)return null;const last=N.rounds[N.rounds.length-1];return last[0]&&last[0].id&&D.res[last[0].id]?winnerOf(last[0].id):null}return D.res[mid("nat",sp,"gf")]?winnerOf(mid("nat",sp,"gf")):null}
function finishSeason(){
  D.phase="done";
  SPORT_IDS.forEach(sp=>{
    const S=SPORTS[sp],c=natChampion(sp);if(!c)return;
    const past=titleHistory(sp,"nat",c),prevYear=D.archive.length?D.archive[D.archive.length-1].champs[sp].nat:null;
    let line=`${cname(c)} are the ${D.season} ${S.name} national champions`;
    if(prevYear===c)line+=past.length>=2&&D.archive[D.archive.length-2]&&D.archive[D.archive.length-2].champs[sp].nat===c?". Three-peat!":", going back to back!";
    else if(!past.length)line+=", their first national title!";else line+=`, their first title since ${past[past.length-1]}.`;
    news(line,sp,"title",true);
    const top=topScorers(sp,"season")[0];
    if(top){const best=D.rec[sp].pSeason;if(!best||top.v>best.v){if(best&&D.archive.length)news(`${top.n} (${cname(top.code)}) finishes with ${top.v} ${S.unit}, a new OSG season record.`,sp,"rec",true);D.rec[sp].pSeason={v:top.v,name:top.n,code:top.code,season:D.season}}}
  });
}
function topScorers(sp,scope){
  const key=sp==="ru"?"sc":"sc";
  const list=Object.values(D.players).filter(p=>p.sp===sp).map(p=>{const s=scope==="season"?p.st:p.car;return{n:p.n,code:p.code,id:p.id,yr:p.yr,pos:p.pos,v:s[key],ap:s.ap,as:s.as,pts:s.pts}});
  if(scope==="career")D.alumni[sp].forEach(a=>list.push(Object.assign({alum:true},a)));
  return list.filter(x=>x.v>0||x.pts>0).sort((x,y)=>y.v-x.v||y.pts-x.pts||y.as-x.as);
}
function nextSeason(){
  if(D.phase!=="done")return;
  // 1. archive compactly
  const arch={season:D.season,champs:{},res:{},top:{}};
  SPORT_IDS.forEach(sp=>{
    arch.champs[sp]={nat:natChampion(sp),conf:{}};
    CONFS.forEach(cf=>arch.champs[sp].conf[cf.id]=winnerOf(mid("cf",cf.id,sp,"GF")));
    arch.res[sp]=allMatches().filter(m=>m.sp===sp&&D.res[m.id]).map(m=>[m.h,m.a,D.res[m.id].hs,D.res[m.id].as,m.w]);
    const t=topScorers(sp,"season")[0];if(t)arch.top[sp]={name:t.n,code:t.code,v:t.v};
  });
  D.archive.push(arch);
  // 2. ratings evolve: beat your expectation and you improve
  const rng=rngFor("between|"+D.season);
  SPORT_IDS.forEach(sp=>CAMPUSES.forEach(c=>{
    let sc=0,ex=0,con=0,exc=0;
    allMatches().forEach(m=>{if(m.sp!==sp||!D.res[m.id])return;const r=D.res[m.id];const u=SPORTS[sp].units.reduce((s,x)=>s+x[0]*x[1],0);
      if(m.h===c.code){sc+=r.hs;ex+=r.eh*u;con+=r.as;exc+=r.ea*u}else if(m.a===c.code){sc+=r.as;ex+=r.ea*u;con+=r.hs;exc+=r.eh*u}});
    const T=D.teams[c.code][sp];
    T.att=Math.round(clamp(T.att+15*Math.log((sc+2)/(ex+2))-(T.att-52)*.1,25,90));
    T.def=Math.round(clamp(T.def+15*Math.log((exc+2)/(con+2))-(T.def-52)*.1,25,90));
  }));
  // 3. players: graduate Year 12s, grow the rest, bring in Year 7s
  SPORT_IDS.forEach(sp=>CAMPUSES.forEach(c=>{
    const S=SPORTS[sp],key=c.code+"_"+sp,T=D.teams[c.code][sp];
    const keep=[];
    D.squads[key].forEach(id=>{
      const p=D.players[id];
      if(p.yr>=12){
        if(p.car.sc>=S.careerMarks[0]){D.alumni[sp].push({n:p.n,code:p.code,v:p.car.sc,ap:p.car.ap,as:p.car.as,pts:p.car.pts,last:D.season});
          if(p.car.sc>=S.careerMarks[1])news(`${p.n} graduates from ${cname(p.code)} with ${p.car.sc} career ${S.unit}.`,sp,"grad")}
        delete D.players[id];
      }else{p.yr++;p.sk=Math.round(clamp(p.sk+1+rng()*4+(p.yr<=9?2:0),30,96));p.out=0;p.why="";keep.push(id)}
    });
    D.alumni[sp].sort((x,y)=>y.v-x.v);D.alumni[sp]=D.alumni[sp].slice(0,40);
    const golden=rng()<.015;
    if(golden){T.golden=D.season+1+5;news(`Golden generation? ${cname(c.code)}'s new Year 7 ${S.name} intake looks special.`,sp,"gold",true)}
    const tmpl=posTemplate(S,S.squad),have={};keep.forEach(id=>{const pos=D.players[id].pos;have[pos]=(have[pos]||0)+1});
    const need=[];const cnt={};tmpl.forEach(pos=>{cnt[pos]=(cnt[pos]||0)+1});Object.keys(cnt).forEach(pos=>{for(let i=(have[pos]||0);i<cnt[pos];i++)need.push(pos)});
    while(keep.length+need.length<S.squad)need.push(tmpl[Math.floor(rng()*tmpl.length)]);
    need.slice(0,Math.max(0,S.squad-keep.length)).forEach(pos=>keep.push(makePlayer(c.code,sp,pos,7,T.q-8+(golden?14:0)+gauss(rng)*6,rng)));
    if(T.golden&&T.golden<=D.season+1)T.golden=0;
    D.squads[key]=keep;
  }));
  D.season++;D.seasonNo++;AVG_CACHE={};
  startSeason();indexMatches();
  news(`The ${D.season} season is underway.`,"","first");
}

  const momVal=live.mom.reduce((x,y)=>x+y,0)/6,w=Math.abs(momVal)*50,momStyle=momVal>=0?`left:${50-w}%;width:${w}%`:`left:50%;width:${w}%`;

  const opts=picks.map(p=>`<option value="${p.id}"${p.id===m.id?" selected":""}>${SPORTS[p.sp].name} · ${esc(p.tag)}: ${esc(cname(p.h))} v ${esc(cname(p.a))}</option>`).join("");
  const res=D.res[m.id];
  el.innerHTML=`
    <div class="mc-pick"><select id="pickSel" aria-label="Choose a game"${running?" disabled":""}>${finished?`<option>${Sp.name}: ${esc(cname(m.h))} v ${esc(cname(m.a))} (finished)</option>`:""}${opts}</select>
      ${finished&&picks.length?`<button class="btn primary" data-act="next-game">Next game</button>`:""}</div>
    <div class="stage">
      <div class="sb">${teamPanel(m.h,m.sp,m.neutral?"neutral":"home",H,0)}
        <div class="mid"><div class="clock">${r?clockTxt(m.sp,Math.min(live.r?live.t:r.end,r.end)):"0'"}</div><div class="per">${finished?"Full time"+(res&&res.xt?"<br>"+esc(xtTxt(res)):""):m.ko?"Knockout":esc(m.tag)}</div></div>
        ${teamPanel(m.a,m.sp,m.neutral?"neutral":"away",A,1)}</div>
      <div class="mom"><div class="lab"><span>${m.h} momentum</span><span>${m.a}</span></div><div class="bar"><i style="${momStyle}"></i></div></div>
      <div class="controls">
        ${finished?"":running?`<button class="cta" data-act="pause">Pause</button>`:`<button class="cta" data-act="start">${live.r?"Resume":"Kick off"}</button>`}
        <span class="per" style="margin-left:4px">Speed</span>
        ${["slow","normal","fast","instant"].map(k=>`<button class="chip" data-speed="${k}" aria-pressed="${S.speed===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}
      </div>
      <ul class="feed" aria-live="polite">${feed.length?feed.map(e=>{const big=e.k==="t"||e.k==="g"||e.v===3,bad=e.k==="i"||e.k==="r";return`<li class="${big?"big":""}${bad?" bad":""}"><span class="t">${clockTxt(m.sp,e.m)}</span><span class="txt">${esc(evText(m.sp,m,e))}</span><span class="s">${e.v?scoreAt(r,r.ev.indexOf(e)+1).join("–"):""}</span></li>`}).join(""):`<li class="empty-feed">${Sp.name} · ${esc(m.tag)} at ${m.neutral?"Finals Day (neutral ground)":esc(cname(m.h))+" campus"}. ${Sp.clock.periods} × ${Sp.clock.length/Sp.clock.periods} min. Hit Kick off for live commentary.</li>`}</ul>
    </div>
    <p class="note">Each side's expected scoring comes from its attack against the other side's defence, measured against the league average, with a home-ground boost outside of Finals Day. Missing players drop a side's rating by the gap to their replacement.</p>`;
  el.querySelectorAll("[data-d]").forEach(d=>{const i=+d.dataset.d;d.textContent=sc[i];if(bumps.includes(i))d.classList.add("bump")});
}

/* ---- season ---- */
function ladderHtml(sp,rows,qual){
  const Sx=SPORTS[sp],pct=Sx.table==="pct",bp=!!Sx.points.bonusTries,gd=sp==="so";
  return`<div class="tbl-wrap"><table><thead><tr><th class="l">#</th><th class="l">Campus</th><th>P</th><th>W</th>${pct?"":"<th>D</th>"}<th>L</th><th>${gd?"GF":"PF"}</th><th>${gd?"GA":"PA"}</th><th>${gd?"GD":"PD"}</th>${bp?"<th>BP</th>":""}<th class="l">Form</th><th>${pct?"PCT":"Pts"}</th></tr></thead><tbody>${
    rows.map((t,i)=>`<tr class="${i===0&&t.p?"lead ":""}${i<qual&&t.p?"q ":""}${t.code===MINE?"mine":""}"><td class="pos l">${i+1}</td><td class="l">${badge(t.code)} ${esc(cname(t.code))}</td><td>${t.p}</td><td>${t.w}</td>${pct?"":`<td>${t.d}</td>`}<td>${t.l}</td><td>${t.f}</td><td>${t.a}</td><td>${t.diff>0?"+":""}${t.diff}</td>${bp?`<td>${t.bp}</td>`:""}<td class="l"><span class="form">${t.form.slice(-5).map(x=>`<i class="${x}">${x}</i>`).join("")}</span></td><td class="pts">${pct?(t.p?t.pct.toFixed(3).replace(/^0/,""):"–"):t.pts}</td></tr>`).join("")}</tbody></table></div>`;
}
function resultRow(m,showWatch){
  const r=D.res[m.id],mine=m.h===MINE||m.a===MINE;
  const hw=r&&(r.pw!=null?r.pw===0:r.hs>r.as),aw=r&&(r.pw!=null?r.pw===1:r.as>r.hs);
  return`<div class="r${mine?" mine":""}"><span class="h">${badge(m.h)}<span class="nm">${esc(cname(m.h))}</span></span>
    <span class="sc">${r?`<span class="${hw?"w":""}">${r.hs}</span> – <span class="${aw?"w":""}">${r.as}</span>${r.xt?`<small>${esc(xtTxt(r))}</small>`:""}`:"v"}</span>
    <span class="a"><span class="nm">${esc(cname(m.a))}</span>${badge(m.a)}</span>
    ${r?"<span></span>":showWatch?`<button class="watch" data-watch="${m.id}">Watch</button>`:"<span></span>"}</div>`;
}
function renderSeason(){
  const reg=D.weeks.filter(w=>w.stage==="reg").length;
  const r=clamp(S.round,1,reg),w=r;
  let html=`<div class="roundbar"><button class="nav" data-act="prev"${r<=1?" disabled":""} aria-label="Previous round">‹</button>
    <div class="lbl"><b>Round ${r} · ${SPORTS[S.sport].name}</b><span>${fmtD(weekDate(w))} ${D.season}</span></div>
    <button class="nav" data-act="next"${r>=reg?" disabled":""} aria-label="Next round">›</button></div>`;
  const wm=weekMatches(w).filter(m=>m.sp===S.sport);
  confsShown().forEach(cf=>{
    const list=wm.filter(m=>m.conf===cf.id);
    html+=`<div class="h3">${cf.name}</div>`;
    html+=w>D.week?`<p class="note" style="margin-top:0">Fixtures appear when this round comes up.</p>`:list.length?`<div class="res">${list.map(m=>resultRow(m,w===D.week&&D.phase==="season")).join("")}</div>`:`<p class="note" style="margin-top:0">Bye round. This conference's draw is shorter.</p>`;
  });
  html+=`<div class="h3">Ladders · ${SPORTS[S.sport].name}</div>`;
  confsShown().forEach(cf=>{html+=`<p class="note" style="margin:12px 2px 6px;font-weight:600;color:var(--ink)">${cf.name}</p>`+ladderHtml(S.sport,confLadder(cf.id,S.sport),4)});
  const Sx=SPORTS[S.sport];
  html+=`<p class="note">${Sx.table==="pct"?"Sorted by win percentage, then head to head, then points difference.":`Win ${Sx.points.win} · Draw ${Sx.points.draw} · Loss 0${Sx.points.bonusTries?` · +1 bonus for ${Sx.points.bonusTries}+ tries · +1 for losing by ${Sx.points.bonusLosing} or less`:""}. Ties split on ${Sx.tiebreak.map(t=>({gd:"goal difference",gf:"goals scored",pd:"points difference",pf:"points scored",h2h:"head to head"})[t]).join(", then ")}.`} Top four in each conference make the finals.</p>`;
  $("#season").innerHTML=html;
}

/* ---- finals ---- */
function mBox(h,a,id,seedOf){
  const r=D.res[id],w=r?winnerOf(id):null;
  const row=(c,sc)=>`<div class="tm${w===c?" win":""}"><span class="seed">${seedOf?seedOf(c):""}</span><span>${badge(c)} ${esc(cname(c))}</span><span class="sc">${r?sc:""}</span></div>`;
  return`<div class="m">${row(h,r&&r.hs)}${row(a,r&&r.as)}${r&&r.xt?`<div class="xt">${esc(xtTxt(r))}</div>`:""}</div>`;
}
function renderFinals(){
  const sp=S.sport,Sx=SPORTS[sp];let html="";
  const champ=natChampion(sp);
  if(champ){const N=D.nat[sp];const gfId=N.format==="knockout"?N.rounds[N.rounds.length-1][0].id:mid("nat",sp,"gf");const m=findMatch(gfId),r=D.res[gfId];const ru=champ===m.h?m.a:m.h;
    html+=`<div class="champ"><div class="cup">${D.season} ${Sx.name} national champions</div><h2>${esc(cname(champ))}</h2><p>Beat ${esc(cname(ru))} ${Math.max(r.hs,r.as)}–${Math.min(r.hs,r.as)} in the Grand Final${r.xt?" ("+esc(xtTxt(r))+")":""}${titleHistory(sp,"nat",champ).length?` · titles also in ${titleHistory(sp,"nat",champ).join(", ")}`:""}</p></div>`}
  const N=D.nat[sp];
  if(N){
    const seedOf=c=>N.seeds.indexOf(c)+1||"";
    html+=`<div class="h3">National Finals · ${N.format==="knockout"?"knockout":"groups + knockout"}</div>`;
    if(N.format==="knockout"){
      html+=`<div class="bracket">`+KO_LABELS[8].map((lab,ri)=>{const rd=N.rounds[ri];
        return`<div class="col"><h4>${lab}</h4>${rd?rd.map(p=>p.bye?`<div class="m bye">${badge(p.h)} ${esc(cname(p.h))} (seed ${seedOf(p.h)}) has a bye</div>`:(p.id?mBox(p.h,p.a,p.id,seedOf):`<div class="m bye">${esc(cname(p.h))} v ${esc(cname(p.a))}</div>`)).join(""):`<div class="m bye">To be decided</div>`}</div>`}).join("")+`</div>`;
    }else{
      html+=`<div class="bracket">`+["A","B"].map(g=>`<div class="col"><h4>Group ${g}</h4>${ladderHtml(sp,groupTable(sp,g),2)}</div>`).join("");
      const sf=[0,1].map(i=>findMatch(mid("nat",sp,"sf",i))).filter(Boolean),gf=findMatch(mid("nat",sp,"gf"));
      html+=`<div class="col"><h4>Semi-finals</h4>${sf.length?sf.map(m=>mBox(m.h,m.a,m.id,seedOf)).join(""):`<div class="m bye">Group winners v runners-up</div>`}</div><div class="col"><h4>Grand final</h4>${gf?mBox(gf.h,gf.a,gf.id,seedOf):`<div class="m bye">To be decided</div>`}</div></div>`;
    }
    html+=`<p class="note">Seeds rank the conference champions on regular-season win rate, then points difference per game. ${N.format==="knockout"?"Six teams fill an eight-team bracket, so the top two seeds get byes.":"The six champions and the two best runners-up are drawn from seeded pots into two groups of four."} Finals Day is neutral ground, so there's no home boost.</p>`;
  }
  html+=`<div class="h3">Conference finals · ${Sx.name}</div>`;
  if(!Object.keys(D.cfSeeds).length)html+=`<div class="wait">Conference finals start after the regular season. The top four in each conference play a qualifying final (1 v 2) and an elimination final (3 v 4). The qualifying final loser gets a second chance in the preliminary final.</div>`;
  else{html+=`<div class="cf-grid">`+confsShown().map(cf=>{const seeds=D.cfSeeds[cf.id+"_"+sp]||[];
    const lines=FINALS_SERIES.flatMap(f=>f.games).map(g=>{const m=findMatch(mid("cf",cf.id,sp,g.id));if(!m)return`<div class="ln"><span class="k">${g.id}</span><span>To be decided</span><span></span></div>`;const r=D.res[m.id];const w=r?winnerOf(m.id):null;
      return`<div class="ln"><span class="k">${g.id}</span><span>${w===m.h?"<b>":""}${esc(cname(m.h))}${w===m.h?"</b>":""} v ${w===m.a?"<b>":""}${esc(cname(m.a))}${w===m.a?"</b>":""}</span><span class="s">${r?r.hs+"–"+r.as:""}</span></div>`}).join("");
    const ch=D.res[mid("cf",cf.id,sp,"GF")]?winnerOf(mid("cf",cf.id,sp,"GF")):null;
    return`<div class="cf"><h5>${cf.name}</h5>${lines}${ch?`<div class="champline">🏆 ${esc(cname(ch))}</div>`:""}</div>`}).join("")+`</div>`}
  $("#finals").innerHTML=html;
}

/* ---- players ---- */

  const sp=S.sport,Sx=SPORTS[sp];
  let html=`<div class="subtabs"><button class="pill" data-pview="leaders" aria-pressed="${S.pview==="leaders"}">Leaders</button><button class="pill" data-pview="squads" aria-pressed="${S.pview==="squads"}">Squads</button>

  if(S.pview==="leaders"){

    html+=`<p class="note">Each scoring play picks a scorer weighted by position and skill: position weight × (skill ÷ 70) to the power of ${Sx.starPower}. A higher power makes the stars stand out more, so soccer produces goal machines and basketball spreads the points.</p>`;

      <span class="note" style="margin:0">Team attack ${Math.round(st.att)} · defence ${Math.round(st.def)} (base ${T.att}/${T.def}, squad ${st.adj>=0?"+":""}${st.adj.toFixed(1)})${T.golden?` <span class="tag gold">Golden generation</span>`:""}</span></div>`;

      ids.map(id=>{const p=D.players[id];const out=p.out>D.week;const inXI=st.lineup.includes(id);
        return`<tr><td class="l">${inXI?"<b>":""}${esc(p.n)}${inXI?"</b>":""}${out?`<span class="tag ${p.why}">${p.why==="ban"?"Suspended":"Injured"} ${p.out-D.week} wk</span>`:""}</td><td class="l">${esc(p.pos)}</td><td>${p.yr}</td><td>${p.sk}</td><td>${p.st.ap}</td><td>${p.st.sc}</td><td>${p.st.as}</td><td>${p.car.sc}</td></tr>`}).join("")}</tbody></table></div>
      <p class="note">Bold players make this week's ${Sx.lineup}-player line-up. Year 12s graduate at the end of each season and a new Year 7 intake replaces them.</p>`;
  }

}

    <tr><td class="l">Highest score</td>${SPORT_IDS.map(sp=>{const r=D.rec[sp].high;return`<td class="l">${r?`${r.v} · ${esc(cname(r.code))} (${r.season})`:"–"}</td>`}).join("")}</tr>

    <tr><td class="l">Most in a game</td>${SPORT_IDS.map(sp=>{const r=D.rec[sp].pMatch;return`<td class="l">${r?`${r.v} · ${esc(r.name)}, ${r.code} (${r.season})`:"–"}</td>`}).join("")}</tr>
    <tr><td class="l">Most in a season</td>${SPORT_IDS.map(sp=>{const r=D.rec[sp].pSeason;return`<td class="l">${r?`${r.v} · ${esc(r.name)}, ${r.code} (${r.season})`:"–"}</td>`}).join("")}</tr>
  </tbody></table></div>`;

  html+=`<div class="h3">League settings and saves</div><div class="settings">

    <p class="note" style="margin:0">Changes apply now if no games have been played this season, otherwise from next season.</p>
    <div class="row"><button class="btn" data-act="export">Export save file</button><button class="btn" data-act="copy">Copy save code</button>
      <label class="btn" for="importFile" style="display:inline-block">Import save file</label><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <div class="row" style="flex-direction:column;align-items:stretch"><label for="ioText">Or paste a save code</label><textarea id="ioText" placeholder="Paste a save code here, then tap Load save code">${esc(S.io)}</textarea><div class="row"><button class="btn" data-act="paste-load">Load save code</button></div></div>
    <div class="row"><label for="seedIn">New league seed</label><input type="text" id="seedIn" value="${esc(D.seed)}" style="width:10em">
      ${S.confirm==="new"?`<span class="confirm">This wipes the current league. <button class="btn danger" data-act="new-yes">Start new league</button><button class="btn" data-act="new-no">Keep playing</button></span>`:`<button class="btn danger" data-act="new">Start new league</button>`}</div>
    <p class="note" style="margin:0">The same seed always produces the same league, so you can share a seed and replay identical seasons.</p>
  </div>`;
  $("#history").innerHTML=html;
}

/* ---- save import/export ---- */
function exportText(){return JSON.stringify(D)}
async function exportFile(){
  const name=`osg-cup-${D.season}-seed-${D.seed}.json`;
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:exportText()});return}}}catch(e){if(e&&e.code&&e.code!=="unavailable"){toast("Save cancelled");return}}
  try{const url=URL.createObjectURL(new Blob([exportText()],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Save file exported")}
  catch(e){toast("Export isn't available here. Use Copy save code instead")}
}
function importText(txt){
  try{const v=JSON.parse(txt);if(!v||v.app!=="osg-cup-sim"||v.v!==3)throw 0;stopLive();live=null;D=v;AVG_CACHE={};indexMatches();save();toast(`Loaded the ${D.season} season`);render()}
  catch(e){toast("That doesn't look like an OSG Cup save. Check you copied the whole thing")}
}

/* ---- events ---- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||t.disabled)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.confirm=null;if(S.tab==="season"){const wk=D.weeks[D.week-1];S.round=wk&&wk.stage==="reg"?D.week:D.weeks.filter(w=>w.stage==="reg").length}render();return}
  if(t.dataset.sport){S.sport=t.dataset.sport;savePrefs();if(live&&!live.r&&!live.timer){live=null;S.pickId=null}render();return}
  if(t.dataset.pview){S.pview=t.dataset.pview;renderPlayers();return}
  if(t.dataset.pscope){S.pscope=t.dataset.pscope;renderPlayers();return}
  if(t.dataset.speed){S.speed=t.dataset.speed;if(live&&live.timer)liveStart();else renderMatch([]);return}
  if(t.dataset.watch){S.tab="match";S.pickId=t.dataset.watch;loadLive(S.pickId);render();return}
  const a=t.dataset.act;
  if(a==="start")liveStart();
  else if(a==="pause"){stopLive();renderMatch([])}
  else if(a==="next-game"){live=null;S.pickId=null;renderMatch([])}
  else if(a==="sim-week"){const lbl=D.weeks[D.week-1].label;stopLive();live=null;playWeek();save();toast(lbl+" simulated");render()}
  else if(a==="sim-season"){stopLive();live=null;simToEnd();save();toast(`${D.season} season complete`);render()}
  else if(a==="next-season"){stopLive();live=null;nextSeason();save();S.round=1;toast(`Welcome to ${D.season}. Year 12s graduated and new Year 7s arrived`);render()}
  else if(a==="prev"){S.round--;renderSeason()}
  else if(a==="next"){S.round++;renderSeason()}
  else if(a==="export")exportFile();
  else if(a==="copy"){const txt=exportText();S.io=txt;renderHistory();try{navigator.clipboard.writeText(txt).then(()=>toast("Save code copied"),()=>{toast("Copy blocked. The code is in the box, select it to copy");$("#ioText").select()})}catch(err){$("#ioText").select()}}
  else if(a==="paste-load")importText($("#ioText").value);
  else if(a==="new"){S.confirm="new";renderHistory()}
  else if(a==="new-no"){S.confirm=null;renderHistory()}
  else if(a==="new-yes"){S.confirm=null;stopLive();live=null;const seed=($("#seedIn").value||"").trim()||String(Math.floor(Math.random()*1e6));AVG_CACHE={};newLeague(seed);indexMatches();news(`A new league begins with seed ${seed}.`,"","first");save();S.tab="match";toast("New league started");render()}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="pickSel"){S.pickId=e.target.value;loadLive(S.pickId);renderMatch([])}
  else if(id==="confSel"){S.conf=e.target.value;if(live&&!live.r&&!live.timer){live=null;S.pickId=null}render()}
  else if(id==="mineSel"){MINE=e.target.value;savePrefs();if(live&&!live.r&&!live.timer){live=null;S.pickId=null}render()}
  else if(id==="pcampSel"){S.pcamp=e.target.value;renderPlayers()}
  else if(id==="fmtSel"||id==="haChk"){
    if(id==="fmtSel")D.settings.format=e.target.value;else D.settings.homeAway=e.target.checked;
    if(D.week===1&&!Object.keys(D.res).length){stopLive();live=null;AVG_CACHE={};startSeason();indexMatches();toast("Applied to this season")}else toast(`Saved. Applies from the ${D.season+1} season`);
    save();render();
  }
  else if(id==="importFile"){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importText(String(rd.result));rd.readAsText(f);e.target.value=""}
});
document.addEventListener("input",e=>{if(e.target.id==="ioText")S.io=e.target.value});

/* ---- boot ---- */
if(!load()){newLeague(String(20261016));news("Welcome to the OSG Cup. 31 campuses, six conferences, three sports.","","first");save()}
indexMatches();
render();
window.__osg={get D(){return D},simulateMatch,playWeek,simToEnd,nextSeason,table,confLadder};
})();
</script>
</body></html>
