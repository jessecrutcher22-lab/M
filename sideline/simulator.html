<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Sideline Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Run a season of anything: pick a sport, teams and format, then simulate leagues, cups and finals season after season.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky dark header (logo, competition switcher, help/theme/new) over scrollable tabs; Home holds the setup wizard as numbered cards; other tabs are tables, brackets and a scoreboard */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#111b22; --muted:#5b6971; --line:#d9e0de;
  --accent:#2f8a5c; --accent-ink:#ffffff; --accent-soft:#e2f2ea;
  --head:#0f1822; --head-ink:#e8eef2; --head-line:#25344a; --head-muted:#9fb0bf;
  --board:#0b1424; --board-ink:#e9eef6; --board-line:#24344d; --board-muted:#a9b4c4; --amber:#ffb400;
  --live:#d62839; --good:#1d8348; --warn:#b26a00; --mine:#fff4d6;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1219; --surface:#141d27; --ink:#e8edf2; --muted:#93a2ae; --line:#263443;
  --accent:#5cc98f; --accent-ink:#0b1712; --accent-soft:#16302a;
  --head:#0b1118; --head-ink:#e8eef2; --head-line:#223142; --head-muted:#9fb0bf;
  --board:#060c16; --board-ink:#e9eef6; --board-line:#1f2e45; --board-muted:#a9b4c4; --amber:#ffbf2e;
  --live:#ff5a66; --good:#4cc47e; --warn:#f0a63a; --mine:#2a2412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1219; --surface:#141d27; --ink:#e8edf2; --muted:#93a2ae; --line:#263443;
  --accent:#5cc98f; --accent-ink:#0b1712; --accent-soft:#16302a;
  --head:#0b1118; --head-ink:#e8eef2; --head-line:#223142; --head-muted:#9fb0bf;
  --board:#060c16; --board-ink:#e9eef6; --board-line:#1f2e45; --board-muted:#a9b4c4; --amber:#ffbf2e;
  --live:#ff5a66; --good:#4cc47e; --warn:#f0a63a; --mine:#2a2412; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--head-line)}
header.top .wrap{padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#5cc98f,#3a7bd5);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#0b1712;flex:none}
.switch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--head-line);border-radius:999px;padding:4px 6px 4px 14px;background:#ffffff08}
.switch select{flex:1;min-width:0;background:none;border:0;color:var(--head-ink);font-weight:700;font-size:15px;padding:6px 0;appearance:auto}
.switch select option{color:#111}
.sbadge{font-weight:800;font-size:13px;color:#5cc98f;background:#5cc98f22;border-radius:999px;padding:3px 9px;flex:none}
.hbtn{flex:none;height:40px;min-width:40px;border-radius:999px;border:1px solid var(--head-line);background:none;color:var(--head-ink);font-weight:700;padding:0 12px}
.hbtn.sq{border-radius:10px}
#themeBtn{font-size:19px;line-height:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:var(--head-muted);font-weight:700;font-size:15px;padding:10px 12px 11px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--head-ink);border-color:var(--accent)}

main{padding-block:14px 64px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card>.hd{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.card>.hd h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.card>.bd{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.chipline{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13.5px;margin-top:8px}
.hero{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 55%);padding:22px 20px}
.hero .em{font-size:48px;line-height:1}
.hero h2{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:8px 0 6px;line-height:1}
.hero p{color:var(--muted);font-size:16px;max-width:52ch;margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;text-align:left}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#0b1424}
.btn.danger{border-color:var(--live);color:var(--live)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.fine{font-size:13.5px;color:var(--muted);margin:0}
.lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-weight:700;font-size:14px;color:var(--muted)}
.field input[type="text"],.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:15px;width:100%}
.field textarea{min-height:120px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .em{font-size:28px;line-height:1.1}
.opt b{font-size:16px}
.opt span{font-size:13.5px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.strength{display:grid;grid-template-columns:minmax(0,1fr) 140px 2.6em;gap:10px;align-items:center;font-size:14px}
.strength input[type="range"]{width:100%;accent-color:var(--accent)}
.strength .v{font-family:var(--display);font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.strength .nm{display:flex;gap:6px;align-items:center;min-width:0;overflow-wrap:anywhere}
.err{color:var(--live);font-size:13.5px;font-weight:600;margin:0}
.sumline{font-size:14px;color:var(--muted)}
.complist{display:grid;gap:8px}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.comp .em{font-size:24px}
.comp b{display:block}
.comp span{font-size:13px;color:var(--muted)}
.comp.on{border-color:var(--accent)}
.help{font-size:14.5px;color:var(--ink);display:grid;gap:8px}
.help p{margin:0;max-width:68ch}

.code{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;color:#fff;flex:none;display:inline-block;line-height:1.35;white-space:nowrap}
.h3{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;display:flex;align-items:center;gap:8px}
.h3::after{content:"";flex:1;height:1px;background:var(--line)}
.wait{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13.5px;font-weight:600;max-width:100%}

.progress{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.progress .meter{flex:1;min-width:140px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.progress .txt{font-size:13.5px;color:var(--muted);flex-basis:100%}
.progress .txt b{color:var(--ink)}

/* scoreboard */
.mc-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mc-pick select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:600}
.stage{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.side{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;text-align:center}
.side .tn{font-weight:600;font-size:14px;line-height:1.2;min-height:2.4em;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.rating{font-size:11.5px;color:var(--board-muted);letter-spacing:.04em}
.digits{font-family:var(--display);font-weight:800;font-size:clamp(60px,18vw,100px);line-height:.9;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,180,0,.25)}
.digits.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.12)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2.4em}
.clock{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.per{font-size:12px;color:var(--board-muted);text-transform:uppercase;letter-spacing:.1em;text-align:center}
.out{font-size:12px;color:var(--board-muted);line-height:1.35}
.out b{color:#ff8a93;font-weight:600}
.mom{display:flex;flex-direction:column;gap:4px}
.mom .lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--board-muted)}
.mom .bar2{height:8px;border-radius:99px;background:#1b2a42;position:relative;overflow:hidden}
.mom .bar2 i{position:absolute;top:0;bottom:0;left:50%;background:var(--amber);transition:all .4s}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--board-line);background:none;color:var(--board-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--board-ink);color:var(--board)}
.cta{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--amber);color:#0b1424}
.feed{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto;border-top:1px solid var(--board-line)}
.feed li{display:grid;grid-template-columns:4.4em 1fr auto;gap:10px;padding:8px 2px;border-bottom:1px solid var(--board-line);font-size:14px;align-items:baseline}
.feed .t{font-family:var(--display);font-weight:600;color:var(--board-muted);font-variant-numeric:tabular-nums}
.feed .s{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--amber)}
.feed li.big .txt{font-weight:700}
.feed li.bad .txt{color:#ff8a93}
.empty-feed{color:var(--board-muted);font-size:14px;padding:10px 2px}

/* fixtures + tables */
.roundbar{display:flex;align-items:center;gap:10px}
.roundbar .nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;flex:none}
.roundbar .l{flex:1;min-width:0}
.roundbar .l b{font-family:var(--display);font-size:22px;font-weight:700;display:block;line-height:1.1}
.roundbar .l span{font-size:13px;color:var(--muted)}
.res{display:grid;gap:6px}
.r{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.r.mine{background:var(--mine)}
.r .h{display:flex;gap:6px;align-items:center;min-width:0}
.r .a{display:flex;gap:6px;align-items:center;justify-content:flex-end;min-width:0;text-align:right}
.r .sc{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.r .sc small{display:block;font-family:var(--body);font-size:10.5px;font-weight:600;color:var(--muted)}
.r .w{color:var(--accent)}
.r .watch{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.r .nm{overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pts{font-family:var(--display);font-weight:800;font-size:18px}
td.pos{font-family:var(--display);font-weight:700;color:var(--muted);width:2.2em}
tr.q td.pos{color:var(--accent)}
tr.lead td.pos{color:var(--amber)}
tr.mine td{background:var(--mine)}
.form{display:inline-flex;gap:2px}
.form i{width:16px;height:16px;border-radius:3px;font-style:normal;font-size:10px;font-weight:700;display:inline-grid;place-items:center;color:#fff}
.form .W{background:var(--good)}.form .L{background:var(--live)}.form .D{background:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:1px}
.tag.inj{background:color-mix(in srgb,var(--live) 15%,transparent);color:var(--live)}
.tag.ban{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.gold{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--warn)}
.champ{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:18px}
.champ .cup{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.champ h2{font-family:var(--display);font-weight:800;font-size:34px;margin:2px 0 0;line-height:1}
.champ p{margin:4px 0 0;color:var(--board-muted);font-size:14px}
.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col h4{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.m{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.m .tm{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 10px;font-size:14px}
.m .tm+.tm{border-top:1px solid var(--line)}
.m .tm.win{font-weight:700}
.m .tm .seed{font-size:11px;color:var(--muted);min-width:1.4em}
.m .tm .sc{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.m .xt{font-size:11.5px;color:var(--muted);padding:4px 10px;border-top:1px dashed var(--line)}
.m.bye{border-style:dashed;color:var(--muted);font-size:13px;padding:10px}
.news{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.news li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.news .when{font-size:11.5px;color:var(--muted);grid-column:2}
.news .k{font-size:18px;line-height:1.2;grid-row:span 2}
.news li.big{border-color:var(--amber)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--live)}
textarea.io{width:100%;min-height:90px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:520px){
  .hbtn{padding:0 10px}
  .hero h2{font-size:34px}
  .feed li{grid-template-columns:3.8em 1fr auto;font-size:13.5px}
  .r{grid-template-columns:1fr auto 1fr}
  .r .watch{grid-column:1/-1;justify-self:center}
  .strength{grid-template-columns:minmax(0,1fr) 110px 2.4em}
  .grid2{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.digits.bump{animation:none}.progress .meter i,.mom .bar2 i{transition:none}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <span class="logo" aria-hidden="true">S</span>
      <label class="switch" for="compSel"><select id="compSel" aria-label="Competition"></select><span class="sbadge" id="sbadge"></span></label>
      <button class="hbtn" id="helpBtn" aria-label="How it works" aria-expanded="false">?</button>
      <button class="hbtn" id="themeBtn" aria-label="Switch theme">◐</button>
      <button class="hbtn sq" id="newBtn">New</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* =====================================================================
   sports.js — every sport is one settings object. Units are
   [value, weight, kind]: tc = converted try, t = try, p = penalty goal,
   d = drop/field goal, g = goal, b = basket. Tie steps run in order
   when scores are level: et = extra time, ot = repeat overtime,
   golden = first score wins, pens = shootout.
   ===================================================================== */
const SPORTS={
  so:{id:"so",name:"Soccer",emoji:"⚽",blurb:"goals, draws allowed",unit:"goals",statH:"Goals",tryV:0,
      basePlays:1.32,spread:52,dist:"poisson",units:[[1,1,"g"]],
      lg:[],ko:[{t:"et",min:10},{t:"pens",p:.74,label:"on penalties"}],
      points:{win:3,draw:1,loss:0},table:"points",tiebreak:["gd","gf","h2h"],
      lineup:11,squad:16,starPower:4.2,home:[1.15,.95],assist:.7,clock:{school:[60,2],senior:[90,2]},stoppage:4,
      pos:[["GK",1,.02,.1],["DEF",4,.35,.6],["MID",4,1,1.4],["FWD",2,2.6,1]],kickers:[],
      injury:.006,card:.0015,yellow:1.4,banWeeks:[1,1],haul:3,haulName:"hat-trick",careerMarks:[10,25,50,100]},
  bb:{id:"bb",name:"Basketball",emoji:"🏀",blurb:"points, no draws",unit:"points",statH:"Points",tryV:0,
      basePlays:22,senior:{basePlays:40},spread:75,dist:"normal",sd:1,units:[[2,.62,"b"],[3,.2,"b"],[1,.18,"b"]],
      lg:[{t:"ot",min:4}],ko:[{t:"ot",min:4}],
      points:{win:1,draw:0,loss:0},table:"pct",tiebreak:["h2h","pd"],

function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rngFor=key=>mulberry32(hash(D.seed+"|"+key));
function gauss(rng){let u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function poisson(l,rng){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rng()}while(p>L&&k<300);return k-1}
function weighted(rng,items,w){let tot=0;const ws=items.map(x=>{const v=Math.max(0,w(x));tot+=v;return v});if(tot<=0)return items[Math.floor(rng()*items.length)];let r=rng()*tot;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* =====================================================================
   fixtures.js — round robin, finals series, groups drawn from pots,
   knockouts padded to a power of two with byes for the top seeds
   ===================================================================== */
function roundRobin(teams){
  const t=teams.slice();if(t.length%2)t.push(null);
  const n=t.length,rounds=[];let arr=t.slice();
  for(let r=0;r<n-1;r++){const games=[];for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if(r%2===1&&i===0)[a,b]=[b,a];if(a&&b)games.push([a,b])}rounds.push(games);arr=[arr[0],arr[n-1]].concat(arr.slice(1,n-1))}
  return rounds;
}
const withReturn=rr=>D.format.homeAway?rr.concat(rr.map(g=>g.map(([h,a])=>[a,h]))):rr;
function bracketOrder(n){let o=[1];while(o.length<n){const m=o.length*2+1;o=o.flatMap(s=>[s,m-s])}return o}
const koSize=n=>{let s=2;while(s<n)s*=2;return s};
function koLabels(size){const l=[];for(let s=size;s>=2;s/=2)l.push(s===2?"Final":s===4?"Semi-finals":s===8?"Quarter-finals":"Round of "+s);return l}
const mid=(...p)=>D.season+"-"+p.join("-");
const strengthKey=id=>T(id).att+T(id).def;

function drawGroups(){
  const F=D.format,ids=D.order.slice();
  const regions=[...new Set(ids.map(id=>T(id).region).filter(Boolean))];
  if(F.groupBy==="region"&&regions.length>1&&ids.every(id=>T(id).region)){
    return regions.map(r=>({name:r,ids:ids.filter(id=>T(id).region===r)}));
  }
  const k=Math.max(2,Math.ceil(ids.length/F.groupSize)),rng=rngFor("groups|"+D.season);
  const seeded=ids.sort((a,b)=>strengthKey(b)-strengthKey(a)||a.localeCompare(b));
  const groups=Array.from({length:k},(_,i)=>({name:"Group "+String.fromCharCode(65+i),ids:[]}));
  for(let p=0;p<seeded.length;p+=k){shuffle(seeded.slice(p,p+k),rng).forEach((id,i)=>groups[i].ids.push(id))}
  return groups;
}
function koQualifierCount(){
  const F=D.format,n=D.order.length;
  if(F.structure==="cup")return n;
  if(F.structure==="leaguefinals")return F.finals==="top8"?Math.min(8,n):0;
  if(F.structure==="groups")return D.groups.reduce((s,g)=>s+Math.min(F.qualify,g.ids.length),0);
  return 0;
}
function startSeason(){
  const F=D.format;
  D.weeks=[];D.wm={};D.res={};D.fs=null;D.ko=null;D.form={};D.week=1;D.phase="season";
  Object.values(D.players).forEach(p=>{p.st=blankStats()});
  if(F.structure==="league"||F.structure==="leaguefinals"){
    const R=withReturn(roundRobin(D.order)).length;
    for(let r=1;r<=R;r++)D.weeks.push({st:"lg",n:r,label:"Round "+r});
    if(F.structure==="leaguefinals"&&F.finals==="top4")FINALS_SERIES.forEach((f,i)=>D.weeks.push({st:"fs",n:i+1,label:f.label}));
  }
  if(F.structure==="groups"){
    D.groups=drawGroups();
    const R=Math.max(...D.groups.map(g=>withReturn(roundRobin(g.ids)).length));
    for(let r=1;r<=R;r++)D.weeks.push({st:"grp",n:r,label:"Group round "+r});
  }else D.groups=[];
  const q=koQualifierCount();
  if(q>=2){const labs=koLabels(koSize(q));labs.forEach((lab,ri)=>{const final=ri===labs.length-1,legs=F.twoLegs&&!final?2:1;for(let leg=1;leg<=legs;leg++)D.weeks.push({st:"ko",r:ri,leg,legs,label:lab+(legs>1?" · leg "+leg:"")})})}
  buildWeek(1);
}

let MATCH_INDEX={};
const findMatch=id=>MATCH_INDEX[id];
function indexMatches(){MATCH_INDEX={};Object.values(D.wm).forEach(l=>l.forEach(m=>MATCH_INDEX[m.id]=m))}
function winnerOf(id){const r=D.res[id],m=findMatch(id);if(!r||!m)return null;return r.pw!=null?(r.pw?m.a:m.h):(r.hs>r.as?m.h:r.as>r.hs?m.a:null)}
function loserOf(id){const m=findMatch(id),w=winnerOf(id);return w?(w===m.h?m.a:m.h):null}
function tieWinner(p){
  if(p.bye)return p.h;if(!p.ids)return null;
  if(p.ids.length===1)return winnerOf(p.ids[0]);
  const r1=D.res[p.ids[0]],r2=D.res[p.ids[1]];if(!r1||!r2)return null;
  if(r2.pw!=null)return r2.pw===0?p.h:p.a;
  const h=r2.hs+r1.as,a=r2.as+r1.hs;return h>a?p.h:p.a;
}
function buildWeek(w){
  const wk=D.weeks[w-1],F=D.format,list=[];
  const mk=(o)=>Object.assign({ko:false,neutral:false,w},o);
  if(wk.st==="lg"){
    (withReturn(roundRobin(D.order))[wk.n-1]||[]).forEach(([h,a])=>list.push(mk({id:mid("r"+wk.n,h,a),h,a,st:"lg",tag:"Round "+wk.n})));
  }else if(wk.st==="grp"){
    D.groups.forEach((g,gi)=>(withReturn(roundRobin(g.ids))[wk.n-1]||[]).forEach(([h,a])=>list.push(mk({id:mid("g"+gi,wk.n,h,a),h,a,st:"grp",grp:gi,tag:g.name}))));
  }else if(wk.st==="fs"){
    if(wk.n===1)D.fs={seeds:leagueTable().slice(0,4).map(r=>r.id)};
    const seeds=D.fs.seeds;
    FINALS_SERIES[wk.n-1].games.forEach(g=>{
      const slot=s=>s[0]==="S"?seeds[+s.slice(1)-1]:(s[0]==="W"?winnerOf(mid("fs",s.slice(2))):loserOf(mid("fs",s.slice(2))));
      list.push(mk({id:mid("fs",g.id),h:slot(g.h),a:slot(g.a),st:"fs",tag:g.id==="GF"?"Grand final":g.id==="PF"?"Preliminary final":g.id==="QF"?"Qualifying final":"Elimination final",ko:true,neutral:g.id==="GF"&&F.neutralKO}));
    });
  }else{
    if(wk.r===0&&wk.leg===1)setupKO();
    const K=D.ko;
    if(wk.r>0&&wk.leg===1&&!K.rounds[wk.r]){const prev=K.rounds[wk.r-1],next=[];for(let i=0;i<prev.length;i+=2)next.push({h:tieWinner(prev[i]),a:tieWinner(prev[i+1])});K.rounds[wk.r]=next}
    const labs=koLabels(K.size),lab=labs[wk.r];
    K.rounds[wk.r].forEach((p,i)=>{
      if(p.bye)return;
      if(wk.legs===1){p.ids=[mid("k",wk.r,i)];list.push(mk({id:p.ids[0],h:p.h,a:p.a,st:"ko",tag:lab,ko:true,neutral:F.neutralKO}))}
      else if(wk.leg===1){p.ids=[mid("k",wk.r,i,"l1"),mid("k",wk.r,i,"l2")];list.push(mk({id:p.ids[0],h:p.a,a:p.h,st:"ko",tag:lab+" · leg 1"}))}
      else{const r1=D.res[p.ids[0]];list.push(mk({id:p.ids[1],h:p.h,a:p.a,st:"ko",tag:lab+" · leg 2",ko:true,agg:[r1.as,r1.hs]}))}
    });
  }
  D.wm[w]=list;list.forEach(m=>MATCH_INDEX[m.id]=m);
}
function rankRows(rows){return rows.sort((x,y)=>y.pct-x.pct||(y.diff/Math.max(1,y.p))-(x.diff/Math.max(1,x.p))||strengthKey(y.id)-strengthKey(x.id))}
function setupKO(){
  const F=D.format;let seeds;
  if(F.structure==="cup")seeds=D.order.slice().sort((a,b)=>strengthKey(b)-strengthKey(a)||a.localeCompare(b));
  else if(F.structure==="leaguefinals")seeds=leagueTable().slice(0,Math.min(8,D.order.length)).map(r=>r.id);

/* =====================================================================
   engine.js — ratings in, goals out
   ===================================================================== */
const posW=(S,pos,i)=>{const e=S.pos.find(x=>x[0]===pos);return e?e[i]:.5};
function lineupFor(team,week){
  const S=SP(),sq=D.squads[team].map(id=>D.players[id]);
  const avail=sq.filter(p=>!(p.out>week)),used=new Set(),ids=[];
  S.pos.forEach(([pos,cnt])=>{for(let i=0;i<cnt;i++){
    let best=null;avail.forEach(p=>{if(!used.has(p.id)&&p.pos===pos&&(!best||p.sk>best.sk))best=p});
    if(!best)avail.forEach(p=>{if(!used.has(p.id)&&(!best||p.sk>best.sk))best=p});
    if(best){used.add(best.id);ids.push(best.id)}
  }});
  return{ids,missing:sq.filter(p=>p.out>week).map(p=>p.id)};
}
function strength(team,week){
  const t=T(team),L=lineupFor(team,week),adj=(mean(L.ids.map(id=>D.players[id].sk))-62)*.5;
  return{att:t.att+adj,def:t.def+adj,lineup:L.ids,missing:L.missing,adj};
}
let AVG_CACHE={};
function leagueAvg(week){
  const k=D.id+"|"+D.season+"|"+week;if(AVG_CACHE[k])return AVG_CACHE[k];
  const all=D.order.map(id=>strength(id,week));
  return AVG_CACHE[k]={att:mean(all.map(s=>s.att)),def:mean(all.map(s=>s.def))};
}
function expectedPlays(att,oppDef,avg,homeMul){const S=SP();return basePlays()*Math.exp((att-avg.att)/S.spread)*Math.exp((avg.def-oppDef)/S.spread)*homeMul}
function rollPlays(l,rng){const S=SP();return S.dist==="poisson"?poisson(l,rng):Math.max(0,Math.round(l+gauss(rng)*S.sd*Math.sqrt(l)))}
function pickScorer(lineup,rng){const S=SP();return weighted(rng,lineup,id=>{const p=D.players[id];return posW(S,p.pos,2)*Math.pow(p.sk/70,S.starPower)})}
function pickAssist(lineup,rng,ex){const S=SP();const l=lineup.filter(id=>id!==ex);return l.length?weighted(rng,l,id=>posW(S,D.players[id].pos,3)*(D.players[id].sk/70)):null}
function kickerOf(lineup){const S=SP();let best=null;lineup.forEach(id=>{const p=D.players[id];const k=S.kickers.indexOf(p.pos);const sc=(k<0?0:30-k*10)+p.sk;if(!best||sc>best.sc)best={id,sc}});return best&&best.id}

function simulateMatch(m){
  const S=SP(),rng=rngFor("m|"+m.id),len=clockLen();
  const H=strength(m.h,m.w),A=strength(m.a,m.w),avg=leagueAvg(m.w);
  const hm=m.neutral?1:S.home[0],am=m.neutral?1:S.home[1];
  const eh=expectedPlays(H.att,A.def,avg,hm),ea=expectedPlays(A.att,H.def,avg,am);
  const ev=[],sc=[0,0],tries=[0,0],L=[H.lineup,A.lineup],agg=m.agg||[0,0];
  function play(side,u,min){
    const lu=L[side],e={m:min,s:side,v:u[0],k:u[2]};

  [0,1].forEach(side=>{
    L[side].forEach(id=>{

    });
    if(S.yellow){const n=poisson(S.yellow,rng);for(let i=0;i<n;i++)ev.push({m:rng()*len,s:side,k:"y",p:L[side][Math.floor(rng()*L[side].length)]})}
  });

      if(level())play(rng()<eh/(eh+ea)?0:1,S.units[S.units.length-1],t-.05);end=t;xt=k>1?k+"OT":"OT"}
    else if(st.t==="golden"){const times=[eh,ea].map(l=>-Math.log(1-rng())/(Math.max(l,.05)/len));const side=times[0]<times[1]?0:1;
      if(times[side]<st.min){play(side,weighted(rng,S.units,u=>(u[2]==="p"||u[2]==="d")?u[1]*3:u[1]),t+times[side]);end=t+times[side];xt="golden point"}else{t+=st.min;end=t}}
    else if(st.t==="pens"){const k=[0,0],pk=side=>clamp(st.p+(avgSk(side)-avgSk(1-side))/300,.4,.92);
      for(let i=0;i<5;i++){if(rng()<pk(0))k[0]++;if(rng()<pk(1))k[1]++}
      let g=0;while(k[0]===k[1]&&g++<30){if(rng()<pk(0))k[0]++;if(rng()<pk(1))k[1]++}

  return{id:m.id,hs:sc[0],as:sc[1],th:tries[0],ta:tries[1],eh,ea,ev,xt,pw,pens,lu:L,end};
}

const ICON={rec:"📈",star:"⭐",streak:"🔥",title:"🏆",gold:"✨",grad:"🎓",ban:"🟥",first:"📣"};
function applyMatch(m,r){

  });

/* =====================================================================
   tables — points or win %, configurable tiebreakers incl. head to head
   ===================================================================== */
function table(ids,matches){
  const S=SP(),P=S.points,rows={};
  ids.forEach(c=>rows[c]={id:c,p:0,w:0,d:0,l:0,f:0,a:0,bp:0,pts:0,form:[]});
  const played=matches.filter(m=>D.res[m.id]&&rows[m.h]&&rows[m.a]);
  played.forEach(m=>{
    const r=D.res[m.id],h=rows[m.h],a=rows[m.a];h.p++;a.p++;h.f+=r.hs;h.a+=r.as;a.f+=r.as;a.a+=r.hs;
    const hw=r.pw!=null?r.pw===0:r.hs>r.as,aw=r.pw!=null?r.pw===1:r.as>r.hs;
    if(hw){h.w++;a.l++;h.pts+=P.win;h.form.push("W");a.form.push("L")}
    else if(aw){a.w++;h.l++;a.pts+=P.win;a.form.push("W");h.form.push("L")}
    else{h.d++;a.d++;h.pts+=P.draw;a.pts+=P.draw;h.form.push("D");a.form.push("D")}
    if(P.bonusTries){if(r.th>=P.bonusTries){h.bp++;h.pts++}if(r.ta>=P.bonusTries){a.bp++;a.pts++}
      if(aw&&r.as-r.hs<=P.bonusLosing){h.bp++;h.pts++}if(hw&&r.hs-r.as<=P.bonusLosing){a.bp++;a.pts++}}
  });
  const list=Object.values(rows);list.forEach(r=>{r.pct=r.p?(r.w+r.d/2)/r.p:0;r.diff=r.f-r.a});
  const prim=r=>S.table==="pct"?r.pct:r.pts;
  list.sort((x,y)=>prim(y)-prim(x));
  const out=[];
  for(let i=0;i<list.length;){
    let j=i;while(j<list.length&&prim(list[j])===prim(list[i]))j++;
    const grp=list.slice(i,j);
    if(grp.length>1){
      const set=new Set(grp.map(r=>r.id)),h2h={};grp.forEach(r=>h2h[r.id]=0);
      played.forEach(m=>{if(set.has(m.h)&&set.has(m.a)){const r=D.res[m.id];const hw=r.pw!=null?r.pw===0:r.hs>r.as,aw=r.pw!=null?r.pw===1:r.as>r.hs;if(hw)h2h[m.h]+=3;else if(aw)h2h[m.a]+=3;else{h2h[m.h]++;h2h[m.a]++}}});
      const key={gd:r=>r.diff,pd:r=>r.diff,gf:r=>r.f,pf:r=>r.f,h2h:r=>h2h[r.id]};
      grp.sort((x,y)=>{for(const t of S.tiebreak){const d=key[t](y)-key[t](x);if(d)return d}return x.id.localeCompare(y.id)});
    }
    out.push(...grp);i=j;
  }
  return out;
}
const allMatches=()=>Object.values(D.wm).flat();
const leagueTable=()=>table(D.order,allMatches().filter(m=>m.st==="lg"));
const groupTable=gi=>table(D.groups[gi].ids,allMatches().filter(m=>m.st==="grp"&&m.grp===gi));

   season flow
   ===================================================================== */
const weekMatches=w=>D.wm[w]||[];
const unplayed=w=>weekMatches(w).filter(m=>!D.res[m.id]).sort((x,y)=>x.id<y.id?-1:1);
function advance(){
  while(D.phase==="season"&&!unplayed(D.week).length){

function playWeek(){if(D.phase!=="season")return;unplayed(D.week).forEach(m=>applyMatch(m,simulateMatch(m)));advance()}
function simToEnd(){let g=0;while(D.phase==="season"&&g++<200)playWeek()}
function champion(){

  if(F.structure==="leaguefinals"&&F.finals==="top4")return D.res[mid("fs","GF")]?winnerOf(mid("fs","GF")):null;

    res:allMatches().filter(m=>D.res[m.id]).map(m=>[m.h,m.a,D.res[m.id].hs,D.res[m.id].as,m.w])});

          if(p.car.sc>=S.careerMarks[1])news(`${p.n} ${isSchool()?"graduates from":"retires from"} ${tname(p.team)} with ${p.car.sc} career ${S.unit}.`,"grad")}
        delete D.players[pid];
      }else{p.age++;const g=isSchool()?1+rng()*4+(p.age<=9?2:0):(p.age<27?rng()*4:p.age<=30?rng()*2-1:-1-rng()*2);p.sk=Math.round(clamp(p.sk+g,30,96));p.out=0;p.why="";keep.push(pid)}
    });

    if(t.golden&&t.golden<=D.season+1)t.golden=0;

    need.slice(0,Math.max(0,S.squad-keep.length)).forEach(pos=>keep.push(makePlayer(id,pos,isSchool()?7:18+Math.floor(rng()*3),t.q-8+(golden?14:0)+gauss(rng)*6,rng)));

  });

}

function presetTeams(w){
  if(w.preset.startsWith("osg")){const confs=PRESETS[w.preset].confs;return OSG.filter(r=>confs.includes(r[2])).map(r=>({id:r[0],name:r[1],short:r[0],color:r[3],flag:"",region:OSG_CONF[r[2]],def:clamp(55+r[4]*2.5,1,99)}))}
  if(w.preset==="nations")return NATIONS.slice(0,w.nations).map(r=>({id:r[0],name:r[1],short:r[0],color:r[3],flag:r[2],region:r[5],def:r[4]}));
  const seen={};return w.custom.split(/\n|,/).map(s=>s.trim()).filter(Boolean).slice(0,32).map((name,i)=>{
    let short=name.replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase()||"T"+(i+1);while(seen[short])short=short.slice(0,2)+(i%10);seen[short]=1;
    return{id:short+i,name,short,color:PALETTE[i%PALETTE.length],flag:"",region:"",def:40+hash(name)%40}});
}
function newWizard(over){
  const w=Object.assign({sport:"ru",preset:"osg-all",nations:16,custom:"Red Rovers\nBlue Bulls\nGreen Giants\nGold Diggers\nSilver Hawks\nPurple Pythons",mode:"school",name:"",nameTouched:false,
    structure:"groups",groupSize:4,groupBy:"region",qualify:2,finals:"top4",homeAway:false,twoLegs:false,neutralKO:true,ratings:{},seed:""},over||{});

}
function wizTeams(){const list=presetTeams(W);list.forEach(t=>{if(W.ratings[t.id]==null)W.ratings[t.id]=t.def});return list}
function wizName(){return W.nameTouched&&W.name?W.name:`${PRESETS[W.preset].label} ${SPORTS[W.sport].name}${W.structure==="cup"?" Cup":W.structure==="groups"?" Championship":" League"}`}
function wizProblems(teams){
  const p=[],n=teams.length;
  if(n<2)p.push("Add at least two teams.");
  if((W.structure==="league"||W.structure==="leaguefinals")&&n<3)p.push("A league needs at least three teams.");
  if(W.structure==="leaguefinals"&&W.finals==="top4"&&n<4)p.push("A top-four finals series needs at least four teams.");
  if(W.structure==="groups"){
    const regions=[...new Set(teams.map(t=>t.region).filter(Boolean))];
    const byRegion=W.groupBy==="region"&&regions.length>1&&teams.every(t=>t.region);
    const sizes=byRegion?regions.map(r=>teams.filter(t=>t.region===r).length):(()=>{const k=Math.max(2,Math.ceil(n/W.groupSize));return Array.from({length:k},(_,i)=>Math.floor(n/k)+(i<n%k?1:0))})();
    if(n<4)p.push("Groups need at least four teams.");
    if(Math.min(...sizes)<2)p.push("Every group needs at least two teams. Try a bigger group size.");
    if(W.qualify>Math.min(...sizes))p.push(`Some groups only have ${Math.min(...sizes)} teams, so ${W.qualify} can't qualify from each.`);
  }
  return p;
}

}

function scoreAt(r,n){const s=[0,0];for(let i=0;i<n;i++){const e=r.ev[i];if(e.v)s[e.s]+=e.v}return s}
function liveTick(jump){
  if(!live||!live.r||live.comp!==D.id){stopLive();return}
  if(!jump)live.t+=.25;
  const before=live.shown,bumps=[];
  while(live.shown<live.r.ev.length&&live.r.ev[live.shown].m<=live.t){const e=live.r.ev[live.shown];if(e.v){bumps.push(e.s);live.mom.push(e.s?-1:1);if(live.mom.length>6)live.mom.shift()}live.shown++}
  if(live.t>=live.r.end){live.shown=live.r.ev.length;stopLive();live.done=true;applyMatch(live.m,live.r);const wk=D.week;advance();save();toast(D.week!==wk?`Result saved. On to ${D.phase==="done"?"the off-season":D.weeks[D.week-1].label}`:"Result saved");render();return}
  if(UI.view!=="overview")return;
  if(live.shown>before)renderOverview(bumps);else{const c=document.querySelector(".stage .clock");if(c)c.textContent=clockTxt(live.t)}
}

  return`<div class="side"><div class="tn">${badge(id)} ${esc(tname(id))}</div><div class="rating">ATT ${Math.round(st.att)} · DEF ${Math.round(st.def)} · ${label}</div><div class="digits" data-d="${idx}">0</div>

function matchCentre(bumps){
  const picks=matchPicks();
  if(live&&live.comp!==D.id)live=null;
  if(!live||(!live.timer&&!live.r&&!picks.some(p=>p.id===live.m.id))){const id=UI.pickId&&picks.some(p=>p.id===UI.pickId)?UI.pickId:defaultPick();if(id)loadLive(id);else live=null}
  if(!live)return`<div class="wait">The ${D.season} season is over. Check the Table for the champions, or start the next season.</div>`;
  const m=live.m,H=strength(m.h,m.w),A=strength(m.a,m.w);
  const r=live.r||(D.res[m.id]?{ev:D.res[m.id].ev.map(unpackEv),end:D.res[m.id].end}:null);
  const n=live.r?live.shown:(r?r.ev.length:0),sc=r?scoreAt(r,n):[0,0],feed=r?r.ev.slice(0,n).reverse():[];

/* ---- table ---- */
function ladderHtml(rows,qual){
  const S=SP(),pct=S.table==="pct",bp=!!S.points.bonusTries,gd=S.unit==="goals";
  return`<div class="tbl-wrap"><table><thead><tr><th class="l">#</th><th class="l">Team</th><th>P</th><th>W</th>${pct?"":"<th>D</th>"}<th>L</th><th>${gd?"GF":"PF"}</th><th>${gd?"GA":"PA"}</th><th>${gd?"GD":"PD"}</th>${bp?"<th>BP</th>":""}<th class="l">Form</th><th>${pct?"PCT":"Pts"}</th></tr></thead><tbody>${
    rows.map((t,i)=>`<tr class="${i===0&&t.p?"lead ":""}${i<qual&&t.p?"q ":""}${t.id===D.follow?"mine":""}"><td class="pos l">${i+1}</td><td class="l">${badge(t.id)} ${esc(tname(t.id))}</td><td>${t.p}</td><td>${t.w}</td>${pct?"":`<td>${t.d}</td>`}<td>${t.l}</td><td>${t.f}</td><td>${t.a}</td><td>${t.diff>0?"+":""}${t.diff}</td>${bp?`<td>${t.bp}</td>`:""}<td class="l"><span class="form">${t.form.slice(-5).map(x=>`<i class="${x}">${x}</i>`).join("")}</span></td><td class="pts">${pct?(t.p?t.pct.toFixed(3).replace(/^0/,""):"–"):t.pts}</td></tr>`).join("")}</tbody></table></div>`;
}
function tieBox(p,seedOf){
  if(p.bye)return`<div class="m bye">${badge(p.h)} ${esc(tname(p.h))} has a bye</div>`;
  if(!p.h||!p.a)return`<div class="m bye">To be decided</div>`;
  const w=tieWinner(p);let sh="",sa="",note="";
  if(p.ids&&p.ids.length===1&&D.res[p.ids[0]]){const r=D.res[p.ids[0]];sh=r.hs;sa=r.as;note=xtTxt(r)}
  else if(p.ids&&p.ids.length===2){const r1=D.res[p.ids[0]],r2=D.res[p.ids[1]];if(r1){sh=r1.as+(r2?r2.hs:0);sa=r1.hs+(r2?r2.as:0);note=`Legs: ${r1.as}–${r1.hs}`+(r2?`, ${r2.hs}–${r2.as}`+(r2.xt?` (${xtTxt(r2)})`:""):"")}}
  const row=(c,s)=>`<div class="tm${w===c?" win":""}"><span class="seed">${seedOf(c)}</span><span>${badge(c)} ${esc(tname(c))}</span><span class="sc">${s}</span></div>`;
  return`<div class="m">${row(p.h,sh)}${row(p.a,sa)}${note?`<div class="xt">${esc(note)}</div>`:""}</div>`;
}

  if(F.structure!=="cup")h+=`<p class="fine">${S.table==="pct"?"Sorted by win percentage, then head to head, then points difference.":`Win ${S.points.win} · Draw ${S.points.draw} · Loss 0${S.points.bonusTries?` · +1 bonus for ${S.points.bonusTries}+ tries · +1 for losing by ${S.points.bonusLosing} or less`:""}. Ties split on ${S.tiebreak.map(t=>({gd:"goal difference",gf:"goals scored",pd:"points difference",pf:"points scored",h2h:"head to head"})[t]).join(", then ")}.`}</p>`;

/* ---- import / export ---- */
async function exportFile(){
  const name=`${D.name.replace(/[^a-z0-9]+/gi,"-").toLowerCase()}-${D.season}.json`,txt=JSON.stringify(D);
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:txt});return}}}catch(e){if(e&&e.code&&e.code!=="unavailable"){toast("Save cancelled");return}}
  try{const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Save file exported")}catch(e){toast("Export isn't available here. Use Copy save code instead")}
}
function importText(txt){
  try{const v=JSON.parse(txt);if(!v||v.app!=="sideline-sim"||v.v!==4)throw 0;stopLive();live=null;if(D)save();D=v;AVG_CACHE={};indexMatches();save();UI.view="overview";toast(`Loaded ${D.name}`);render()}
  catch(e){toast("That doesn't look like a Sideline save. Check you copied all of it")}
}

  if(t.id==="newBtn"){W=newWizard();UI.view="home";UI.wiz=true;render();window.scrollTo(0,0);return}
  if(t.dataset.view){UI.view=t.dataset.view;UI.confirm=null;if(UI.view==="fixtures")UI.round=D.week;render();return}

  if(t.dataset.delYes){if(D&&D.id===t.dataset.delYes){stopLive();live=null}deleteComp(t.dataset.delYes);UI.confirm=null;toast("Competition deleted");render();return}
  if(t.dataset.speed){UI.speed=t.dataset.speed;if(live&&live.timer)liveStart();else renderOverview();return}
  if(t.dataset.watch){UI.view="overview";UI.pickId=t.dataset.watch;loadLive(UI.pickId);render();return}
  if(t.dataset.pview){UI.pview=t.dataset.pview;renderStats();return}
  if(t.dataset.pscope){UI.pscope=t.dataset.pscope;renderStats();return}
  const a=t.dataset.act;
  if(a==="wiz-open"){W=newWizard();UI.wiz=true;renderHome();window.scrollTo(0,0)}
  else if(a==="wiz-close"){UI.wiz=false;renderHome()}
  else if(a==="go-overview"){UI.view="overview";render()}
  else if(a==="help-close"){UI.help=false;render()}
  else if(a==="w-random"){const rng=mulberry32(Date.now()>>>0);wizTeams().forEach(x=>W.ratings[x.id]=20+Math.floor(rng()*75));renderHome()}
  else if(a==="w-even"){wizTeams().forEach(x=>W.ratings[x.id]=60);renderHome()}
  else if(a==="w-default"){W.ratings={};renderHome()}
  else if(a==="w-start")wizStart();
  else if(a==="start")liveStart();
  else if(a==="pause"){stopLive();renderOverview()}
  else if(a==="next-game"){live=null;UI.pickId=null;renderOverview()}
  else if(a==="sim-week"){const lbl=D.weeks[D.week-1].label;stopLive();live=null;playWeek();save();toast(lbl+" simulated");render()}
  else if(a==="sim-season"){stopLive();live=null;simToEnd();save();toast(`${D.season} season complete`);render()}
  else if(a==="next-season"){stopLive();live=null;nextSeason();save();toast(`Welcome to ${D.season}`);render()}
  else if(a==="all-news"){UI.allNews=!UI.allNews;renderOverview()}
  else if(a==="prev"){UI.round--;renderFixtures()}
  else if(a==="next"){UI.round++;renderFixtures()}
  else if(a==="export")exportFile();
  else if(a==="copy"){const txt=JSON.stringify(D);UI.io=txt;renderHistory();try{navigator.clipboard.writeText(txt).then(()=>toast("Save code copied"),()=>{toast("Copy blocked. Select the code in the box to copy it");$("#ioText").select()})}catch(err){$("#ioText").select()}}
  else if(a==="paste-load")importText($("#ioText").value);
  else if(a==="del-cur"){UI.confirm="del-cur";renderHistory()}
  else if(a==="del-cur-yes"){stopLive();live=null;const n=D.name;deleteComp(D.id);UI.confirm=null;UI.view=D?"overview":"home";toast(n+" deleted");render()}
  else if(a==="confirm-no"){UI.confirm=null;render()}
});
document.addEventListener("change",e=>{
  const id=e.target.id,v=e.target.value;
  if(id==="compSel"){stopLive();live=null;if(D)save();loadComp(v);UI.view=UI.view==="home"?"home":"overview";render();return}
  if(id==="wNations"){W.nations=+v;W.ratings={};renderHome()}
  else if(id==="wMode")W.mode=v;
  else if(id==="wStructure"){W.structure=v;renderHome()}
  else if(id==="wGroupBy"){W.groupBy=v;renderHome()}
  else if(id==="wGroupSize"){W.groupSize=+v;renderHome()}
  else if(id==="wQualify"){W.qualify=+v;renderHome()}
  else if(id==="wFinals"){W.finals=v;renderHome()}
  else if(id==="wHomeAway")W.homeAway=e.target.checked;
  else if(id==="wTwoLegs")W.twoLegs=e.target.checked;
  else if(id==="wNeutral")W.neutralKO=e.target.checked;
  else if(id==="wCustom"){W.custom=v;W.ratings={};renderHome()}
  else if(id==="pickSel"){UI.pickId=v;loadLive(v);renderOverview()}
  else if(id==="followSel"){D.follow=v;save();if(live&&!live.r&&!live.timer){live=null;UI.pickId=null}renderOverview()}
  else if(id==="pteamSel"){UI.pteam=v;renderStats()}
  else if(id==="sHomeAway"||id==="sTwoLegs"||id==="sNeutral"){
    const k={sHomeAway:"homeAway",sTwoLegs:"twoLegs",sNeutral:"neutralKO"}[id];D.format[k]=e.target.checked;
    if(D.week===1&&!Object.keys(D.res).length){stopLive();live=null;AVG_CACHE={};startSeason();indexMatches();toast("Applied to this season")}else toast(`Saved. Applies from the ${D.season+1} season`);
    save();render();
  }
  else if(id==="importFile"){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importText(String(rd.result));rd.readAsText(f);e.target.value=""}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(e.target.dataset.rate){W.ratings[e.target.dataset.rate]=+e.target.value;const o=document.getElementById("rv-"+e.target.dataset.rate);if(o)o.textContent=e.target.value}
  else if(id==="wName"){W.name=e.target.value;W.nameTouched=true}
  else if(id==="wSeed")W.seed=e.target.value;
  else if(id==="ioText")UI.io=e.target.value;
});

/* ---- boot ---- */
if(!(INDEX.current&&loadComp(INDEX.current))&&!(INDEX.list[0]&&loadComp(INDEX.list[0].id))){
  W=newWizard(QUICK.osg);
  createCompetition({name:"OSG Inter-Campus Rugby Championship",sport:"ru",mode:"school",seed:"20261016",teams:wizTeams().map(t=>Object.assign({},t,{rating:W.ratings[t.id]})),format:{structure:"groups",groupSize:4,groupBy:"region",qualify:2,finals:"top4",homeAway:false,twoLegs:false,neutralKO:true}});
  indexMatches();save();W=newWizard();
}
render();
window.__sim={get D(){return D},createCompetition:(c)=>{createCompetition(c);indexMatches();save();render();return D},simToEnd:()=>{simToEnd();save()},nextSeason:()=>{nextSeason();save()},presetTeams:(w)=>presetTeams(newWizard(w)),champion,leagueTable};
})();
</script>
</body></html>
