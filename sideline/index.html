        '<th class="l" style="width:34px">#</th><th class="l">Player</th><th class="l">Team</th>' +
        '<th>Apps</th><th class="strong">' + valHead + '</th></tr></thead><tbody>' +
        rows.map(function (x, i) {
          return '<tr class="clickable" data-act="team" data-id="' + x.t.id + '">' +
            '<td class="pos l">' + (i + 1) + '</td>' +
            '<td class="l"><span class="strong">' + esc(x.p.name) + '</span> ' +
            '<span class="tiny muted">' + x.p.pos + '</span></td>' +
            '<td class="l">' + teamCell(x.t, { abbr: true }) + '</td>' +
            '<td class="muted">' + x.apps + '</td>' +
            '<td class="strong">' + valFn(x) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    return '<div class="stack">' +
      '<div class="card"><div class="card-head"><h3>Top scorers</h3>' +
        (isWorldCup(comp) ? '<span class="badge">' + esc(phaseLabel(phase)) + '</span>' : '') +
        '<span class="badge badge-accent">Leading ' + esc(sp.scoreWordOne) + ' scorer: ' +
        esc(scorers[0].p.name) + '</span></div>' +
        plist(scorers, function (x) { return x.g; }, sp.scoreWord) + '</div>' +
      '<div class="grid grid-2">' +
        '<div class="card"><div class="card-head"><h3>Most assists</h3></div>' +
          (assists.length ? plist(assists, function (x) { return x.a; }, 'Assists') :
            '<div class="card-body"><p class="muted small" style="margin:0">No assists recorded.</p></div>') + '</div>' +
        '<div class="card"><div class="card-head"><h3>' + esc(sp.scoreWord) + ' + assists</h3></div>' +
          plist(contrib, function (x) { return x.g + x.a; }, 'Total') + '</div>' +
      '</div></div>';
  }

  function statsTeams(comp, table, phase) {
    var sp = sportOf(comp);
    if (!table.length || !table[0].p) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'Nothing played in ' + (isWorldCup(comp) ? phaseLabel(phase).toLowerCase() : 'this season') +
        ' yet.</p></div></div>';
    }
    var rows = table.slice().map(function (r) {
      return {
        r: r,
        scored: r.gf, conceded: r.ga,
        gpg: r.p ? r.gf / r.p : 0,
        cpg: r.p ? r.ga / r.p : 0,
        cs: r.cs, fts: r.fts,
        winPct: pct(r.w, r.p)
      };
    });
    return '<div class="stack"><div class="card">' +
      '<div class="card-head"><h3>Team breakdown</h3></div>' +
      '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th class="l">Team</th><th>P</th><th>Win %</th><th>' + esc(sp.scoreWord) + ' /match</th>' +
      '<th>Conceded /match</th>' +
      '<th>' + (sp.scoreWord === 'Goals' ? 'Clean sheets' : 'Shut-outs') + '</th>' +
      '<th>Failed to score</th><th class="strong">' +
      (comp.settings.rankBy === 'winpct' ? 'Win%' : 'PPG') + '</th>' +
      '</tr></thead><tbody>' +
      rows.map(function (x) {
        return '<tr class="clickable" data-act="team" data-id="' + x.r.id + '">' +
          '<td class="l">' + teamCell(x.r.team) + '</td>' +
          '<td class="muted">' + x.r.p + '</td>' +
          '<td>' + x.winPct + '%</td>' +
          '<td>' + x.gpg.toFixed(2) + '</td><td>' + x.cpg.toFixed(2) + '</td>' +
          '<td>' + x.cs + '</td><td>' + x.fts + '</td>' +
          '<td class="strong">' + (comp.settings.rankBy === 'winpct'
            ? winPctStr(x.r.winPct) : x.r.ppg.toFixed(2)) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>' +
      '<div class="grid grid-2">' +
        '<div class="card"><div class="card-head"><h3>' +
          (sp.scoreWord === 'Goals' ? 'Clean sheets' : 'Shut-outs') + '</h3></div><div class="card-body">' +
          barList(rows.slice().sort(function (a, b) { return b.cs - a.cs; }).slice(0, 8)
            .map(function (x) { return { label: x.r.team.abbr, value: x.cs, color: x.r.team.c1 }; })) +
        '</div></div>' +
        '<div class="card"><div class="card-head"><h3>' +
          (comp.settings.rankBy === 'winpct' ? 'Win rate' : 'Points per game') +
          '</h3></div><div class="card-body">' +
          barList(rows.slice(0, 8).map(function (x) {
            return { label: x.r.team.abbr,
                     value: comp.settings.rankBy === 'winpct' ? x.r.winPct : x.r.ppg,
                     color: x.r.team.c1 };
          }), { fmt: function (v) {
            return comp.settings.rankBy === 'winpct' ? winPctStr(v) : v.toFixed(2);
          } }) +
        '</div></div>' +
      '</div></div>';
  }

  function statsCharts(comp, table) {
    var s = comp.season, ui = app.ui;
    if (comp.format === 'cup') {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'Charts follow league position over time — a straight knockout has no table to track.</p></div></div>';
    }
    if (!table.length || !table[0].p) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'Play a matchday first and the charts will fill in.</p></div></div>';
    }
    var ph = E.positionHistory(comp.teams, s.matches, comp.settings);
    var chosen = ui.chartTeams || table.slice(0, 6).map(function (r) { return r.id; });
    var map = E.teamsById(comp);

    var allSeries = table.map(function (r, i) {
      return { id: r.id, name: r.team.abbr, color: PALETTE[i % PALETTE.length], row: r };
    });
    var active = allSeries.filter(function (x) { return chosen.indexOf(x.id) >= 0; });

    function build(mode) {
      return active.map(function (x) {
        return {
          id: x.id, name: x.name, color: x.color,
          points: ph.series[x.id].map(function (p) {
            return { x: p.md, y: mode === 'position' ? p.pos : p.pts };
          })
        };
      });
    }

    var posSeries = build('position'), ptsSeries = build('points');

    return '<div class="stack">' +
      '<div class="card"><div class="card-head"><h3>League position by matchday</h3>' +
        '<span class="badge">1st at the top</span></div><div class="card-body">' +
        lineChart(posSeries, {
          height: 300, invertY: true, yMin: 1, yMax: comp.teams.length,
          yTicks: Math.min(comp.teams.length - 1, 6), label: 'League position by matchday'
        }) +
        chartLegend(allSeries, chosen) +
        '<p class="tiny muted" style="margin:10px 0 0">Click a team to add or remove it from both charts.</p>' +
      '</div></div>' +
      '<div class="card"><div class="card-head"><h3>Points accumulated</h3></div><div class="card-body">' +
        lineChart(ptsSeries, { height: 260, yMin: 0, label: 'Points by matchday' }) +
      '</div></div>' +
    '</div>';
  }

  function statsRecords(comp, played, table, phase) {
    if (!played.length) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'Nothing played in ' + (isWorldCup(comp) ? phaseLabel(phase).toLowerCase() : 'this season') +
        ' yet.</p></div></div>';
    }
    var map = E.teamsById(comp);
    var byMargin = played.slice().sort(function (x, y) {
      return Math.abs(y.hg - y.ag) - Math.abs(x.hg - x.ag) || (y.hg + y.ag) - (x.hg + x.ag);
    }).slice(0, 5);
    var byGoals = played.slice().sort(function (x, y) { return (y.hg + y.ag) - (x.hg + x.ag); }).slice(0, 5);

    var sp = sportOf(comp);
    var totalGoals = played.reduce(function (a, m) { return a + m.hg + m.ag; }, 0);
    var homeWins = played.filter(function (m) { return m.hg > m.ag; }).length;
    var draws = played.filter(function (m) { return m.hg === m.ag; }).length;
    var awayWins = played.length - homeWins - draws;
    var cleanSheets = played.reduce(function (a, m) { return a + (m.hg === 0 ? 1 : 0) + (m.ag === 0 ? 1 : 0); }, 0);
    var goalless = played.filter(function (m) { return m.hg + m.ag === 0; }).length;

    // longest unbeaten run in the season so far
    var best = { team: null, run: 0 };
    var inPhase = {};
    played.forEach(function (m) { inPhase[m.id] = true; });
    comp.teams.forEach(function (t) {
      var run = 0, top = 0;
      comp.season.matches.forEach(function (m) {
        if (!m.played || !inPhase[m.id] || (m.h !== t.id && m.a !== t.id)) return;
        var gf = m.h === t.id ? m.hg : m.ag, ga = m.h === t.id ? m.ag : m.hg;
        if (gf >= ga) { run++; if (run > top) top = run; } else run = 0;
      });
      if (top > best.run) best = { team: t, run: top };
    });

    return '<div class="stack">' +
      '<div class="grid grid-4">' +
        tile('Home wins', homeWins + ' (' + pct(homeWins, played.length) + '%)', 'across ' + played.length + ' matches') +
        tile('Draws', draws + ' (' + pct(draws, played.length) + '%)', awayWins + ' away wins') +
        tile(sp.scoreWord === 'Goals' ? 'Clean sheets' : 'Shut-outs', cleanSheets,
             goalless + ' scoreless games') +
        tile('Longest unbeaten', best.run + ' matches', best.team ? esc(best.team.name) : '—') +
      '</div>' +
      '<div class="grid grid-2">' +
        '<div class="card"><div class="card-head"><h3>Biggest wins</h3></div><div>' +
          byMargin.map(function (m) { return fixtureRow(m, map); }).join('') + '</div></div>' +
        '<div class="card"><div class="card-head"><h3>Highest scoring</h3></div><div>' +
          byGoals.map(function (m) { return fixtureRow(m, map); }).join('') + '</div></div>' +
      '</div>' +
      '<div class="card"><div class="card-head"><h3>Where the ' +
        esc(sp.scoreWord.toLowerCase()) + ' went</h3>' +
        '<span class="badge">' + totalGoals + ' ' + esc(sp.scoreWord.toLowerCase()) + ' · ' +
        (totalGoals / played.length).toFixed(2) + ' per match</span>' +
        '</div><div class="card-body">' +
        barList(table.slice().sort(function (a, b) { return b.gf - a.gf; }).slice(0, 10).map(function (r) {
          return { label: r.team.abbr + ' — ' + r.gf + ' scored, ' + r.ga + ' conceded',
                   value: r.gf, color: r.team.c1 };
        })) +
      '</div></div>' +
    '</div>';
  }

  /* --------------------------------------------------------- betting view */

  function credits(n) {
    var v = Math.round(n);
    return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString();
  }

  function wagerEnabled(comp) {
    var w = comp.wager;
    return !!(w && w.enabled);
  }

  function viewBetting(comp) {
    var ui = app.ui;
    var w = W.ensure(comp);

    if (!w.enabled) {
      return '<div class="card"><div class="card-body empty">' +
        '<div class="big">🎲</div><h2>Betting is switched off</h2>' +
        '<p class="small" style="max-width:460px;margin:8px auto 16px">Turn it on to get an odds board ' +
        'priced off this competition\'s own simulation, a play-money balance, and a tipping ' +
        'competition against six computer tipsters.</p>' +
        '<button class="btn btn-primary" data-act="wager-on">Turn betting on</button>' +
        '</div></div>';
    }

    var led = W.ledger(comp);
    var tabs = '<div class="seg">' +
      [['board', 'Board'], ['season', 'Season'], ['bets', 'Bets'],
       ['tipping', 'Tipping'], ['ledger', 'Ledger']]
      .map(function (t) {
        return '<button data-act="wager-tab" data-tab="' + t[0] + '" aria-pressed="' +
          (ui.wagerTab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>';

    var header =
      '<div class="card"><div class="card-body" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">' +
        '<div><div class="section-title" style="margin:0">Balance</div>' +
          '<div style="font-size:1.6rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums">' +
          credits(w.bankroll) + '<span class="muted small" style="font-weight:500"> cr</span></div></div>' +
        '<div><div class="section-title" style="margin:0">Profit</div>' +
          '<div style="font-size:1.1rem;font-weight:700;color:' +
          (led.profit > 0 ? 'var(--accent)' : led.profit < 0 ? 'var(--red)' : 'var(--text-2)') + '">' +
          (led.profit > 0 ? '+' : '') + credits(led.profit) + '</div></div>' +
        (led.openCount ? '<div><div class="section-title" style="margin:0">Running</div>' +
          '<div style="font-size:1.1rem;font-weight:700">' + credits(led.pending) +
          '<span class="muted small" style="font-weight:500"> in ' + led.openCount + ' bet' +
          (led.openCount > 1 ? 's' : '') + '</span></div></div>' : '') +
        '<div class="wager-tabs">' + tabs + '</div>' +
      '</div></div>';

    var body;
    if (ui.wagerTab === 'bets') body = wagerBets(comp);
    else if (ui.wagerTab === 'season') body = wagerSeason(comp);
    else if (ui.wagerTab === 'tipping') body = wagerTipping(comp);
    else if (ui.wagerTab === 'ledger') body = wagerLedger(comp, led);
    else body = wagerBoard(comp);

    return '<div class="stack">' + header + body + '</div>';
  }

  /* ------------------------------------------------------- season betting */

  function seasonMarketTitle(comp) {
    return comp.format === 'worldcup' ? 'Outrights'
      : comp.format === 'cup' || comp.format === 'groups' ? 'Outrights' : 'Season markets';
  }

  function wagerSeason(comp) {
    var w = W.ensure(comp);
    var s = comp.season;
    var map = E.teamsById(comp);
    var open = w.bets.filter(function (b) {
      return b.kind === 'season' && b.status === 'open' && b.season === s.number;
    });

    if (s.complete) {
      return '<div class="card"><div class="card-body empty">' +
        '<div class="big">🏁</div><h2>Season ' + s.number + ' is done</h2>' +
        '<p class="small" style="max-width:420px;margin:8px auto 16px">Outrights are settled. ' +
        'Start the next season and the board goes up again, priced from a blank slate.</p>' +
        '<button class="btn btn-primary" data-act="go" data-view="overview">Back to the season</button>' +
        '</div></div>';
    }

    var markets = W.seasonMarkets(comp);
    if (!markets.length) {
      return '<div class="card"><div class="card-body"><p class="small muted" style="margin:0">' +
        'Nothing to price yet.</p></div></div>';
    }
    var proj = W.project(comp);
    var total = s.matches.length;
    var pct = total ? Math.round(proj.played / total * 100) : 0;

    var staked = {};
    open.forEach(function (b) {
      var k = b.market + '|' + b.side;
      staked[k] = (staked[k] || 0) + b.stake;
    });

    var head =
      '<div class="card"><div class="card-body">' +
        '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px">' +
          '<h2>' + esc(seasonMarketTitle(comp)) + '</h2>' +
          '<span class="badge">' + (proj.played ? pct + '% of the season played' : 'before a ball is kicked') + '</span>' +
          (open.length ? '<span class="badge badge-accent">' + open.length + ' running</span>' : '') +
        '</div>' +
        '<p class="small" style="margin:0">Every price here comes from playing the rest of the ' +
        'season out ' + proj.runs + ' times from exactly where it stands, so the board moves as ' +
        'results come in. Back something now or leave it — these settle when the season ends.</p>' +
      '</div></div>';

    var running = open.length ?
      '<div class="card"><div class="card-head"><h3>Your outrights</h3>' +
        '<span class="badge">' + credits(open.reduce(function (a, b) { return a + b.stake; }, 0)) +
        ' cr running</span></div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
        '<th class="l">Selection</th><th class="l">Market</th><th>Odds</th><th>Stake</th>' +
        '<th class="strong">Returns</th><th>Now</th></tr></thead><tbody>' +
        open.map(function (b) {
          var t = map[b.side];
          var live = null;
          markets.forEach(function (mk) {
            if (mk.id !== b.market) return;
            mk.picks.forEach(function (p) { if (p.side === b.side) live = p; });
          });
          var drift = live ? live.odds - b.odds : 0;
          return '<tr><td class="l strong">' + (t ? teamCell(t) : esc(b.label)) + '</td>' +
            '<td class="l muted small">' + esc(b.marketName) + '</td>' +
            '<td class="mono">' + b.odds.toFixed(2) + '</td>' +
            '<td>' + credits(b.stake) + '</td>' +
            '<td class="strong">' + credits(Math.round(b.stake * b.odds)) + '</td>' +
            '<td class="mono ' + (drift < -0.01 ? 'up' : drift > 0.01 ? 'down' : 'muted') + '">' +
            (live ? live.odds.toFixed(2) : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="zone-key">“Now” is what the same bet would cost today. Shorter than you ' +
        'took it means the market has come your way.</div></div>' : '';

    var cards = markets.map(function (mk) {
      var shown = mk.picks.slice(0, 12);
      return '<div class="card"><div class="card-head"><h3>' + esc(mk.name) + '</h3>' +
        (mk.note ? '<span class="badge">' + esc(mk.note) + '</span>' : '') +
        '</div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
        '<th class="l">Selection</th><th>Chance</th><th class="strong">Odds</th><th></th>' +
        '</tr></thead><tbody>' +
        shown.map(function (p) {
          var t = map[p.side];
          var mine = staked[mk.id + '|' + p.side];
          return '<tr><td class="l">' + (t ? teamCell(t) : esc(p.label)) +
            (mine ? ' <span class="badge tiny" title="You have ' + credits(mine) +
              ' cr on this">' + credits(mine) + '</span>' : '') + '</td>' +
            '<td class="muted">' + (p.p >= 0.005 ? Math.round(p.p * 100) + '%' : '<1%') + '</td>' +
            '<td class="strong mono">' + p.odds.toFixed(2) + '</td>' +
            '<td><button class="btn btn-sm" data-act="season-bet" data-market="' + esc(mk.id) +
            '" data-pick="' + esc(p.key) + '">Back</button></td></tr>';
        }).join('') + '</tbody></table></div>' +
        (mk.picks.length > shown.length
          ? '<div class="zone-key">' + (mk.picks.length - shown.length) +
            ' longer shots are not listed.</div>' : '') +
      '</div>';
    }).join('');

    return '<div class="stack">' + head + running +
      '<div class="grid grid-2">' + cards + '</div>' + '</div>';
  }

  function showSeasonSlip(comp, marketId, pickKey) {
    var market = null, pick = null;
    W.seasonMarkets(comp).forEach(function (mk) {
      if (mk.id !== marketId) return;
      market = mk;
      mk.picks.forEach(function (p) { if (p.key === pickKey) pick = p; });
    });
    if (!market || !pick) return;
    var w = W.ensure(comp);
    var map = E.teamsById(comp);
    var t = map[pick.side];

    modal('Back it for the season',
      '<div class="stat-tile" style="margin-bottom:14px">' +
        '<div class="k">' + esc(market.name) + '</div>' +
        '<div class="v" style="font-size:1.15rem">' + esc(t ? t.name : pick.label) + '</div>' +
        '<div class="s">' + esc(market.note || '') + ' · true chance ' +
        (pick.p >= 0.005 ? Math.round(pick.p * 100) + '%' : 'under 1%') + '</div></div>' +
      '<div class="grid grid-2">' +
        '<label class="field"><span class="lbl">Stake</span>' +
          '<input type="number" id="betStake" min="1" step="1" value="25" ' +
          'data-odds="' + pick.odds + '" ' +
          'max="' + Math.max(1, Math.floor(w.bankroll)) + '"></label>' +
        '<div class="field"><span class="lbl">Odds</span>' +
          '<div style="font-size:1.5rem;font-weight:700" class="mono">' + pick.odds.toFixed(2) +
          '</div></div>' +
      '</div>' +
      '<div class="btn-row" style="margin-bottom:14px">' +
        [10, 25, 50, 100].map(function (v) {
          return '<button class="btn btn-sm" data-act="stake-chip" data-v="' + v + '">' + v + '</button>';
        }).join('') +
        '<button class="btn btn-sm" data-act="stake-chip" data-v="all">All in</button>' +
      '</div>' +
      '<p class="small" id="betReturn" style="margin-bottom:14px"></p>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" data-act="place-season-bet" data-market="' +
          esc(market.id) + '" data-pick="' + esc(pick.key) + '">Place bet</button>' +
        '<button class="btn" data-act="close-modal">Cancel</button>' +
      '</div>' +
      '<p class="tiny muted" style="margin:14px 0 0">Balance ' + credits(w.bankroll) + ' cr. ' +
      'Settles at the end of season ' + comp.season.number + ' — the price you take is the price ' +
      'you keep, whatever the board does afterwards.</p>');
    updateBetReturn(pick.odds);
  }

  function wagerRound(comp) {
    var ui = app.ui;
    var mds = E.matchdaysOf(comp.season);
    var md = ui.wagerMd == null ? comp.season.round : ui.wagerMd;
    return E.clamp(md, 0, Math.max(0, mds - 1));
  }

  function roundPicker(comp, act) {
    var s = comp.season, mds = E.matchdaysOf(s), md = wagerRound(comp);
    var opts = '';
    for (var i = 0; i < mds; i++) {
      var any = s.matches.filter(function (m) { return m.md === i; })[0];
      var nm = !any ? 'Matchday ' + (i + 1)
        : any.stage === 'finals' ? (any.weekLabel || any.round)
        : any.stage === 'ko' ? any.round
        : 'Matchday ' + (i + 1);
      var done = s.matches.filter(function (m) { return m.md === i && !m.played; }).length === 0;
      opts += '<option value="' + i + '"' + (i === md ? ' selected' : '') + '>' +
        esc(nm) + (done ? ' — played' : '') + '</option>';
    }
    return '<select data-act="' + act + '" style="width:auto;min-width:170px">' + opts + '</select>';
  }

  function wagerBoard(comp) {
    var w = W.ensure(comp);
    var md = wagerRound(comp);
    var map = E.teamsById(comp);
    var ms = comp.season.matches.filter(function (m) { return m.md === md; });
    var upcoming = ms.filter(function (m) { return !m.played; });

    if (!ms.length) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'Nothing scheduled for this round.</p></div></div>';
    }

    var rows = ms.map(function (m) {
      var h = map[m.h], a = map[m.a];
      if (m.played) {
        return '<div class="fixture" data-act="match" data-id="' + esc(m.id) + '">' +
          '<div class="home ' + (m.hg > m.ag ? 'win' : 'lose') + '">' + esc(h.name) + kit(h) + '</div>' +
          '<div><span class="score">' + m.hg + ' – ' + m.ag + '</span></div>' +
          '<div class="away ' + (m.ag > m.hg ? 'win' : 'lose') + '">' + kit(a) + esc(a.name) + '</div></div>';
      }
      var mk = W.markets(comp, m);
      var result = mk[0];
      var on = W.stakedOn(comp, m.id);
      return '<div style="padding:11px 14px;border-bottom:1px solid var(--border-soft)">' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">' +
          teamCell(h, { strong: true }) +
          '<span class="muted tiny">v</span>' +
          teamCell(a, { strong: true }) +
          (on.length ? '<span class="badge badge-accent">' + on.length + ' bet' +
            (on.length > 1 ? 's' : '') + ' running</span>' : '') +
          '<button class="btn btn-sm btn-ghost" style="margin-left:auto" data-act="all-markets" ' +
            'data-id="' + esc(m.id) + '">All markets ›</button>' +
        '</div>' +
        '<div class="btn-row">' + result.picks.map(function (p) {
          return oddsButton(m, result, p);
        }).join('') + '</div>' +
      '</div>';
    }).join('');

    return '<div class="card">' +
      '<div class="card-head"><h2>Odds board</h2>' + roundPicker(comp, 'wager-md') +
        '<span class="badge">margin ' + Math.round((w.margin || 0) * 100) + '%</span>' +
      '</div>' + rows +
      '<div class="zone-key">Prices come from ' +
        '2,000 simulations of each fixture using this competition\'s own ratings, then the margin above ' +
        'is added. Play money only — nothing here is real.</div>' +
    '</div>' +
    (upcoming.length ? '' :
      '<div class="card"><div class="card-body"><p class="small muted" style="margin:0">' +
      'Every match in this round has been played. Pick a later round to see prices.</p></div></div>');
  }

  function oddsButton(match, market, p) {
    var short = p.short && p.short !== p.label
      ? '<span class="t-full">' + esc(p.label) + '</span>' +
        '<span class="t-abbr">' + esc(p.short) + '</span>'
      : esc(p.label);
    return '<button class="btn btn-sm" data-act="bet" data-match="' + esc(match.id) + '" ' +
      'data-market="' + esc(market.id) + '" data-pick="' + esc(p.key) + '" ' +
      'style="display:flex;gap:7px;align-items:baseline">' +
      '<span class="muted" style="font-weight:600">' + short + '</span>' +
      '<span class="strong mono">' + p.odds.toFixed(2) + '</span></button>';
  }

  function showMarkets(comp, matchId) {
    var m = null;
    comp.season.matches.forEach(function (x) { if (x.id === matchId) m = x; });
    if (!m || m.played) return;
    var map = E.teamsById(comp);
    var mk = W.markets(comp, m);
    var body = mk.map(function (market) {
      return '<div style="margin-bottom:16px">' +
        '<div class="section-title" style="margin-bottom:7px">' + esc(market.name) +
        (market.note ? ' <span class="muted" style="text-transform:none;letter-spacing:0">· ' +
          esc(market.note) + '</span>' : '') + '</div>' +
        '<div class="btn-row">' + market.picks.map(function (p) {
          return oddsButton(m, market, p);
        }).join('') + '</div></div>';
    }).join('');
    modal(map[m.h].abbr + ' v ' + map[m.a].abbr + ' — all markets', body);
  }

  function showBetSlip(comp, matchId, marketId, pickKey) {
    var m = null;
    comp.season.matches.forEach(function (x) { if (x.id === matchId) m = x; });
    if (!m) return;
    var market = null, pick = null;
    W.markets(comp, m).forEach(function (mk) {
      if (mk.id !== marketId) return;
      market = mk;
      mk.picks.forEach(function (p) { if (p.key === pickKey) pick = p; });
    });
    if (!market || !pick) return;
    var map = E.teamsById(comp);
    var w = W.ensure(comp);

    modal('Place a bet',
      '<div class="stat-tile" style="margin-bottom:14px">' +
        '<div class="k">' + esc(market.name) + '</div>' +
        '<div class="v" style="font-size:1.15rem">' + esc(pick.label) + '</div>' +
        '<div class="s">' + esc(map[m.h].name) + ' v ' + esc(map[m.a].name) + ' · ' +
        'true chance ' + Math.round(pick.p * 100) + '%</div></div>' +
      '<div class="grid grid-2">' +
        '<label class="field"><span class="lbl">Stake</span>' +
          '<input type="number" id="betStake" min="1" step="1" value="25" ' +
          'data-odds="' + pick.odds + '" ' +
          'max="' + Math.max(1, Math.floor(w.bankroll)) + '"></label>' +
        '<div class="field"><span class="lbl">Odds</span>' +
          '<div style="font-size:1.5rem;font-weight:700" class="mono">' + pick.odds.toFixed(2) + '</div></div>' +
      '</div>' +
      '<div class="btn-row" style="margin-bottom:14px">' +
        [10, 25, 50, 100].map(function (v) {
          return '<button class="btn btn-sm" data-act="stake-chip" data-v="' + v + '">' + v + '</button>';
        }).join('') +
        '<button class="btn btn-sm" data-act="stake-chip" data-v="all">All in</button>' +
      '</div>' +
      '<p class="small" id="betReturn" style="margin-bottom:14px"></p>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" data-act="place-bet" data-match="' + esc(m.id) + '" ' +
          'data-market="' + esc(market.id) + '" data-pick="' + esc(pick.key) + '">Place bet</button>' +
        '<button class="btn" data-act="close-modal">Cancel</button>' +
      '</div>' +
      '<p class="tiny muted" style="margin:14px 0 0">Balance ' + credits(w.bankroll) + ' cr. ' +
      'Play money — this competition only.</p>');
    updateBetReturn(pick.odds);
  }

  function updateBetReturn(odds) {
    var input = $('#betStake'), out = $('#betReturn');
    if (!input || !out) return;
    if (odds == null) odds = parseFloat(input.dataset.odds) || 1;
    var stake = Math.floor(Number(input.value) || 0);
    var ret = Math.round(stake * odds);
    out.innerHTML = stake > 0
      ? 'Returns <b>' + credits(ret) + ' cr</b> if it lands — a profit of <b>' +
        credits(ret - stake) + ' cr</b>.'
      : '<span class="muted">Enter a stake.</span>';
  }

  function wagerBets(comp) {
    var w = W.ensure(comp);
    var map = E.teamsById(comp);
    if (!w.bets.length) {
      return '<div class="card"><div class="card-body empty">' +
        '<div class="big">🎟️</div><h2>No bets yet</h2>' +
        '<p class="small" style="max-width:400px;margin:8px auto 16px">Head to the odds board and back ' +
        'something.</p><button class="btn btn-primary" data-act="wager-tab" data-tab="board">Odds board</button>' +
        '</div></div>';
    }
    function table(list, title, badge) {
      if (!list.length) return '';
      return '<div class="card"><div class="card-head"><h3>' + title + '</h3>' + (badge || '') + '</div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
        '<th class="l">Selection</th><th class="l">Market</th><th class="l">Fixture</th>' +
        '<th>Odds</th><th>Stake</th><th class="l">Result</th><th class="strong">Return</th>' +
        '</tr></thead><tbody>' +
        list.map(function (b) {
          var tone = b.status === 'won' ? 'var(--accent)' : b.status === 'lost' ? 'var(--red)' : '';
          return '<tr><td class="l strong">' + esc(b.label) + '</td>' +
            '<td class="l muted small">' + esc(b.marketName) + '</td>' +
            '<td class="l muted small">' + esc(b.fixture) + '</td>' +
            '<td class="mono">' + b.odds.toFixed(2) + '</td>' +
            '<td>' + credits(b.stake) + '</td>' +
            '<td class="l small">' + (b.result ? '<span class="mono">' + esc(b.result) + '</span>' :
              '<span class="muted">pending</span>') + '</td>' +
            '<td class="strong" style="color:' + tone + '">' +
              (b.status === 'open' ? '<span class="muted">—</span>' :
               b.status === 'won' ? '+' + credits(b.returned - b.stake) :
               b.status === 'void' ? 'void' : '−' + credits(b.stake)) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    var open = w.bets.filter(function (b) { return b.status === 'open'; });
    var done = w.bets.filter(function (b) { return b.status !== 'open'; }).slice(0, 60);
    return '<div class="stack">' +
      table(open, 'Running', '<span class="badge badge-accent">' + open.length + '</span>') +
      table(done, 'Settled', '<span class="badge">most recent first</span>') +
      '</div>';
  }

  function wagerLedger(comp, led) {
    var w = W.ensure(comp);
    if (!led.settled) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'Nothing settled yet — the ledger fills in once your bets have results.</p></div></div>';
    }
    var byMarket = {};
    w.bets.forEach(function (b) {
      if (b.status !== 'won' && b.status !== 'lost') return;
      var k = b.marketName;
      byMarket[k] = byMarket[k] || { name: k, n: 0, staked: 0, returned: 0, won: 0 };
      byMarket[k].n++; byMarket[k].staked += b.stake; byMarket[k].returned += b.returned;
      if (b.status === 'won') byMarket[k].won++;
    });
    var rows = Object.keys(byMarket).map(function (k) { return byMarket[k]; })
      .sort(function (x, y) { return (y.returned - y.staked) - (x.returned - x.staked); });

    return '<div class="stack">' +
      '<div class="grid grid-4">' +
        tile('Turnover', credits(led.staked), led.settled + ' settled bets') +
        tile('Returned', credits(led.returned), 'from ' + led.won + ' winners') +
        tile('Profit', (led.profit > 0 ? '+' : '') + credits(led.profit),
             (led.roi >= 0 ? '+' : '') + (led.roi * 100).toFixed(1) + '% return on turnover') +
        tile('Strike rate', Math.round(led.strike * 100) + '%', led.won + ' from ' + led.settled) +
      '</div>' +
      (led.best ? '<div class="card"><div class="card-head"><h3>Best result</h3></div>' +
        '<div class="card-body"><p class="small" style="margin:0">' +
        '<b>' + esc(led.best.label) + '</b> at <span class="mono">' + led.best.odds.toFixed(2) + '</span> ' +
        'in ' + esc(led.best.fixture) + ' returned <b>' + credits(led.best.returned) + ' cr</b> ' +
        'from a ' + credits(led.best.stake) + ' cr stake.</p></div></div>' : '') +
      '<div class="card"><div class="card-head"><h3>By market</h3></div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
        '<th class="l">Market</th><th>Bets</th><th>Staked</th><th>Returned</th>' +
        '<th>Strike</th><th class="strong">Profit</th></tr></thead><tbody>' +
        rows.map(function (r) {
          var p = r.returned - r.staked;
          return '<tr><td class="l">' + esc(r.name) + '</td><td class="muted">' + r.n + '</td>' +
            '<td>' + credits(r.staked) + '</td><td>' + credits(r.returned) + '</td>' +
            '<td>' + Math.round(r.won / r.n * 100) + '%</td>' +
            '<td class="strong" style="color:' + (p > 0 ? 'var(--accent)' : p < 0 ? 'var(--red)' : '') + '">' +
            (p > 0 ? '+' : '') + credits(p) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-body"><p class="tiny muted" style="margin:0">' +
      'The board carries a ' + Math.round((w.margin || 0) * 100) + '% margin, so backing everything ' +
      'returns about ' + (100 - Math.round((w.margin || 0) / (1 + (w.margin || 0)) * 100)) +
      '% of turnover over time. Beating it means finding prices the simulation has misjudged.' +
      '</p></div></div>' +
    '</div>';
  }

  function wagerTipping(comp) {
    var w = W.ensure(comp);
    if (!w.tipping) {
      return '<div class="card"><div class="card-body empty">' +
        '<div class="big">✍️</div><h2>Tipping is switched off</h2>' +
        '<p class="small" style="max-width:420px;margin:8px auto 16px">Pick a winner in every match and ' +
        'go up against six computer tipsters over the season.</p>' +
        '<button class="btn btn-primary" data-act="tipping-on">Turn tipping on</button></div></div>';
    }

    var md = wagerRound(comp);
    var map = E.teamsById(comp);
    var ms = comp.season.matches.filter(function (m) { return m.md === md; });
    var ladder = W.tipScores(comp);
    var feature = ms[0];

    var rows = ms.map(function (m) {
      var h = map[m.h], a = map[m.a];
      var t = w.tips[m.id] || {};
      var pick = t.user;
      var winner = m.played ? (m.tieWinner || (m.hg > m.ag ? m.h : m.hg < m.ag ? m.a : null)) : null;
      var drawn = m.played && m.hg === m.ag && !m.tieWinner;
      var got = m.played && pick && (drawn || pick === winner);
      var mark = !m.played ? ''
        : !pick ? '<span class="badge">no tip</span>'
        : got ? '<span class="badge badge-accent">✓</span>'
        : '<span class="badge badge-red">✕</span>';

      function opt(team, id) {
        var sel = pick === id;
        return '<button class="btn btn-sm' + (sel ? ' btn-primary' : '') + '"' +
          (m.played ? ' disabled' : '') +
          ' data-act="tip" data-id="' + esc(m.id) + '" data-team="' + esc(id) + '"' +
          ' style="flex:1;justify-content:center">' + kit(team) + esc(team.abbr) + '</button>';
      }

      return '<div style="padding:10px 14px;border-bottom:1px solid var(--border-soft);' +
        'display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        '<div style="display:flex;gap:6px;flex:1;min-width:200px;align-items:center">' +
          opt(h, m.h) + '<span class="muted tiny" title="home v away">v</span>' + opt(a, m.a) + '</div>' +
        (m.played ? '<span class="mono small">' + m.hg + '–' + m.ag + '</span>' : '') + mark +
        '</div>';
    }).join('');

    var played = ms.filter(function (m) { return m.played; }).length;
    var tipped = ms.filter(function (m) { return (w.tips[m.id] || {}).user; }).length;

    var marginBox = feature ?
      '<div class="card-body" style="border-top:1px solid var(--border-soft)">' +
        '<label class="field" style="margin:0;max-width:340px"><span class="lbl">Margin tip — ' +
        esc(map[feature.h].abbr) + ' v ' + esc(map[feature.a].abbr) + '</span>' +
        '<input type="number" min="0" max="200" value="' + (w.margins[md] == null ? '' : w.margins[md]) + '" ' +
        'placeholder="winning margin" data-act="tip-margin" data-md="' + md + '"' +
        (feature.played ? ' disabled' : '') + '>' +
        '<span class="hint">Breaks ties on the ladder. ' +
        (feature.played ? 'Actual margin ' + Math.abs(feature.hg - feature.ag) + '.' :
          'Closest across the season wins a countback.') + '</span></label>' +
      '</div>' : '';

    var ladderCard =
      '<div class="card"><div class="card-head"><h3>Tipping ladder</h3>' +
        '<span class="badge">season ' + comp.season.number + '</span></div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
        '<th class="l" style="width:34px">#</th><th class="l">Tipster</th>' +
        '<th>Tipped</th><th class="strong">Correct</th><th>Accuracy</th><th>Margin error</th>' +
        '</tr></thead><tbody>' +
        ladder.map(function (r) {
          return '<tr' + (r.you ? ' style="background:var(--accent-soft)"' : '') + '>' +
            '<td class="pos l">' + r.pos + '</td>' +
            '<td class="l"><span class="strong">' + esc(r.name) + '</span>' +
            (r.blurb ? ' <span class="tiny muted">' + esc(r.blurb) + '</span>' : '') + '</td>' +
            '<td class="muted">' + r.tipped + '</td>' +
            '<td class="strong">' + r.correct + '</td>' +
            '<td>' + (r.tipped ? Math.round(r.correct / r.tipped * 100) + '%' : '—') + '</td>' +
            '<td class="muted">' + (r.you ? r.error : '—') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="zone-key">A drawn match pays everyone, as in most tipping comps. ' +
        'Miss a match and it counts as a wrong tip.</div>' +
      '</div>';

    var hist = w.tipHistory.length ?
      '<div class="card"><div class="card-head"><h3>Past seasons</h3></div>' +
      '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th class="l">Season</th><th>Your finish</th><th>Correct</th><th class="l">Comp winner</th>' +
      '</tr></thead><tbody>' + w.tipHistory.slice().reverse().map(function (r) {
        return '<tr><td class="l strong">Season ' + r.season + '</td>' +
          '<td>' + r.pos + ' of ' + r.of + (r.pos === 1 ? ' 🏆' : '') + '</td>' +
          '<td>' + r.correct + '/' + r.tipped + '</td>' +
          '<td class="l muted">' + esc(r.winner) + ' (' + r.winnerCorrect + ')</td></tr>';
      }).join('') + '</tbody></table></div></div>' : '';

    return '<div class="stack">' +
      '<div class="card"><div class="card-head"><h2>Your tips</h2>' + roundPicker(comp, 'wager-md') +
        '<span class="badge">' + tipped + ' of ' + ms.length + ' tipped</span>' +
        (played ? '' : '<button class="btn btn-sm" data-act="tip-all-fav">Tip the favourites</button>') +
      '</div>' + (rows || '<div class="card-body"><p class="muted small" style="margin:0">' +
        'Nothing scheduled.</p></div>') + marginBox + '</div>' +
      ladderCard + hist +
    '</div>';
  }

  /* ---------------------------------------------------------- history view */

  function viewHistory(comp) {
    var ui = app.ui;
    if (!comp.history.length) {
      return '<div class="stack">' +
        '<div class="card"><div class="card-body empty">' +
        '<div class="big">📚</div><h2>No seasons archived yet</h2>' +
        '<p class="small" style="max-width:440px;margin:8px auto 16px">Play through the current season and start ' +
        'the next one. Every completed season is stored here in full — final table, every result, ' +
        'award winners and scorers — and rolls up into all-time records.</p>' +
        '<button class="btn btn-primary" data-act="go" data-view="overview">Back to the season</button>' +
        '</div></div>' +
        (comp.season.matches.some(function (m) { return m.played; })
          ? '<div class="card"><div class="card-head"><h2>Records so far</h2></div></div>' + recordsBook(comp) : '') +
        '</div>';
    }

    var histTabs = [['honours', 'Honours'], ['seasons', 'Seasons'], ['alltime', 'All-time'],
       ['scorers', 'Scorers'], ['h2h', 'H2H'], ['rivals', 'Rivalries'],
       ['records', 'Records'], ['story', 'Story']];
    if (comp.format === 'worldcup') histTabs.splice(3, 0, ['qualifying', 'Qualifying']);
    // the Qualifying tab only exists for a World Cup, so fall back if it is not here
    var histTab = histTabs.some(function (t) { return t[0] === ui.histTab; }) ? ui.histTab : 'honours';
    var tabs = '<div class="seg seg-scroll">' +
      histTabs
      .map(function (t) {
        return '<button data-act="hist-tab" data-tab="' + t[0] + '" aria-pressed="' +
          (histTab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>';

    var body;
    if (histTab === 'seasons') body = histSeasons(comp);
    else if (histTab === 'alltime') body = histAllTime(comp);
    else if (histTab === 'qualifying') body = histQualifying(comp);
    else if (histTab === 'scorers') body = histScorers(comp);
    else if (histTab === 'h2h') body = histH2H(comp);
    else if (histTab === 'rivals') body = rivalriesCard(comp);
    else if (histTab === 'story') body = histStory(comp);
    else if (histTab === 'records') body = recordsBook(comp);
    else body = histHonours(comp);

    return '<div class="stack">' +
      '<div class="card"><div class="card-head"><h2>History</h2>' + tabs +
      '<span class="badge">' + comp.history.length + ' season' + (comp.history.length > 1 ? 's' : '') + '</span>' +
      '</div></div>' + body + '</div>';
  }

  function histHonours(comp) {
    var all = S.allTimeTable(comp, false);
    var withTitles = all.filter(function (r) { return r.titles > 0 || r.runnerUps > 0; });
    var seasons = comp.history.length;

    var chart = '';
    if (seasons > 1) {
      var tracked = all.slice(0, 6);
      var series = tracked.map(function (r, i) {
        return {
          id: r.team.id, name: r.team.abbr, color: PALETTE[i % PALETTE.length],
          points: r.positions.map(function (p) { return { x: p.season, y: p.pos }; })
        };
      });
      chart = '<div class="card"><div class="card-head"><h3>Where they finished, season by season</h3></div>' +
        '<div class="card-body">' +
        lineChart(series, {
          height: 280, invertY: true, yMin: 1, yMax: comp.teams.length,
          yTicks: Math.min(comp.teams.length - 1, 6), label: 'Finishing position by season'
        }) + chartLegend(series, null) + '</div></div>';
    }

    return '<div class="stack">' +
      '<div class="grid grid-4">' +
        tile('Seasons played', seasons, comp.name) +
        tile('Different champions', new Set(comp.history.map(function (r) { return r.champion; })).size,
             'out of ' + comp.teams.length + ' teams') +
        tile('Most titles', withTitles[0] ? withTitles[0].titles : 0,
             withTitles[0] ? esc(withTitles[0].team.name) : '—') +
        tile('Total ' + sportOf(comp).scoreWord.toLowerCase(), comp.history.reduce(function (a, r) {
          return a + r.table.reduce(function (b, t) { return b + t.gf; }, 0);
        }, 0), 'across every archived season') +
      '</div>' +
      '<div class="card"><div class="card-head"><h3>Roll of honour</h3>' +
        (comp.history.some(function (r) { return r.finalsSystem; }) ?
          '<span class="badge">Premierships, not minor premierships</span>' : '') +
        '</div><div class="card-body">' +
        (withTitles.length ? withTitles.map(function (r) {
          return '<div class="honour">' + kit(r.team, true) +
            '<span><span class="strong">' + esc(r.team.name) + '</span><br>' +
            '<span class="tiny muted">' + r.titles + ' title' + (r.titles === 1 ? '' : 's') +
            (r.runnerUps ? ' · ' + r.runnerUps + ' runner-up' : '') + '</span></span>' +
            '<span class="trophies">' + new Array(r.titles + 1).join('<i>🏆</i>') +
            new Array(r.runnerUps + 1).join('<i style="opacity:.45">🥈</i>') + '</span></div>';
        }).join('') : '<p class="muted small" style="margin:0">Nothing won yet.</p>') +
      '</div></div>' + chart +
    '</div>';
  }

  function histSeasons(comp) {
    var anyFinals = comp.history.some(function (r) { return r.finalsSystem; });
    var anyQual = comp.history.some(function (r) { return r.qualified && r.qualified.length; });
    return '<div class="card"><div class="card-head"><h3>Every season</h3>' +
      '<span class="badge">Newest first</span></div>' +
      '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th class="l">Season</th><th class="l">' + (anyFinals ? 'Premiers' : 'Champions') + '</th>' +
      (anyFinals ? '<th class="l">Minor premiers</th>' : '') +
      '<th class="l">Runner-up</th>' +
      '<th class="l">Top scorer</th>' +
      (anyQual ? '<th>New in</th>' : '') +
      '<th>' + (comp.settings.rankBy === 'winpct' ? 'W' : 'Pts') + '</th><th>' +
      esc(sportOf(comp).scoreWord) + '</th><th></th>' +
      '</tr></thead><tbody>' +
      comp.history.slice().reverse().map(function (rec) {
        var champ = comp.teams[rec.champion], run = comp.teams[rec.runnerUp];
        var champRow = rec.table[0];
        var goals = rec.table.reduce(function (a, t) { return a + t.gf; }, 0);
        var ts = rec.awards.topScorer;
        var minor = rec.minorPremier != null ? comp.teams[rec.minorPremier] : null;
        return '<tr class="clickable" data-act="season" data-n="' + rec.n + '">' +
          '<td class="l strong">Season ' + rec.n + '</td>' +
          '<td class="l">' + teamCell(champ) + '</td>' +
          (anyFinals ? '<td class="l">' + (minor ?
            (minor.id === (champ && champ.id) ?
              '<span class="badge badge-amber">Double</span> ' : '') + teamCell(minor)
            : '<span class="muted">—</span>') + '</td>' : '') +
          '<td class="l muted">' + esc(run ? run.name : '—') + '</td>' +
          '<td class="l">' + (ts ? '<span class="strong">' + esc(ts.n) + '</span> <span class="tiny muted">' +
            ts.g + '</span>' : '<span class="muted">—</span>') + '</td>' +
          (anyQual ? '<td>' + newcomerCount(comp, rec) + '</td>' : '') +
          '<td>' + (champRow ? (comp.settings.rankBy === 'winpct' ? champRow.w : champRow.pts) : '—') + '</td>' +
          '<td class="muted">' + goals + '</td>' +
          '<td class="muted">›</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  // How many of this cycle's qualifiers were absent from the previous one.
  function newcomerCount(comp, rec) {
    if (!rec.qualified || !rec.qualified.length) return '<span class="muted">—</span>';
    var i = comp.history.indexOf(rec);
    var prev = i > 0 ? comp.history[i - 1] : null;
    if (!prev || !prev.qualified) return '<span class="muted">—</span>';
    var was = {};
    prev.qualified.forEach(function (q) { was[q.t] = true; });
    var n = rec.qualified.filter(function (q) { return !was[q.t]; }).length;
    return n ? '<span class="strong">' + n + '</span>' : '0';
  }

  // How often each nation reaches the finals, and the longest unbroken run of it.
  function histQualifying(comp) {
    var rows = S.qualificationRuns(comp, true);
    if (!rows.length) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'No edition has been completed yet, so there is nothing to compare.</p></div></div>';
    }
    var editions = rows[0].editions;
    var live = rows.some(function (r) { return r.currentLive; });

    function span(r) {
      if (!r.best) return '<span class="muted">\u2014</span>';
      return '<span class="tiny muted">' + (r.best === 1 ? 'S' + r.bestFrom
        : 'S' + r.bestFrom + '\u2013' + r.bestTo) + '</span>';
    }

    var longest = rows[0].best;
    var holders = rows.filter(function (r) { return r.best === longest; });
    var running = rows.slice().sort(function (a, b) { return b.current - a.current; });
    var onNow = running.filter(function (r) { return r.current === running[0].current && r.current > 0; });
    var everPresent = rows.filter(function (r) { return r.apps === editions; });

    function nameList(list, max) {
      var shown = list.slice(0, max || 6);
      return shown.map(function (r) {
        return '<span class="badge" title="' + esc(r.team.name) + '">' + kit(r.team) + ' ' +
          esc(r.team.abbr) + '</span>';
      }).join('') + (list.length > shown.length
        ? '<span class="tiny muted" style="align-self:center">+' +
          (list.length - shown.length) + ' more</span>' : '');
    }

    var tiles = '<div class="grid grid-3">' +
      '<div class="card"><div class="card-head"><h3>Longest run</h3>' +
        '<span class="badge badge-accent">' + longest + ' in a row</span></div>' +
        '<div class="card-body"><div style="display:flex;flex-wrap:wrap;gap:5px">' +
        nameList(holders) + '</div>' +
        '<p class="tiny muted" style="margin:10px 0 0">' +
        (holders.length === 1 ? 'Seasons ' + holders[0].bestFrom + '\u2013' + holders[0].bestTo
          : 'Shared by ' + holders.length + ' nations.') + '</p></div></div>' +
      '<div class="card"><div class="card-head"><h3>On the longest run now</h3>' +
        '<span class="badge">' + (onNow.length ? onNow[0].current : 0) + ' in a row</span></div>' +
        '<div class="card-body"><div style="display:flex;flex-wrap:wrap;gap:5px">' +
        (onNow.length ? nameList(onNow) : '<span class="muted small">Nobody \u2014 every run is broken.</span>') +
        '</div><p class="tiny muted" style="margin:10px 0 0">' +
        (live ? 'Counting the edition being played.' : 'As at the last completed edition.') +
        '</p></div></div>' +
      '<div class="card"><div class="card-head"><h3>Never missed one</h3>' +
        '<span class="badge">' + everPresent.length + '</span></div>' +
        '<div class="card-body"><div style="display:flex;flex-wrap:wrap;gap:5px">' +
        (everPresent.length ? nameList(everPresent, 8)
          : '<span class="muted small">Nobody has been to all ' + editions + '.</span>') +
        '</div><p class="tiny muted" style="margin:10px 0 0">' + editions +
        ' edition' + (editions === 1 ? '' : 's') + ' so far.</p></div></div>' +
    '</div>';

    var table = '<div class="card"><div class="card-head"><h3>Qualification record</h3>' +
      '<span class="badge">' + editions + ' edition' + (editions === 1 ? '' : 's') + '</span>' +
      '</div><div class="table-wrap"><table class="data sticky-team"><thead><tr>' +
      '<th class="l stick" style="width:34px">#</th><th class="l stick">Nation</th>' +
      '<th class="strong" title="Longest run of consecutive editions reached">In a row</th>' +
      '<th class="col-hide-sm" title="When that run happened">Run</th>' +
      '<th title="Consecutive editions reached, counting the latest">Current</th>' +
      '<th class="col-hide-sm" title="Editions reached in total">Reached</th>' +
      '<th class="col-hide-sm" title="Editions missed">Missed</th>' +
      '<th class="col-hide-sm" title="Share of editions reached">Rate</th>' +
      '<th class="col-hide-sm" title="First edition reached">First</th>' +
      '<th class="col-hide-sm" title="Most recent edition reached">Last</th>' +
      '</tr></thead><tbody>' +
      rows.map(function (r, i) {
        return '<tr class="clickable" data-act="team" data-id="' + r.id + '">' +
          '<td class="pos l stick">' + (i + 1) + '</td>' +
          '<td class="l stick">' + teamCell(r.team) + '</td>' +
          '<td class="strong">' + r.best + '</td>' +
          '<td class="col-hide-sm">' + span(r) + '</td>' +
          '<td>' + (r.current
            ? r.current + (r.currentLive ? '<span class="tiny muted"> \u2197</span>' : '')
            : '<span class="muted">\u2014</span>') + '</td>' +
          '<td class="col-hide-sm">' + r.apps + '</td>' +
          '<td class="muted col-hide-sm">' + r.missed + '</td>' +
          '<td class="muted col-hide-sm">' + Math.round(r.apps / r.editions * 100) + '%</td>' +
          '<td class="muted col-hide-sm">' + (r.first == null ? '\u2014' : 'S' + r.first) + '</td>' +
          '<td class="muted col-hide-sm">' + (r.last == null ? '\u2014' : 'S' + r.last) + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="zone-key">A run counts consecutive editions reached. ' +
      (live ? 'The edition being played counts once its draw is made, marked \u2197. ' : '') +
      'Ranked by the longest run, then by the one running now.</div></div>';

    return '<div class="stack">' + tiles + table + '</div>';
  }

  function histAllTime(comp) {
    var rows = S.allTimeTable(comp, true);
    return '<div class="card"><div class="card-head"><h3>All-time table</h3>' +
      '<span class="badge">Includes the season in progress</span></div>' +
      '<div class="table-wrap"><table class="data sticky-team"><thead><tr>' +
      '<th class="l stick" style="width:34px">#</th><th class="l stick">Team</th>' +
      '<th>Titles</th><th class="col-hide-sm">2nd</th>' +
      '<th class="col-hide-sm">Seasons</th><th>P</th><th class="col-hide-sm">W</th>' +
      '<th class="col-hide-sm">D</th><th class="col-hide-sm">L</th>' +
      '<th class="col-hide-sm">GF</th><th class="col-hide-sm">GA</th><th>GD</th>' +
      '<th class="strong">Pts</th><th class="col-hide-sm">PPG</th>' +
      '<th class="col-hide-sm">Best</th><th class="col-hide-sm">Worst</th>' +
      '<th class="col-hide-sm">Avg pos</th>' +
      '</tr></thead><tbody>' +
      rows.map(function (r, i) {
        return '<tr class="clickable" data-act="team" data-id="' + r.team.id + '">' +
          '<td class="pos l stick">' + (i + 1) + '</td>' +
          '<td class="l stick">' + teamCell(r.team) + '</td>' +
          '<td class="strong">' + (r.titles || '<span class="muted">–</span>') + '</td>' +
          '<td class="muted col-hide-sm">' + (r.runnerUps || '–') + '</td>' +
          '<td class="muted col-hide-sm">' + r.seasons + '</td>' +
          '<td>' + r.p + '</td><td class="col-hide-sm">' + r.w + '</td>' +
          '<td class="col-hide-sm">' + r.d + '</td><td class="col-hide-sm">' + r.l + '</td>' +
          '<td class="col-hide-sm">' + r.gf + '</td><td class="col-hide-sm">' + r.ga + '</td>' +
          '<td>' + signed(r.gd) + '</td>' +
          '<td class="strong">' + r.pts + '</td>' +
          '<td class="muted col-hide-sm">' + r.ppg.toFixed(2) + '</td>' +
          '<td class="col-hide-sm">' + (r.best || '–') + '</td>' +
          '<td class="col-hide-sm">' + (r.worst || '–') + '</td>' +
          '<td class="muted col-hide-sm">' + (r.avgPos == null ? '–' : r.avgPos) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function histScorers(comp) {
    var list = S.allTimeScorers(comp, 30);
    if (!list.length) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">No goals on record.</p></div></div>';
    }
    return '<div class="card"><div class="card-head"><h3>All-time leading scorers</h3>' +
      '<span class="badge">Career totals across every season</span></div>' +
      '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th class="l" style="width:34px">#</th><th class="l">Player</th><th class="l">Team</th>' +
      '<th class="col-hide-sm">Seasons</th><th class="col-hide-sm">Best season</th>' +
      '<th>Assists</th><th class="strong">' + esc(sportOf(comp).scoreWord) + '</th>' +
      '</tr></thead><tbody>' +
      list.map(function (p, i) {
        var t = comp.teams[p.t];
        return '<tr><td class="pos l">' + (i + 1) + '</td>' +
          '<td class="l strong">' + esc(p.name) + '</td>' +
          '<td class="l">' + teamCell(t, { abbr: true }) + '</td>' +
          '<td class="muted col-hide-sm">' + (p.seasons || 1) + '</td>' +
          '<td class="col-hide-sm">' + p.best + '</td><td class="muted">' + p.a + '</td>' +
          '<td class="strong">' + p.g + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function histH2H(comp) {
    var teams = comp.teams;
    var n = teams.length;
    if (n > 24) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'The head-to-head grid is available for competitions of 24 teams or fewer. Open a team from the ' +
        'all-time table to see its individual records.</p></div></div>';
    }
    var cells = [];
    for (var i = 0; i < n; i++) {
      cells[i] = [];
      for (var j = 0; j < n; j++) cells[i][j] = i === j ? null : S.headToHead(comp, i, j);
    }
    return '<div class="card"><div class="card-head"><h3>Head-to-head record</h3>' +
      '<span class="badge">Wins–draws–losses, row team first</span></div>' +
      '<div class="table-wrap"><table class="data sticky-team"><thead><tr><th class="l stick">Team</th>' +
      teams.map(function (t) { return '<th title="' + esc(t.name) + '">' + esc(t.abbr) + '</th>'; }).join('') +
      '<th class="strong">Total</th></tr></thead><tbody>' +
      teams.map(function (t, i) {
        var tw = 0, td = 0, tl = 0;
        var row = teams.map(function (o, j) {
          if (i === j) return '<td style="background:var(--surface-3)"></td>';
          var h = cells[i][j];
          tw += h.aw; td += h.d; tl += h.bw;
          if (!h.p) return '<td class="muted">·</td>';
          var col = h.aw > h.bw ? 'var(--accent)' : h.aw < h.bw ? 'var(--red)' : 'var(--muted)';
          return '<td class="mono" style="font-size:.74rem;color:' + col + '" title="' +
            esc(t.name + ' v ' + o.name) + '">' + h.aw + '-' + h.d + '-' + h.bw + '</td>';
        }).join('');
        return '<tr class="clickable" data-act="team" data-id="' + t.id + '">' +
          '<td class="l stick">' + teamCell(t) + '</td>' + row +
          '<td class="strong mono" style="font-size:.76rem">' + tw + '-' + td + '-' + tl + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  /* -------------------------------------------------- season & team modals */

  function showSeason(comp, n) {
    var rec = null;
    comp.history.forEach(function (r) { if (r.n === n) rec = r; });
    if (!rec) return;
    var champ = comp.teams[rec.champion];
    var a = rec.awards;

    var minorName = rec.minorPremier != null ? rec.names[rec.minorPremier] : null;
    var awards = '<div class="grid grid-2" style="margin-bottom:16px">' +
      awardTile('🏆', rec.finalsSystem ? 'Premiers' : 'Champions',
        champ ? champ.name : rec.names[rec.champion],
        rec.finalsSystem ? 'won the ' + (E.FINALS_SYSTEMS[rec.finalsSystem] || {}).name : rec.table[0].pts + ' points') +
      (rec.finalsSystem ? awardTile('🥇', 'Minor premiers', minorName || '—',
        rec.table[0].pts + ' points from the regular season') : '') +
      awardTile('⚽', 'Top scorer', a.topScorer ? a.topScorer.n : '—',
        a.topScorer ? a.topScorer.g + ' goals for ' + rec.names[a.topScorer.t] : '') +
      awardTile('🎯', 'Best attack', a.bestAttack ? rec.names[a.bestAttack.t] : '—',
        a.bestAttack ? a.bestAttack.v + ' scored' : '') +
      awardTile('🧱', 'Meanest defence', a.bestDefence ? rec.names[a.bestDefence.t] : '—',
        a.bestDefence ? a.bestDefence.v + ' conceded' : '') +
      '</div>';

    var table = '<div class="section-title">Final table</div>' +
      '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th class="l" style="width:30px">#</th><th class="l">Team</th><th>P</th><th>W</th><th>D</th><th>L</th>' +
      '<th>GF</th><th>GA</th><th>GD</th><th class="strong">Pts</th></tr></thead><tbody>' +
      rec.table.map(function (r) {
        var t = comp.teams[r.t];
        return '<tr class="' + zoneClass(comp, r.pos) + '">' +
          '<td class="pos l">' + r.pos + '</td>' +
          '<td class="l">' + (t ? teamCell(t) : esc(rec.names[r.t])) + '</td>' +
          '<td>' + r.p + '</td><td>' + r.w + '</td><td>' + r.d + '</td><td>' + r.l + '</td>' +
          '<td>' + r.gf + '</td><td>' + r.ga + '</td><td>' + signed(r.gf - r.ga) + '</td>' +
          '<td class="strong">' + r.pts + '</td></tr>';
      }).join('') + '</tbody></table></div>';

    var qualified = (rec.qualified && rec.qualified.length)
      ? '<div class="section-title" style="margin-top:18px">Qualified for the finals (' +
        rec.qualified.length + ')</div>' +
        (rec.host != null ? '<p class="tiny muted" style="margin:0 0 8px">Hosted by ' +
          esc(rec.names[rec.host] || '') + '.</p>' : '') +
        '<div style="display:flex;flex-wrap:wrap;gap:5px">' + rec.qualified.map(function (q) {
          var t = comp.teams[q.t];
          var how = VIA_WORDS[q.via] || '';
          return '<span class="badge" title="' + esc((t ? t.name : rec.names[q.t]) + ' — ' + q.conf +
            (how ? ' · ' + how : '')) + '">' +
            (t ? kit(t) + ' ' : '') + esc(t ? t.abbr : rec.names[q.t]) + '</span>';
        }).join('') + '</div>'
      : '';

    var surges = (rec.surges && rec.surges.length)
      ? '<div class="section-title" style="margin-top:18px">Squads on a run</div>' +
        rec.surges.map(function (g) {
          var t = comp.teams[g.t];
          return '<div class="honour" style="padding:7px 0">' + (t ? kit(t) : '') +
            '<span>' + esc(t ? t.name : rec.names[g.t]) + '</span>' +
            '<span class="small muted" style="margin-left:auto">' +
            (g.kind === 'golden' ? 'Golden generation' : 'Bad run') + ' ' +
            (g.size > 0 ? '+' + g.size : g.size) + ' from season ' + g.from +
            (g.star ? ' \u00b7 ' + esc(g.star) : '') + '</span></div>';
        }).join('')
      : '';

    // the world ranking as it stood at the end of that edition
    var ladder = (rec.rankings && rec.rankings.length)
      ? '<div class="section-title" style="margin-top:18px">World ranking after season ' + rec.n + '</div>' +
        '<div class="table-wrap"><table class="data"><thead><tr><th class="l" style="width:30px">#</th>' +
        '<th class="l">Nation</th><th class="strong">Rating</th></tr></thead><tbody>' +
        rec.rankings.slice(0, 10).map(function (r) {
          var t = comp.teams[r.t];
          return '<tr><td class="pos l">' + r.pos + '</td>' +
            '<td class="l">' + (t ? teamCell(t) : esc(rec.names[r.t])) + '</td>' +
            '<td class="strong">' + r.r.toFixed(2) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '';

    function scorerTable(list, title) {
      if (!list || !list.length) return '';
      return '<div class="section-title" style="margin-top:18px">' + title + '</div>' +
        '<div class="table-wrap"><table class="data"><tbody>' +
        list.slice(0, 10).map(function (sc, i) {
          return '<tr><td class="pos l">' + (i + 1) + '</td>' +
            '<td class="l strong">' + esc(sc.n) + '</td>' +
            '<td class="l muted">' + esc(rec.names[sc.t]) + '</td>' +
            '<td class="strong">' + sc.g + '</td><td class="muted small">' + sc.a + ' ast</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    var scorers = scorerTable(rec.scorers,
        rec.qualScorers ? 'Leading scorers — finals' : 'Leading scorers') +
      scorerTable(rec.qualScorers, 'Leading scorers — qualifying');

    var heads = MS ? MS.seasonHeadlines(comp, rec.n).filter(function (e) { return e.w >= 2; }).slice(0, 6) : [];
    var storyHtml = heads.length
      ? '<div class="section-title">The headlines</div>' + heads.map(function (e) {
          if (e.n == null) e = { w: e.w, k: e.k, text: e.text, teams: e.teams, n: rec.n, at: 'season' };
          return storyRow(comp, e);
        }).join('') + '<div style="height:16px"></div>'
      : '';
    modal('Season ' + rec.n, awards + storyHtml + qualified + table + surges + ladder + scorers,
      '<div class="btn-row" style="margin-top:16px">' +
      '<button class="btn" data-act="recap" data-n="' + rec.n + '">Recap image</button></div>');
  }

  /* ------------------------------------------------------------- recap */

  // A season recap needs the same shape whether it is still being played or
  // long since archived, so a live one is built the same way an archived
  // record was: seasonRecord() is exactly what endSeason() stores.
  function recapData(comp, seasonArg) {
    var live = seasonArg === 'live' || seasonArg == null;
    var rec = live ? S.seasonRecord(comp) : null;
    if (!live) comp.history.forEach(function (r) { if (r.n === seasonArg) rec = r; });
    if (!rec) return null;

    function nameOf(idx) {
      var t = comp.teams[idx];
      return t ? t.name : (rec.names[idx] || '?');
    }
    function teamOf(idx) { return comp.teams[idx] || null; }

    var champ = rec.champion != null ? teamOf(rec.champion) : null;
    var top = rec.table.slice(0, 5).map(function (r) {
      return { pos: r.pos, name: nameOf(r.t), pts: r.pts, team: teamOf(r.t) };
    });

    var biggest = null;
    rec.results.forEach(function (r) {
      var margin = Math.abs(r[2] - r[3]), total = r[2] + r[3];
      if (!biggest || margin > biggest.margin || (margin === biggest.margin && total > biggest.total)) {
        biggest = { h: r[0], a: r[1], hg: r[2], ag: r[3], margin: margin, total: total };
      }
    });

    var a = rec.awards;
    var sp = D.sports[comp.sport] || D.sports.football;

    // the season's biggest moment leads the poster
    var headline = null;
    if (MS) {
      var heads = live ? MS.byWeight(MS.forSeason(comp, rec.n)) : MS.seasonHeadlines(comp, rec.n);
      if (heads[0] && heads[0].w >= 2) headline = heads[0].text;
    }

    var mgrs = null;
    if (M) {
      var list = M.ensure(comp);
      if (list.length === 2 && list.every(function (m) { return m.teamId; })) {
        var idxOf = {}; comp.teams.forEach(function (t, i) { idxOf[t.id] = i; });
        var iA = idxOf[list[0].teamId], iB = idxOf[list[1].teamId];
        var rowA = rec.table.filter(function (r) { return r.t === iA; })[0];
        var rowB = rec.table.filter(function (r) { return r.t === iB; })[0];
        if (rowA && rowB) {
          var aw = 0, bw = 0, d = 0;
          rec.results.forEach(function (r) {
            var isAB = r[0] === iA && r[1] === iB, isBA = r[0] === iB && r[1] === iA;
            if (!isAB && !isBA) return;
            if (r[2] === r[3]) { d++; return; }
            var hWon = r[2] > r[3];
            if ((isAB && hWon) || (isBA && !hWon)) aw++; else bw++;
          });
          mgrs = {
            a: { name: list[0].name, team: nameOf(iA), pos: rowA.pos, pts: rowA.pts, color: list[0].color },
            b: { name: list[1].name, team: nameOf(iB), pos: rowB.pos, pts: rowB.pts, color: list[1].color },
            aw: aw, bw: bw, d: d
          };
        }
      }
    }

    return {
      live: live, complete: comp.season.complete || !live,
      compName: comp.name, seasonN: rec.n, sportIcon: sp.icon, formatLabel: formatLabel(comp),
      scoreWord: sp.scoreWord.toLowerCase(),
      champion: champ ? { name: champ.name, c1: champ.c1, c2: champ.c2 } : null,
      finalsSystem: rec.finalsSystem,
      // the table always crowns a minor premier; it only means something
      // distinct from the champion when a finals series decided the title
      minorPremier: rec.finalsSystem && rec.minorPremier != null ? nameOf(rec.minorPremier) : null,
      host: rec.host != null ? nameOf(rec.host) : null,
      table: top,
      topScorer: a.topScorer ? { name: a.topScorer.n, team: nameOf(a.topScorer.t), g: a.topScorer.g } : null,
      bestAttack: a.bestAttack ? { team: nameOf(a.bestAttack.t), v: a.bestAttack.v } : null,
      bestDefence: a.bestDefence ? { team: nameOf(a.bestDefence.t), v: a.bestDefence.v } : null,
      biggest: biggest ? {
        h: nameOf(biggest.h), a: nameOf(biggest.a), hg: biggest.hg, ag: biggest.ag
      } : null,
      managers: mgrs,
      headline: headline
    };
  }

  var RECAP_BG = '#f7f9fc', RECAP_CARD = '#ffffff', RECAP_BORDER = '#e2e8f0',
    RECAP_TEXT = '#0f172a', RECAP_MUTED = '#64748b', RECAP_ACCENT = '#059669',
    RECAP_GOLD = '#d97706', RECAP_SOFT = '#ecfdf5';

  function xesc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function xtrunc(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  var RECAP_HEAD_BG = '#fef3c7';

  // Greedy word wrap for the poster, which has no text layout of its own.
  function wrapText(str, max, maxLines) {
    var out = [], cur = '';
    String(str).split(/\s+/).forEach(function (w) {
      if (cur && (cur + ' ' + w).length > max) { out.push(cur); cur = w; }
      else cur = cur ? cur + ' ' + w : w;
    });
    if (cur) out.push(cur);
    if (out.length > maxLines) {
      out = out.slice(0, maxLines);
      out[maxLines - 1] = xtrunc(out[maxLines - 1] + ' …', max);
    }
    return out;
  }

  function svgCrest(t, x, y, size) {
    if (!t) return '';
    return '<rect x="' + x + '" y="' + y + '" width="' + size + '" height="' + size +
      '" rx="' + Math.round(size * 0.28) + '" fill="' + esc0(t.c1) + '" stroke="' +
      esc0(t.c2) + '" stroke-width="2"/>';
  }
  function esc0(v) { return String(v == null ? '' : v); }

  // Built as one long inline SVG string — no dependency, and the same markup
  // both renders on screen and rasterises to a PNG.
  // Drawn top to bottom in a single pass: a running cursor (cy) is the only
  // state, advanced before each line is drawn — no separate layout pass, so
  // there is nothing to get out of sync.
  function recapSVG(data) {
    var W = 1000, pad = 56, cy = 20;
    var body = '';

    function advance(dy) { cy += dy; }
    function text(x, size, weight, fill, str, anchor) {
      var tx = anchor === 'end' ? W - pad : x;
      body += '<text x="' + tx + '" y="' + Math.round(cy) + '" font-size="' + size + '" font-weight="' +
        weight + '" fill="' + fill + '" text-anchor="' + (anchor || 'start') + '" ' +
        'font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">' + xesc(str) + '</text>';
    }
    function rule() {
      body += '<line x1="' + pad + '" y1="' + Math.round(cy) + '" x2="' + (W - pad) + '" y2="' +
        Math.round(cy) + '" stroke="' + RECAP_BORDER + '" stroke-width="1.5"/>';
    }

    advance(46); text(pad, 22, 800, RECAP_MUTED, data.sportIcon + '  ' + xtrunc(data.compName, 40));
    advance(28); text(pad, 15, 600, RECAP_MUTED, 'Season ' + data.seasonN +
      (data.live && !data.complete ? ' — as it stands' : '') + '  ·  ' +
      data.formatLabel.replace(/^\S+\s/, ''));
    advance(30); rule(); advance(26);

    if (data.champion) {
      advance(20); text(pad, 13, 800, RECAP_GOLD, data.finalsSystem ? 'PREMIERS' : 'CHAMPIONS');
      advance(44);
      body += svgCrest(data.champion, pad, cy - 32, 40);
      text(pad + 54, 28, 800, RECAP_TEXT, xtrunc(data.champion.name, 26));
      if (data.minorPremier) {
        advance(24);
        text(pad + 54, 14, 500, RECAP_MUTED, 'Minor premiers: ' + xtrunc(data.minorPremier, 30));
      }
      advance(30);
    } else {
      advance(30); text(pad, 20, 700, RECAP_TEXT, 'Season in progress');
      advance(30);
    }

    if (data.host) { advance(20); text(pad, 14, 500, RECAP_MUTED, 'Hosted by ' + xtrunc(data.host, 30)); advance(30); }

    if (data.headline) {
      var lines = wrapText(data.headline, 72, 3);
      var boxH = 40 + lines.length * 26;
      body += '<rect x="' + pad + '" y="' + Math.round(cy) + '" width="' + (W - pad * 2) + '" height="' +
        boxH + '" rx="12" fill="' + RECAP_HEAD_BG + '"/>';
      advance(27); text(pad + 18, 11, 800, RECAP_GOLD, 'THE HEADLINE');
      lines.forEach(function (ln) { advance(26); text(pad + 18, 19, 750, RECAP_TEXT, ln); });
      advance(boxH - 27 - lines.length * 26 + 28);
    }

    if (data.table.length) {
      advance(20); text(pad, 13, 800, RECAP_MUTED, 'FINAL TABLE');
      advance(30);
      data.table.forEach(function (r) {
        text(pad, 16, 800, RECAP_MUTED, String(r.pos));
        if (r.team) body += svgCrest(r.team, pad + 34, cy - 16, 20);
        text(pad + 62, 16, 600, RECAP_TEXT, xtrunc(r.name, 28));
        text(0, 16, 800, RECAP_TEXT, r.pts + ' pts', 'end');
        advance(34);
      });
      advance(14);
    }

    var stats = [];
    if (data.topScorer) stats.push({ k: 'TOP SCORER', v: data.topScorer.name,
      s: data.topScorer.g + ' ' + data.scoreWord + ' · ' + xtrunc(data.topScorer.team, 20) });
    if (data.biggest) stats.push({ k: 'BIGGEST RESULT', v: data.biggest.hg + ' – ' + data.biggest.ag,
      s: xtrunc(data.biggest.h, 16) + ' v ' + xtrunc(data.biggest.a, 16) });
    if (data.bestAttack) stats.push({ k: 'BEST ATTACK', v: xtrunc(data.bestAttack.team, 22),
      s: data.bestAttack.v + ' scored' });
    if (data.bestDefence) stats.push({ k: 'BEST DEFENCE', v: xtrunc(data.bestDefence.team, 22),
      s: data.bestDefence.v + ' conceded' });
    if (stats.length) {
      var cols = 2, cardW = (W - pad * 2 - 16) / cols, cardH = 76, rowGap = 14;
      var statRows = Math.ceil(stats.length / cols);
      stats.forEach(function (it, i) {
        var col = i % cols, row = Math.floor(i / cols);
        var bx = pad + col * (cardW + 16), by = cy + row * (cardH + rowGap);
        body += '<rect x="' + bx + '" y="' + by + '" width="' + cardW + '" height="' + cardH +
          '" rx="10" fill="' + RECAP_SOFT + '"/>';
        body += '<text x="' + (bx + 14) + '" y="' + (by + 22) + '" font-size="11" font-weight="800" ' +
          'fill="' + RECAP_ACCENT + '" font-family="-apple-system,sans-serif" letter-spacing="0.6">' +
          xesc(it.k) + '</text>';
        body += '<text x="' + (bx + 14) + '" y="' + (by + 45) + '" font-size="18" font-weight="800" ' +
          'fill="' + RECAP_TEXT + '" font-family="-apple-system,sans-serif">' +
          xesc(xtrunc(it.v, 24)) + '</text>';
        body += '<text x="' + (bx + 14) + '" y="' + (by + 63) + '" font-size="12" font-weight="500" ' +
          'fill="' + RECAP_MUTED + '" font-family="-apple-system,sans-serif">' + xesc(it.s) + '</text>';
      });
      advance(statRows * cardH + (statRows - 1) * rowGap + 30);
    }

    if (data.managers) {
      rule(); advance(24);
      text(pad, 13, 800, RECAP_MUTED, 'MANAGER BATTLE');
      advance(30);
      [data.managers.a, data.managers.b].forEach(function (m) {
        body += '<circle cx="' + (pad + 6) + '" cy="' + Math.round(cy - 6) + '" r="6" fill="' +
          esc0(m.color) + '"/>';
        text(pad + 22, 18, 800, RECAP_TEXT, m.name + '  ·  ' + xtrunc(m.team, 22));
        var ord = m.pos === 1 ? 'st' : m.pos === 2 ? 'nd' : m.pos === 3 ? 'rd' : 'th';
        text(0, 14, 700, RECAP_MUTED, m.pos + ord + ' · ' + m.pts + ' pts', 'end');
        advance(34);
      });
      var mg = data.managers;
      text(pad, 14, 600, RECAP_TEXT,
        xtrunc(mg.a.name, 14) + ' ' + mg.aw + '  ·  ' + mg.d + ' drawn  ·  ' +
        mg.bw + ' ' + xtrunc(mg.b.name, 14));
      advance(30);
    }

    advance(10); rule(); advance(30);
    text(pad, 12, 600, RECAP_MUTED, 'Simulated on Sideline');
    advance(20);

    var H = Math.round(cy);
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W +
      '" height="' + H + '">' +
      '<rect width="' + W + '" height="' + H + '" fill="' + RECAP_BG + '"/>' +
      '<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" rx="18" fill="' + RECAP_CARD +
      '" stroke="' + RECAP_BORDER + '" stroke-width="1.5"/>' +
      body + '</svg>';
  }

  function showRecap(comp, seasonArg) {
    var data = recapData(comp, seasonArg);
    if (!data) { toast('Nothing to recap yet'); return; }
    var svg = recapSVG(data);
    modal('Season recap',
      '<div class="recap-print"><div class="recap-frame">' + svg + '</div></div>' +
      '<div class="btn-row" style="margin-top:16px">' +
      '<button class="btn btn-primary" data-act="recap-png">Download PNG</button>' +
      '<button class="btn" data-act="recap-print-btn">Print / Save as PDF</button>' +
      '<button class="btn" data-act="close-modal">Close</button></div>' +
      '<p class="tiny muted" style="margin:12px 0 0">The image is rendered fresh from the data — nothing ' +
      'leaves your browser.</p>');
  }

  function downloadRecapPNG() {
    var svgEl = document.querySelector('.recap-frame svg');
    if (!svgEl) return;
    var xml = new XMLSerializer().serializeToString(svgEl);
    var svg64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
    var img = new Image();
    img.onload = function () {
      var scale = 2;
      var vb = svgEl.viewBox.baseVal;
      var canvas = document.createElement('canvas');
      canvas.width = vb.width * scale; canvas.height = vb.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'sideline-recap.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }, 'image/png');
    };
    img.src = svg64;
  }

  function awardTile(icon, k, v, s) {
    return '<div class="stat-tile"><div class="k">' + icon + ' ' + esc(k) + '</div>' +
      '<div class="v" style="font-size:1.05rem">' + esc(v || '—') + '</div>' +
      '<div class="s">' + esc(s || '') + '</div></div>';
  }

  function showAwards(comp) {
    var s = comp.season;
    if (!s.complete) return;
    var wcPhase = isWorldCup(comp) ? 'finals' : 'all';
    var table = isWorldCup(comp) ? phaseTable(comp, 'finals') : liveTable(comp);
    var map = E.teamsById(comp);
    var champ = map[s.champion];
    var scorers = E.topScorers(comp.teams, 5, wcPhase);
    var bestAtt = table.slice().sort(function (x, y) { return y.gf - x.gf; })[0];
    var bestDef = table.slice().sort(function (x, y) { return x.ga - y.ga; })[0];
    var mostCs = table.slice().sort(function (x, y) { return y.cs - x.cs; })[0];

    var body = '<div class="grid grid-2" style="margin-bottom:16px">' +
      awardTile('🏆', 'Champions', champ ? champ.name : '—', table[0] ? table[0].pts + ' points' : '') +
      awardTile(sportOf(comp).icon,
        isWorldCup(comp) ? 'Golden boot (finals)' : 'Leading scorer',
        scorers[0] ? scorers[0].p.name : '—',
        scorers[0] ? scorers[0].g + ' ' + sportOf(comp).scoreWord.toLowerCase() +
          ' for ' + scorers[0].t.name : '') +
      awardTile('🎯', 'Best attack', bestAtt ? bestAtt.team.name : '—', bestAtt ? bestAtt.gf + ' scored' : '') +
      awardTile('🧱', 'Meanest defence', bestDef ? bestDef.team.name : '—', bestDef ? bestDef.ga + ' conceded' : '') +
      awardTile('🧤', 'Most shut-outs', mostCs ? mostCs.team.name : '—', mostCs ? mostCs.cs + ' shut-outs' : '') +
      awardTile('📈', comp.settings.rankBy === 'winpct' ? 'Best win rate' : 'Best points per game',
        table[0] ? table[0].team.name : '—',
        table[0] ? (comp.settings.rankBy === 'winpct'
          ? winPctStr(table[0].winPct) : table[0].ppg.toFixed(2) + ' ppg') : '') +
      '</div>' +
      '<p class="small">Starting season ' + (s.number + 1) + ' archives all of this into History and ' +
      'applies your between-seasons rule (<b>' + esc(comp.settings.evolution) + '</b>) to every team.</p>' +
      '<div class="btn-row"><button class="btn btn-primary" data-act="end-season">Start season ' +
      (s.number + 1) + '</button></div>';
