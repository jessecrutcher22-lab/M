      pos: {}, avgPos: {}
    };
    comp.teams.forEach(function (t) {
      out.champion[t.id] = 0; out.runnerUp[t.id] = 0; out.minor[t.id] = 0;
      out.final[t.id] = 0; out.qualify[t.id] = 0; out.pos[t.id] = []; out.avgPos[t.id] = 0;
    });

    var filter = tableFilter(comp);
    for (var r = 0; r < n; r++) {
      // seeded from the competition and its state, never the object, so the same
      // season priced twice gives the same board
      var c = projectClone(comp, (comp.seed >>> 0) ^ (s.number * 40503) ^
        (played * 2246822519) ^ ((r + 1) * 2654435761));
      E.simulateSeason(c);
      var cs = c.season;
      if (cs.champion && out.champion[cs.champion] != null) out.champion[cs.champion]++;
      if (cs.runnerUp && out.runnerUp[cs.runnerUp] != null) out.runnerUp[cs.runnerUp]++;
      if (cs.minorPremier && out.minor[cs.minorPremier] != null) out.minor[cs.minorPremier]++;
      if (cs.champion && out.final[cs.champion] != null) out.final[cs.champion]++;
      if (cs.runnerUp && out.final[cs.runnerUp] != null) out.final[cs.runnerUp]++;
      (cs.qualified || []).forEach(function (q) {
        if (out.qualify[q.id] != null) out.qualify[q.id]++;
      });
      var table = E.computeTable(c.teams, cs.matches, c.settings, filter);
      table.forEach(function (row) {
        if (out.pos[row.id]) { out.pos[row.id].push(row.pos); out.avgPos[row.id] += row.pos; }
      });
    }
    comp.teams.forEach(function (t) {
      var list = out.pos[t.id];
      out.avgPos[t.id] = list.length ? out.avgPos[t.id] / list.length : 0;
    });
    projCache[key] = out;
    return out;
  }

  function clearProjection() { projCache = {}; }

  function shareAtOrBetter(proj, id, upTo) {
    var list = proj.pos[id] || [];
    if (!list.length) return 0;
    var c = 0;
    for (var i = 0; i < list.length; i++) if (list[i] <= upTo) c++;
    return c / list.length;
  }

  function shareAtOrWorse(proj, id, from) {
    var list = proj.pos[id] || [];
    if (!list.length) return 0;
    var c = 0;
    for (var i = 0; i < list.length; i++) if (list[i] >= from) c++;
    return c / list.length;
  }

  // A market where several selections can win at once is priced one at a time,
  // the way a book prices "to finish top four" — not as a share of one pot.
  function priceEach(probs, margin) {
    return probs.map(function (p) {
      var q = Math.min(0.985, p.p * (1 + margin));
      return {
        key: p.key, label: p.label, short: p.short, side: p.side, p: p.p,
        odds: Math.max(1.01, Math.round((q > 0 ? 1 / q : 999) * 100) / 100)
      };
    });
  }

  function zoneOf(comp, cls) {
    var zones = (comp.settings.zones || []).filter(function (z) { return z.cls === cls; });
    return zones.length ? zones[0] : null;
  }

  // A board quotes the whole field, including sides that never won a projection.
  // Half a win is added to everyone so nothing prices at infinity — the standard
  // smoothing, and it is what a real board does when it puts up 500/1.
  function teamPicks(comp, valueOf) {
    return comp.teams.map(function (t) {
      return { key: t.id, side: t.id, label: t.name, short: t.abbr, p: valueOf(t) };
    }).sort(function (a, b) { return b.p - a.p; });
  }

  function smoothOutright(hits, runs, field) {
    return (hits + 0.5) / (runs + field * 0.5);
  }

  function smoothEach(hits, runs) {
    return (hits + 0.5) / (runs + 1);
  }

  // Every market that settles at the end of the season rather than at a match.
  function seasonMarkets(comp, runs) {
    var w = ensure(comp);
    var m = w.margin == null ? 0.06 : w.margin;
    var proj = project(comp, runs);
    var n = proj.runs;
    var teams = comp.teams.length;
    var wc = comp.format === 'worldcup';
    var cup = comp.format === 'cup' || comp.format === 'groups';
    var finals = comp.settings.finals && comp.settings.finals.enabled;
    var out = [];

    var winnerName = wc ? 'Winner' : cup ? 'Cup winner'
      : finals ? 'Premiership' : 'League winner';
    out.push({
      id: 'winner', name: winnerName, kind: 'outright',
      note: 'Lifts the trophy',
      picks: price(teamPicks(comp, function (t) {
        return smoothOutright(proj.champion[t.id], n, teams);
      }), m)
    });

    if (finals) {
      out.push({
        id: 'minor', name: 'Minor premiers', kind: 'outright',
        note: 'Finishes top of the ladder',
        picks: price(teamPicks(comp, function (t) {
          return smoothOutright(proj.minor[t.id], n, teams);
        }), m)
      });
    }

    if (wc || cup) {
      out.push({
        id: 'final', name: 'To reach the final', kind: 'each',
        note: 'Wins it or loses the final',
        picks: priceEach(teamPicks(comp, function (t) {
          return smoothEach(proj.final[t.id], n);
        }), m)
      });
    }

    if (wc && comp.season.stage === 'qual') {
      out.push({
        id: 'qualify', name: 'To reach the finals', kind: 'each',
        note: 'Comes through qualifying',
        picks: priceEach(teamPicks(comp, function (t) {
          return smoothEach(proj.qualify[t.id], n);
        }), m)
      });
    }

    if (!wc && !cup) {
      var top = zoneOf(comp, 'z-ucl');
      if (top && top.to > 1 && top.to < teams) {
        out.push({
          id: 'topn', name: 'Top ' + top.to, kind: 'each', line: top.to,
          note: esc0(top.label) + ' — finishes ' + top.to + 'th or better',
          picks: priceEach(teamPicks(comp, function (t) {
            return smoothEach(shareAtOrBetter(proj, t.id, top.to) * n, n);
          }), m)
        });
      }
      var rel = zoneOf(comp, 'z-rel');
      if (rel && rel.from > 1) {
        out.push({
          id: 'releg', name: 'Relegation', kind: 'each', line: rel.from,
          note: 'Finishes ' + rel.from + 'th or lower',
          picks: priceEach(teamPicks(comp, function (t) {
            return smoothEach(shareAtOrWorse(proj, t.id, rel.from) * n, n);
          }), m)
        });
      }
      out.push({
        id: 'spoon', name: 'Wooden spoon', kind: 'outright', line: teams,
        note: 'Finishes last',
        picks: price(teamPicks(comp, function (t) {
          return smoothOutright(shareAtOrWorse(proj, t.id, teams) * n, n, teams);
        }), m)
      });
    }

    return out.filter(function (mk) { return mk.picks.length > 1; });
  }

  function esc0(v) { return String(v == null ? '' : v); }

  function placeSeasonBet(comp, market, pick, stake) {
    var w = ensure(comp);
    stake = Math.floor(Number(stake) || 0);
    if (stake <= 0) return { ok: false, reason: 'Enter a stake first.' };
    if (stake > w.bankroll) return { ok: false, reason: 'That is more than your balance.' };
    if (comp.season.complete) return { ok: false, reason: 'This season is already done.' };

    var played = comp.season.matches.filter(function (x) { return x.played; }).length;
    w.bankroll -= stake;
    w.bets.unshift({
      id: 'b' + (w.nextBetId++),
      kind: 'season',
      season: comp.season.number,
      matchId: null,
      fixture: 'Season ' + comp.season.number,
      market: market.id,
      marketName: market.name,
      line: market.line == null ? null : market.line,
      pick: pick.key,
      side: pick.side,
      label: pick.label + ' — ' + market.name.toLowerCase(),
      odds: pick.odds,
      stake: stake,
      placedAfter: played,
      status: 'open',
      returned: 0
    });
    return { ok: true };
  }

  // Did the season end the way the bet said it would?
  function settleSeasonBet(comp, bet, table, posOf) {
    var s = comp.season;
    switch (bet.market) {
      case 'winner': return s.champion === bet.side;
      case 'minor': return s.minorPremier === bet.side;
      case 'final': return s.champion === bet.side || s.runnerUp === bet.side;
      case 'qualify':
        return (s.qualified || []).some(function (q) { return q.id === bet.side; });
      case 'topn': return posOf[bet.side] != null && posOf[bet.side] <= bet.line;
      case 'releg': return posOf[bet.side] != null && posOf[bet.side] >= bet.line;
      case 'spoon': return posOf[bet.side] != null && posOf[bet.side] === table.length;
    }
    return false;
  }

  // Season bets settle once the season is done, not when a match is played.
  function settleSeason(comp) {
    var w = ensure(comp);
    if (!comp.season) return [];
    var stale = [];
    // a bet left behind by a season that has already rolled can never land
    w.bets.forEach(function (b) {
      if (b.kind !== 'season' || b.status !== 'open') return;
      if (b.season >= comp.season.number) return;
      b.status = 'void'; b.returned = b.stake; w.bankroll += b.stake;
      stale.push(b);
    });
    if (!comp.season.complete) return stale;
    var live = {};
    comp.teams.forEach(function (t) { live[t.id] = 1; });
    var table = E.computeTable(comp.teams, comp.season.matches, comp.settings, tableFilter(comp));
    var posOf = {};
    table.forEach(function (r) { posOf[r.id] = r.pos; });
    var done = [];

    w.bets.forEach(function (b) {
      if (b.kind !== 'season' || b.status !== 'open') return;
      if (b.season !== comp.season.number) return;
      if (!live[b.side]) {
        // the side left the competition, so the bet never ran
        b.status = 'void'; b.returned = b.stake; w.bankroll += b.stake;
        done.push(b); return;
      }
      var won = settleSeasonBet(comp, b, table, posOf);
      b.result = posOf[b.side] ? 'finished ' + posOf[b.side] : 'did not finish';
      if (won) {
        b.status = 'won';
        b.returned = Math.round(b.stake * b.odds);
        w.bankroll += b.returned;
      } else {
        b.status = 'lost';
        b.returned = 0;
      }
      done.push(b);
    });
    return stale.concat(done);
  }

  /* -------------------------------------------------------------- pricing */

  // Share the margin across a set of true probabilities, then invert to odds.
  function price(probs, margin) {
    var sum = 0;
    probs.forEach(function (p) { sum += p.p; });
    if (sum <= 0) return [];
    return probs.map(function (p) {
      var q = (p.p / sum) * (1 + margin);
      var odds = q > 0 ? 1 / q : 999;
      return {
        key: p.key, label: p.label, short: p.short, side: p.side,
        p: p.p / sum,
        odds: Math.max(1.01, Math.round(odds * 100) / 100)
      };
    });
  }

  function nearestHalf(v) { return Math.round(v * 2) / 2; }

  function fraction(arr, test) {
    var c = 0;
    for (var i = 0; i < arr.length; i++) if (test(arr[i])) c++;
    return c / arr.length;
  }

  // Every market for one fixture.
  function markets(comp, match) {
    var d = distribution(comp, match);
    if (!d) return [];
    var w = ensure(comp);
    var sport = E.sportOf(comp);
    var map = E.teamsById(comp);
    var h = map[match.h], a = map[match.a];
    var m = w.margin == null ? 0.06 : w.margin;
    var out = [];

    // result
    var res = [{ key: 'H', label: h.name, short: h.abbr, side: 'h', p: d.pHome }];
    if (sport.draws) res.push({ key: 'D', label: 'Draw', side: 'd', p: d.pDraw });
    res.push({ key: 'A', label: a.name, short: a.abbr, side: 'a', p: d.pAway });
    // a sport without draws still throws them up before overtime; fold them in
    if (!sport.draws && d.pDraw > 0) {
      res[0].p += d.pDraw / 2;
      res[res.length - 1].p += d.pDraw / 2;
    }
    out.push({ id: 'result', name: 'Match result', picks: price(res, m) });

    // handicap — line set near the expected margin so both sides price up evenly
    var line = nearestHalf(d.meanMargin);
    if (line === 0) line = 0.5;
    var pHomeCover = fraction(d.margins, function (x) { return x > line; });
    var pAwayCover = 1 - pHomeCover;
    out.push({
      id: 'handicap', name: 'Handicap', note: 'line ' + (line > 0 ? '-' : '+') + Math.abs(line),
      picks: price([
        { key: 'HH', label: h.abbr + ' ' + (line > 0 ? '-' : '+') + Math.abs(line), side: 'h', p: pHomeCover },
        { key: 'AH', label: a.abbr + ' ' + (line > 0 ? '+' : '-') + Math.abs(line), side: 'a', p: pAwayCover }
      ], m),
      line: line
    });

    // totals
    var tLine = nearestHalf(d.medianTotal);
    if (tLine === Math.round(tLine)) tLine += 0.5;
    var pOver = fraction(d.totals, function (x) { return x > tLine; });
    out.push({
      id: 'total', name: 'Total ' + sport.scoreWord.toLowerCase(), note: 'line ' + tLine,
      picks: price([
        { key: 'O', label: 'Over ' + tLine, side: 'o', p: pOver },
        { key: 'U', label: 'Under ' + tLine, side: 'u', p: 1 - pOver }
      ], m),
      line: tLine
    });

    // both to score, and correct score, only where the numbers stay small
    var typical = sport.basePlays * sport.units.reduce(function (s, u) { return s + u[0] * u[1]; }, 0);
    if (typical < 8) {
      out.push({
        id: 'btts', name: 'Both teams to score',
        picks: price([
          { key: 'BY', label: 'Yes', side: 'y', p: d.pBtts },
          { key: 'BN', label: 'No', side: 'n', p: 1 - d.pBtts }
        ], m)
      });

      var top = Object.keys(d.scores).map(function (k) {
        return { key: 'CS' + k, label: k.replace('-', ' – '), side: k, p: d.scores[k] / d.n };
      }).sort(function (x, y) { return y.p - x.p; }).slice(0, 8);
      // correct score is priced on its own book, so the margin lands per selection
      out.push({ id: 'score', name: 'Correct score', picks: price(top, m * 2.5), spread: true });
    }

    return out;
  }

  /* ---------------------------------------------------------------- bets */

  function openBets(comp) {
    return ensure(comp).bets.filter(function (b) { return b.status === 'open'; });
  }

  function stakedOn(comp, matchId) {
    return openBets(comp).filter(function (b) { return b.matchId === matchId; });
  }

  function placeBet(comp, match, market, pick, stake) {
    var w = ensure(comp);
    stake = Math.floor(Number(stake) || 0);
    if (stake <= 0) return { ok: false, reason: 'Enter a stake first.' };
    if (stake > w.bankroll) return { ok: false, reason: 'That is more than your balance.' };
    if (match.played) return { ok: false, reason: 'That match has already been played.' };

    var map = E.teamsById(comp);
    w.bankroll -= stake;
    w.bets.unshift({
      id: 'b' + (w.nextBetId++),
      season: comp.season.number,
      matchId: match.id,
      fixture: map[match.h].abbr + ' v ' + map[match.a].abbr,
      market: market.id,
      marketName: market.name,
      line: market.line == null ? null : market.line,
      pick: pick.key,
      side: pick.side,
      label: pick.label,
      odds: pick.odds,
      stake: stake,
      status: 'open',
      returned: 0
    });
    return { ok: true };
  }

  // Did this selection come in?
  function settleBet(bet, match, sport) {
    var hg = match.hg, ag = match.ag;
    switch (bet.market) {
      case 'result':
        if (bet.side === 'h') return hg > ag || (match.ot && match.tieWinner === match.h);
        if (bet.side === 'a') return ag > hg || (match.ot && match.tieWinner === match.a);
        return hg === ag && !match.ot;
      case 'handicap':
        return bet.side === 'h' ? (hg - ag) > bet.line : (hg - ag) < bet.line;
      case 'total':
        return bet.side === 'o' ? (hg + ag) > bet.line : (hg + ag) < bet.line;
      case 'btts':
        return bet.side === 'y' ? (hg > 0 && ag > 0) : (hg === 0 || ag === 0);
      case 'score':
        return bet.side === (hg + '-' + ag);
    }
    return false;
  }

  // Called after any simulation: pay out everything whose match has been played.
  function settle(comp) {
    var w = ensure(comp);
    var sport = E.sportOf(comp);
    var byId = {};
    comp.season.matches.forEach(function (m) { byId[m.id] = m; });
    var settled = [];

    w.bets.forEach(function (b) {
      if (b.status !== 'open' || b.kind === 'season') return;
      var m = byId[b.matchId];
      if (!m) { b.status = 'void'; b.returned = b.stake; w.bankroll += b.stake; settled.push(b); return; }
      if (!m.played) return;
      var won = settleBet(b, m, sport);
      b.result = m.hg + '–' + m.ag;
      if (won) {
        b.status = 'won';
        b.returned = Math.round(b.stake * b.odds);
        w.bankroll += b.returned;
      } else {
        b.status = 'lost';
        b.returned = 0;
      }
      settled.push(b);
    });
    return settled.concat(settleSeason(comp));
  }

  function ledger(comp) {
    var w = ensure(comp);
    var done = w.bets.filter(function (b) { return b.status === 'won' || b.status === 'lost'; });
    var staked = 0, returned = 0, won = 0, best = null;
    done.forEach(function (b) {
      staked += b.stake; returned += b.returned;
      if (b.status === 'won') {
        won++;
        if (!best || b.returned - b.stake > best.returned - best.stake) best = b;
      }
    });
    var pending = openBets(comp).reduce(function (s, b) { return s + b.stake; }, 0);
    return {
      settled: done.length, staked: staked, returned: returned,
      profit: returned - staked,
      roi: staked ? (returned - staked) / staked : 0,
      strike: done.length ? won / done.length : 0,
      won: won, lost: done.length - won,
      pending: pending, openCount: openBets(comp).length,
      best: best,
      bankroll: w.bankroll, start: w.startBankroll
    };
  }

  /* -------------------------------------------------------------- tipping */

  function roundMatches(comp, md) {
    return comp.season.matches.filter(function (m) { return m.md === md; });
  }

  // Each tipster picks by its own rule. Never returns a draw.
  function aiTip(strategy, comp, match, table, rng) {
    var map = E.teamsById(comp);
    var h = map[match.h], a = map[match.a];
    var pos = {};
    table.forEach(function (r) { pos[r.id] = r.pos; });
    var form = {};
    table.forEach(function (r) {
      form[r.id] = r.form.reduce(function (s, f) { return s + (f === 'W' ? 3 : f === 'D' ? 1 : 0); }, 0);
    });

    switch (strategy) {
      case 'home': return match.h;
      case 'ladder':
        if (pos[match.h] === pos[match.a]) return match.h;
        return pos[match.h] < pos[match.a] ? match.h : match.a;
      case 'form':
        if ((form[match.h] || 0) === (form[match.a] || 0)) return match.h;
        return (form[match.h] || 0) > (form[match.a] || 0) ? match.h : match.a;
      case 'random': return rng.next() < 0.5 ? match.h : match.a;
      case 'upset': {
        var fav = favourite(comp, match);
        var dog = fav === match.h ? match.a : match.h;
        return rng.next() < 0.35 ? dog : fav;
      }
      default: return favourite(comp, match);
    }
  }

  function favourite(comp, match) {
    var d = distribution(comp, match, 600);
    if (!d) return match.h;
    return d.pHome >= d.pAway ? match.h : match.a;
  }

  function setTip(comp, matchId, teamId) {
    var w = ensure(comp);
    if (!w.tips[matchId]) w.tips[matchId] = { user: null, ai: null };
    w.tips[matchId].user = teamId;
  }

  function setMargin(comp, md, value) {
    var w = ensure(comp);
    w.margins[md] = Math.max(0, Math.min(200, Math.floor(Number(value) || 0)));
  }

  // Lock every tipster's picks for a round before it is played.
  function lockRound(comp, md) {
    var w = ensure(comp);
    if (!w.tipping) return;
    var ms = roundMatches(comp, md).filter(function (m) { return !m.played; });
    if (!ms.length) return;
    var table = E.computeTable(comp.teams, comp.season.matches, comp.settings);
    var rng = new E.RNG(((comp.seed >>> 0) ^ (md * 2654435761)) >>> 0);
    ms.forEach(function (m) {
      if (!w.tips[m.id]) w.tips[m.id] = { user: null, ai: null };
      var t = w.tips[m.id];
      if (!t.ai) {
        t.ai = {};
        TIPSTERS.forEach(function (x) { t.ai[x.id] = aiTip(x.strategy, comp, m, table, rng); });
      }
      // no pick from the user counts as a miss, not a free point
      if (!t.user) t.user = null;
    });
  }

  // A draw pays everyone, which is how office comps handle it.
  function tipScores(comp) {
    var w = ensure(comp);
    var rows = [{ id: 'user', name: 'You', you: true, correct: 0, tipped: 0, error: 0 }];
    TIPSTERS.forEach(function (x) {
      rows.push({ id: x.id, name: x.name, blurb: x.blurb, correct: 0, tipped: 0, error: 0 });
    });
    var byId = {};
    rows.forEach(function (r) { byId[r.id] = r; });

    comp.season.matches.forEach(function (m) {
      if (!m.played) return;
      var t = w.tips[m.id];
      if (!t) return;
      var drawn = m.hg === m.ag && !m.tieWinner;
      var winner = m.tieWinner || (m.hg > m.ag ? m.h : m.hg < m.ag ? m.a : null);
      if (t.user) {
        byId.user.tipped++;
        if (drawn || t.user === winner) byId.user.correct++;
      }
      if (t.ai) {
        TIPSTERS.forEach(function (x) {
          var pick = t.ai[x.id];
          if (!pick) return;
          byId[x.id].tipped++;
          if (drawn || pick === winner) byId[x.id].correct++;
        });
      }
    });

    // margin tiebreak: how far off the user was on each round's feature match
    Object.keys(w.margins).forEach(function (md) {
      var ms = roundMatches(comp, Number(md));
      var feature = ms[0];
      if (!feature || !feature.played) return;
      byId.user.error += Math.abs(Math.abs(feature.hg - feature.ag) - w.margins[md]);
    });

    rows.sort(function (x, y) {
      return y.correct - x.correct || x.error - y.error || x.name.localeCompare(y.name);
    });
    rows.forEach(function (r, i) { r.pos = i + 1; });
    return rows;
  }

  function archiveTipping(comp) {
    var w = ensure(comp);
    if (!w.tipping) return null;
    var rows = tipScores(comp);
    var you = rows.filter(function (r) { return r.you; })[0];
    if (!you || !you.tipped) return null;
    var rec = {

    if (!me) return false;
    var mine = st.score(me) + st.gain;
    var opp = m.h === id ? m.a : m.h;
    return st.table.every(function (r) {
      if (r.id === id) return true;
      var rem = st.rem[r.id] - (r.id === opp ? 1 : 0);
      return st.score(r) + rem * st.gain < mine;
    });
  }

  /* -------------------------------------------------------- the hooks */

  // Before a batch of matches: what can only be read before they are played.
  function before(comp, due) {
    ensure(comp);
    var ids = {}, apps = {};
    due.forEach(function (m) { ids[m.h] = 1; ids[m.a] = 1; });
    comp.teams.forEach(function (t) {
      if (!ids[t.id]) return;
      t.players.forEach(function (p) { apps[p.id] = p.capps; });
    });
    return { apps: apps, complete: comp.season.complete, stage: comp.season.stage };
  }

  function after(comp, due, snap) {
    if (!snap) return;
    var R = ensure(comp);
    var ctx = context(comp);
    due.forEach(function (m) { if (m.played) atFullTime(comp, R, ctx, m, snap); });
    if (snap.stage === 'qual' && comp.season.stage !== 'qual') {
      atQualified(comp, ctx.n, (comp.season.qualified || []).map(function (q) { return q.id; }));
    }
    if (!snap.complete && comp.season.complete) atSeasonEnd(comp, R, ctx);
    else atRoundEnd(comp, R);
  }

  function context(comp) {
    var byId = {}, players = {};
    comp.teams.forEach(function (t) {
      byId[t.id] = t;
      t.players.forEach(function (p) { players[p.id] = p; });
    });
    return { byId: byId, players: players, sp: sportOf(comp), n: comp.season.number };
  }

  /* ----------------------------------------------------------- full time */

  function atFullTime(comp, R, ctx, m, snap) {
    var h = ctx.byId[m.h], a = ctx.byId[m.a];
    if (!h || !a) return;
    var base = R.played, hadBig = !!last(R.big), hadHigh = !!last(R.high);
    var info = noteResult(R, ctx.n, m.md, h, a, m.hg, m.ag);
    R.cur.played++;
    var winner = m.hg > m.ag ? h : m.ag > m.hg ? a : null;
    var loser = winner === h ? a : winner === a ? h : null;
    var wg = Math.max(m.hg, m.ag), lg = Math.min(m.hg, m.ag);
    var ripe = base >= BASELINE;

    // the competition's own records
    if (info.big && ripe && hadBig && winner && comp.history.length >= 1) {
      push(comp, { at: 'match', k: 'record', w: comp.history.length >= 3 ? 3 : 2,
        mid: m.id, md: m.md, teams: [winner.id, loser.id],
        text: winner.name + ' beat ' + loser.name + ' ' + wg + '–' + lg +
          ', the biggest win in ' + span(comp) + '.' });
    } else if (info.high && ripe && hadHigh && comp.history.length >= 1) {
      push(comp, { at: 'match', k: 'record', w: 2, mid: m.id, md: m.md, teams: [h.id, a.id],
        text: h.name + ' ' + m.hg + '–' + m.ag + ' ' + a.name +
          ', the highest-scoring match in ' + span(comp) + '.' });
    }

    matchFeats(comp, R, ctx, m, h, a, winner, loser, ripe);

    // a hoodoo broken
    if (winner && info.pair) {
      var pr = info.pair, drought = pr.s[winner.id], wins = pr.w[winner.id], theirs = pr.w[loser.id];
      var text = null, w = 1;
      if (pr.p >= 5 && !wins) {
        text = winner.name + ' beat ' + loser.name + ' for the first time, at the ' +
          ordinal(pr.p + 1) + ' attempt.';
        w = pr.p >= 25 ? 3 : pr.p >= 10 ? 2 : 1;
      } else if (drought >= 8) {
        text = winner.name + ' beat ' + loser.name + ' for the first time in ' + drought + ' meetings.';
        w = drought >= 30 ? 3 : drought >= 12 ? 2 : 1;
        if (theirs >= 6 && theirs / Math.max(1, theirs + wins) >= 0.7) text += ' The bogey team, beaten at last.';
      }
      if (text) {
        push(comp, { at: 'match', k: 'h2h', w: w, mid: m.id, md: m.md, teams: [winner.id, loser.id], text: text });
      }
    }

    playerMoments(comp, R, ctx, m, h, a);
    appearanceMoments(comp, ctx, m, h, a, snap);
    incidentMoments(comp, ctx, m, h, a);
  }

  // Feats the archive cannot answer later, because it keeps scores but not
  // minutes: the fastest opener and the biggest deficit turned round. Each is
  // kept as a short top-five list for the records book.
  var FEAT_KEEP = 5;
  function keepTop(list, row, better) {
    list.push(row);
    list.sort(better);
    if (list.length > FEAT_KEEP) list.length = FEAT_KEEP;
    return list.indexOf(row);
  }

  function matchFeats(comp, R, ctx, m, h, a, winner, loser, ripe) {
    if (!R.fast) R.fast = [];
    if (!R.comeback) R.comeback = [];
    var sp = ctx.sp, ev = m.events[0];
    // the fastest goal only means something where goals are rare
    if (ev && haulMin(sp) && ev.s && ctx.players[ev.s]) {
      var t = ev.side === 'h' ? h : a;
      keepTop(R.fast, { n: ctx.n, md: m.md, mid: m.id, name: ctx.players[ev.s].name, team: t.name, tid: t.id,
        opp: (t === h ? a : h).name, min: ev.min, label: E.clockLabel(sp, ev.min) },
        function (x, y) { return x.min - y.min || x.n - y.n; });
    }
    // in the high-scoring sports plays are timed too loosely for a running
    // score to mean anything, so comebacks are only told where goals are rare
    if (!winner || !haulMin(sp)) return;
    var side = winner === h ? 'h' : 'a', us = 0, them = 0, deficit = 0;
    m.events.forEach(function (e) {
      if (e.side === side) us += e.v || 1; else them += e.v || 1;
      deficit = Math.max(deficit, them - us);
    });
    var need = 2;
    if (deficit < need) return;
    var prev = R.comeback[0];
    var row = { n: ctx.n, md: m.md, mid: m.id, team: winner.name, tid: winner.id, opp: loser.name,
      deficit: deficit, score: (side === 'h' ? m.hg + '\u2013' + m.ag : m.ag + '\u2013' + m.hg) };
    var at = keepTop(R.comeback, row, function (x, y) { return y.deficit - x.deficit || x.n - y.n; });
    if (at === 0 && prev && row.deficit > prev.deficit && ripe && comp.history.length >= 1) {
      push(comp, { at: 'match', k: 'comeback', w: 3, mid: m.id, md: m.md, teams: [winner.id, loser.id],
        text: winner.name + ' come from ' + deficit + ' down to beat ' + loser.name + ' ' + row.score +
          ', the biggest comeback in ' + span(comp) + '.' });
    } else if (deficit >= need + 1) {
      push(comp, { at: 'match', k: 'comeback', w: 2, mid: m.id, md: m.md, teams: [winner.id, loser.id],
        text: winner.name + ' come from ' + deficit + ' down to beat ' + loser.name + ' ' + row.score + '.' });
    }
  }

  // A star's long lay-off is news; a sending-off is worth a line.
  function incidentMoments(comp, ctx, m, h, a) {
    (m.inc || []).forEach(function (x) {
      var t = x.side === 'h' ? h : a, opp = x.side === 'h' ? a : h, p = ctx.players[x.p];
      if (!p) return;
      var best = t.players.slice().sort(function (y, z) { return z.skill - y.skill; }).slice(0, 3);
      var star = best.indexOf(p) >= 0;
      if (x.k === 'inj' && x.out >= 8 && star) {
        push(comp, { at: 'match', k: 'injury', w: 2, mid: m.id, md: m.md, teams: [t.id],
          text: 'Blow for ' + t.name + ': ' + p.name + ' is out for ' + x.out + ' matches with ' + x.what + '.' });
      } else if (x.k === 'red') {
        push(comp, { at: 'match', k: 'red', w: 1, mid: m.id, md: m.md, teams: [t.id],
          text: p.name + ' sent off against ' + opp.name + ', banned for ' + x.out +
            (x.out === 1 ? ' match.' : ' matches.') });
      }
    });
  }

  function playerMoments(comp, R, ctx, m, h, a) {
    var sp = ctx.sp, wd = words(sp), cr = careerOf(comp), hm = haulMin(sp);
    var tally = {}, order = [];
    m.events.forEach(function (ev) {
      if (!ev.s || !ctx.players[ev.s]) return;
      if (!tally[ev.s]) {
        tally[ev.s] = { p: ctx.players[ev.s], t: ev.side === 'h' ? h : a,
                        opp: ev.side === 'h' ? a : h, evs: [], v: 0 };
        order.push(ev.s);
      }
      tally[ev.s].evs.push(ev);
      tally[ev.s].v += ev.v || 1;
    });

    order.forEach(function (pid) {
      var x = tally[pid], p = x.p, t = x.t;
      var clubBefore = (R.club[t.id] || {})[p.name] || 0;
      var top = clubTop(R, t.id, p.name);
      // two teammates trading the record every week is not news; passing a
      // name from the club's past is
      var active = top && t.players.some(function (q) { return q.name === top.name; });
      var cgBefore = p.cg - x.v;

      var run = cgBefore, crossed = null, clubRun = clubBefore, passed = null;
      x.evs.forEach(function (ev) {
        var v = ev.v || 1;
        if (Math.floor((run + v) / cr.step) > Math.floor(run / cr.step)) {
          crossed = { at: Math.floor((run + v) / cr.step) * cr.step, ev: ev };
        }
        run += v;
        if (top && !passed && clubRun <= top.g && clubRun + v > top.g) passed = ev;
        clubRun += v;
      });
      addClub(R, t.id, p.name, x.v);
      addCur(R, t.id, p.name, x.v);

      function moment(w, k, text, ev) {
        push(comp, { at: 'match', k: k, w: w, mid: m.id, md: m.md, teams: [t.id],
                     s: p.id, min: ev ? ev.min : null, text: text });
      }

      // a haul in a low-scoring sport, measured in scoring plays
      var plays = x.evs.length;
      if (hm && plays >= hm) {
        var prev = null;
        R.hauls.forEach(function (hl) { if (hl.k >= plays) prev = hl; });
        R.hauls.push({ n: ctx.n, md: m.md, name: p.name, team: t.name, k: plays });
        if (R.hauls.length > HAUL_CAP) {
          var drop = -1;
          for (var i = 0; i < R.hauls.length && drop < 0; i++) if (R.hauls[i].k <= 3) drop = i;
          R.hauls.splice(drop < 0 ? 0 : drop, 1);
        }
        var trick = sp.id === 'football' || sp.id === 'hockey';
        var what = trick && plays === 3 ? 'a hat-trick' : num(plays) + ' ' + wd.many;
        var ev = x.evs[plays - 1];
        if (!prev && comp.history.length >= 1) {
          moment(plays >= 4 ? 3 : 2, 'haul', cap(what) + ' for ' + p.name + ' against ' + x.opp.name +
            '. Nobody had ever done that here.', ev);
        } else if (prev && ctx.n - prev.n >= 3) {
          moment(plays >= 4 && ctx.n - prev.n >= 5 ? 3 : 2, 'haul', cap(what) + ' for ' + p.name +
            ' against ' + x.opp.name + '. Nobody has done that here since S' + prev.n + '.', ev);
        } else {
          moment(plays >= 4 ? 2 : 1, 'haul', cap(what) + ' for ' + p.name + ' against ' + x.opp.name + '.', ev);
        }
      }

      // a single-game points record in the high-scoring sports
      var best = last(R.best);
      if (!best || x.v > best.v) {
        R.best.push({ n: ctx.n, md: m.md, name: p.name, team: t.name, v: x.v });
        if (!hm && best && R.played > BASELINE && comp.history.length >= 1) {
          moment(3, 'record', p.name + ' scores ' + x.v + ' ' + wd.many + ' against ' + x.opp.name +
            ', the most by any player in a single game in ' + span(comp) + '.',
            x.evs[x.evs.length - 1]);
        }
      }

      // the first landmark comes round for half the league; only the later ones are news
      if (crossed && crossed.at >= cr.step * 2) {
        var at = crossed.at, before = R.marks[at] || 0;
        R.marks[at] = before + 1;
        var first = !before && at >= cr.pop;
        moment(first ? 3 : at >= cr.pop ? 2 : 1, 'career',
          (wd.one === 'point' ? p.name + ' passes ' + big(at) + ' career points.'
            : poss(p.name) + ' ' + ordinal(at) + ' career ' + wd.one + '.') +
          (first ? ' The first player in ' + span(comp) + ' to get there.' : ''), crossed.ev);
      }

      if (passed && !active && top.g >= cr.step && comp.history.length >= 1) {
        var who = wd.one === 'goal' ? 'goalscorer' : wd.one === 'run' ? 'run scorer' : 'points scorer';
        moment(3, 'club-record', p.name + ' passes ' + poss(top.name) + ' ' + big(top.g) + ' to become ' +
          poss(t.name) + ' leading ' + who + ' of all time.', passed);
      }
    });
  }

  // Squads that came up together reach their landmarks together, so one line
  // covers everyone from a club who got there in the same game.
  function appearanceMoments(comp, ctx, m, h, a, snap) {
    // a hundred games is three seasons in football and under two in basketball,
    // so the landmarks stretch with the length of the season
    var games = ctx.games || (ctx.games = seasonGames(comp));
    var unitApps = 100 * Math.max(1, Math.round(games / 38));
    [h, a].forEach(function (t) {
      var at = {};
      t.players.forEach(function (p) {
        var was = snap.apps[p.id];
        if (was == null || p.capps <= was || p.capps < unitApps * 3) return;
        if (Math.floor(p.capps / unitApps) === Math.floor(was / unitApps)) return;
        var mk = Math.floor(p.capps / unitApps) * unitApps;
        (at[mk] = at[mk] || []).push(p.name);
      });
      Object.keys(at).forEach(function (k) {
        var names = at[k], mk = +k;
        var who = names.length === 1 ? names[0]
          : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
        push(comp, { at: 'match', k: 'apps', w: mk >= unitApps * 5 ? 2 : 1, mid: m.id, md: m.md, teams: [t.id],
          text: who + (names.length > 1 ? ' all reach ' : ' reaches ') + mk + ' career appearances, for ' +
            t.name + ' against ' + (t === h ? a : h).name + '.' });
      });
    });
  }

  /* ----------------------------------------------------------- round end */

  function atRoundEnd(comp, R) {
    if (R.cur.clinched || comp.season.complete) return;
    var c = clinched(comp);
    if (!c || !c.rem) return;
    R.cur.clinched = c.team.id;
    var spare = 'with ' + num(c.rem) + (c.rem === 1 ? ' game' : ' games') + ' to spare';
    if (hasFinals(comp)) {
      push(comp, { at: 'round', k: 'minor', w: 1, teams: [c.team.id], md: comp.season.round,
        text: c.team.name + ' wrap up the minor premiership ' + spare + '.' });
      return;
    }
    var t = titleStory(comp, c.team);
    push(comp, { at: 'round', k: 'title', w: Math.max(2, t.w), teams: [c.team.id], md: comp.season.round,
      text: t.text + ' Sealed ' + spare + '.' });
  }

  /* ---------------------------------------------------------- season end */

  function atSeasonEnd(comp, R, ctx) {
    var s = comp.season;
    var champ = ctx.byId[s.champion];
    var titleTold = R.cur.clinched && !hasFinals(comp) && R.cur.clinched === s.champion;
    if (champ && !titleTold) {
      var t = titleStory(comp, champ);
      push(comp, { at: 'season', k: 'title', w: t.w, teams: [champ.id], text: t.text });
    }

    // the nearly-men
    var ru = ctx.byId[s.runnerUp];
    if (ru && seasonHasFinal(comp)) {
      var rf = facts(comp, ru.id);
      if (!rf.finalWins && rf.finals + 1 >= 3) {
        push(comp, { at: 'season', k: 'heartbreak', w: 2, teams: [ru.id],
          text: 'Heartbreak again for ' + ru.name + ': ' + num(rf.finals + 1) + ' ' + finalWord(comp) +
            's, still no win.' });
      }
    }

    if (comp.format === 'league') leagueSeasonEnd(comp, ctx);
  }

  function leagueSeasonEnd(comp, ctx) {
    var s = comp.season, H = comp.history;
    var table = E.computeTable(comp.teams, s.matches, comp.settings,
      function (m) { return m.stage === 'league'; });
    var idxOf = {};
    comp.teams.forEach(function (t, i) { idxOf[t.id] = i; });
    var leagueRecs = H.filter(function (r) { return r.format === 'league'; });
    var pctMode = comp.settings.rankBy === 'winpct';

    // decided on goal difference
    if (!pctMode && !hasFinals(comp) && table[1] && table[0].pts === table[1].pts) {
      var before = leagueRecs.some(function (r) {
        return !r.finalsSystem && r.table[1] && r.table[0].pts === r.table[1].pts;
      });
      var how = comp.settings.tiebreak === 'h2h' ? 'head to head' : comp.settings.tiebreak === 'gf'
        ? sportOf(comp).scoreWord.toLowerCase() + ' scored' : 'goal difference';
      push(comp, { at: 'season', k: 'decider', w: before || !H.length ? 2 : 3,
        teams: [table[0].id, table[1].id],
        text: 'Level on points with ' + table[1].team.name + ', ' + table[0].team.name +
          ' take it on ' + how + (before || !H.length ? '.' : ', the first title ever settled that way.') });
    }

    // unbeaten
    table.forEach(function (r) {
      if (r.l || r.p < 10) return;
      var done = leagueRecs.some(function (rec) {
        return rec.table.some(function (x) { return x.p >= 10 && !x.l; });
      });
      push(comp, { at: 'season', k: 'unbeaten', w: done ? 2 : 3, teams: [r.id],
        text: r.team.name + ' go the whole season unbeaten' +
          (done || !H.length ? '.' : ', a first in ' + span(comp) + '.') });
    });

    // record points haul and record scorer, once there is a past to beat
    if (leagueRecs.length >= 3 && !pctMode && table[0]) {
      var bestPpg = 0;
      leagueRecs.forEach(function (r) {
        if (r.table[0] && r.table[0].p) bestPpg = Math.max(bestPpg, r.table[0].pts / r.table[0].p);
      });
      if (table[0].p && table[0].pts / table[0].p > bestPpg + 1e-9) {
        push(comp, { at: 'season', k: 'record', w: 2, teams: [table[0].id],
          text: table[0].team.name + ' finish on ' + table[0].pts + ' points, the best return in ' +
            span(comp) + '.' });
      }
    }
    var top = E.topScorers(comp.teams, 1, 'all')[0];
    if (top && leagueRecs.length >= 3) {
      var most = 0;
      leagueRecs.forEach(function (r) { if (r.awards && r.awards.topScorer) most = Math.max(most, r.awards.topScorer.g); });
      if (top.g > most) {
        push(comp, { at: 'season', k: 'record', w: 2, teams: [top.t.id],
          text: poss(top.p.name) + ' ' + big(top.g) + ' ' + words(ctx.sp).many +
            ' are the most in a single season in ' + span(comp) + '.' });
      }
    }

    // highest finish in years, or the worst
    if (H.length >= 5) {
      table.forEach(function (r) {
        var i = idxOf[r.id], past = [];
        H.forEach(function (rec) {
          if (rec.format !== 'league') return;
          rec.table.forEach(function (x) { if (x.t === i) past.push({ n: rec.n, pos: x.pos }); });
        });
        if (past.length < 5 || r.pos === 1) return;
        var half = Math.ceil(table.length / 2);
        var better = null, worse = null;
        past.forEach(function (x) {
          if (x.pos <= r.pos) better = x;
          if (x.pos >= r.pos) worse = x;
        });
        if (r.pos <= half) {
          if (!better) {
            push(comp, { at: 'season', k: 'finish', w: 2, teams: [r.id],
              text: r.team.name + ' finish ' + ordinal(r.pos) + ', their highest finish ever.' });
          } else if (ctx.n - better.n >= 8) {
            push(comp, { at: 'season', k: 'finish', w: 2, teams: [r.id],
              text: r.team.name + ' finish ' + ordinal(r.pos) + ', their highest finish in ' +
                (ctx.n - better.n) + ' seasons.' });
          }
        } else if (r.pos > half) {
          if (!worse) {
            push(comp, { at: 'season', k: 'fall', w: 2, teams: [r.id],
              text: r.team.name + ' finish ' + ordinal(r.pos) + ', the lowest they have ever been.' });
          } else if (ctx.n - worse.n >= 8) {
            push(comp, { at: 'season', k: 'fall', w: 2, teams: [r.id],
              text: r.team.name + ' finish ' + ordinal(r.pos) + ', their worst since S' + worse.n + '.' });
          }
        }
      });
    }
  }

  /* -------------------------------------------------- World Cup qualifying */

  // `ids` are the sides through to edition `n`; the archive says what that means.
  function atQualified(comp, n, ids) {
    if (!ids.length || !LS.store) return;
    var runs = LS.store.qualificationRuns(comp, false);
    if (!runs.length || runs[0].editions < 2) return;
    var through = {};
    ids.forEach(function (id) { through[id] = true; });
    var C = comp.name, U = unit(comp);
    var ctx = { n: n };
    function say(e) { e.n = n; push(comp, e); }
    runs.forEach(function (row) {
      var T = row.team.name;
      if (through[row.id]) {
        if (!row.apps) {
          if (row.editions < 3) return;
          say({ at: 'round', k: 'qual', w: row.editions >= 8 ? 3 : 2, teams: [row.id],
            text: T + ' qualify for the ' + C + ' for the first time.' });
        } else if (ctx.n - row.last >= 5) {
          say({ at: 'round', k: 'qual', w: 2, teams: [row.id],
            text: T + ' are back at the ' + C + ' for the first time in ' + (ctx.n - row.last) + ' ' + U + '.' });
        } else if (row.current + 1 >= 10 && (row.current + 1) % 5 === 0) {
          say({ at: 'round', k: 'qual', w: 2, teams: [row.id],
            text: T + ' reach the ' + C + ' for the ' + ordinal(row.current + 1) + ' time in a row.' });
        }
      } else if (row.current >= 5) {
        say({ at: 'round', k: 'qual', w: row.current >= 8 ? 3 : 2, teams: [row.id],
          text: T + ' miss the ' + C + ' for the first time in ' + (row.current + 1) + ' ' + U + '.' });
      }
    });
  }

  /* -------------------------------------------------------- archiving */

  // Who is on every squad, so whoever is gone after the summer can be found.
  function squads(comp) {
    var out = {};
    comp.teams.forEach(function (t) { out[t.id] = t.players.slice(); });
    return out;
  }

  // Called once the season is in the books and the summer has happened, but
  // before the next one starts.
  function onArchive(comp, rec, before) {
    var R = ensure(comp);
    var cr = careerOf(comp), wd = words(sportOf(comp));

    // retirements: the summer turnover clears out the weakest, legends included
    var bigCareer = 300 * Math.max(1, Math.round(seasonGames(comp) / 38));
    if (before) {
      comp.teams.forEach(function (t) {
        // a newcomer inherits the old player's slot and id, so it is the
        // player object itself that tells who has gone
        (before[t.id] || []).forEach(function (p) {

            '<label class="field"><span class="lbl">System</span>' +

  // A continental cup needs no teams of its own, only the leagues that feed it.

    var defaults = CTm.DEFAULT_LEAGUES[sport.id] || [];
    var list = feeders.length
      ? feeders.map(function (L) {
          return '<label class="check"><input type="checkbox" class="cont-pick" value="' + esc(L.id) + '" checked> ' +
            esc(L.name) + ' <span class="tiny muted">\u00b7 season ' + L.season.number + ', ' + L.teams.length + ' clubs</span></label>';
        }).join('')
      : '<p class="small" style="margin:0">You have no ' + esc(sport.name.toLowerCase()) + ' leagues yet, so these are set up for you: <b>' +
        defaults.map(function (k) { return esc(D.presets[k].name); }).join(', ') + '</b>. Play them and their tables decide ' +
        'who qualifies from season two.</p>';
    return '<div class="stack">' +
      '<div class="card"><div class="card-body">' +
        '<button class="btn btn-sm" data-act="go-home" style="margin-bottom:12px">\u2190 Home</button>' +
        '<h1 style="margin-bottom:6px">Build a competition</h1>' +
        '<p class="small">A continental cup draws the top finishers from your leagues into groups, then a knockout. ' +
        'Clubs arrive with their domestic ratings and squads, refreshed at every draw.</p>' +
      '</div></div>' +
      '<div class="card"><div class="card-head"><h2>1. Sport &amp; teams</h2>' +
        '<span class="badge">' + sport.icon + ' ' + esc(sport.name) + '</span></div>' +
        '<div class="card-body">' + sportChips +
        '<div class="section-title">Starting teams</div><div class="preset-grid">' + presets + '</div></div></div>' +
      '<div class="card"><div class="card-head"><h2>2. Feeder leagues</h2></div><div class="card-body">' + list +
        '<div class="grid grid-2" style="margin-top:12px">' +
          '<label class="field"><span class="lbl">Competition name</span>' +
            '<input type="text" id="fName" value="' + esc(CTm.NAMES[sport.id] || 'Continental Cup') + '"></label>' +
          '<label class="field"><span class="lbl">Places per league</span><select id="contPlaces">' +
            [1, 2, 3, 4, 5, 6, 8].map(function (n) {
              return '<option value="' + n + '"' + (n === 4 ? ' selected' : '') + '>Top ' + n + '</option>';
            }).join('') + '</select></label>' +
        '</div>' +
        '<label class="check"><input type="checkbox" id="fTwoLegs" checked> Two-legged knockout ties (final excepted)</label>' +
        '<label class="field" style="max-width:280px"><span class="lbl">Seed (optional)</span>' +
          '<input type="text" id="fSeed" placeholder="Leave blank for random"></label>' +
      '</div></div>' +
      '<div class="btn-row"><button class="btn btn-primary btn-lg" data-act="create-comp">Create competition</button>' +

      '</div></div>';
  }

  function viewCreateOsg(sport, sportChips, presets) {
    var rows = LS.osg.COUNTRIES.map(function (c) {
      return '<tr><td class="l">' + c.flag + ' <span class="strong">' + esc(c.name) + '</span></td>' +
        '<td>' + c.campuses.length + '</td><td class="strong">' + c.places + '</td></tr>';
    }).join('');
    var total = LS.osg.COUNTRIES.reduce(function (n, c) { return n + c.places; }, 0);
    var campuses = LS.osg.COUNTRIES.reduce(function (n, c) { return n + c.campuses.length; }, 0);
    return '<div class="stack">' +
      '<div class="card"><div class="card-body">' +
        '<button class="btn btn-sm" data-act="go-home" style="margin-bottom:12px">\u2190 Home</button>' +
        '<h1 style="margin-bottom:6px">Build a competition</h1></div></div>' +
      '<div class="card"><div class="card-head"><h2>1. Sport &amp; teams</h2>' +
        '<span class="badge">' + sport.icon + ' ' + esc(sport.name) + '</span></div>' +
        '<div class="card-body">' + sportChips +
        '<div class="section-title">Starting teams</div><div class="preset-grid">' + presets + '</div></div></div>' +
      '<div class="card"><div class="card-head"><h2>2. OneSchool Global Rugby</h2>' +
        '<span class="badge">' + campuses + ' campuses</span></div><div class="card-body">' +
        '<p class="small">Every campus plays its national competition. Countries with only a few campuses share a ' +
        'regional one, the way OSG groups them. The bigger competitions settle their title in a top-four finals series. ' +
        'Then comes qualifying, World Cup style, and <b>every campus takes part</b>: each national champion goes straight ' +
        'through, and every other campus plays a qualifying round for the rest of their country\u2019s places. The ' + total + ' who make it meet in the <b>' +
        esc(LS.osg.GLOBAL_NAME) + '</b>: four groups, then quarter-finals, semis and a final.</p>' +
        '<div class="table-wrap"><table class="data"><thead><tr><th class="l">National competition</th>' +
        '<th>Campuses, all in qualifying</th><th class="strong">World Series places</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="tiny muted" style="margin:10px 0 0">Campus names come from OneSchool Global\u2019s campus pages. ' +
        'Strengths are estimates (country rugby pedigree and campus size), and every name, rating and place is editable afterwards.</p>' +
        '<label class="field" style="max-width:280px;margin-top:12px"><span class="lbl">Seed (optional)</span>' +
          '<input type="text" id="fSeed" placeholder="Leave blank for random"></label>' +
      '</div></div>' +
      '<div class="btn-row"><button class="btn btn-primary btn-lg" data-act="create-comp">Create OneSchool Global Rugby</button>' +
        (S.state.competitions.length ? '<button class="btn btn-lg" data-act="cancel-create">Cancel</button>' : '') +
      '</div></div>';
  }

  function doCreateOsg() {
    var seedRaw = ($('#fSeed') || {}).value ? $('#fSeed').value.trim() : '';
    var comp = LS.osg.create({ seed: seedRaw ? (parseInt(seedRaw, 10) || hashString(seedRaw)) : null });
    app.view = 'overview';
    app.ui.md = 0;
    render();
    toast('OneSchool Global Rugby is set up: ' + LS.osg.COUNTRIES.length + ' national competitions and the ' + comp.name);
  }

  function doCreateContinental() {
    var ids = Array.prototype.slice.call(document.querySelectorAll('.cont-pick'))
      .filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
    if (document.querySelectorAll('.cont-pick').length && !ids.length) { toast('Pick at least one league'); return; }
    var seedRaw = $('#fSeed').value.trim();
    var res = LS.continental.create({
      sport: app.ui.createSport,
      name: $('#fName').value.trim(),
      leagues: ids,
      places: parseInt($('#contPlaces').value, 10),
      seed: seedRaw ? (parseInt(seedRaw, 10) || hashString(seedRaw)) : null,
      settings: { twoLegs: $('#fTwoLegs').checked }
    });
    app.view = 'overview';
    app.ui.md = 0;
    render();
    toast(res.comp.name + ' created' + (res.made.length ? ' with ' + res.made.length + ' leagues to feed it' : ''));
  }

  function doCreate() {
    var presetId = app.ui.createPreset;
    if (presetId === 'continental') { doCreateContinental(); return; }
    if (presetId === 'osg') { doCreateOsg(); return; }
    var teams;
    if (presetId === 'custom') {
      var n = E.clamp(parseInt($('#customCount').value, 10) || 12, 4, 40);
      teams = [];
      for (var i = 0; i < n; i++) {
        teams.push(D.T('Team ' + (i + 1), 'T' + (i + 1), 60, 60,
          PALETTE[i % PALETTE.length], '#ffffff'));
      }
    } else {
      teams = D.presets[presetId].teams;
    }
    var seedRaw = $('#fSeed').value.trim();
    var seed = seedRaw ? (parseInt(seedRaw, 10) || hashString(seedRaw)) : null;

    // start from whatever the preset defines (qualifying structure, group sizes),
    // then let the form override the parts it actually exposes
    var preset = D.presets[presetId];
    var settings = {};
    Object.keys((preset && preset.settings) || {}).forEach(function (k) {
      settings[k] = preset.settings[k];
    });
    var form = {
        doubleRound: $('#fDouble').checked,
        twoLegs: $('#fTwoLegs').checked,
        neutralKo: $('#fNeutral').checked,
        groupSize: parseInt($('#fGroupSize').value, 10),
        qualifyPerGroup: parseInt($('#fQualify').value, 10),
        pointsWin: parseInt($('#fWin').value, 10),
        pointsDraw: parseInt($('#fDraw').value, 10),
        tiebreak: $('#fTiebreak').value,
        homeAdv: parseInt($('#fAdv').value, 10) / 100,
        evolution: $('#fEvolution').value,
        finals: {
          enabled: $('#fFinals').checked,
          system: $('#fFinalsSystem').value,
          size: parseInt($('#fFinalsSize').value, 10)
        }
    };
    Object.keys(form).forEach(function (k) { settings[k] = form[k]; });

    var comp = S.createCompetition({
      name: $('#fName').value.trim() || 'My Competition',
      format: $('#fFormat').value,
      sport: app.ui.createSport,
      teams: teams,
      seed: seed,
      settings: settings
    });
    S.add(comp);
    app.view = 'overview';
    app.ui.md = 0;
    render();
    toast(comp.name + ' created');
  }

  function hashString(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /* -------------------------------------------------------- overview view */

  function viewOverview(comp) {
    var s = comp.season, prog = seasonProgress(comp);
    var table = liveTable(comp);
    var map = E.teamsById(comp);
    var phase = statPhase(comp);
    var pf = phaseFilter(comp, phase);
    var goals = 0, biggest = null;
    s.matches.forEach(function (m) {
      if (!m.played || m.stage === 'finals') return;
      if (pf && !pf(m)) return;
      goals += m.hg + m.ag;
      var marg = Math.abs(m.hg - m.ag);
      if (!biggest || marg > biggest.marg || (marg === biggest.marg && m.hg + m.ag > biggest.tot)) {
        biggest = { m: m, marg: marg, tot: m.hg + m.ag };
      }
    });
    var scorers = E.topScorers(comp.teams, 5, phase);
    var leader = table[0];

    var tiles =
      '<div class="grid grid-4">' +
        tile('Matches played', prog.played + ' / ' + prog.total, prog.pct + '% of the season') +
        tile(sportOf(comp).scoreWord + (isWorldCup(comp) ? ' — ' + phaseLabel(phase).toLowerCase() : ''),
             goals, prog.played ? (goals / prog.played).toFixed(2) + ' per match' : 'none yet') +
        tile(comp.format === 'league' ? 'Leading' : 'Best record',
             leader && leader.p ? esc(leader.team.abbr) : '—',
             leader && leader.p ? (comp.settings.rankBy === 'winpct'
               ? leader.w + '-' + leader.l + ' from ' + leader.p
               : leader.pts + ' pts from ' + leader.p) : 'not started') +
        tile('Top scorer',
             scorers[0] ? scorers[0].g + ' ' + sportOf(comp).scoreWord.toLowerCase() : '—',
             scorers[0] ? esc(scorers[0].p.name) : 'none yet') +
      '</div>';

    var head =
      '<div class="card"><div class="card-body">' +
        '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">' +
          '<h1>' + esc(comp.name) + '</h1>' +
          '<span class="badge badge-accent">Season ' + s.number + '</span>' +
          '<span class="badge">' + esc(formatLabel(comp)) + '</span>' +
          (comp.history.length ? '<span class="badge">' + comp.history.length + ' season' +
            (comp.history.length > 1 ? 's' : '') + ' archived</span>' : '') +
          (comp.host && map[comp.host.id]
            ? '<span class="badge badge-accent" title="The hosts have a place waiting">Hosts: ' +
              esc(map[comp.host.id].name) + '</span>' : '') + feedsBadges(comp) +
        '</div>' +
        '<div style="margin:14px 0 6px" class="progress"><i style="width:' + prog.pct + '%"></i></div>' +
        '<div class="small muted" style="margin-bottom:14px">' +
          (s.complete ? 'Season complete' :
            s.stage === 'qual' ? 'Qualifying — round ' + (s.round + 1) :
            s.stage === 'finals' ? 'Finals series' :
            s.stage === 'ko' ? 'Knockout stage' :
            'Matchday ' + Math.min(s.round + 1, prog.mds) + ' of ' + prog.mds) +
          ' · ' + prog.played + ' of ' + prog.total + ' matches played</div>' +
        simButtons(comp) +
      '</div></div>';

    var mini = '';
    if (comp.format !== 'cup') {
      var shown = table.length > 12 ? table.slice(0, 6).concat([null]).concat(table.slice(-3)) : table;
      mini =
      '<div class="card">' +
        '<div class="card-head"><h2>Standings</h2>' +
          '<button class="btn btn-sm" data-act="go" data-view="table">Full table</button></div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
          '<th class="l" style="width:34px">#</th><th class="l">Team</th><th>P</th><th>' +
          forAgainst(sportOf(comp))[2] + '</th>' +
          '<th class="strong">' + (comp.settings.rankBy === 'winpct' ? 'Win%' : 'Pts') + '</th>' +
          '<th class="l" style="padding-left:14px">Form</th>' +
        '</tr></thead><tbody>' +
        shown.map(function (r) {
          if (!r) return '<tr><td colspan="6" class="center muted tiny" style="padding:3px">· · ·</td></tr>';
          return '<tr class="' + zoneClass(comp, r.pos) + ' clickable" data-act="team" data-id="' + r.id + '">' +
            '<td class="pos l">' + r.pos + '</td>' +
            '<td class="l">' + teamCell(r.team) + '</td>' +
            '<td>' + r.p + '</td><td>' + signed(r.gd) + '</td>' +
            '<td class="strong">' + (comp.settings.rankBy === 'winpct' ? winPctStr(r.winPct) : r.pts) + '</td>' +
            '<td class="l" style="padding-left:14px">' + formRun(r.form) + '</td></tr>';
        }).join('') +
        '</tbody></table></div>' + zoneKey(comp) +
      '</div>';
    }

    var lastRound = s.round > 0 ? s.round - 1 : 0;
    var recent = s.matches.filter(function (m) { return m.played && m.md === lastRound; });
    if (!recent.length) recent = s.matches.filter(function (m) { return m.played; }).slice(-8);
    var results =
      '<div class="card">' +
        '<div class="card-head"><h2>Latest results</h2>' +
          '<button class="btn btn-sm" data-act="go" data-view="fixtures">All fixtures</button></div>' +
        (recent.length ?
          '<div>' + recent.slice(0, 10).map(function (m) { return fixtureRow(m, map, comp); }).join('') + '</div>' :
          '<div class="card-body"><p class="small muted" style="margin:0">No matches played yet — hit ' +
          '“Play matchday” to get the season going.</p></div>') +
      '</div>';

    var race = '';
    if (comp.format !== 'cup' && prog.played > 0) {
      var ph = E.positionHistory(comp.teams, s.matches, comp.settings);
      var top = table.slice(0, 5);
      var series = top.map(function (r, i) {
        return {
          id: r.id, name: r.team.abbr, color: PALETTE[i % PALETTE.length],
          points: ph.series[r.id].map(function (p) { return { x: p.md, y: p.pts }; })
        };
      });
      race =
        '<div class="card"><div class="card-head"><h2>Points race</h2>' +
        '<span class="badge">Top 5</span></div><div class="card-body">' +
        lineChart(series, { height: 230, yMin: 0, label: 'Points by matchday' }) +
        chartLegend(series, null) + '</div></div>';
    }

    var scorerCard =
      '<div class="card">' +
        '<div class="card-head"><h2>Leading scorers</h2>' +
          (isWorldCup(comp) ? '<span class="badge">' + esc(phaseLabel(phase)) + '</span>' : '') +
          '<button class="btn btn-sm" data-act="go" data-view="stats">All stats</button></div>' +
        (scorers.length ?
          '<div class="table-wrap"><table class="data"><tbody>' + scorers.map(function (x, i) {
            return '<tr><td class="pos l">' + (i + 1) + '</td>' +
              '<td class="l"><span class="team-cell">' + kit(x.t) +
              '<span><span class="strong">' + esc(x.p.name) + '</span> ' +
              '<span class="tiny muted">' + esc(x.t.abbr) + ' · ' + x.p.pos + '</span></span></span></td>' +
              '<td class="strong">' + x.g + '</td>' +
              '<td class="muted small">' + x.a + ' ast</td></tr>';
          }).join('') + '</tbody></table></div>' :
          '<div class="card-body"><p class="small muted" style="margin:0">No goals scored yet.</p></div>') +
      '</div>';

    var recordCard = biggest ? '<div class="card"><div class="card-head"><h3>Biggest win so far</h3></div>' +
      '<div>' + fixtureRow(biggest.m, map) + '</div></div>' : '';

    var middle = comp.format === 'cup'
      ? bracketCard(comp) + '<div class="grid grid-2">' + results + recordCard + '</div>'
      : '<div class="grid grid-2">' + mini + '<div class="stack">' + results + recordCard + '</div></div>';

    var finals = hasFinals(comp) ? finalsCard(comp) : '';

    if (isWorldCup(comp) && s.stage === 'qual') {
      return '<div class="stack">' + head + tourNudge() + tiles + storyCard(comp) +
        (CT && CT.isCont(comp) ? contFieldCard(comp) : '') + treatmentCard(comp) + qualifyingCard(comp) + '</div>';
    }

    var ladder = comp.rankings ? rankingsCard(comp, 10, true) : '';

    return '<div class="stack">' + head + tourNudge() + championBanner(comp) + tiles + storyCard(comp) + finals +
      (CT && CT.isCont(comp) ? contFieldCard(comp) : isWorldCup(comp) ? heldPlacesCard(comp) + qualifiedSummary(comp) : '') +
      middle + treatmentCard(comp) + race +
      '<div class="grid grid-2">' + scorerCard + honoursMini(comp) + '</div>' +
      managerBattleCard(comp) + storylinesCard(comp) + ladder +
      '</div>';
  }

  function tile(k, v, s) {
    return '<div class="stat-tile"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  }

  function formatLabel(comp) {
    var sp = sportOf(comp);
    var f = comp.format === 'cup' ? 'Knockout cup'
      : comp.continental ? (comp.continental.qualify ? 'Qualifying, then groups + knockout' : 'Continental cup \u00b7 groups + knockout')
      : comp.format === 'worldcup' ? 'Qualifying + World Cup'
      : comp.format === 'groups' ? 'Groups + knockout'
      : comp.settings.doubleRound ? 'Home & away league' : 'Single round league';
    return sp.icon + ' ' + f;
  }

  // `comp` is optional: pass it where a rivalry badge is worth the space.
  function fixtureRow(m, map, comp) {
    var h = map[m.h], a = map[m.a];
    var hw = m.played && m.hg > m.ag, aw = m.played && m.ag > m.hg;
    var score = m.played
      ? '<span class="score">' + m.hg + ' – ' + m.ag + '</span>'
      : '<span class="score pending">v</span>';
    var note = m.pens ? 'pens ' + m.pens[0] + '–' + m.pens[1] : (m.ot ? 'after overtime' : '');
    var pens = note ? '<div class="tiny muted center">' + note + '</div>' : '';
    var rival = comp ? rivalBadge(comp, m) : '';
    if (rival) rival = '<div class="center" style="margin-top:3px">' + rival + '</div>';
    return '<div class="fixture" data-act="match" data-id="' + esc(m.id) + '">' +
      '<div class="home ' + (hw ? 'win' : m.played ? 'lose' : '') + '">' + esc(h ? h.name : '?') + kit(h) + '</div>' +
      '<div>' + score + pens + rival + '</div>' +
      '<div class="away ' + (aw ? 'win' : m.played ? 'lose' : '') + '">' + kit(a) + esc(a ? a.name : '?') + '</div>' +
      '</div>';
  }

  function honoursMini(comp) {
    if (!comp.history.length) {
      return '<div class="card"><div class="card-head"><h2>History</h2></div><div class="card-body">' +
        '<p class="small muted" style="margin:0">Finish this season and it gets archived here — champions, ' +
        'final tables, scorers and every result stay searchable for as long as the competition runs.</p></div></div>';
    }
    var rows = comp.history.slice().reverse().slice(0, 6);
    return '<div class="card"><div class="card-head"><h2>Past seasons</h2>' +
      '<button class="btn btn-sm" data-act="go-records">Records</button>' +
      '<button class="btn btn-sm" data-act="go" data-view="history">Full history</button></div>' +
      '<div>' + rows.map(function (rec) {
        var champ = comp.teams[rec.champion];
        return '<div class="season-row" data-act="season" data-n="' + rec.n + '">' +
          '<span class="sn">S' + rec.n + '</span>' +
          '<span class="team-cell">' + kit(champ) + '<span class="strong">' +
          esc(champ ? champ.name : rec.names[rec.champion] || '—') + '</span></span>' +
          '<span class="tiny muted nowrap">' + (rec.awards.topScorer ?
            esc(rec.awards.topScorer.n) + ' · ' + rec.awards.topScorer.g + 'g' : '') + '</span></div>';
      }).join('') + '</div></div>';
  }

  /* ----------------------------------------------------------- table view */

  function viewTable(comp) {
    var ui = app.ui, s = comp.season;
    var mds = E.matchdaysOf(s);
    var upto = ui.tableUpto;

    if (comp.format === 'cup') {
      return '<div class="stack">' + bracketCard(comp) + '</div>';
    }

    if (isWorldCup(comp) && s.stage === 'qual') {
      return qualifyingCard(comp);
    }

    if ((comp.format === 'groups' || comp.format === 'worldcup') && s.groups) {
      var map = E.teamsById(comp);
      var thirds = comp.settings.qualifyBestThirds || 0;
      var cards = s.groups.map(function (g, gi) {
        var gTeams = g.map(function (id) { return map[id]; });
        var t = E.computeTable(gTeams, s.matches, comp.settings, function (m) {
          return m.stage === 'group' && m.group === gi;
        });
        return '<div class="card"><div class="card-head"><h3>Group ' + String.fromCharCode(65 + gi) + '</h3>' +
          '<span class="badge">Top ' + (comp.settings.qualifyPerGroup || 2) + ' advance' +
          (thirds ? ' + best thirds' : '') + '</span></div>' +
          standingsTable(comp, t, { compact: true, qualify: comp.settings.qualifyPerGroup || 2 }) + '</div>';
      }).join('');
      return '<div class="stack">' +
        (isWorldCup(comp) ? qualifiedSummary(comp) : '') +
        '<div class="grid grid-2">' + cards + '</div>' +
        (s.stage === 'ko' || s.complete ? bracketCard(comp) : '') +
        (isWorldCup(comp) ? '<div class="card"><div class="card-head"><h2>How they qualified</h2></div></div>' +
          qualifyingCard(comp) : '') +
      '</div>';
    }

    var filter = null;
    if (upto != null) filter = function (m) { return m.md <= upto; };
    var table = E.computeTable(comp.teams, s.matches, comp.settings, filter);

    var mdOptions = '<option value="">Full season so far</option>';
    for (var i = 0; i < mds; i++) {
      mdOptions += '<option value="' + i + '"' + (upto === i ? ' selected' : '') + '>After matchday ' + (i + 1) + '</option>';
    }

    var controls =
      '<div class="card-head">' +
        '<h2>' + esc(comp.name) + ' table</h2>' +
        '<div class="seg">' +
          ['overall', 'home', 'away', 'form'].map(function (m) {
            return '<button data-act="table-mode" data-mode="' + m + '" aria-pressed="' +
              (ui.tableMode === m) + '">' + m.charAt(0).toUpperCase() + m.slice(1) + '</button>';
          }).join('') +
        '</div>' +
        '<select id="tableUpto" data-act="table-upto" style="width:auto;min-width:170px">' + mdOptions + '</select>' +
      '</div>';

    var body;
    if (ui.tableMode === 'home' || ui.tableMode === 'away') {
      body = splitTable(comp, table, ui.tableMode);
    } else if (ui.tableMode === 'form') {
      body = formTable(comp, s, mds);
    } else {
      body = standingsTable(comp, table, {}) + zoneKey(comp);
    }
    return '<div class="stack"><div class="card">' + controls + body + '</div>' +
      (hasFinals(comp) ? finalsCard(comp) : '') + tableExtras(comp, table) + '</div>';
  }

  function winPctStr(v) { return ('.' + String(Math.round(v * 1000)).padStart(3, '0')); }

  function standingsTable(comp, table, opts) {
    opts = opts || {};
    var sp = sportOf(comp);
    var fa = forAgainst(sp);
    var ot = hasOtPoints(comp);
    var byPct = comp.settings.rankBy === 'winpct';

    var head = '<th class="l stick" style="width:34px">#</th><th class="l stick">Team</th>' +
      '<th>P</th><th class="col-hide-sm">W</th>' +
      (sp.draws ? '<th class="col-hide-sm">D</th>' : '') + '<th class="col-hide-sm">L</th>' +
      (ot ? '<th class="col-hide-sm" title="Overtime wins">OTW</th>' +
            '<th class="col-hide-sm" title="Overtime losses">OTL</th>' : '') +
      '<th class="col-hide-sm">' + fa[0] + '</th><th class="col-hide-sm">' + fa[1] + '</th>' +
      '<th>' + fa[2] + '</th>' +
      (byPct ? '<th class="strong">Win%</th>' : '<th class="strong">Pts</th>') +
      (opts.compact ? '' : '<th class="col-hide-sm">' + (byPct ? fa[2] + '/g' : 'PPG') + '</th>') +
      '<th class="l" style="padding-left:12px">Form</th>';

    return '<div class="table-wrap"><table class="data sticky-team"><thead><tr>' + head +
      '</tr></thead><tbody>' +
      table.map(function (r) {
        var cls = opts.through ? (opts.through[r.id] ? 'z-ucl' : '')
          : opts.qualify ? (r.pos <= opts.qualify ? 'z-ucl' : '') : zoneClass(comp, r.pos);
        return '<tr class="' + cls + ' clickable" data-act="team" data-id="' + r.id + '">' +
          '<td class="pos l stick">' + r.pos + '</td>' +
          '<td class="l stick">' + teamCell(r.team) + managerBadge(comp, r.id) + '</td>' +
          '<td>' + r.p + '</td><td class="col-hide-sm">' + r.w + '</td>' +
          (sp.draws ? '<td class="col-hide-sm">' + r.d + '</td>' : '') +
          '<td class="col-hide-sm">' + r.l + '</td>' +
          (ot ? '<td class="muted col-hide-sm">' + r.otw + '</td>' +
                '<td class="muted col-hide-sm">' + r.otl + '</td>' : '') +
          '<td class="col-hide-sm">' + r.gf + '</td><td class="col-hide-sm">' + r.ga + '</td>' +
          '<td>' + signed(r.gd) + '</td>' +
          (byPct ? '<td class="strong">' + winPctStr(r.winPct) + '</td>'
                 : '<td class="strong">' + r.pts + '</td>') +
          (opts.compact ? '' : '<td class="muted col-hide-sm">' +
            (byPct ? (r.p ? signed(Math.round(r.gd / r.p * 10) / 10) : '0') : r.ppg.toFixed(2)) + '</td>') +
          '<td class="l" style="padding-left:12px">' + formRun(r.form) + '</td></tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  function splitTable(comp, table, side) {
    var sorted = table.slice().sort(function (x, y) {
      var a = x[side], b = y[side];
      return b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    });
    return '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th class="l" style="width:34px">#</th><th class="l">Team</th>' +
      '<th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th class="strong">Pts</th>' +
      '</tr></thead><tbody>' +
      sorted.map(function (r, i) {
        var d = r[side];
        return '<tr class="clickable" data-act="team" data-id="' + r.id + '">' +
          '<td class="pos l">' + (i + 1) + '</td><td class="l">' + teamCell(r.team) + '</td>' +
          '<td>' + d.p + '</td><td>' + d.w + '</td><td>' + d.d + '</td><td>' + d.l + '</td>' +
          '<td>' + d.gf + '</td><td>' + d.ga + '</td><td>' + signed(d.gf - d.ga) + '</td>' +
          '<td class="strong">' + d.pts + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="zone-key">Ranked by ' + side + ' record only.</div>';
  }

  function formTable(comp, s, mds) {
    var window5 = Math.max(0, s.round - 5);
    var t = E.computeTable(comp.teams, s.matches, comp.settings, function (m) { return m.md >= window5; });
    return '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th class="l" style="width:34px">#</th><th class="l">Team</th><th>P</th><th>W</th><th>D</th><th>L</th>' +
      '<th>GD</th><th class="strong">Pts</th><th class="l" style="padding-left:14px">Run</th>' +
      '</tr></thead><tbody>' +
      t.map(function (r) {
        return '<tr class="clickable" data-act="team" data-id="' + r.id + '">' +
          '<td class="pos l">' + r.pos + '</td><td class="l">' + teamCell(r.team) + '</td>' +
          '<td>' + r.p + '</td><td>' + r.w + '</td><td>' + r.d + '</td><td>' + r.l + '</td>' +
          '<td>' + signed(r.gd) + '</td><td class="strong">' + r.pts + '</td>' +
          '<td class="l" style="padding-left:14px">' + formRun(r.form) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="zone-key">Form table — the last five matchdays only.</div>';
  }

  function tableExtras(comp, table) {
    if (!table.length || !table[0].p) return '';
    var att = table.slice().sort(function (x, y) { return y.gf - x.gf; }).slice(0, 6);
    var def = table.slice().sort(function (x, y) { return x.ga - y.ga; }).slice(0, 6);
    return '<div class="grid grid-2">' +
      '<div class="card"><div class="card-head"><h3>Best attack</h3></div><div class="card-body">' +
        barList(att.map(function (r) { return { label: r.team.abbr, value: r.gf, color: r.team.c1 }; })) +
      '</div></div>' +
      '<div class="card"><div class="card-head"><h3>Meanest defence</h3></div><div class="card-body">' +
        barList(def.map(function (r) { return { label: r.team.abbr, value: r.ga, color: r.team.c1 }; })) +
      '</div></div>' +
    '</div>';
  }

  /* -------------------------------------------------------- fixtures view */

  function viewFixtures(comp) {
    var s = comp.season, ui = app.ui, map = E.teamsById(comp);
    var mds = E.matchdaysOf(s);
    var md = E.clamp(ui.md, 0, Math.max(0, mds - 1));

    var teamOpts = '<option value="">Every team</option>' + comp.teams.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name);
    }).map(function (t) {
      return '<option value="' + t.id + '"' + (ui.fixtureTeam === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>';
    }).join('');

    var list, headExtra = '';
    if (ui.fixtureTeam) {
      var team = map[ui.fixtureTeam];
      list = s.matches.filter(function (m) { return m.h === ui.fixtureTeam || m.a === ui.fixtureTeam; });
      headExtra = '<span class="badge">' + esc(team ? team.name : '') + ' · ' + list.length + ' matches</span>';
      list = '<div>' + list.map(function (m) {
        return fixtureRow(m, map, comp).replace('<div class="fixture"',
          '<div class="fixture" data-md="' + m.md + '"');
      }).join('') + '</div>';
    } else {
      var todays = s.matches.filter(function (m) { return m.md === md; });
      var label = !todays.length ? 'Matchday ' + (md + 1)
        : todays[0].stage === 'finals' ? (todays[0].weekLabel || todays[0].round)
        : todays[0].stage === 'ko' ? todays[0].round
        : todays[0].stage === 'qual' ? 'Qualifying round ' + (md + 1)
        : 'Matchday ' + (md + 1);
      var mdOpts = '';
      for (var i = 0; i < mds; i++) {
        var any = s.matches.filter(function (m) { return m.md === i; })[0];
        var nm = !any ? 'Matchday ' + (i + 1)
          : any.stage === 'finals' ? (any.weekLabel || any.round)
          : any.stage === 'ko' ? any.round
          : any.stage === 'qual' ? 'Qualifying round ' + (i + 1)
          : 'Matchday ' + (i + 1);
        mdOpts += '<option value="' + i + '"' + (i === md ? ' selected' : '') + '>' + esc(nm) + '</option>';
      }
      headExtra = '<div class="md-nav">' +
        '<button class="icon-btn" data-act="md" data-d="-1"' + (md === 0 ? ' disabled' : '') + '>‹</button>' +
        '<select id="mdSelect" data-act="md-pick">' + mdOpts + '</select>' +
        '<button class="icon-btn" data-act="md" data-d="1"' + (md >= mds - 1 ? ' disabled' : '') + '>›</button>' +
        '</div>';
      list = '<div>' + todays.map(function (m) { return fixtureRow(m, map, comp); }).join('') + '</div>';
      if (!todays.length) list = '<div class="card-body"><p class="muted small" style="margin:0">Nothing scheduled.</p></div>';
      headExtra = '<span class="badge">' + esc(label) + '</span>' + headExtra;
    }

    var unplayedHere = s.matches.filter(function (m) { return m.md === md && !m.played; }).length;

    return '<div class="stack">' +
      '<div class="card">' +
        '<div class="card-head"><h2>Fixtures &amp; results</h2>' + headExtra +
          '<select data-act="fixture-team" style="width:auto;min-width:150px">' + teamOpts + '</select>' +
        '</div>' + list +
        (unplayedHere && !ui.fixtureTeam && md === s.round ?
          '<div class="card-body" style="border-top:1px solid var(--border-soft)">' + simButtons(comp) + '</div>' : '') +
      '</div>' +
      resultsGrid(comp) +
    '</div>';
  }

  // Classic results grid: every team against every team.
  function resultsGrid(comp) {
    if (comp.format === 'cup' || comp.teams.length > 24) return '';
    var s = comp.season;
    var grid = {};
    s.matches.forEach(function (m) {
      if (!m.played || m.stage === 'ko' || m.stage === 'finals' || m.stage === 'qual') return;
      grid[m.h + '|' + m.a] = m.hg + '–' + m.ag;
    });
    if (!Object.keys(grid).length) return '';
    var teams = liveTable(comp).map(function (r) { return r.team; });
    return '<div class="card"><div class="card-head"><h3>Results grid</h3>' +
      '<span class="badge">Home across, away down</span></div>' +
      '<div class="table-wrap"><table class="data sticky-team"><thead><tr>' +
      '<th class="l stick">Home \\ Away</th>' +
      teams.map(function (t) { return '<th title="' + esc(t.name) + '">' + esc(t.abbr) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      teams.map(function (h) {
        return '<tr><td class="l stick">' + teamCell(h, { abbr: true }) + '</td>' +
          teams.map(function (a) {
            if (h.id === a.id) return '<td style="background:var(--surface-3)"></td>';
            var v = grid[h.id + '|' + a.id];
            return '<td class="' + (v ? 'mono' : 'muted') + '" style="font-size:.78rem">' + (v || '·') + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  /* ------------------------------------------------------------- bracket */

  function bracketCard(comp) {
    var s = comp.season, map = E.teamsById(comp);
    var ko = s.matches.filter(function (m) { return m.stage === 'ko'; });
    if (!ko.length) {
      return '<div class="card"><div class="card-head"><h2>Knockout bracket</h2></div><div class="card-body">' +
        '<p class="small muted" style="margin:0">The bracket appears once the group stage is done.</p></div></div>';
    }
    var byMd = {};
    ko.forEach(function (m) { (byMd[m.md] = byMd[m.md] || []).push(m); });
    var rounds = Object.keys(byMd).map(Number).sort(function (a, b) { return a - b; });

    var cols = rounds.map(function (md) {
      var ms = byMd[md];
      var ties = {};
      ms.forEach(function (m) { (ties[m.tie] = ties[m.tie] || []).push(m); });
      var name = ms[0].round;
      return '<div class="bracket-round"><div class="rn">' + esc(name) + '</div>' +
        '<div class="bracket-ties">' + Object.keys(ties).map(function (tk) {
          var legs = ties[tk], first = legs[0];
          var hId = legs.length > 1 ? legs[1].h : first.h;
          var aId = legs.length > 1 ? legs[1].a : first.a;
          var agg = {}; agg[hId] = 0; agg[aId] = 0;
          var anyPlayed = false;
          legs.forEach(function (m) {
            if (!m.played) return;
            anyPlayed = true;
            agg[m.h] += m.hg; agg[m.a] += m.ag;
          });
          var winner = legs[legs.length - 1].tieWinner;
          function row(id) {
            var t = map[id];
            var cls = !winner ? '' : (winner === id ? 'won' : 'out');
            return '<div class="tie-row ' + cls + '">' + kit(t) + '<span>' + esc(t ? t.abbr : '?') + '</span>' +
              '<span class="g">' + (anyPlayed ? agg[id] : '–') + '</span>' +
              (winner === id ? '<span class="tiny" style="color:var(--accent)">✓</span>' : '') + '</div>';
          }
          var pens = legs[legs.length - 1].pens;
          return '<div class="tie" data-act="match" data-id="' + esc(legs[legs.length - 1].id) + '" style="cursor:pointer">' +
            row(hId) + row(aId) +
            (pens ? '<div class="tie-row tiny muted">pens ' + pens[0] + '–' + pens[1] + '</div>' : '') +
            '</div>';
        }).join('') + '</div></div>';
    }).join('');

    var champ = s.complete ? map[s.champion] : null;
    return '<div class="card"><div class="card-head"><h2>Knockout bracket</h2>' +
      (champ ? '<span class="badge badge-amber">🏆 ' + esc(champ.name) + '</span>' : '') +
