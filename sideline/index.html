<title>Sideline</title>
<style>
/* Sideline — design system */

/* Light is the base palette; dark applies both from the viewer's OS setting
   (unless they explicitly chose light) and from an explicit dark choice. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --surface-3: #eef2f7;
  --border: #e2e8f0;
  --border-soft: #edf1f6;
  --text: #0f172a;
  --text-2: #475569;
  --muted: #7c8ca1;
  --accent: #059669;
  --accent-ink: #ffffff;
  --accent-soft: rgba(5, 150, 105, .1);
  --blue: #2563eb;
  --amber: #d97706;
  --red: #dc2626;
  --violet: #7c3aed;
  --z-title: #d97706;
  --z-ucl: #2563eb;
  --z-uel: #059669;
  --z-rel: #dc2626;
  --shadow: 0 1px 2px rgba(15,23,42,.05), 0 8px 24px -14px rgba(15,23,42,.2);
  --radius: 14px;
  --radius-sm: 9px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e14;
    --surface: #111823;
    --surface-2: #161f2c;
    --surface-3: #1c2735;
    --border: #212d3d;
    --border-soft: #1a2532;
    --text: #e8eef6;
    --text-2: #a8b6c8;
    --muted: #6b7c92;
    --accent: #34d399;
    --accent-ink: #052e20;
    --accent-soft: rgba(52, 211, 153, .13);
    --blue: #60a5fa;
    --amber: #fbbf24;
    --red: #f87171;
    --violet: #a78bfa;
    --z-title: #fbbf24;
    --z-ucl: #60a5fa;
    --z-uel: #34d399;
    --z-rel: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    --radius: 14px;
    --radius-sm: 9px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
}

:root[data-theme="dark"] {
  --bg: #0a0e14;
  --surface: #111823;
  --surface-2: #161f2c;
  --surface-3: #1c2735;
  --border: #212d3d;
  --border-soft: #1a2532;
  --text: #e8eef6;
  --text-2: #a8b6c8;
  --muted: #6b7c92;
  --accent: #34d399;
  --accent-ink: #052e20;
  --accent-soft: rgba(52, 211, 153, .13);
  --blue: #60a5fa;
  --amber: #fbbf24;
  --red: #f87171;
  --violet: #a78bfa;
  --z-title: #fbbf24;
  --z-ucl: #60a5fa;
  --z-uel: #34d399;
  --z-rel: #f87171;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --radius: 14px;
  --radius-sm: 9px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

body { min-height: 100vh; }

h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.014em; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: .95rem; }
p { margin: 0 0 .7em; color: var(--text-2); }
a { color: var(--accent); }

.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ app frame */

.app { max-width: 1180px; margin: 0 auto; padding: 0 18px 80px; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid var(--border-soft);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: 12px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand {
  display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.03em;
  font-size: 1.06rem; background: none; border: 0; padding: 4px 6px 4px 0; color: var(--text);
  cursor: pointer; font-family: inherit; min-height: 36px; border-radius: var(--radius-sm);
}
.brand:hover .brand-name { color: var(--accent); }
.brand-mark {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--accent), var(--blue));
  color: var(--accent-ink); font-size: 14px; font-weight: 800;
}
.topbar-spacer { flex: 1 1 auto; }

.comp-switch {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 5px 4px 13px;
}
.comp-switch .season-pill {
  background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 2px 9px; font-size: .74rem; font-weight: 700;
  letter-spacing: .02em; white-space: nowrap;
}
.comp-switch select {
  background: none; border: 0; color: var(--text); font: inherit;
  font-weight: 600; max-width: 190px; padding: 3px 4px; cursor: pointer;
}
.comp-switch select:focus { outline: none; }

/* ------------------------------------------------------------------ nav */

/* the attribute has to beat the layout rules below it */
[hidden] { display: none !important; }

.tabs {
  display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--border-soft); margin-bottom: 22px;
  position: sticky; top: 55px; z-index: 30;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer;
  color: var(--muted); font: inherit; font-weight: 600; font-size: .89rem;
  padding: 12px 13px 11px; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s;
}
.tab:hover { color: var(--text-2); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

/* --------------------------------------------------------------- pieces */

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.card-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 14px 16px; border-bottom: 1px solid var(--border-soft);
  min-width: 0;
}
.card-head > * { min-width: 0; }
.card-head h2, .card-head h3 { margin-right: auto; }
.card-body { padding: 16px; }
.card-body.flush { padding: 0; }

.grid { display: grid; gap: 16px; }
/* Grid and flex items default to min-width:auto, so one wide table stretches the
   whole page instead of scrolling inside its own container. */
.grid > *, .stack > * { min-width: 0; }
.card { min-width: 0; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.stack { display: grid; gap: 16px; min-width: 0; }

.section-title {
  font-size: .74rem; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}

.muted { color: var(--muted); }
.dim { color: var(--text-2); }
.small { font-size: .82rem; }
.tiny { font-size: .74rem; }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }

/* -------------------------------------------------------------- buttons */

.btn {
  appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: .87rem;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 14px; display: inline-flex; align-items: center; gap: 7px;
  transition: background .14s, border-color .14s, transform .05s;
}
.btn:hover { background: var(--surface-3); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:disabled:hover { background: var(--surface-2); border-color: var(--border); }
.btn-primary {
  background: var(--accent); color: var(--accent-ink); border-color: transparent;
}
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 86%, #fff); border-color: transparent; }
.btn-ghost { background: none; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--border); }
.btn-danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.btn-danger:hover { background: color-mix(in srgb, var(--red) 12%, transparent); border-color: var(--red); }
.btn-sm { padding: 5px 10px; font-size: .8rem; }
.btn-lg { padding: 11px 20px; font-size: .95rem; }
.btn-row { display: flex; gap: 9px; flex-wrap: wrap; }
.icon-btn {
  appearance: none; cursor: pointer; background: var(--surface); color: var(--text-2);
  border: 1px solid var(--border); border-radius: 999px;
  width: 34px; height: 34px; display: grid; place-items: center; font-size: 15px;
}
.icon-btn:hover { color: var(--text); background: var(--surface-2); }

/* --------------------------------------------------------------- inputs */

label.field { display: block; margin-bottom: 14px; }
label.field > span.lbl {
  display: block; font-size: .78rem; font-weight: 650; color: var(--text-2);
  margin-bottom: 5px; letter-spacing: .01em;
}
label.field > span.hint { display: block; font-size: .75rem; color: var(--muted); margin-top: 4px; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; font: inherit; font-size: .88rem;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 11px;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="color"] {
  width: 34px; height: 30px; padding: 2px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface-2); cursor: pointer;
}
.check { display: flex; align-items: center; gap: 9px; font-size: .87rem; cursor: pointer; margin-bottom: 10px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button {
  appearance: none; background: none; border: 0; cursor: pointer; font: inherit;
  font-size: .8rem; font-weight: 600; color: var(--muted);
  padding: 5px 13px; border-radius: 999px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* --------------------------------------------------------------- tables */

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
table.data { width: 100%; border-collapse: collapse; font-size: .87rem; }
table.data th {
  text-align: right; font-size: .7rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--muted);
  padding: 9px 7px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
table.data th.l, table.data td.l { text-align: left; }
table.data td {
  padding: 9px 7px; text-align: right; border-bottom: 1px solid var(--border-soft);
  font-variant-numeric: tabular-nums;
}
table.data tbody tr:last-child td { border-bottom: 0; }
/* score-shaped cells and column headings never break mid-value */
table.data th, table.data td.mono, table.data td.nowrap { white-space: nowrap; }
/* sortable column headings */
table.data th.sortable { cursor: pointer; user-select: none; }
table.data th.sortable::after {
  content: '\2195'; margin-left: 4px; font-size: .9em; opacity: .22;
  font-weight: 400; letter-spacing: 0;
}
table.data th.sortable:hover { color: var(--text-2); }
table.data th.sortable:hover::after { opacity: .55; }
table.data th.sortable.sorted { color: var(--accent); }
table.data th.sortable.sorted::after { content: '\2191'; opacity: 1; }
table.data th.sortable.sorted.desc::after { content: '\2193'; }
table.data th.sortable:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--radius-sm);
}

/* the phone picker reaches columns that are hidden at that width */
.sort-bar { display: none; align-items: center; gap: 8px; padding: 0 14px 10px; }
.sort-bar select { width: auto; flex: 1; min-width: 0; min-height: 38px; }
.sort-bar .btn { min-width: 42px; min-height: 38px; padding-left: 0; padding-right: 0; font-size: 1rem; }
.sort-bar .btn:disabled { opacity: .45; cursor: default; }

table.data tbody tr.clickable { cursor: pointer; }
table.data tbody tr.clickable:hover { background: var(--surface-2); }
table.data td.pos { width: 34px; color: var(--muted); font-weight: 600; }
table.data td.strong, table.data th.strong { font-weight: 700; color: var(--text); }
.team-cell { display: inline-flex; align-items: center; gap: 9px; vertical-align: middle; }
table.data .team-cell { display: flex; min-width: 150px; }
.t-abbr { display: none; }

.rank-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.rank-name .team-cell { min-width: 0; }

/* home page */
.hero { background:
  linear-gradient(160deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 62%),
  var(--surface); }
.hero .card-body { padding: 30px 26px 26px; }
.hero-mark { font-size: 2.1rem; line-height: 1; margin-bottom: 10px; }
.hero h1 { font-size: 2rem; letter-spacing: -.045em; }
.hero-lead { font-size: 1.02rem; color: var(--text-2); max-width: 62ch; margin: 0; line-height: 1.55; }
.step { min-width: 0; }
.step-n {
  width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: .82rem;
  margin-bottom: 9px;
}
.step-h { font-weight: 700; }
.feature { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.feature-i { font-size: 1.25rem; line-height: 1.3; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin-bottom: 6px; }
ul.plain li:last-child { margin-bottom: 0; }
.home table.data td { border-bottom: 1px solid var(--border-soft); padding: 11px 14px; }
.home table.data tbody tr:last-child td { border-bottom: 0; }

/* ranking movement */
.move { font-weight: 700; font-size: .78rem; font-variant-numeric: tabular-nums; }
.move.up { color: var(--accent); }
.move.down { color: var(--red); }
/* a price that has moved since it was taken */
table.data td.up { color: var(--accent); }
table.data td.down { color: var(--red); }

/* zone stripes */
tr.z-title td.pos { box-shadow: inset 3px 0 0 var(--z-title); }
tr.z-ucl td.pos { box-shadow: inset 3px 0 0 var(--z-ucl); }
tr.z-uel td.pos { box-shadow: inset 3px 0 0 var(--z-uel); }
tr.z-rel td.pos { box-shadow: inset 3px 0 0 var(--z-rel); }

.zone-key { display: flex; gap: 14px; flex-wrap: wrap; padding: 11px 16px; border-top: 1px solid var(--border-soft); font-size: .75rem; color: var(--muted); }
.zone-key span { display: inline-flex; align-items: center; gap: 6px; }
.zone-key i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

/* ---------------------------------------------------------------- kits */

.kit {
  display: inline-block; vertical-align: middle;
  width: 20px; height: 20px; border-radius: 5px; flex: 0 0 auto;
  position: relative; overflow: hidden; border: 1px solid rgba(128,128,128,.28);
}
.kit i { position: absolute; inset: 0 50% 0 0; }
.kit b { position: absolute; inset: 0 0 0 50%; }
.kit-lg { width: 30px; height: 30px; border-radius: 8px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .7rem; font-weight: 700; letter-spacing: .04em;
  padding: 2px 8px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-2);
}
.badge-accent { background: var(--accent-soft); color: var(--accent); }
.badge-amber { background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
.badge-blue { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
.badge-red { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.mgr-badge { font-weight: 800; }

/* --------------------------------------------------------- manager mode */

.mgr-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border-soft); flex-wrap: wrap;
}
.mgr-row:last-of-type { border-bottom: 0; }
.mgr-row select { max-width: 220px; }
.mgr-dot { width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto; }
.mgr-draft-live {
  margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border-soft);
}

/* --------------------------------------------------------- season recap */

/* the recap is its own fixed-palette poster, not themed to the app, so it
   looks the same shared out of context as it does on screen */
.recap-frame {
  border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
  box-shadow: var(--shadow); max-width: 100%;
}
.recap-frame svg { display: block; width: 100%; height: auto; }

@media print {
  body * { visibility: hidden; }
  .recap-print, .recap-print * { visibility: visible; }
  .recap-print {
    position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 0;
  }
  .recap-frame { border: 0; box-shadow: none; border-radius: 0; }
}

/* ---------------------------------------------------------------- form */

.form-run { display: inline-flex; gap: 3px; }
.form-dot {
  width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;
  font-size: .64rem; font-weight: 800; color: #fff;
}
.form-W { background: #16a34a; }
.form-D { background: #64748b; }
.form-L { background: #dc2626; }

/* --------------------------------------------------------------- stats */

.stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 15px; }
.stat-tile .k { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.stat-tile .v { font-size: 1.55rem; font-weight: 700; letter-spacing: -.03em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stat-tile .s { font-size: .8rem; color: var(--text-2); margin-top: 1px; }

.wager-tabs { margin-left: auto; }

.progress { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }

.bar-row { display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 10px; margin-bottom: 7px; font-size: .83rem; }
.bar { height: 20px; border-radius: 6px; background: var(--surface-3); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; }
.bar > em { position: absolute; left: 8px; top: 0; line-height: 20px; font-style: normal; font-size: .76rem; font-weight: 600; }

/* ------------------------------------------------------------- fixtures */

.fixture {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 10px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer;
}
.fixture:last-child { border-bottom: 0; }
.fixture:hover { background: var(--surface-2); }
.fixture .home { display: flex; align-items: center; gap: 9px; justify-content: flex-end; text-align: right; }
.fixture .away { display: flex; align-items: center; gap: 9px; }
.fixture .score {
  font-family: var(--mono); font-weight: 700; font-size: .95rem;
  background: var(--surface-3); border-radius: 7px; padding: 4px 11px; min-width: 58px; text-align: center;
}
.fixture .score.pending { color: var(--muted); font-weight: 500; background: transparent; border: 1px dashed var(--border); }
.fixture .win { font-weight: 700; }
.fixture .lose { color: var(--text-2); }

.md-nav { display: flex; align-items: center; gap: 8px; }
.md-nav select { width: auto; min-width: 150px; }

/* --------------------------------------------------------------- modal */

.modal-back {
  position: fixed; inset: 0; z-index: 100; background: rgba(3, 7, 12, .62);
  backdrop-filter: blur(3px); display: grid; place-items: center; padding: 18px;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 24px 60px -20px rgba(0,0,0,.7);
  width: min(620px, 100%); max-height: min(84vh, 760px); overflow: auto;
}
.modal-head { display: flex; align-items: center; gap: 10px; padding: 15px 17px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--surface); }
.modal-head h2 { margin-right: auto; }
.modal-body { padding: 17px; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 200; background: var(--surface-3); color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 9px 18px; font-size: .85rem; font-weight: 600;
  box-shadow: var(--shadow); animation: toast-in .22s ease-out;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } }

    <button class="brand" data-act="go-home" title="Home — how it all works" aria-label="Home">
      <span class="brand-mark">S</span><span class="brand-name">Sideline</span></button>
    <div class="comp-switch" id="compSwitch" hidden>
      <select id="compSelect" aria-label="Active competition"></select>
      <span class="season-pill" id="seasonPill">S1</span>
    </div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="tourBtn" data-act="tour-list" title="Tutorials" aria-label="Tutorials">?</button>
    <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">◐</button>
    <button class="btn btn-sm" id="newCompBtn">New</button>
  </div>
</header>

<main class="app">
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button class="tab" role="tab" data-view="home">Home</button>
    <button class="tab" role="tab" data-view="overview" aria-selected="true">Overview</button>
    <button class="tab" role="tab" data-view="table">Table</button>
    <button class="tab" role="tab" data-view="fixtures">Fixtures</button>
    <button class="tab" role="tab" data-view="stats">Stats</button>
    <button class="tab" role="tab" data-view="betting">Betting</button>
    <button class="tab" role="tab" data-view="history">History</button>
    <button class="tab" role="tab" data-view="teams">Teams</button>
    <button class="tab" role="tab" data-view="settings">Settings</button>
  </nav>
  <div id="view"></div>
</main>

<div id="toastRoot"></div>
