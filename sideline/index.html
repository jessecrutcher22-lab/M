    modal('Season ' + s.number + ' awards', body);
  }

  function showTeam(comp, id) {
    var map = E.teamsById(comp);
    var team = map[id];
    if (!team) return;
    var idx = comp.teams.indexOf(team);
    var live = liveTable(comp).filter(function (r) { return r.id === id; })[0];
    var all = S.allTimeTable(comp, false).filter(function (r) { return r.team.id === id; })[0];

    var seasonBlock = live && live.p ?
      '<div class="grid grid-3" style="margin-bottom:16px">' +
        tile('This season', live.pos + (live.pos === 1 ? 'st' : live.pos === 2 ? 'nd' : live.pos === 3 ? 'rd' : 'th'),
             live.pts + ' pts from ' + live.p) +
        tile(sportOf(comp).scoreWord, live.gf + ' – ' + live.ga, signed(live.gd) + ' difference') +
        '<div class="stat-tile"><div class="k">Form</div>' +
          '<div class="v" style="font-size:1rem">' + formRun(live.form) + '</div>' +
          '<div class="s">last five</div></div>' +
      '</div>' : '';

    // a nation's World Cup record: how often it gets there, and how long a run
    var runs = comp.format === 'worldcup' ? S.qualificationRuns(comp, true) : [];
    var mine = runs.filter(function (r) { return r.id === id; })[0];
    var qualBlock = mine && mine.editions ?
      '<div class="grid grid-3" style="margin-bottom:16px">' +
        tile('Editions reached', mine.apps + ' / ' + mine.editions,
             Math.round(mine.apps / mine.editions * 100) + '% of them') +
        tile('Longest run', mine.best + (mine.best === 1 ? ' edition' : ' in a row'),
             mine.best ? 'seasons ' + mine.bestFrom + '\u2013' + mine.bestTo : 'never qualified') +
        tile('Current run', mine.current || '\u2014',
             mine.current ? (mine.currentLive ? 'still running' : 'to season ' + mine.last)
                          : 'missed the last one') +
      '</div>' : '';

    var rankBlock = teamRankBlock(comp, id);

    var history = all && all.positions.length ?
      '<div class="section-title">Season by season</div>' +
      '<div class="table-wrap"><table class="data"><thead><tr><th class="l">Season</th><th>Finish</th>' +
      '<th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th class="strong">Pts</th>' +
      '</tr></thead><tbody>' +
      comp.history.slice().reverse().map(function (rec) {
        var r = null;
        rec.table.forEach(function (x) { if (x.t === idx) r = x; });
        if (!r) return '';
        var medal = r.pos === 1 ? ' 🏆' : r.pos === 2 ? ' 🥈' : '';
        return '<tr><td class="l">Season ' + rec.n + '</td>' +
          '<td class="strong">' + r.pos + medal + '</td>' +
          '<td>' + r.p + '</td><td>' + r.w + '</td><td>' + r.d + '</td><td>' + r.l + '</td>' +
          '<td>' + r.gf + '</td><td>' + r.ga + '</td><td class="strong">' + r.pts + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="grid grid-3" style="margin-top:14px">' +
        tile('Titles', all.titles, all.runnerUps + ' runner-up finishes') +
        tile('Best / worst', all.best + ' / ' + all.worst, 'average ' + all.avgPos) +
        tile('All-time points', all.pts, all.p + ' matches, ' + all.ppg.toFixed(2) + ' ppg') +
      '</div>' : '<p class="small muted">No completed seasons on record yet.</p>';

    var wc = isWorldCup(comp);
    var squad = team.players.slice().sort(function (x, y) {
      return (y.g + y.a) - (x.g + x.a) || y.skill - x.skill;
    }).slice(0, 10);
    var squadHtml = '<div class="section-title" style="margin-top:18px">Squad — this ' +
      (wc ? 'cycle' : 'season') + '</div>' +
      '<div class="table-wrap"><table class="data"><thead><tr><th class="l">Player</th><th class="l">Pos</th>' +
      '<th class="col-hide-sm">Rating</th><th>Apps</th>' +
      (wc ? '<th>Qualifying</th><th class="strong">Finals</th>'
          : '<th>' + esc(sportOf(comp).scoreWord) + '</th><th>Assists</th>') +
      '<th class="strong col-hide-sm">Career</th>' +
      '</tr></thead><tbody>' +
      squad.map(function (p) {
        var q = E.playerPhase(p, 'qual'), f = E.playerPhase(p, 'finals');
        return '<tr><td class="l strong">' + esc(p.name) +
          (p.wild ? ' <span class="badge tiny" title="A generational talent — here while the run lasts">\u2605</span>' : '') +
          '</td><td class="l muted">' + p.pos + '</td>' +
          '<td class="col-hide-sm">' + p.skill + '</td><td class="muted">' + p.apps + '</td>' +
          (wc ? '<td class="muted">' + q.g + '</td><td class="strong">' + f.g + '</td>'
              : '<td class="strong">' + p.g + '</td><td>' + p.a + '</td>') +
          '<td class="muted col-hide-sm">' + p.cg + 'g ' + p.ca + 'a</td></tr>';
      }).join('') + '</tbody></table></div>';

    var h2hHtml = '';
    if (comp.teams.length <= 30) {
      var rows = comp.teams.map(function (o, j) {
        if (j === idx) return null;
        var h = S.headToHead(comp, idx, j);
        return h.p ? { o: o, h: h } : null;
      }).filter(Boolean).sort(function (x, y) { return y.h.p - x.h.p || y.h.aw - x.h.aw; });
      if (rows.length) {
        h2hHtml = '<div class="section-title" style="margin-top:18px">Head to head</div>' +
          '<div class="table-wrap"><table class="data"><thead><tr><th class="l">Opponent</th>' +
          '<th>Played</th><th>W</th><th>D</th><th>L</th><th>' +
          esc(sportOf(comp).scoreWord) + '</th></tr></thead><tbody>' +
          rows.map(function (x) {
            return '<tr><td class="l">' + teamCell(x.o) + '</td>' +
              '<td class="muted">' + x.h.p + '</td><td class="strong">' + x.h.aw + '</td>' +
              '<td>' + x.h.d + '</td><td>' + x.h.bw + '</td>' +
              '<td class="mono" style="font-size:.78rem">' + x.h.agf + '–' + x.h.bgf + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
    }

    var head = '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">' +
      kit(team, true) + '<div><div style="font-size:1.15rem;font-weight:700">' + esc(team.name) + ' ' +
      surgeBadge(team) + '</div>' +
      '<div class="tiny muted">Attack ' + team.att + ' · Defence ' + team.def + '</div></div>' +
      (MS ? '<button class="btn btn-sm" style="margin-left:auto" data-act="club-history" data-id="' +
        esc(id) + '">Club history</button>' : '') + '</div>' +
      (team.surge ? '<p class="small" style="margin:-6px 0 14px">' + esc(surgeNote(team)) + '</p>' : '');

    modal(team.name, head + seasonBlock + absenceSection(comp, team) + qualBlock + rankBlock + history +
      squadHtml + h2hHtml);
  }

    var q = comp.settings.qualifying;

    return comp.season.matches.some(function (m) { return m.played; });

  function strengthCard(comp) {
    var rows = comp.teams.slice().sort(function (x, y) {
      return (y.att + y.def) - (x.att + x.def);
    }).map(function (t) {
      return { label: t.abbr + ' — ATT ' + t.att + ' / DEF ' + t.def, value: t.att + t.def, color: t.c1 };
    });
    return '<div class="card"><div class="card-head"><h3>Squad strength</h3>' +
      '<span class="badge">Attack + defence</span></div><div class="card-body">' +
      barList(rows, { fmt: function (v) { return Math.round(v / 2); } }) + '</div></div>';
  }

      (comp.format === 'cup' ? '' :
      '<div class="card"><div class="card-head"><h3>Table zones</h3>' +
        '<button class="btn btn-sm" data-act="zone-add">Add zone</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="zone-reset">Reset</button></div>' +
        '<div class="card-body">' + (zoneRows ||
          '<p class="small muted" style="margin:0">No zones — the table shows without colour stripes.</p>') +
        '</div></div>') +

      '<div class="card"><div class="card-head"><h3>Betting &amp; tipping</h3>' +
        '<span class="badge">' + (wag.enabled ? 'On' : 'Off') + '</span></div>' +
        '<div class="card-body">' +
          '<p class="small">Play money, this competition only. Prices are generated from the same ' +
          'simulation that plays the matches, so the board is only as sharp as your ratings.</p>' +
          '<label class="check"><input type="checkbox" data-act="wager-enabled"' +
            (wag.enabled ? ' checked' : '') + '> Betting and the odds board</label>' +
          '<label class="check"><input type="checkbox" data-act="wager-tipping"' +
            (wag.tipping ? ' checked' : '') + '> Tipping competition against six computer tipsters</label>' +
          '<div class="grid grid-2">' +
            '<label class="field"><span class="lbl">Starting balance</span>' +
              '<input type="number" min="0" step="50" value="' + Math.round(wag.startBankroll) + '" ' +
              'data-act="wager-bankroll">' +
              '<span class="hint">Sets your balance now as well.</span></label>' +
            '<label class="field"><span class="lbl">Bookmaker margin — <b class="num">' +
              Math.round(wag.margin * 100) + '%</b></span>' +
              '<input type="range" min="0" max="20" value="' + Math.round(wag.margin * 100) + '" ' +
              'data-act="wager-margin">' +
              '<span class="hint">0% prices every market at its true chance, so the board has no edge.' +
              '</span></label>' +
          '</div>' +
          '<div class="btn-row">' +
            '<button class="btn btn-sm" data-act="wager-reset">Reset balance and clear bets</button>' +
          '</div>' +
        '</div></div>' +

      managersCard(comp) +

      '<div class="card"><div class="card-head"><h3>Save file</h3></div><div class="card-body">' +
        '<p class="small">This competition lives in your browser and saves itself after every action. ' +
        'Export it to keep a copy or move it to another device.</p>' +
        '<div class="btn-row">' +
          '<button class="btn" data-act="export">Export ' + esc(comp.name) + '</button>' +
          '<button class="btn" data-act="import">Import a file</button>' +
        '</div>' +
        (S.saveErr() ? '<p class="small" style="color:var(--red);margin:12px 0 0">' + esc(S.saveErr()) + '</p>' : '') +
      '</div></div>' +

      '<div class="card"><div class="card-head"><h3>Danger zone</h3></div><div class="card-body">' +
        '<div class="btn-row">' +
          '<button class="btn btn-danger" data-act="restart">Restart season ' + comp.season.number + '</button>' +
          '<button class="btn btn-danger" data-act="delete">Delete this competition</button>' +
        '</div>' +
        '<p class="tiny muted" style="margin:12px 0 0">Restarting regenerates the fixture list and wipes this ' +
        'season\'s results. Archived seasons in History are not touched.</p>' +
      '</div></div>' +
    '</div>';
  }

  /* ------------------------------------------------------------ rendering */

  /* ------------------------------------------------------ sortable tables */

  // Sorting happens in the DOM rather than in each view. Every table in the app
  // is built by different code, so one pass over the rendered markup covers all
  // of them at once — and the chosen sort is remembered per table, so it holds
  // when a matchday is played and the view is drawn again.

  // Column headings are abbreviated to fit; the phone picker spells them out.
  var SORT_WORDS = {
    '#': 'Position', 'Pos': 'Position', 'P': 'Played', 'W': 'Won', 'D': 'Drawn',
    'L': 'Lost', 'GF': 'For', 'GA': 'Against', 'GD': 'Difference', 'PF': 'For',
    'PA': 'Against', 'Pts': 'Points', 'PPG': 'Points per game', 'G': 'Goals',
    'A': 'Assists', 'CS': 'Clean sheets', 'Apps': 'Appearances', 'MP': 'Matches'
  };
  // Ranking columns read best-first, so they open ascending; everything else
  // opens biggest-first, which is what you want from points or goals.
  var SORT_ASC_FIRST = { '#': 1, 'Pos': 1, 'Season': 1, 'Rank': 1, 'Team': 1, 'Player': 1 };

  var sortSeq = 0;

  function sortText(el) {
    var full = el.querySelector ? el.querySelector('.t-full') : null;
    return ((full ? full.textContent : el.textContent) || '').replace(/\s+/g, ' ').trim();
  }

  // A cell counts as a number if it reads like one — money, percentages and
  // signed differences included. Anything else sorts as text, and a dash is
  // treated as no value at all, so those rows always settle at the bottom.
  function sortValue(td) {
    var raw = td.getAttribute('data-v');
    var s = raw == null ? sortText(td) : raw.trim();
    if (!s || /^[\u2014\u2013\u2212-]$/.test(s)) return null;
    var n = s.replace(/[,$\u00a3\u20ac\s]/g, '').replace(/%$/, '')
      .replace(/^\u2212/, '-');   // the minus sign the ledger prints is not a hyphen
    if (/^[+-]?(\d+(\.\d+)?|\.\d+)$/.test(n)) return parseFloat(n);
    return s.toLowerCase();
  }

  // Only tables whose rows line up column for column: anything with a spanning
  // cell is a layout, not a list, and reordering it would break it.
  function sortableTable(t) {
    if (t.classList.contains('no-sort')) return false;
    var head = t.tHead, body = t.tBodies[0];
    if (!head || head.rows.length !== 1 || !body || body.rows.length < 3) return false;
    var cols = head.rows[0].cells.length, i, j;
    for (i = 0; i < body.rows.length; i++) {
      if (body.rows[i].cells.length !== cols) return false;
      for (j = 0; j < cols; j++) if (body.rows[i].cells[j].colSpan > 1) return false;
    }
    for (j = 0; j < cols; j++) if (head.rows[0].cells[j].colSpan > 1) return false;
    return true;
  }

  function columnType(body, i) {
    var seen = 0;
    for (var r = 0; r < body.rows.length; r++) {
      var v = sortValue(body.rows[r].cells[i]);
      if (v == null) continue;
      seen++;
      if (typeof v === 'string') return 'text';
    }
    return seen ? 'num' : null;
  }

  function tableBySid(sid) {
    return document.querySelector('table[data-sid="' + sid + '"]');
  }

  function applySort(t) {
    var st = app.ui.sort[t.dataset.skey] || null;
    var body = t.tBodies[0];
    var rows = Array.prototype.slice.call(body.rows);
    var order = function (a, b) { return (+a.dataset.si) - (+b.dataset.si); };

    Array.prototype.forEach.call(t.tHead.rows[0].cells, function (th, i) {
      if (!th.classList.contains('sortable')) return;
      var on = !!st && st.i === i;
      th.setAttribute('aria-sort', on ? (st.dir > 0 ? 'ascending' : 'descending') : 'none');
      th.classList.toggle('sorted', on);
      th.classList.toggle('desc', on && st.dir < 0);
    });
    t.classList.toggle('is-sorted', !!st);

    rows.sort(!st ? order : function (a, b) {
      var x = sortValue(a.cells[st.i]), y = sortValue(b.cells[st.i]);
      if (x == null || y == null) return x == null && y == null ? order(a, b) : (x == null ? 1 : -1);
      if (x === y) return order(a, b);
      return (x > y ? 1 : -1) * st.dir;
    });
    rows.forEach(function (r) { body.appendChild(r); });

    // A column hidden on a narrow screen is shown while it is the one being
    // sorted on, so the order on screen never looks arbitrary.
    Array.prototype.forEach.call(t.querySelectorAll('.col-shown'), function (c) {
      c.classList.remove('col-shown');
    });
    if (st && t.tHead.rows[0].cells[st.i].classList.contains('col-hide-sm')) {
      t.tHead.rows[0].cells[st.i].classList.add('col-shown');
      rows.forEach(function (r) { r.cells[st.i].classList.add('col-shown'); });
    }

    var bar = document.querySelector('.sort-bar[data-sid="' + t.dataset.sid + '"]');
    if (bar) {
      bar.querySelector('select').value = st ? String(st.i) : '';
      var dirBtn = bar.querySelector('[data-act="sort-dir"]');
      dirBtn.textContent = st && st.dir > 0 ? '\u2191' : '\u2193';
      dirBtn.disabled = !st;
      dirBtn.setAttribute('aria-label', st && st.dir > 0 ? 'Sort largest first' : 'Sort smallest first');
    }
  }

  // Click cycles: the column's natural direction, then the other way, then back
  // to the order the view built.
  function toggleSort(t, i, dir) {
    var key = t.dataset.skey, st = app.ui.sort[key];
    var natural = SORT_ASC_FIRST[sortText(t.tHead.rows[0].cells[i])] ? 1 : -1;
    if (t.tHead.rows[0].cells[i].dataset.type === 'text') natural = 1;
    if (dir) app.ui.sort[key] = { i: i, dir: dir };
    else if (!st || st.i !== i) app.ui.sort[key] = { i: i, dir: natural };
    else if (st.dir === natural) app.ui.sort[key] = { i: i, dir: -natural };
    else delete app.ui.sort[key];
    applySort(t);
  }

  function sortBar(t, heads, types) {
    var opts = '<option value="">Table order</option>' + heads.map(function (th, i) {
      if (!types[i]) return '';
      return '<option value="' + i + '">' + esc(th.dataset.sortLabel) + '</option>';
    }).join('');
    var bar = document.createElement('div');
    bar.className = 'sort-bar';
    bar.dataset.sid = t.dataset.sid;
    bar.innerHTML = '<span class="tiny muted">Sort by</span>' +
      '<select data-act="sort-pick" data-sid="' + t.dataset.sid + '" aria-label="Sort this table">' +
      opts + '</select>' +
      '<button class="btn btn-sm" data-act="sort-dir" data-sid="' + t.dataset.sid + '" ' +
      'disabled aria-label="Reverse the order">\u2193</button>';
    return bar;
  }

  function enhanceTables(root, scope) {
    if (!root) return;
    Array.prototype.forEach.call(root.querySelectorAll('table.data'), function (t, n) {
      if (!sortableTable(t)) return;
      var body = t.tBodies[0];
      Array.prototype.forEach.call(body.rows, function (r, i) { r.dataset.si = i; });

      var heads = Array.prototype.slice.call(t.tHead.rows[0].cells);
      var types = heads.map(function (_, i) { return columnType(body, i); });
      if (!types.some(function (x) { return x; })) return;

      t.dataset.sid = ++sortSeq;
      t.dataset.skey = scope + '#' + app.view + '#' + n + '#' +
        heads.map(function (h) { return sortText(h); }).join(',');

      heads.forEach(function (th, i) {
        if (!types[i]) return;
        th.dataset.act = 'sort-col';
        th.dataset.col = i;
        th.dataset.type = types[i];
        th.dataset.sid = t.dataset.sid;
        th.classList.add('sortable');
        th.tabIndex = 0;
        var txt = sortText(th);
        // the heading's own title is the best long name for the picker, but the
        // hint below overwrites it, so keep it first
        th.dataset.sortLabel = th.title || SORT_WORDS[txt] || txt || 'Column ' + (i + 1);
        th.title = 'Sort by ' + th.dataset.sortLabel.toLowerCase();
      });

      // On a phone some columns are hidden, so their headings cannot be tapped.
      // Those tables get a picker that covers every column.
      if (heads.some(function (h) { return h.classList.contains('col-hide-sm'); })) {
        var wrap = t.parentNode;
        if (wrap && wrap.parentNode) wrap.parentNode.insertBefore(sortBar(t, heads, types), wrap);
      }

      applySort(t);
    });
  }

  function render() {
    var comp = S.active();
    var switchEl = $('#compSwitch');

    if (app.view === 'home') {
      // with a competition open the strip stays, so there is always a way back
      tabsEl.hidden = !comp;
      switchEl.hidden = !S.state.competitions.length;
      if (S.state.competitions.length) fillSwitch(comp);
      Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (t) {
        t.setAttribute('aria-selected', String(t.dataset.view === 'home'));
      });
      viewEl.innerHTML = viewHome();
      enhanceTables(viewEl, 'v');
      return;
    }

    if (!comp || app.view === 'create') {
      tabsEl.hidden = true;
      switchEl.hidden = !S.state.competitions.length;
      if (S.state.competitions.length) fillSwitch(comp);
      viewEl.innerHTML = viewCreate();
      wireCreate();
      return;
    }

    tabsEl.hidden = false;
    switchEl.hidden = false;
    fillSwitch(comp);

    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (t) {
      var on = t.dataset.view === app.view;
      t.setAttribute('aria-selected', String(on));
      // the tab strip scrolls on a phone, so bring the current one into view
      if (on && tabsEl.scrollWidth > tabsEl.clientWidth) {
        var left = t.offsetLeft - (tabsEl.clientWidth - t.offsetWidth) / 2;
        tabsEl.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
      }
    });
    W.ensure(comp);

    var html;
    switch (app.view) {
      case 'table': html = viewTable(comp); break;
      case 'fixtures': html = viewFixtures(comp); break;
      case 'stats': html = viewStats(comp); break;
      case 'betting': html = viewBetting(comp); break;
      case 'history': html = viewHistory(comp); break;
      case 'teams': html = viewTeams(comp); break;
      case 'settings': html = viewSettings(comp); break;
      default: html = viewOverview(comp);
    }
    viewEl.innerHTML = html;
    enhanceTables(viewEl, 'v');
    // a scrolling strip of tabs opens on the one that is selected
    Array.prototype.forEach.call(viewEl.querySelectorAll('.seg-scroll'), function (seg) {
      var on = seg.querySelector('[aria-pressed="true"]');
      if (on && seg.scrollWidth > seg.clientWidth) {
        seg.scrollLeft = Math.max(0, on.offsetLeft - (seg.clientWidth - on.offsetWidth) / 2);
      }
    });
  }

  function fillSwitch(comp) {
    var sel = $('#compSelect');
    sel.innerHTML = S.state.competitions.map(function (c) {
      return '<option value="' + c.id + '"' + (comp && c.id === comp.id ? ' selected' : '') + '>' +
        esc(c.name) + '</option>';
    }).join('');
    $('#seasonPill').textContent = comp ? 'S' + comp.season.number : '';
  }

  function wireCreate() {
    var adv = $('#fAdv');
    if (adv) {
      adv.addEventListener('input', function () { $('#fAdvVal').textContent = adv.value + '%'; });
    }
    var fmt = $('#fFormat');
    if (fmt) fmt.addEventListener('change', function () { /* fields stay visible; harmless either way */ });
  }

  function persist() { S.save(); }

  /* --------------------------------------------------------- records book */

  /* Every all-time record the save can answer, gathered on one page. Most
     come straight from the archive (tables, results, scorers, champions); the
     fastest goals and biggest comebacks need minutes, which the archive does
     not keep, so those come from the milestone engine's running lists and
     start from whenever it began watching. A finished season counts; one in
     progress only counts where a partial figure cannot flatter it. */

  function recordsData(comp) {
    var H = comp.history, s = comp.season;
    var idxOf = {};
    comp.teams.forEach(function (t, i) { idxOf[t.id] = i; });

    // a team as it appears in the book, even if it has since left
    function who(idx, names) {
      var t = comp.teams[idx];
      return { t: t, name: t ? t.name : ((names || [])[idx] || '?') };
    }

    // every result in order, archive first, with where to find it
    var results = [];
    H.forEach(function (rec) {
      rec.results.slice().sort(function (x, y) { return x[4] - y[4]; }).forEach(function (r) {
        results.push({ n: rec.n, md: r[4], h: r[0], a: r[1], hg: r[2], ag: r[3], names: rec.names });
      });
    });
    s.matches.filter(function (m) { return m.played; })
      .sort(function (x, y) { return x.md - y.md; })
      .forEach(function (m) {
        results.push({ n: s.number, md: m.md, h: idxOf[m.h], a: idxOf[m.a], hg: m.hg, ag: m.ag, mid: m.id, live: true });
      });

    // team seasons, from finished leagues only
    var seasons = [];
    if (comp.format === 'league') {
      H.forEach(function (rec) {
        if (rec.format !== 'league') return;
        rec.table.forEach(function (r) {
          if (r.p) seasons.push({ n: rec.n, team: who(r.t, rec.names), p: r.p, w: r.w, d: r.d, l: r.l,
                                   gf: r.gf, ga: r.ga, pts: r.pts });
        });
      });
      if (s.complete) {
        E.computeTable(comp.teams, s.matches, comp.settings, function (m) { return m.stage === 'league'; })
          .forEach(function (r) {
            if (r.p) seasons.push({ n: s.number, team: { t: r.team, name: r.team.name }, p: r.p, w: r.w,
                                     d: r.d, l: r.l, gf: r.gf, ga: r.ga, pts: r.pts });
          });
      }
    }

    // runs: consecutive results for each side, across seasons
    var runs = { win: [], unbeaten: [], lose: [], winless: [] };
    var cur = {};
    function close(idx, kind, live) {
      var c = cur[idx] && cur[idx][kind];
      if (!c || c.len < 2) return;
      runs[kind].push({ team: who(idx, c.names), len: c.len, from: c.from, to: c.to, live: !!live });
    }
    results.forEach(function (r) {
      [[r.h, r.hg, r.ag], [r.a, r.ag, r.hg]].forEach(function (x) {
        var idx = x[0];
        if (idx == null) return;
        var res = x[1] > x[2] ? 'W' : x[1] < x[2] ? 'L' : 'D';
        var c = cur[idx] || (cur[idx] = {});
        var fits = { win: res === 'W', unbeaten: res !== 'L', lose: res === 'L', winless: res !== 'W' };
        Object.keys(fits).forEach(function (k) {
          if (fits[k]) {
            if (!c[k]) c[k] = { len: 0, from: 'S' + r.n + ' MD ' + (r.md + 1), names: r.names };
            c[k].len++;
            c[k].to = 'S' + r.n + ' MD ' + (r.md + 1);
          } else {
            close(idx, k);
            c[k] = null;
          }
        });
      });
    });
    Object.keys(cur).forEach(function (idx) {
      ['win', 'unbeaten', 'lose', 'winless'].forEach(function (k) { close(+idx, k, true); });
    });
    Object.keys(runs).forEach(function (k) {
      runs[k].sort(function (x, y) { return y.len - x.len; });
    });

    // titles
    var titles = S.allTimeTable(comp, false).filter(function (r) { return r.titles; })
      .sort(function (x, y) { return y.titles - x.titles || y.runnerUps - x.runnerUps; });
    var streaks = [], gaps = [];
    var run = null, lastTitle = {};
    H.forEach(function (rec) {
      var c = rec.champion;
      if (c == null) { run = null; return; }
      if (run && run.idx === c) run.len++;
      else { run = { idx: c, len: 1, from: rec.n }; streaks.push(run); }
      run.to = rec.n;
      if (lastTitle[c] != null && rec.n - lastTitle[c] > 1) {
        gaps.push({ team: who(c, rec.names), gap: rec.n - lastTitle[c], from: lastTitle[c], to: rec.n });
      }
      lastTitle[c] = rec.n;
    });
    streaks = streaks.filter(function (x) { return x.len >= 2; })
      .sort(function (x, y) { return y.len - x.len || x.from - y.from; })
      .map(function (x) { return { team: who(x.idx), len: x.len, from: x.from, to: x.to }; });
    gaps.sort(function (x, y) { return y.gap - x.gap; });

    // players
    var seasonScorers = [];
    H.forEach(function (rec) {
      (rec.scorers || []).forEach(function (sc) {
        seasonScorers.push({ name: sc.n, team: who(sc.t, rec.names), g: sc.g, n: rec.n });
      });
    });
    if (s.complete) {
      E.topScorers(comp.teams, 10, comp.format === 'worldcup' ? 'finals' : 'all').forEach(function (x) {
        seasonScorers.push({ name: x.p.name, team: { t: x.t, name: x.t.name }, g: x.g, n: s.number });
      });
    }
    seasonScorers.sort(function (x, y) { return y.g - x.g; });
    var career = S.allTimeScorers(comp, 10);
    var apps = [];
    comp.teams.forEach(function (t) {
      t.players.forEach(function (p) { if (p.capps) apps.push({ name: p.name, team: { t: t, name: t.name }, v: p.capps }); });
    });
    apps.sort(function (x, y) { return y.v - x.v; });

    var R = MS ? MS.ensure(comp) : {};
    return { results: results, seasons: seasons, runs: runs, titles: titles, streaks: streaks, gaps: gaps,
             seasonScorers: seasonScorers, career: career, apps: apps,
             hauls: (R.hauls || []).slice().sort(function (x, y) { return y.k - x.k || x.n - y.n; }),
             best: (R.best || []).slice().reverse(),
             fast: R.fast || [], comeback: R.comeback || [] };
  }

  // One record: the holder up top, the next few underneath.
  function recordRow(label, list, fmt) {
    if (!list.length) return '';
    var top = fmt(list[0]);
    var rest = list.slice(1, 3).map(function (x) { var f = fmt(x); return f.plain; });
    return '<div class="rec-row">' +
      '<div class="rec-label">' + esc(label) + '</div>' +
      '<div class="rec-main"><span class="rec-val">' + top.val + '</span>' +
        '<span class="rec-who">' + top.who + '</span>' +
        (top.when ? '<span class="rec-when">' + top.when + '</span>' : '') + '</div>' +
      (rest.length ? '<div class="rec-next">Next: ' + rest.map(esc).join(' · ') + '</div>' : '') +
      '</div>';
  }

  function recWho(team, extra) {
    return (team.t ? kit(team.t) + ' ' : '') + '<span class="strong">' + esc(extra || team.name) + '</span>' +
      (extra ? ' <span class="muted small">' + esc(team.name) + '</span>' : '');
  }
  function seasonLink(comp, n, label) {
    var archived = comp.history.some(function (r) { return r.n === n; });
    return archived ? '<a href="#" data-act="season" data-n="' + n + '">' + esc(label || 'S' + n) + '</a>'
      : esc(label || 'S' + n);
  }
  function matchLink(comp, r, label) {
    if (r.mid && r.n === comp.season.number && matchById(comp, r.mid)) {
      return '<a href="#" data-act="match" data-id="' + esc(r.mid) + '">' + esc(label) + '</a>';
    }
    return seasonLink(comp, r.n, label);
  }

  function recordsBook(comp) {
    var d = recordsData(comp), sp = sportOf(comp), fa = forAgainst(sp);
    var units = sp.scoreWord.toLowerCase();
    var pctMode = comp.settings.rankBy === 'winpct';
    function card(title, icon, rows) {
      rows = rows.filter(Boolean);
      if (!rows.length) return '';
      return '<div class="card"><div class="card-head"><h3>' + icon + ' ' + esc(title) + '</h3></div>' +
        '<div class="card-body rec-body">' + rows.join('') + '</div></div>';
    }
    function by(list, key, asc) {
      return list.slice().sort(function (x, y) { return asc ? x[key] - y[key] : y[key] - x[key]; });
    }
    function nm(x) { return x.team.name; }
    function teamSeason(key, unit, asc) {
      return function (x) {

    var awayWin = res.filter(function (r) { return r.ag > r.hg; })
      .sort(function (x, y) { return (y.ag - y.hg) - (x.ag - x.hg) || y.ag - x.ag; });
    var highest = res.slice().sort(function (x, y) { return (y.hg + y.ag) - (x.hg + x.ag); });

  var tour = null;

  function tourById(id) { return TOURS.filter(function (t) { return t.id === id; })[0] || null; }

  function seenTours() {
    try { return JSON.parse(localStorage.getItem(TOUR_SEEN_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function markSeen(id) {
    var s = seenTours();
    s[id] = true;
    try { localStorage.setItem(TOUR_SEEN_KEY, JSON.stringify(s)); } catch (e) { /* private mode */ }
  }

  // A tour needs something to point at; make it if it is missing.
  function prepareTour(t) {
    var comp = S.active();
    if (t.needs === 'comp' && !comp) {
      S.add(S.fromPreset('premier', {}));
      toast('A Premier League has been set up to show you around');
    }
    if (t.needs === 'cont') {
      var cont = S.state.competitions.filter(function (c) { return c.continental; })[0];
      if (!cont) {
        var made = LS.continental.create({ sport: 'football', fill: true,
          leagues: LS.continental.candidates('football').map(function (c) { return c.id; }) });
        cont = made.comp;
        toast('A Champions League has been set up' + (made.made.length ? ', with the big five leagues to feed it' : ''));
      }
      S.setActive(cont.id);
    }
    if (t.needs === 'comp' && comp && comp.continental && t.id === 'injuries') {
      var L = anyLeague();
      if (L) S.setActive(L.id);
    }
  }

  function startTour(id) {
    var t = tourById(id);
    if (!t) return;
    closeModal();
    prepareTour(t);
    tour = { t: t, i: 0, compId: S.active() ? S.active().id : null };
    markSeen(id);
    showTourStep();
  }

  function endTour(done) {
    tour = null;
    var root = $('#tourRoot');
    if (root) root.innerHTML = '';
    closeModal();
    render();
    if (done) toast('Tutorial done. The ? button at the top opens the others');
  }

  function findTarget(sel) {
    var list = Array.isArray(sel) ? sel : [sel];
    for (var i = 0; i < list.length; i++) {
      var els = document.querySelectorAll(list[i]);
      for (var j = 0; j < els.length; j++) {
        var r = els[j].getBoundingClientRect();
        if (r.width > 0 && r.height > 0) return els[j];
      }
    }
    return null;
  }

  function showTourStep() {
    if (!tour) return;
    var st = tour.t.steps[tour.i];
    // a step that hops to another competition must not strand the ones after it
    if (!st.open && tour.compId && S.active() && S.active().id !== tour.compId) S.setActive(tour.compId);
    var comp = S.active();
    if (st.close) closeModal();
    if (st.view && app.view !== st.view) { closeModal(); app.view = st.view; }
    if (!st.open) { if (!st.keepModal) closeModal(); render(); }
    else { render(); if (comp) st.open(comp); }
    var el = st.sel ? findTarget(st.sel) : null;
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', inline: 'nearest' });
    tour.el = el;
    drawTourCard();
    // layout settles after scrolling; place once more when it has
    setTimeout(placeTour, 80);
  }

            (last ? 'Done' : 'Next') + '</button>' +

    if (next) next.focus({ preventScroll: true });

  function placeTour() {
    if (!tour) return;
    var hole = $('#tourHole'), card = $('#tourCard');
    if (!hole || !card) return;
    var el = tour.el && document.body.contains(tour.el) ? tour.el : null;
    var vw = window.innerWidth, vh = window.innerHeight, pad = 6, gap = 12;
    var cw = Math.min(360, vw - 24), ch = card.offsetHeight;
    card.style.width = cw + 'px';
    if (!el) {
      hole.className = 'tour-hole tour-none';
      hole.removeAttribute('style');
      card.style.left = Math.round((vw - cw) / 2) + 'px';
      card.style.top = Math.round(Math.max(12, (vh - ch) / 2)) + 'px';
      return;
    }
    var r = el.getBoundingClientRect();
    hole.className = 'tour-hole';
    hole.style.left = Math.round(r.left - pad) + 'px';
    hole.style.top = Math.round(r.top - pad) + 'px';
    hole.style.width = Math.round(r.width + pad * 2) + 'px';
    hole.style.height = Math.round(Math.min(r.height, vh) + pad * 2) + 'px';
    var top;
    if (r.bottom + gap + ch <= vh - 8) top = r.bottom + gap;
    else if (r.top - gap - ch >= 8) top = r.top - gap - ch;
    else top = vh - ch - 12;   // a tall target: sit at the bottom of the screen
    var left = Math.min(Math.max(12, r.left), vw - cw - 12);
    card.style.left = Math.round(left) + 'px';
    card.style.top = Math.round(Math.max(8, top)) + 'px';
  }

  function tourStep(d) {
    if (!tour) return;
    var n = tour.i + d;
    if (n < 0 || n >= tour.t.steps.length) return;
    tour.i = n;
    showTourStep();
  }

  function showTours() {
    var seen = seenTours();
    modal('Tutorials',
      '<p class="small" style="margin:0 0 12px">Short walk-throughs that point at the real buttons. ' +
      'Each one takes about a minute, and you can skip out at any point.</p>' +
      TOURS.map(function (t) {
        return '<div class="tour-row"><span class="tour-ico" aria-hidden="true">' + t.icon + '</span>' +
          '<span style="min-width:0;flex:1"><span class="strong">' + esc(t.title) + '</span>' +
          (seen[t.id] ? ' <span class="badge tiny">done</span>' : '') +
          '<span class="tiny muted" style="display:block;margin-top:2px">' + esc(t.desc) + ' · ' +
            t.steps.length + ' steps</span></span>' +
          '<button class="btn btn-sm' + (seen[t.id] ? '' : ' btn-primary') + '" data-act="tour-start" data-id="' +
            t.id + '">' + (seen[t.id] ? 'Again' : 'Start') + '</button></div>';
      }).join(''));
  }

  // The home page and a first competition both offer the tours.
  function toursCard() {
    var seen = seenTours();
    return '<div class="card"><div class="card-head"><h2>Tutorials</h2>' +
      '<span class="badge">' + TOURS.length + ' walk-throughs</span></div>' +
      '<div class="card-body"><div class="grid grid-3">' + TOURS.map(function (t) {
        return '<button class="preset" data-act="tour-start" data-id="' + t.id + '">' +
          '<div class="flag">' + t.icon + '</div><div class="nm">' + esc(t.title) +
          (seen[t.id] ? ' ✓' : '') + '</div>' +
          '<div class="sub">' + esc(t.desc) + '</div></button>';
      }).join('') + '</div></div></div>';
  }

  function tourNudge() {
    var seen = seenTours();
    if (seen.start || seen._nudge) return '';
    return '<div class="card tour-nudge"><div class="card-body" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">' +
      '<span style="font-size:1.6rem" aria-hidden="true">\u{1F44B}</span>' +
      '<div style="flex:1;min-width:200px"><div class="strong">New here?</div>' +
      '<div class="small muted">A one-minute walk-through of the buttons that matter.</div></div>' +
      '<button class="btn btn-primary btn-sm" data-act="tour-start" data-id="start">Show me around</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="tour-dismiss">Not now</button></div></div>';
  }

  /* -------------------------------------------------------------- actions */

  function simulateAndRender(fn, comp) {
    fn();
    persist();
    render();
  }

  // Tips have to be locked in before a round is played, and bets paid out after.
  function lockTips(comp) {
    var w = comp.wager;
    if (w && w.enabled && w.tipping) W.lockRound(comp, comp.season.round);
  }
  function settleBets(comp) {
    var w = comp.wager;
    if (!w || !w.enabled) return null;
    var settled = W.settle(comp);
    if (!settled.length) return null;
    var net = settled.reduce(function (t, b) { return t + (b.returned - b.stake); }, 0);
    var wins = settled.filter(function (b) { return b.status === 'won'; }).length;
    return { n: settled.length, wins: wins, net: net };
  }
  function simToast(comp, res, fallback) {
    if (res) {
      toast(res.wins + ' of ' + res.n + ' bets landed · ' +
        (res.net >= 0 ? '+' : '') + credits(res.net) + ' cr');
    } else if (fallback) {
      toast(fallback);
    }
  }

  function handleAction(act, el, ev) {
    var comp = S.active();

    switch (act) {
      case 'go':
        app.view = el.dataset.view;
        render();
        return;

      case 'pick-preset':
        app.ui.createPreset = el.dataset.id;
        render();
        return;

      case 'pick-sport': {
        var sid = el.dataset.id;
        app.ui.createSport = sid;
        app.ui.createPreset = D.sports[sid].presets[0];
        render();
        return;
      }

      case 'create-comp': doCreate(); return;

      case 'cancel-create':
        app.view = 'overview';
        render();
        return;

      case 'go-home':
        app.view = 'home';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;

      case 'go-create':
        app.view = 'create';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;

      case 'open-comp': {
        S.setActive(el.dataset.id);
        app.view = 'overview';
        app.ui.md = 0; app.ui.tableUpto = null; app.ui.chartTeams = null; app.ui.rankTeams = null;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      case 'quick-start': {
        var qp = D.presets[el.dataset.id];
        if (!qp) return;
        var qc = S.fromPreset(el.dataset.id, {});
        S.add(qc);
        app.view = 'overview';
        app.ui.md = 0;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        toast(qc.name + ' created — hit Play matchday');
        return;
      }

      case 'import': doImport(); return;

      case 'close-modal': closeModal(); return;

      case 'tour-list': showTours(); return;
      case 'go-records':
        app.view = 'history'; app.ui.histTab = 'records'; closeModal(); render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      case 'tour-start': startTour(el.dataset.id); return;
      case 'tour-next': tourStep(1); return;
      case 'tour-back': tourStep(-1); return;
      case 'tour-end': endTour(false); return;
      case 'tour-done': endTour(true); return;
      case 'tour-dismiss': markSeen('_nudge'); render(); return;
      case 'close-modal-back':
        if (ev.target === el) closeModal();
        return;
    }

    if (!comp) return;
    var seq = MS ? MS.mark(comp) : 0;   // anything after this is news

    switch (act) {
      case 'story-all': showStory(comp); return;
      case 'cont-leagues': showContLeagues(comp); return;
      case 'cont-playall': {
        var played = LS.continental.playFeeders(comp);
        LS.continental.redraw(comp);
        persist(); render();
        toast(played ? played + (played === 1 ? ' season' : ' seasons') + ' played and the field redrawn from the final tables'
          : 'Field redrawn from the final tables');
        popMoments(comp, seq);
        return;
      }
      case 'cont-redraw':
        if (LS.continental.redraw(comp)) {
          persist(); render(); toast('Redrawn from the latest tables');
          popMoments(comp, seq);
        }
        return;
      case 'cont-save': {
        var picks = Array.prototype.slice.call(document.querySelectorAll('.cont-pick'))
          .filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
        if (!picks.length) { toast('Pick at least one league'); return; }
        var by = {};
        Array.prototype.forEach.call(document.querySelectorAll('.cont-places'), function (x) {
          by[x.dataset.id] = parseInt(x.value, 10);
        });
        LS.continental.setLeagues(comp, picks, null, by, {
          qualify: !!($('#contQualify') || {}).checked,
          champAuto: !!($('#contChampAuto') || {}).checked,
          enterAll: !!($('#contEnterAll') || {}).checked
        });
        closeModal();
        var redrawn = LS.continental.redraw(comp);
        persist(); render();
        toast(redrawn ? 'Leagues saved and the field redrawn' : 'Saved. The new leagues feed the next draw');
        return;
      }
      case 'club-history': showClubHistory(comp, el.dataset.id); return;

      case 'sim-round': {
        var r1;
        simulateAndRender(function () {
          lockTips(comp);
          E.playRound(comp);
          r1 = settleBets(comp);
        });
        simToast(comp, r1, comp.season.complete ? 'Season complete' : null);
        popMoments(comp, seq);
        return;
      }

      case 'sim-match': {
        var r2;
        simulateAndRender(function () {
          lockTips(comp);
          var nm = E.nextMatch(comp);
          if (nm) E.playMatch(comp, nm.id);
          r2 = settleBets(comp);
        });
        simToast(comp, r2, null);
        popMoments(comp, seq);
        return;
      }

      case 'watch':
        if (el.dataset.id) watchMatch(comp, el.dataset.id);
        return;

      case 'live-pause': toggleLivePause(); return;
      case 'live-speed': cycleLiveSpeed(); return;
      case 'live-skip': skipLive(); return;

      case 'sim-this': {
        lockTips(comp);
        E.playMatch(comp, el.dataset.id);
        var r3 = settleBets(comp);
        persist();
        closeModal();
        render();
        simToast(comp, r3, null);
        popMoments(comp, seq);
        return;
      }

      case 'sim-season': {
        var wt = comp.wager;
        if (wt && wt.enabled && wt.tipping && !el.dataset.confirmed) {
          var untipped = 0, engaged = false;
          comp.season.matches.forEach(function (m) {
            var t = wt.tips[m.id] || {};
            if (t.user) engaged = true;
            if (!m.played && !t.user) untipped++;
          });
          // only worth asking if they are actually playing the tipping comp
          if (engaged && untipped > 0) {
            modal('Simulate the rest of the season?',
              '<p class="small">You have <b>' + untipped + '</b> matches left untipped. ' +
              'Running the season now plays them all, and an untipped match counts as a miss ' +
              'on the tipping ladder.</p>' +
              '<div class="btn-row" style="margin-top:16px">' +
              '<button class="btn btn-primary" data-act="sim-season-tipped">Tip the favourites, then simulate</button>' +
              '<button class="btn" data-act="sim-season" data-confirmed="1">Simulate anyway</button>' +
              '<button class="btn btn-ghost" data-act="close-modal">Cancel</button></div>');
            return;
          }
        }
        closeModal();
        var wasStage = comp.season.stage;
        var r4;
        simulateAndRender(function () {
          E.simulateSeason(comp, { stopAtFinals: true, beforeRound: lockTips });
          r4 = settleBets(comp);
        });
        var done = comp.season.stage === 'finals' && wasStage !== 'finals'
          ? 'Regular season done — the finals are set'
          : 'Season ' + comp.season.number + ' complete';
        simToast(comp, r4, done);
        popMoments(comp, seq);
        return;
      }

      case 'end-season': {
        var n = comp.season.number;
        closeModal();
        if (comp.wager && comp.wager.enabled) W.rollSeason(comp);
        if (S.endSeason(comp)) {
          persist();
          app.ui.md = 0;
          app.ui.tableUpto = null;
          app.ui.chartTeams = null;
          render();
          toast('Season ' + n + ' archived — season ' + comp.season.number + ' begins');
          popMoments(comp, seq);
        }
        return;
      }

      case 'sim-season-tipped': {
        var wf = W.ensure(comp);
        comp.season.matches.forEach(function (m) {
          if (m.played) return;
          if (!(wf.tips[m.id] || {}).user) W.setTip(comp, m.id, W.favourite(comp, m));
        });
        closeModal();
        var r5;
        simulateAndRender(function () {
          E.simulateSeason(comp, { stopAtFinals: true, beforeRound: lockTips });
          r5 = settleBets(comp);
        });
        simToast(comp, r5, 'Season simulated with the favourites tipped');
        popMoments(comp, seq);
        return;
      }

      case 'season-awards': showAwards(comp); return;
      case 'match': showMatch(comp, el.dataset.id); return;
      case 'team': showTeam(comp, el.dataset.id); return;
      case 'season': showSeason(comp, parseInt(el.dataset.n, 10)); return;

      case 'recap':
        showRecap(comp, el.dataset.n === 'live' ? 'live' : parseInt(el.dataset.n, 10));
        return;
      case 'recap-png': downloadRecapPNG(); return;
      case 'recap-print-btn': window.print(); return;

      case 'wager-tab': app.ui.wagerTab = el.dataset.tab; closeModal(); render(); return;
      case 'wager-on':
        W.ensure(comp).enabled = true;
        persist(); render(); toast('Betting switched on');
        return;
      case 'tipping-on':
        W.ensure(comp).tipping = true;
        persist(); render(); toast('Tipping switched on');
        return;

      case 'season-bet':
        showSeasonSlip(comp, el.dataset.market, el.dataset.pick);
        return;

      case 'place-season-bet': {
        var smk = null, spk = null;
        W.seasonMarkets(comp).forEach(function (mm) {
          if (mm.id !== el.dataset.market) return;
          smk = mm;
          mm.picks.forEach(function (p) { if (p.key === el.dataset.pick) spk = p; });
        });
        if (!smk || !spk) return;
        var sStake = $('#betStake');
        var sRes = W.placeSeasonBet(comp, smk, spk, sStake ? sStake.value : 0);
        if (!sRes.ok) { toast(sRes.reason); return; }
        persist();
        closeModal();
        render();
        toast('Backed for the season');
        return;
      }

      case 'all-markets': showMarkets(comp, el.dataset.id); return;
      case 'bet':
        showBetSlip(comp, el.dataset.match, el.dataset.market, el.dataset.pick);
        return;

      case 'stake-chip': {
        var input = $('#betStake');
        if (!input) return;
        var v = el.dataset.v;
        input.value = v === 'all' ? Math.floor(W.ensure(comp).bankroll) : v;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        return;
      }

      case 'place-bet': {
        var betMatch = null;
        comp.season.matches.forEach(function (x) { if (x.id === el.dataset.match) betMatch = x; });
        if (!betMatch) return;
        var mkt = null, pk = null;
        W.markets(comp, betMatch).forEach(function (mm) {
          if (mm.id !== el.dataset.market) return;
          mkt = mm;
          mm.picks.forEach(function (p) { if (p.key === el.dataset.pick) pk = p; });
        });
        var stakeEl = $('#betStake');
        var res = W.placeBet(comp, betMatch, mkt, pk, stakeEl ? stakeEl.value : 0);
        if (!res.ok) { toast(res.reason); return; }
        persist();
        closeModal();
        render();
        toast('Bet placed');
        return;
      }

      case 'tip':
        W.setTip(comp, el.dataset.id, el.dataset.team);
        persist(); render();
        return;

      case 'tip-all-fav': {
        var mdNow = wagerRound(comp);
        W.roundMatches(comp, mdNow).forEach(function (m) {
          if (m.played) return;
          W.setTip(comp, m.id, W.favourite(comp, m));
        });
        persist(); render(); toast('Favourites tipped');
        return;
      }

      case 'table-mode': app.ui.tableMode = el.dataset.mode; render(); return;
      case 'stat-tab': app.ui.statTab = el.dataset.tab; render(); return;
      case 'stat-phase': app.ui.statPhase = el.dataset.phase; render(); return;
      case 'hist-tab': app.ui.histTab = el.dataset.tab; render(); return;

      case 'md':
        app.ui.md = E.clamp(app.ui.md + parseInt(el.dataset.d, 10), 0, E.matchdaysOf(comp.season) - 1);
        render();
        return;

      case 'rank-tab': app.ui.rankTab = el.dataset.tab; render(); return;

      case 'rank-mode': app.ui.rankMode = el.dataset.mode; render(); return;

      case 'toggle-series': {
        var id = el.dataset.id;
        // the ranking chart keeps its own selection, so the two do not fight
        var onRank = app.view === 'stats' && app.ui.statTab === 'ranking';
        var cur = onRank ? app.ui.rankTeams : app.ui.chartTeams;
        if (!cur) {
          cur = (onRank ? E.rankingTable(comp) : liveTable(comp))
            .slice(0, 6).map(function (r) { return r.id; });
        }
        var i = cur.indexOf(id);
        if (i >= 0) cur = cur.filter(function (x) { return x !== id; });
        else cur = cur.concat([id]);
        if (onRank) app.ui.rankTeams = cur; else app.ui.chartTeams = cur;
        render();
        return;
      }

      case 'sort-col': {
        var stbl = tableBySid(el.dataset.sid);
        if (stbl) toggleSort(stbl, parseInt(el.dataset.col, 10));
        return;
      }

      case 'sort-dir': {
        var dtbl = tableBySid(el.dataset.sid);
        var dst = dtbl && app.ui.sort[dtbl.dataset.skey];
        if (dst) toggleSort(dtbl, dst.i, -dst.dir);
        return;
      }

      case 'go-rankings':
        app.view = 'stats';
        app.ui.statTab = 'ranking';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;

      case 'add-team': showAddTeam(comp); return;

      case 'create-team': {
        var spec = {
          name: ($('#ntName') || {}).value,
          abbr: ($('#ntAbbr') || {}).value,
          att: parseInt(($('#ntAtt') || {}).value, 10),
          def: parseInt(($('#ntDef') || {}).value, 10),
          c1: ($('#ntC1') || {}).value,
          c2: ($('#ntC2') || {}).value,
          conf: ($('#ntConf') || {}).value
        };
        closeModal();
        var added = S.addTeam(comp, spec);
        persist();
        app.ui.md = 0;
        render();
        toast(added.name + ' added — fixtures rebuilt');
        return;
      }

      case 'remove-team': {
        var rid = el.dataset.id;
        var rteam = null;
        comp.teams.forEach(function (t) { if (t.id === rid) rteam = t; });
        if (!rteam) return;
        var floor = (comp.format === 'league' || comp.format === 'cup') ? 2 : 4;
        if (comp.teams.length <= floor) {
          toast('A ' + formatLabel(comp).toLowerCase() + ' needs at least ' + floor + ' teams');
          return;
        }
        // Removal always asks: it strips the club out of archived seasons too.
        var body = 'They leave the competition for good.' +
          (comp.history.length
            ? ' Their results, titles and scorers are stripped out of the ' +
              comp.history.length + ' archived season' + (comp.history.length === 1 ? '' : 's') +
              ', and the tables there renumber around them.'
            : '') +
          (seasonStarted(comp)
            ? ' Season ' + comp.season.number + ' has already started, so its fixtures are rebuilt ' +
              'and the results so far are cleared.'
            : ' Season ' + comp.season.number + ' has not started, so its fixtures are simply redrawn.');
        confirmAction('Remove ' + rteam.name + '?', body, function () {
          closeModal();
          if (!S.removeTeam(comp, rid)) { toast('Could not remove that team'); return; }
          persist();
          app.ui.md = 0;
          render();
          toast(rteam.name + ' removed');
        }, true);
        return;
      }

      case 'randomise': {
        var rng = new E.RNG((Date.now() >>> 0));
        comp.teams.forEach(function (t) {
          t.att = rng.int(35, 92); t.def = rng.int(35, 92);
        });
        W.clearOddsCache();
        persist(); render(); toast('Ratings randomised');
        return;
      }
      case 'level':
        comp.teams.forEach(function (t) { t.att = 60; t.def = 60; });
        W.clearOddsCache();
        persist(); render(); toast('Every team levelled at 60');
        return;

      case 'zone-add':
        comp.settings.zones = (comp.settings.zones || []).concat([
          { from: 1, to: 1, label: 'New zone', cls: 'z-uel' }
        ]);
        persist(); render();
        return;
      case 'zone-del':
        comp.settings.zones.splice(parseInt(el.dataset.i, 10), 1);
        persist(); render();
        return;
      case 'zone-reset':
        comp.settings.zones = S.defaultZones(comp.teams.length);
        persist(); render();
        return;

      case 'wager-reset':
        confirmAction('Reset the betting balance?',
          'Every bet on record is removed and your balance goes back to the starting figure. ' +
          'Tipping is not affected.',
          function () {
            var wr = W.ensure(comp);
            wr.bets = [];
            wr.bankroll = wr.startBankroll;
            wr.nextBetId = 1;
            persist(); closeModal(); render();
            toast('Balance reset');
          });
        return;

      case 'export': doExport(comp); return;

      case 'manager-add':
        M.addManager(comp, '');
        persist(); render();
        return;

      case 'manager-remove':
        M.removeManager(comp, el.dataset.id);
        persist(); render();
        toast('Manager removed');
        return;

      case 'manager-draft-start':
        if (M.startDraft(comp)) { persist(); showManagerDraft(comp); }
        return;

      case 'manager-draft-open':
        showManagerDraft(comp);
        return;

      case 'manager-draft-cancel':
        M.cancelDraft(comp);
        persist(); closeModal(); render();
        return;

      case 'manager-draft-pick':
        if (M.draftPick(comp, el.dataset.id)) {
          persist();
          if (comp.managerDraft) showManagerDraft(comp);
          else { closeModal(); render(); toast('Draft complete'); }
        }
        return;

      case 'restart':
        confirmAction('Restart season ' + comp.season.number + '?',
          'This season\'s fixtures are regenerated and every result is wiped. Archived seasons stay put.',
          function () {
            S.restartSeason(comp);
            persist(); closeModal(); app.ui.md = 0; render();
            toast('Season restarted');
          });
        return;

      case 'delete':
        confirmAction('Delete ' + comp.name + '?',
          'Every season, result and record for this competition is removed from this browser. ' +
          'Export it first if you want to keep a copy.',
          function () {
            S.remove(comp.id);
            closeModal();
            app.view = S.state.competitions.length ? 'overview' : 'create';
            render();
            toast('Competition deleted');
          }, true);
        return;
    }
  }

  function confirmAction(title, body, onYes, danger) {
    modal(title, '<p class="small">' + esc(body) + '</p>' +
      '<div class="btn-row" style="margin-top:16px">' +
      '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-act="confirm-yes">Yes, do it</button>' +
      '<button class="btn" data-act="close-modal">Cancel</button></div>');
    confirmAction._yes = onYes;
  }

  /* ------------------------------------------------------- import / export */

  function doExport(comp) {
    var json = S.exportJSON(comp);
    var fname = comp.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-sideline.json';
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) { linkExport(comp); return; }
        dl.save({ filename: fname, data: json }).then(
          function () { toast('Exported'); },
          function (err) {
            toast(err && err.code === 'declined' ? 'Export cancelled' : 'Could not save that file');
          });
      }, function () { linkExport(comp); });
      return;
    }
    linkExport(comp);
  }

  function linkExport(comp) {
    var blob = new Blob([S.exportJSON(comp)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = comp.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-sideline.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('Exported');
  }

  function doImport() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var comp = S.importJSON(String(reader.result));
          app.view = 'overview';
          render();
          toast('Imported ' + comp.name);
        } catch (err) {
          toast(err.message || 'That file could not be read');
        }
      };
      reader.readAsText(file);
    });
    input.click();
  }

  /* --------------------------------------------------------------- events */

  function onClick(ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return; // handled by input/change
    if (act === 'confirm-yes') {
      var fn = confirmAction._yes;
      confirmAction._yes = null;
      if (fn) fn();
      return;
    }
    handleAction(act, el, ev);
  }

  function onInput(ev) {
    if (ev.target && ev.target.id === 'betStake') { updateBetReturn(); return; }
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var comp = S.active();
    var act = el.dataset.act;

    if (act === 'set-adv') {
      comp.settings.homeAdv = parseInt(el.value, 10) / 100;
      var lbl = el.parentNode.querySelector('b');
      if (lbl) lbl.textContent = el.value + '%';
      persist();
      return;
    }
    if (!comp) return;
    var team = null;
    if (el.dataset.id) {
      comp.teams.forEach(function (t) { if (t.id === el.dataset.id) team = t; });
    }

    if (act === 'tip-margin') {
      W.setMargin(comp, parseInt(el.dataset.md, 10), el.value);
      persist();
      return;
    }
    if (act === 'wager-bankroll') {
      var wb = W.ensure(comp);
      var v = Math.max(0, Math.floor(Number(el.value) || 0));
      wb.bankroll = v; wb.startBankroll = v;
      persist();
      return;
    }
    if (act === 'wager-margin') {
      W.ensure(comp).margin = E.clamp(parseInt(el.value, 10) || 0, 0, 30) / 100;
      W.clearOddsCache();
      persist();
      return;
    }

    switch (act) {
      case 'edit-name':
        if (team) {
          team.name = el.value;
          team.abbr = el.value.trim().slice(0, 3).toUpperCase() || team.abbr;
        }
        persist();
        return;
      case 'manager-name': {
        var mgr = M.managerOf(comp, el.dataset.id);
        if (mgr) mgr.name = el.value.trim() || mgr.name;
        persist();
        return;
      }
      case 'manager-team':
        if (el.value) M.assignTeam(comp, el.dataset.id, el.value);
        else M.unassign(comp, el.dataset.id);
        persist();
        return;
      case 'edit-att':
      case 'edit-def': {
        if (!team) return;
        var v = parseInt(el.value, 10);
        team[act === 'edit-att' ? 'att' : 'def'] = v;
        var out = el.parentNode.querySelector('.val');
        if (out) out.textContent = v;
        W.clearOddsCache();   // every price is drawn from these numbers
        persist();
        return;
      }
      case 'edit-c1':
      case 'edit-c2': {
        if (!team) return;
        team[act === 'edit-c1' ? 'c1' : 'c2'] = el.value;
        var kitEl = el.parentNode.querySelector('.kit');
        if (kitEl) {
          kitEl.querySelector('i').style.background = team.c1;
          kitEl.querySelector('b').style.background = team.c2;
        }
        persist();
        return;
      }
      case 'set-name':
        comp.name = el.value || comp.name;
        fillSwitch(comp);
        persist();
        return;
      case 'set': {
        var k = el.dataset.k;
        var val = el.type === 'number' ? parseInt(el.value, 10) : el.value;
        comp.settings[k] = val;
        persist();
        return;
      }
      case 'wildcards':
        comp.settings.wildcards = el.checked;
        persist();
        toast(el.checked ? 'Wildcard runs on' : 'Wildcard runs off');
        return;
      case 'injuries':
        comp.settings.injuries = el.checked;
        if (!el.checked) comp.teams.forEach(function (t) { t.players.forEach(function (p) { p.inj = 0; p.sus = 0; }); });
        W.clearOddsCache();
        persist();
        toast(el.checked ? 'Injuries and suspensions on' : 'Injuries off, everyone is fit');
        return;
      case 'wager-enabled':
        W.ensure(comp).enabled = el.checked;
        persist();
        return;
      case 'wager-tipping':
        W.ensure(comp).tipping = el.checked;
        persist();
        return;
      case 'finals-on':
      case 'finals-system':
      case 'finals-size': {
        var fset = comp.settings.finals ||
          (comp.settings.finals = { enabled: false, system: 'final8', size: 8 });
        if (act === 'finals-on') fset.enabled = el.checked;
        else if (act === 'finals-system') fset.system = el.value;
        else fset.size = parseInt(el.value, 10);
        persist();
        return;
      }
      case 'zone-from':
      case 'zone-to': {
        var z = comp.settings.zones[parseInt(el.dataset.i, 10)];
        if (!z) return;
        z[act === 'zone-from' ? 'from' : 'to'] = E.clamp(parseInt(el.value, 10) || 1, 1, comp.teams.length);
        persist();
        return;
      }
    }
  }

  function onChange(ev) {
    var el = ev.target.closest('[data-act]');
    var comp = S.active();
    if (el && comp) {
      var act = el.dataset.act;
      if (act === 'sort-pick') {
        var ptbl = tableBySid(el.dataset.sid);
        if (ptbl) {
          if (el.value === '') { delete app.ui.sort[ptbl.dataset.skey]; applySort(ptbl); }
          else toggleSort(ptbl, parseInt(el.value, 10), null);
        }
        return;
      }
      if (act === 'table-upto') {
        app.ui.tableUpto = el.value === '' ? null : parseInt(el.value, 10);
        render();
        return;
      }
      if (act === 'md-pick') { app.ui.md = parseInt(el.value, 10); render(); return; }
      if (act === 'wager-md') { app.ui.wagerMd = parseInt(el.value, 10); render(); return; }
      if (act === 'fixture-team') { app.ui.fixtureTeam = el.value; render(); return; }
      if (act === 'set' || act === 'zone-from' || act === 'zone-to' ||
          act === 'finals-on' || act === 'finals-system' || act === 'finals-size' ||
          act === 'wager-enabled' || act === 'wager-tipping' || act === 'wager-bankroll' ||
          act === 'wildcards' || act === 'injuries' || act === 'manager-team') {
        onInput(ev); render(); return;
      }
    }
    if (ev.target.id === 'compSelect') {
      S.setActive(ev.target.value);
      app.ui.md = 0; app.ui.tableUpto = null; app.ui.chartTeams = null; app.ui.rankTeams = null;
      app.view = 'overview';
      render();
    }
  }

  /* ------------------------------------------------------------ bootstrap */

  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('sideline.theme', t); } catch (e) { /* ignore */ }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#f4f6fa' : '#0a0e14');
  }

  function init() {
    viewEl = $('#view');
    tabsEl = $('#tabs');
    modalRoot = $('#modalRoot');
    toastRoot = $('#toastRoot');

    var saved;
    try { saved = localStorage.getItem('sideline.theme'); } catch (e) { saved = null; }
    var hosted = document.documentElement.getAttribute('data-theme');
    setTheme(saved || hosted ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

    S.load();
    // first visit lands on the home page, which explains the place
    if (!S.state.competitions.length) app.view = 'home';

    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);

    tabsEl.addEventListener('click', function (ev) {
      var t = ev.target.closest('.tab');
      if (!t) return;
      app.view = t.dataset.view;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('#themeBtn').addEventListener('click', function () {
      setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
    $('#newCompBtn').addEventListener('click', function () {
      app.view = 'create';
      render();
    });

    document.addEventListener('keydown', function (ev) {
      // a tour owns the keyboard while it runs
      if (tour) {
        if (ev.key === 'Escape') { ev.preventDefault(); endTour(false); }
        else if (ev.key === 'ArrowRight') { ev.preventDefault(); tourStep(1); }
        else if (ev.key === 'ArrowLeft') { ev.preventDefault(); tourStep(-1); }
        return;
      }
      if (ev.key === 'Escape') closeModal();
      if (ev.target && ev.target.classList && ev.target.classList.contains('sortable') &&
          (ev.key === 'Enter' || ev.key === ' ')) {
        ev.preventDefault();
        var kt = tableBySid(ev.target.dataset.sid);
        if (kt) toggleSort(kt, parseInt(ev.target.dataset.col, 10));
        return;
      }
      if (modalRoot.innerHTML) return;
      var comp = S.active();
      if (!comp || app.view === 'create' || app.view === 'home') return;
      var tag = (ev.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
      if (ev.key === ' ' || ev.key === 'Enter') {
        ev.preventDefault();
        if (!comp.season.complete) {
          var kseq = MS ? MS.mark(comp) : 0;
          E.playRound(comp); persist(); render();
          popMoments(comp, kseq);
        }
      }
    });

    window.addEventListener('resize', placeTour);
    window.addEventListener('scroll', placeTour, true);

    render();
    // expose for the smoke test harness
    LS.app = app;
    LS.render = render;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(window.LS = window.LS || {});

</script>
