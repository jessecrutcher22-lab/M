    if (m.pens && m.hg === m.ag) outcome = 0.5;

    var weight = RANK_WEIGHT[m.stage] || 1;
    if (Math.abs(m.hg - m.ag) >= cfg.bigWin) weight *= cfg.bigMult;

    var move = (outcome - expected) * cfg.exchange * weight;
    comp.rankings[m.h] = round2(Math.max(RANK_MIN, Math.min(RANK_MAX, ra + move)));
    comp.rankings[m.a] = round2(Math.max(RANK_MIN, Math.min(RANK_MAX, rb - move)));
    [m.h, m.a].forEach(function (id) {
      comp.rankPlayed[id] = (comp.rankPlayed[id] || 0) + 1;
      if (comp.rankings[id] > (comp.rankPeak[id] || 0)) comp.rankPeak[id] = comp.rankings[id];
    });
    m.rankMove = round2(move);
    return move;
  }

  function rankMatches(comp, list) {
    if (!ranked(comp)) return;
    list.forEach(function (m) { if (m.played && m.rankMove == null) rankMatch(comp, m); });
  }

  // The ladder itself: sorted, with movement against the last snapshot.
  function rankingTable(comp) {
    if (!ranked(comp)) return [];
    var prev = (comp.rankHistory || [])[comp.rankHistory.length - 1];
    var was = prev ? prev.ratings : null;
    var rows = comp.teams.map(function (t) {
      return {
        id: t.id, team: t, conf: t.conf || null,
        rating: rankingOf(comp, t.id),
        peak: (comp.rankPeak || {})[t.id] || rankingOf(comp, t.id),
        played: (comp.rankPlayed || {})[t.id] || 0,
        prev: was && was[t.id] != null ? was[t.id] : null
      };
    });
    rows.sort(function (a, b) { return b.rating - a.rating || a.team.name.localeCompare(b.team.name); });
    rows.forEach(function (r, i) { r.pos = i + 1; });

    if (was) {
      // ranked the same way as the live ladder, so an unchanged ladder shows no movement
      var byId = {};
      comp.teams.forEach(function (t) { byId[t.id] = t; });
      var order = comp.teams.map(function (t) { return t.id; })
        .filter(function (id) { return was[id] != null; })
        .sort(function (a, b) {
          return was[b] - was[a] || byId[a].name.localeCompare(byId[b].name);
        });
      var idx = {};
      order.forEach(function (id, i) { idx[id] = i + 1; });
      rows.forEach(function (r) { r.was = idx[r.id] == null ? null : idx[r.id]; });
    }
    return rows;
  }

  // Snapshot the ladder so the next cycle can show movement against it.
  function snapshotRankings(comp) {
    if (!ranked(comp)) return;
    var ratings = {};
    comp.teams.forEach(function (t) { ratings[t.id] = rankingOf(comp, t.id); });
    comp.rankHistory = comp.rankHistory || [];
    comp.rankHistory.push({ n: comp.season.number, ratings: ratings });
    if (comp.rankHistory.length > 40) comp.rankHistory.shift();
  }

  /* ------------------------------------------------- ranking over time */

  /* Each snapshot stores a rating per nation, which is all the ladder itself
     needs. A history wants positions too, so they are worked out here rather
     than stored — the same sort the live ladder uses, so a nation's place in
     the chart matches the place it held that cycle. Snapshots are keyed by team
     id, so a nation leaving the competition simply drops out of the series
     instead of corrupting anyone else's. */
  function rankingSeries(comp, opts) {
    var out = { cycles: [], series: {}, ids: [] };
    if (!ranked(comp)) return out;
    opts = opts || {};

    var byId = {};
    comp.teams.forEach(function (t) { byId[t.id] = t; });

    var snaps = (comp.rankHistory || []).map(function (h) {
      return { n: h.n, ratings: h.ratings, live: false };
    });

    // The edition in progress is not snapshotted until it finishes, so the
    // ladder as it stands right now is added as the last point.
    if (opts.live !== false) {
      var now = {};
      comp.teams.forEach(function (t) { now[t.id] = rankingOf(comp, t.id); });
      var last = snaps[snaps.length - 1];
      var n = comp.season ? comp.season.number : (last ? last.n + 1 : 1);
      if (!last || last.n !== n) snaps.push({ n: n, ratings: now, live: true });
    }

    snaps.forEach(function (snap) {
      var ids = Object.keys(snap.ratings).filter(function (id) { return byId[id]; });
      ids.sort(function (a, b) {
        return snap.ratings[b] - snap.ratings[a] || byId[a].name.localeCompare(byId[b].name);
      });
      out.cycles.push({ n: snap.n, live: !!snap.live, size: ids.length });
      ids.forEach(function (id, i) {
        if (!out.series[id]) { out.series[id] = []; out.ids.push(id); }
        out.series[id].push({
          n: snap.n, rating: round2(snap.ratings[id]), pos: i + 1, live: !!snap.live
        });
      });
    });
    return out;
  }

  // One nation's run through the ladder: where it started, where it sits, and
  // the highest and lowest it has been along the way.
  function rankingSpan(comp, id, built) {
    var pts = ((built || rankingSeries(comp)).series || {})[id] || [];
    if (!pts.length) return null;
    var bestPos = pts[0], worstPos = pts[0], peak = pts[0], trough = pts[0];
    pts.forEach(function (p) {
      if (p.pos < bestPos.pos) bestPos = p;
      if (p.pos > worstPos.pos) worstPos = p;
      if (p.rating > peak.rating) peak = p;
      if (p.rating < trough.rating) trough = p;
    });
    var first = pts[0], last = pts[pts.length - 1];
    return {
      points: pts, first: first, last: last,
      bestPos: bestPos, worstPos: worstPos, peak: peak, trough: trough,
      change: round2(last.rating - first.rating),
      moved: first.pos - last.pos, cycles: pts.length
    };
  }

  // The ladder as it stood after a given cycle, for reading a season back.
  function rankingAt(comp, n) {
    var built = rankingSeries(comp);
    var rows = [];
    var byId = {};
    comp.teams.forEach(function (t) { byId[t.id] = t; });
    built.ids.forEach(function (id) {
      built.series[id].forEach(function (p) {
        if (p.n === n) rows.push({ id: id, team: byId[id], rating: p.rating, pos: p.pos });
      });
    });
    rows.sort(function (a, b) { return a.pos - b.pos; });
    return rows;
  }

  /* ----------------------------------------------------------- qualifying */

  // Each confederation plays its own groups. Group winners go through, then the
  // best of the rest fill that confederation's remaining slots — the shape most
  // of the real regions use.
  // Nations that already hold a place sit qualifying out, and their region's
  // allocation shrinks by however many of them it has. The field size never
  // changes, so anything a region cannot use is passed to the ones that can.
  function qualifyingSlots(comp, order, cfg, auto) {
    var field = 0, rows = [];
    order.forEach(function (confId) {
      var conf = cfg.confs[confId];
      if (!conf) return;
      field += conf.slots;
      // a continental cup names this year's entrants; everyone else in its
      // pool of past qualifiers sits it out
      var only = null;
      if (cfg.entrants) { only = {}; cfg.entrants.forEach(function (id) { only[id] = true; }); }
      var all = comp.teams.filter(function (t) {
        return t.conf === confId && (!only || only[t.id] || auto[t.id]);
      });
      var entrants = all.filter(function (t) { return !auto[t.id]; });
      var already = all.length - entrants.length;
      rows.push({
        conf: confId, name: conf.name, groupSize: conf.groupSize || 0,
        base: conf.slots, already: already, entrants: entrants,
        slots: Math.max(0, Math.min(conf.slots - already, entrants.length))
      });
    });

    var target = Math.max(0, field - Object.keys(auto).length);
    var total = rows.reduce(function (n, r) { return n + r.slots; }, 0);
    // hand any places a region cannot fill to the next-biggest region that can
    var guard = 0;
    while (total < target && guard++ < 500) {
      var takers = rows.filter(function (r) { return r.slots < r.entrants.length; })
        .sort(function (a, b) { return b.base - a.base || b.entrants.length - a.entrants.length; });
      if (!takers.length) break;
      takers[0].slots++;
      total++;
    }
    while (total > target && guard++ < 500) {
      var givers = rows.filter(function (r) { return r.slots > 0; })
        .sort(function (a, b) { return a.base - b.base; });
      if (!givers.length) break;
      givers[0].slots--;
      total--;
    }
    return rows;
  }

  function buildQualifying(comp, rng) {
    var cfg = comp.settings.qualifying;
    if (!cfg) return null;
    var order = cfg.order || Object.keys(cfg.confs);
    var auto = {};
    (comp.autoQualified || []).forEach(function (a) { auto[a.id] = a; });
    var matches = [], plan = [];

    qualifyingSlots(comp, order, cfg, auto).forEach(function (row) {
      var entrants = row.entrants;
      if (!entrants.length || !row.slots) return;

      var size = row.groupSize;
      var groups;
      if (!size || size >= entrants.length) {
        // one league for the whole confederation, the way South America runs it
        groups = [rng.shuffle(entrants.slice())];
      } else {
        groups = makeGroups(entrants, Math.ceil(entrants.length / Math.ceil(entrants.length / size)),
          rng, seedStrength(comp));
      }

      plan.push({
        conf: row.conf, name: row.name, slots: Math.min(row.slots, entrants.length),
        base: row.base, already: row.already,
        groups: groups.map(function (g) { return g.map(function (t) { return t.id; }); })
      });

      groups.forEach(function (g, gi) {
        if (g.length < 2) return;   // a region with one entrant simply takes its place
        var rounds = roundRobin(g.length, rng);
        var all = rounds.concat(rounds.map(function (r) {
          return r.map(function (m) { return [m[1], m[0]]; });
        }));
        all.forEach(function (r, ri) {
          r.forEach(function (m) {
            var mm = mkMatch(g[m[0]].id, g[m[1]].id, ri, 'qual', gi, row.name);
            mm.conf = row.conf;
            matches.push(mm);
          });
        });
      });
    });

    return { matches: matches, plan: plan };
  }

  // How the finals finished, best to worst: knockout rounds won first, then the
  // group record. That is the order the promotion-style rules read from.
  function finalsOrder(comp) {
    var season = comp.season;
    var wins = {}, reached = {};
    season.matches.forEach(function (m) {
      if (m.stage !== 'ko' || !m.played) return;
      var w = m.tieWinner || (m.hg > m.ag ? m.h : m.a);
      reached[m.h] = 1; reached[m.a] = 1;
      wins[w] = (wins[w] || 0) + 1;
    });
    var map = teamsById(comp);
    var field = (season.groups || []).reduce(function (all, g) { return all.concat(g); }, []);
    var table = computeTable(field.map(function (id) { return map[id]; }).filter(Boolean),
      season.matches, comp.settings, function (m) { return m.stage === 'group'; });
    var rank = {};
    table.forEach(function (r, i) { rank[r.id] = i; });
    return field.slice().sort(function (a, b) {
      var wa = wins[a] || 0, wb = wins[b] || 0;
      if (wa !== wb) return wb - wa;
      var ra = reached[a] ? 1 : 0, rb = reached[b] ? 1 : 0;
      if (ra !== rb) return rb - ra;
      return (rank[a] == null ? 999 : rank[a]) - (rank[b] == null ? 999 : rank[b]);
    });
  }

  function groupLetter(i) { return String.fromCharCode(65 + i); }

  // Hosting rotates around the confederations, and the bid usually goes to one of
  // the region's bigger names that has not had it recently.
  function pickHost(comp, rng, seasonNumber) {
    var cfg = comp.settings.qualifying;
    if (!cfg) return null;
    var order = cfg.order || Object.keys(cfg.confs);
    var recent = {};
    (comp.hostHistory || []).slice(-3).forEach(function (h) { recent[h.id] = 1; });
    for (var step = 0; step < order.length; step++) {
      var confId = order[(seasonNumber + step) % order.length];
      var pool = comp.teams.filter(function (t) {
        return t.conf === confId && !recent[t.id];
      }).sort(function (a, b) { return rankingOf(comp, b.id) - rankingOf(comp, a.id); });
      if (pool.length) return { id: pool[rng.int(0, Math.min(5, pool.length - 1))].id, conf: confId };
    }
    return null;
  }

  // Who already has a place in the next edition, and why. Each tournament keeps
  // the rule its real counterpart uses.
  function nextEditionPlaces(comp) {
    var cfg = comp.settings.qualifying;
    if (comp.format !== 'worldcup' || !cfg) return { list: [], host: null };
    var aq = cfg.autoQualify || { mode: 'none' };
    // before the first edition there is nothing to carry over, only a host to name
    var season = comp.season, n = season ? season.number : 0;
    var rng = new RNG(comp.rngState);
    var out = [], seen = {};
    function add(id, via, note) {
      if (!id || seen[id]) return;
      seen[id] = 1;
      out.push({ id: id, via: via, note: note });
    }

    var map = teamsById(comp);
    if (!season) { /* opening edition: fall through to the host */ }
    else if (aq.mode === 'groupTop') {
      var per = aq.perGroup || 2;
      (season.groups || []).forEach(function (g, gi) {
        var t = computeTable(g.map(function (id) { return map[id]; }).filter(Boolean),
          season.matches, comp.settings, function (m) {
            return m.stage === 'group' && m.group === gi;
          });
        t.slice(0, per).forEach(function (r, i) {
          add(r.id, 'pool', (i + 1) + ordinalSuffix(i + 1) + ' in Group ' + groupLetter(gi) + ', ' + n);
        });
      });
    } else if (aq.mode === 'reachedKo') {
      var qs = groupQualifiers(comp);   // ids, in seeding order
      var label = roundName(qs.length).replace(/s$/, '');
      qs.forEach(function (id) { add(id, 'ko', label + 'ist, ' + n); });
    } else if (aq.mode === 'stayUp') {
      var keep = aq.keep || 0;
      finalsOrder(comp).slice(0, keep).forEach(function (id, i) {
        add(id, 'stay', 'Finished ' + (i + 1) + ordinalSuffix(i + 1) + ' in ' + n);
      });
    }

    var host = null;
    if (aq.host) {
      host = pickHost(comp, rng, n + 1);
      if (host) {
        // the hosts go in whatever else happens
        if (seen[host.id]) {
          out.forEach(function (o) { if (o.id === host.id) { o.host = true; } });
        } else {
          add(host.id, 'host', 'Hosts');
        }
      }
    }
    comp.rngState = rng.s;
    return { list: out, host: host };
  }

  function ordinalSuffix(n) {
    if (n % 100 >= 11 && n % 100 <= 13) return 'th';
    return ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
  }

  function qualifyingTables(comp, entry) {
    var map = teamsById(comp);
    return entry.groups.map(function (g, gi) {
      var teams = g.map(function (id) { return map[id]; }).filter(Boolean);
      return computeTable(teams, comp.season.matches, comp.settings, function (m) {
        return m.stage === 'qual' && m.conf === entry.conf && m.group === gi;
      });
    });
  }

  // Winners first, then the best placed behind them, compared on points per game
  // so uneven group sizes stay fair.
  function qualifiedFromConf(comp, entry) {
    var tables = qualifyingTables(comp, entry);
    var out = [];
    if (tables.length === 1) {
      tables[0].slice(0, entry.slots).forEach(function (r) {
        out.push({ id: r.id, conf: entry.conf, via: 'table', pos: r.pos });
      });
      return out;
    }
    // Group winners go through — but a region can hold fewer places than it has
    // groups once sides have kept theirs, and then only the best winners travel.
    var winners = tables.map(function (t) { return t[0]; }).filter(Boolean);
    winners.sort(function (a, b) {
      var ap = a.p ? a.pts / a.p : 0, bp = b.p ? b.pts / b.p : 0;
      return bp - ap || (b.gd - a.gd) || (b.gf - a.gf);
    });
    winners.slice(0, entry.slots).forEach(function (r) {
      out.push({ id: r.id, conf: entry.conf, via: 'winner', pos: 1 });
    });
    var through = {};
    out.forEach(function (q) { through[q.id] = 1; });
    var rest = [];
    tables.forEach(function (t) {
      t.forEach(function (r, i) { if (!through[r.id]) rest.push({ r: r, rank: i + 1 }); });
    });
    rest.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      var ap = a.r.p ? a.r.pts / a.r.p : 0, bp = b.r.p ? b.r.pts / b.r.p : 0;
      return bp - ap || (b.r.gd - a.r.gd) || (b.r.gf - a.r.gf);
    });
    rest.slice(0, Math.max(0, entry.slots - out.length)).forEach(function (x) {
      out.push({ id: x.r.id, conf: entry.conf, via: 'best', pos: x.rank });
    });
    return out;
  }

  function qualifiedTeams(comp) {
    var plan = (comp.season.qualifying || {}).plan || [];
    var map = teamsById(comp);
    var out = [], seen = {};
    function push(q) {
      if (!q.id || seen[q.id] || !map[q.id]) return;
      seen[q.id] = 1;
      out.push(q);
    }
    // the nations who kept their place from last time are already in
    ((comp.season.qualifying || {}).auto || []).forEach(function (a) {
      push({ id: a.id, conf: (map[a.id] || {}).conf || null, via: a.via, note: a.note });
    });
    plan.forEach(function (entry) {
      qualifiedFromConf(comp, entry).forEach(push);
    });
    return out;
  }

  function roundName(teamCount) {
    if (teamCount <= 2) return 'Final';
    if (teamCount === 4) return 'Semi-finals';
    if (teamCount === 8) return 'Quarter-finals';
    if (teamCount === 16) return 'Round of 16';
    if (teamCount === 32) return 'Round of 32';
    if (teamCount === 64) return 'Round of 64';
    return 'Round of ' + teamCount;
  }

  // Build one knockout round from an ordered list of team ids (1 plays last, etc.).
  function buildKoRound(teamIds, md, settings) {
    var n = teamIds.length;
    var matches = [], byes = [];
    // pad up to the next power of two by giving the top seeds byes
    var size = 1; while (size < n) size *= 2;
    var byeCount = size - n;
    var playing = teamIds.slice(byeCount);
    byes = teamIds.slice(0, byeCount);
    var name = roundName(size);
    var tie = 0;
    for (var i = 0; i < playing.length / 2; i++) {
      var h = playing[i], a = playing[playing.length - 1 - i];
      var twoLegs = settings.twoLegs && size > 2;
      var t = 'tie' + md + '-' + (tie++);
      if (twoLegs) {
        var m1 = mkMatch(a, h, md, 'ko', null, name); m1.leg = 1; m1.tie = t;
        var m2 = mkMatch(h, a, md, 'ko', null, name); m2.leg = 2; m2.tie = t;
        matches.push(m1, m2);
      } else {
        var m = mkMatch(h, a, md, 'ko', null, name);
        m.tie = t; m.mustDecide = true;
        matches.push(m);
      }
    }
    return { matches: matches, byes: byes, name: name };
  }

  /* --------------------------------------------------------------- finals */

  var FINALS_SYSTEMS = {
    final8: {
      name: 'Final eight', teams: 8, weeks: 4,
      note: 'NRL and AFL style — the top four get a second chance'
    },
    page4: {
      name: 'Page playoff', teams: 4, weeks: 3,
      note: 'Top four, and the top two get a second chance'
    },
    knockout: {
      name: 'Straight knockout', teams: 0,
      note: 'Seeded bracket — lose once and you are out'
    }
  };

  function seedRank(seeds, id) {
    var i = seeds.indexOf(id);
    return i < 0 ? 9999 : i;
  }
  function bySeed(seeds, ids) {
    return ids.filter(Boolean).slice().sort(function (a, b) {
      return seedRank(seeds, a) - seedRank(seeds, b);
    });
  }
  // The better-placed side hosts.
  function hosted(seeds, a, b) {
    return seedRank(seeds, a) <= seedRank(seeds, b) ? [a, b] : [b, a];
  }
  function byTag(all, tag) {
    for (var i = 0; i < all.length; i++) if (all[i].tag === tag) return all[i];
    return null;
  }
  function tieWinnerOf(m) { return m ? m.tieWinner : null; }
  function tieLoserOf(m) {
    if (!m || !m.tieWinner) return null;
    return m.tieWinner === m.h ? m.a : m.h;
  }
  function pair(seeds, a, b, tag, label) {
    if (!a || !b) return null;
    var h = hosted(seeds, a, b);
    return { h: h[0], a: h[1], tag: tag, label: label };
  }

  // Returns the fixtures for one week of the finals, or null when the series is done.
  function finalsWeek(system, week, seeds, all, size) {
    var s = seeds;
    if (system === 'page4') {
      if (week === 0) {
        return { week: 'Finals week 1', pairs: [
          pair(s, s[0], s[1], 'QF', 'Qualifying final'),
          pair(s, s[2], s[3], 'EF', 'Elimination final')
        ] };
      }
      if (week === 1) {
        return { week: 'Preliminary final', pairs: [
          pair(s, tieLoserOf(byTag(all, 'QF')), tieWinnerOf(byTag(all, 'EF')), 'PF', 'Preliminary final')
        ] };
      }
      if (week === 2) {
        return { week: 'Grand final', pairs: [
          pair(s, tieWinnerOf(byTag(all, 'QF')), tieWinnerOf(byTag(all, 'PF')), 'GF', 'Grand final')
        ] };
      }
      return null;
    }

    if (system === 'final8') {
      if (week === 0) {
        return { week: 'Finals week 1', pairs: [
          pair(s, s[0], s[3], 'QF1', 'Qualifying final'),
          pair(s, s[1], s[2], 'QF2', 'Qualifying final'),
          pair(s, s[4], s[7], 'EF1', 'Elimination final'),
          pair(s, s[5], s[6], 'EF2', 'Elimination final')
        ] };
      }
      if (week === 1) {
        // beaten qualifiers meet the surviving eliminators, best against worst
        var qfL = bySeed(s, [tieLoserOf(byTag(all, 'QF1')), tieLoserOf(byTag(all, 'QF2'))]);
        var efW = bySeed(s, [tieWinnerOf(byTag(all, 'EF1')), tieWinnerOf(byTag(all, 'EF2'))]);
        return { week: 'Semi-finals', pairs: [
          pair(s, qfL[0], efW[1], 'SF1', 'Semi-final'),
          pair(s, qfL[1], efW[0], 'SF2', 'Semi-final')
        ] };
      }
      if (week === 2) {
        var qfW = bySeed(s, [tieWinnerOf(byTag(all, 'QF1')), tieWinnerOf(byTag(all, 'QF2'))]);
        var sfW = bySeed(s, [tieWinnerOf(byTag(all, 'SF1')), tieWinnerOf(byTag(all, 'SF2'))]);
        return { week: 'Preliminary finals', pairs: [
          pair(s, qfW[0], sfW[1], 'PF1', 'Preliminary final'),
          pair(s, qfW[1], sfW[0], 'PF2', 'Preliminary final')
        ] };
      }
      if (week === 3) {
        return { week: 'Grand final', pairs: [
          pair(s, tieWinnerOf(byTag(all, 'PF1')), tieWinnerOf(byTag(all, 'PF2')), 'GF', 'Grand final')
        ] };
      }
      return null;
    }

    // straight knockout: whoever has not lost yet, re-seeded each week
    var alive = seeds.slice(0, size);
    all.forEach(function (m) {
      var l = tieLoserOf(m);
      if (l) alive = alive.filter(function (x) { return x !== l; });
    });
    alive = bySeed(seeds, alive);
    if (alive.length <= 1) return null;

    var full = 1;
    while (full < alive.length) full *= 2;
    var byes = full - alive.length;
    var playing = alive.slice(byes);
    var label = alive.length === 2 ? 'Grand final' : roundName(full);
    var pairs = [];
    for (var i = 0; i < playing.length / 2; i++) {
      pairs.push(pair(seeds, playing[i], playing[playing.length - 1 - i],
                      'K' + week + '-' + i, label));
    }
    return { week: label, pairs: pairs };
  }

  function finalsMatches(season) {
    return season.matches.filter(function (m) { return m.stage === 'finals'; });
  }

  // Turn a week's pairings into real fixtures and append them to the season.
  function appendFinalsWeek(season, spec) {
    var md = matchdaysOf(season);
    spec.pairs.forEach(function (p) {
      if (!p) return;
      var m = mkMatch(p.h, p.a, md, 'finals', null, p.label);
      m.tag = p.tag;
      m.tie = 'f-' + p.tag;
      m.weekLabel = spec.week;
      m.mustDecide = true;   // a final is never drawn
      season.matches.push(m);
    });
  }

  function finalsSize(settings, teamCount) {
    var f = settings.finals || {};
    var sys = FINALS_SYSTEMS[f.system] || FINALS_SYSTEMS.knockout;
    var n = sys.teams || f.size || 4;
    return Math.min(n, teamCount);
  }

  /* --------------------------------------------------------- match engine */

  // Average attack and defence across the field. Ratings are read relative to this,
  // so a league of 90s plays out the same as a league of 50s — only the gaps matter.
  function leagueNorm(teams) {
    var a = 0, d = 0;
    teams.forEach(function (t) { a += t.att; d += t.def; });
    return { att: a / teams.length, def: d / teams.length };
  }
  var NEUTRAL_NORM = { att: 50, def: 50 };

  // Expected number of scoring plays for one side, from the rating gap.
  function expectedPlays(sport, attacker, defender, mult, norm) {
    norm = norm || NEUTRAL_NORM;
    var v = sport.basePlays
      * Math.exp((attacker.att - norm.att) / sport.spread)
      * Math.exp((norm.def - defender.def) / sport.spread);
    // High-scoring sports have a floor and a ceiling: even a poor NBA side scores
    // about a hundred, so mismatches must not compound without limit. The band
    // constrains what the RATINGS can do — venue is applied on top of it, or a
    // home side would sit permanently at the ceiling and the visitor at the floor.
    var band = sport.band;
    if (band) v = clamp(v, sport.basePlays * (1 - band), sport.basePlays * (1 + band));
    v *= mult;
    return clamp(v, sport.basePlays * 0.12, sport.maxPlays);
  }

  // One home-advantage figure means very different things across sports: 15% is
  // a fifth of a goal in football but sixteen points in basketball. Each sport
  // scales the single user-facing setting into its own world.
  function homeMultipliers(sport, settings, neutral) {
    if (neutral) return [1, 1];
    var adv = (settings.homeAdv == null ? 0.15 : settings.homeAdv)
      * (sport.homeAdvScale == null ? 1 : sport.homeAdvScale);
    return [1 + adv, 1 - adv * 0.55];
  }

  // Poisson for low-scoring sports; a tighter normal for high-scoring ones, so a
  // basketball game does not swing like a football match.
  function samplePlays(sport, mean, rng) {
    if (!sport.disp || sport.disp >= 1) return rng.poisson(mean);
    var v = Math.round(mean + rng.gauss() * Math.sqrt(mean) * sport.disp);
    return v < 0 ? 0 : v;
  }

  function pickUnit(sport, rng) {
    var total = 0, i;
    for (i = 0; i < sport.units.length; i++) total += sport.units[i][1];
    var r = rng.next() * total;
    for (i = 0; i < sport.units.length; i++) {
      r -= sport.units[i][1];
      if (r <= 0) return sport.units[i][0];
    }
    return sport.units[0][0];
  }

  // kept for the football-shaped call sites and the settings preview
  function expectedGoals(attacker, defender, mult) {
    return expectedPlays(LS.data.sports.football, attacker, defender, mult);
  }

  /* ------------------------------------------------ injuries & suspensions */

  /* Players get hurt and sent off. Whoever is out misses the next few of his
     side's matches: he cannot score or appear, and the side is weaker by the
     gap between him and whoever comes in. A club with depth shrugs it off; a
     one-star side feels it. Rates are per player in the line-up, per match. */
  var INJURY_RATE = {
    football: 0.009, hockey: 0.007, basketball: 0.006, baseball: 0.004,
    american: 0.012, rugbyleague: 0.016, rugby: 0.016
  };
  // bookings, sendings-off, and how many bookings earn a one-match ban
  var DISCIPLINE = {
    football: { yellow: 0.09, red: 0.004, yellowBan: 5, redBan: [1, 3] },
    rugby: { red: 0.0025, redBan: [2, 4] },
    rugbyleague: { red: 0.002, redBan: [1, 3] },
    hockey: { red: 0.002, redBan: [1, 2] }
  };
  // how far a missing player drags his side down, per point of line-up quality lost
  var ABSENCE_IMPACT = 1.5;

  function injuriesOn(settings) { return !settings || settings.injuries !== false; }

  function isOut(p) { return (p.inj || 0) > 0 || (p.sus || 0) > 0; }

  // Who can take the field. A squad stretched thinner than a line-up sends the
  // walking wounded out anyway, the least hurt first.
  function available(team, sport) {
    var need = Math.min((sport && sport.lineup) || 11, team.players.length);
    var fit = team.players.filter(function (p) { return !isOut(p); });
    if (fit.length >= need) return fit;
    var hurt = team.players.filter(function (p) { return isOut(p) && !(p.sus > 0); })
      .sort(function (x, y) { return (x.inj || 0) - (y.inj || 0); });
    return fit.concat(hurt.slice(0, need - fit.length));
  }

  function topMean(list, n) {
    var top = list.map(function (p) { return p.skill; }).sort(function (x, y) { return y - x; }).slice(0, n);
    return top.length ? top.reduce(function (s, v) { return s + v; }, 0) / top.length : 0;
  }

  // The side's ratings for today, with whoever is missing taken out.
  function strengthNow(team, sport, settings) {
    if (!team || !injuriesOn(settings) || !team.players.some(isOut)) return team;
    var n = Math.min((sport && sport.lineup) || 11, team.players.length);
    var d = (topMean(available(team, sport), n) - topMean(team.players, n)) * ABSENCE_IMPACT;
    return { id: team.id, att: clamp(team.att + d, 20, 99), def: clamp(team.def + d, 20, 99) };
  }

  // A short signature of who is out, so cached prices know when to move.
  function absenceKey(team) {
    if (!team) return '';
    return team.players.filter(isOut).map(function (p) { return p.id + (p.inj || 0) + 's' + (p.sus || 0); }).join(',');
  }

  function injuryWord(n) {
    return n <= 2 ? 'knock' : n <= 6 ? 'strain' : n <= 15 ? 'ligament damage' : 'serious injury';
  }

  // After the whistle: those who sat it out have served a match, and the line-up
  // takes its knocks and its cards for the matches to come.
  function incidents(match, team, side, lineup, out, sport, rng) {
    out.forEach(function (p) {
      if (p.sus > 0) p.sus--;
      else if (p.inj > 0) p.inj--;
    });
    var rate = INJURY_RATE[sport.id] || 0.008;
    var disc = DISCIPLINE[sport.id] || null;
    var end = regulationEnd(clockOf(sport));
    lineup.forEach(function (p) {
      if (disc && disc.red && rng.next() < disc.red) {
        var ban = rng.int(disc.redBan[0], disc.redBan[1]);
        p.sus = (p.sus || 0) + ban;
        match.inc.push({ min: rng.int(10, end), side: side, p: p.id, k: 'red', out: ban });
        return;
      }
      if (disc && disc.yellow && rng.next() < disc.yellow) {
        p.yc = (p.yc || 0) + 1;
        if (disc.yellowBan && p.yc % disc.yellowBan === 0) {
          p.sus = (p.sus || 0) + 1;
          match.inc.push({ min: rng.int(5, end), side: side, p: p.id, k: 'ban', out: 1, yc: p.yc });
        }
      }
      if (rng.next() < rate) {
        var r = rng.next();
        var len = r < 0.55 ? rng.int(1, 2) : r < 0.85 ? rng.int(3, 6) : r < 0.97 ? rng.int(7, 15) : rng.int(16, 30);
        p.inj = Math.max(p.inj || 0, len);
        match.inc.push({ min: rng.int(1, end), side: side, p: p.id, k: 'inj', out: len, what: injuryWord(len) });
      }
    });
  }

  function simulateMatch(match, teamsById, settings, rng, sport, norm) {
    sport = sport || LS.data.sports.football;
    var h = teamsById[match.h], a = teamsById[match.a];
    var neutral = match.stage === 'ko' && settings.neutralKo;
    var mult = homeMultipliers(sport, settings, neutral);
    var hurt = injuriesOn(settings);

    // whoever is missing is decided before kick-off
    if (hurt) {
      h._avail = available(h, sport); a._avail = available(a, sport);
      match.absent = [h, a].map(function (t) {
        return t.players.filter(function (p) { return t._avail.indexOf(p) < 0; }).map(function (p) { return p.id; });
      });
    }
    var lh = expectedPlays(sport, hurt ? strengthNow(h, sport, settings) : h,
      hurt ? strengthNow(a, sport, settings) : a, mult[0], norm);
    var la = expectedPlays(sport, hurt ? strengthNow(a, sport, settings) : a,
      hurt ? strengthNow(h, sport, settings) : h, mult[1], norm);
    try {
      return playOut(match, h, a, lh, la, sport, settings, rng);
    } finally {
      delete h._avail; delete a._avail;
    }
  }

  function playOut(match, h, a, lh, la, sport, settings, rng) {

    match.played = true;
    match.xg = [Math.round(lh * 100) / 100, Math.round(la * 100) / 100];
    match.events = [];
    match.ot = false;

    match.hg = recordScores(match, sport, h, 'h', samplePlays(sport, lh, rng), rng);
    match.ag = recordScores(match, sport, a, 'a', samplePlays(sport, la, rng), rng);

    // sports without draws — and any knockout or final — settle it after the whistle
    if ((!sport.draws || match.mustDecide) && match.hg === match.ag) {
      match.ot = true;
      var side = rng.next() < 0.5 ? 'h' : 'a';
      if (match.mustDecide && sport.shootout) {
        // football settles a knockout on penalties; the score stays level
        match.pens = shootout(rng);
        match.shootoutWinner = match.pens[0] > match.pens[1] ? match.h : match.a;
        match.ot = true;
        match.events.sort(function (x, y) { return x.min - y.min; });
        afterWhistle(match, h, a, sport, settings, rng, false);
        return match;
      }
      var team = side === 'h' ? h : a;
      var extra = sport.id === 'basketball' ? rng.int(2, 6) : 1;
      var got = recordScores(match, sport, team, side, extra, rng, true);
      if (side === 'h') match.hg += got; else match.ag += got;
      // a shared overtime period can still leave it level; nudge until it does not
      var guard = 0;
      while (match.hg === match.ag && guard++ < 20) {
        var g = recordScores(match, sport, team, side, 1, rng, true);
        if (side === 'h') match.hg += g; else match.ag += g;
      }
    }

    match.events.sort(function (x, y) { return x.min - y.min; });
    afterWhistle(match, h, a, sport, settings, rng, match.stage === 'qual');
    return match;
  }

  function afterWhistle(match, h, a, sport, settings, rng, isQual) {
    var lh = countApps(h, rng, sport, isQual), la = countApps(a, rng, sport, isQual);
    match.inc = [];
    if (!injuriesOn(settings)) return;
    var outH = h.players.filter(function (p) { return h._avail.indexOf(p) < 0; });
    var outA = a.players.filter(function (p) { return a._avail.indexOf(p) < 0; });
    incidents(match, h, 'h', lh, outH, sport, rng);
    incidents(match, a, 'a', la, outA, sport, rng);
    match.inc.sort(function (x, y) { return x.min - y.min; });
  }

  /* ---------------------------------------------------------- match clock */

  // Every sport is timed in its own units: football and rugby run in minutes
  // over two halves, hockey in three periods, basketball and the NFL in
  // quarters, baseball in nine innings. Anything without a profile of its own
  // falls back to a football clock so old saves still read sensibly.
  var DEFAULT_CLOCK = {
    length: 90, periods: 2, periodWord: 'Half', unit: 'min', stoppage: 4,
    ot: { length: 30, periods: 2, word: 'Extra time', shortWord: 'ET' }
  };

  function clockOf(sport) {
    return (sport && sport.clock) || DEFAULT_CLOCK;
  }

  // Regulation runs to the end of the clock plus whatever stoppage the sport
  // plays; overtime picks up after that. Times stay on one rising scale so a
  // match still sorts and ticks in order — the labelling puts them back into
  // the numbers a viewer expects (90+3', then 91' once extra time starts).
  function regulationEnd(c) { return c.length + (c.stoppage || 0); }

  function otOf(c) {
    return c.ot || { length: Math.max(1, Math.round(c.length / 6)), periods: 1,
                     word: 'Overtime', shortWord: 'OT' };
  }

  function eventTime(sport, rng, isOt) {
    var c = clockOf(sport);
    if (isOt) return regulationEnd(c) + rng.int(1, Math.max(1, otOf(c).length));
    return rng.int(1, regulationEnd(c));
  }

  // Which period a given time falls in, and how it should be labelled.
  function periodAt(sport, t) {
    var c = clockOf(sport);
    var end = regulationEnd(c);
    if (t > end) {
      var ot = otOf(c);
      var per = Math.max(1, ot.periods || 1);
      var into = Math.min(ot.length, Math.max(1, t - end));
      var n = Math.min(per, Math.ceil((into / Math.max(1, ot.length)) * per));
      return { ot: true, n: n, of: per, word: ot.word || 'Overtime',
               shortWord: ot.shortWord || 'OT' };
    }
    var periods = Math.max(1, c.periods || 1);
    var i = Math.min(periods, Math.max(1, Math.ceil((Math.min(t, c.length) / c.length) * periods)));
    return { ot: false, n: i, of: periods, word: c.periodWord || 'Half',
             shortWord: (c.periodWord || 'Half').slice(0, 1) + i };
  }

  // The time as a viewer would read it off the scoreboard.
  function clockLabel(sport, t) {
    var c = clockOf(sport);
    var end = regulationEnd(c);
    if (c.unit === 'inning') return 'Inn ' + Math.max(1, Math.round(t));
    if (t > end) return (c.length + (t - end)) + "'";
    if (t > c.length) return c.length + '+' + (t - c.length) + "'";
    return t + "'";
  }

  // The full length of a match on the raw scale, extra time included.
  function fullTime(sport, includeOt) {
    var c = clockOf(sport);
    return regulationEnd(c) + (includeOt ? otOf(c).length : 0);
  }

  // Generates `plays` scoring plays, attributes each to a player, returns points added.
  function recordScores(match, sport, team, side, plays, rng, isOt) {
    starPower = sport.starPower || 2.2;
    var total = 0;
    for (var i = 0; i < plays; i++) {
      var value = pickUnit(sport, rng);
      total += value;
      var squad = team._avail || team.players;
      var scorer = weightedPick(rng, squad, scoringWeight, null);
      var assist = rng.next() < 0.68 ? weightedPick(rng, squad, assistWeight, scorer) : null;
      var isQual = match.stage === 'qual';
      if (scorer) {
        scorer.g += value; scorer.cg += value;
        if (isQual) scorer.qg = (scorer.qg || 0) + value;
      }
      if (assist) {
        assist.a++; assist.ca++;
        if (isQual) assist.qa = (assist.qa || 0) + 1;
      }
      match.events.push({
        min: eventTime(sport, rng, isOt),
        side: side, v: value,
        s: scorer ? scorer.id : null,
        a: assist ? assist.id : null
      });
    }
    return total;
  }

  // Credit an appearance to a plausible line-up: the best players, lightly rotated.
  function countApps(team, rng, sport, isQual) {
    var squad = team._avail || team.players;
    var n = Math.min((sport && sport.lineup) || 11, squad.length);
    var pool = squad.slice().sort(function (x, y) { return y.skill - x.skill; })
      .slice(0, Math.min(n + 2, squad.length));
    rng.shuffle(pool);
    var lineup = pool.slice(0, n);
    lineup.forEach(function (p) {
      p.apps++; p.capps++;
      if (isQual) p.qapps = (p.qapps || 0) + 1;
    });
    return lineup;
  }

  function shootout(rng) {
    // sudden-death-ish shootout that always resolves
    var h = 0, a = 0;
    for (var i = 0; i < 5; i++) { if (rng.next() < 0.76) h++; if (rng.next() < 0.76) a++; }
    while (h === a) { if (rng.next() < 0.75) h++; if (rng.next() < 0.75) a++; }
    return [h, a];
  }

  /* ------------------------------------------------------------ standings */

  function blankRow(team) {
    return {
      id: team.id, team: team, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0,
      form: [], cs: 0, fts: 0, otw: 0, otl: 0,
      home: { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
      away: { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 },
      biggestWin: null, biggestLoss: null, streak: null
    };
  }

  function applyResult(row, gf, ga, isHome, settings, ot) {
    var pts = settings.pointsWin == null ? 3 : settings.pointsWin;
    var dpts = settings.pointsDraw == null ? 1 : settings.pointsDraw;
    var otLoss = settings.pointsOtLoss || 0;
    var side = isHome ? row.home : row.away;
    row.p++; side.p++;
    row.gf += gf; row.ga += ga; side.gf += gf; side.ga += ga;
    if (ga === 0) row.cs++;
    if (gf === 0) row.fts++;
    var res;
    if (gf > ga) {
      row.w++; side.w++; row.pts += pts; side.pts += pts; res = 'W';
      if (ot) row.otw++;
    } else if (gf === ga) {
      row.d++; side.d++; row.pts += dpts; side.pts += dpts; res = 'D';
    } else {
      row.l++; side.l++; res = 'L';
      if (ot) { row.otl++; row.pts += otLoss; side.pts += otLoss; }
    }
    row.gd = row.gf - row.ga;
    row.form.push(res);
    var margin = gf - ga;
    if (margin > 0 && (!row.biggestWin || margin > row.biggestWin.margin)) row.biggestWin = { margin: margin, gf: gf, ga: ga };
    if (margin < 0 && (!row.biggestLoss || margin < row.biggestLoss.margin)) row.biggestLoss = { margin: margin, gf: gf, ga: ga };
  }

  function headToHead(rows, matches, settings) {
    // mini-table among the supplied rows only
    var ids = {}, mini = {};
    rows.forEach(function (r) { ids[r.id] = true; mini[r.id] = { pts: 0, gd: 0, gf: 0 }; });
    matches.forEach(function (m) {
      if (!m.played || !ids[m.h] || !ids[m.a]) return;
      var pw = settings.pointsWin == null ? 3 : settings.pointsWin;
      var pd = settings.pointsDraw == null ? 1 : settings.pointsDraw;
      mini[m.h].gf += m.hg; mini[m.h].gd += m.hg - m.ag;
      mini[m.a].gf += m.ag; mini[m.a].gd += m.ag - m.hg;
      if (m.hg > m.ag) mini[m.h].pts += pw;
      else if (m.hg < m.ag) mini[m.a].pts += pw;
      else { mini[m.h].pts += pd; mini[m.a].pts += pd; }
    });
    return mini;
  }

  function computeTable(teams, matches, settings, filter) {
    var rows = {}, order = [];
    teams.forEach(function (t) { rows[t.id] = blankRow(t); order.push(rows[t.id]); });
    var used = [];
    matches.forEach(function (m) {
      if (!m.played) return;
      if (m.stage === 'finals') return;   // the finals series never counts towards the table
      if (filter && !filter(m)) return;
      if (!rows[m.h] || !rows[m.a]) return;
      used.push(m);
      applyResult(rows[m.h], m.hg, m.ag, true, settings, m.ot);
      applyResult(rows[m.a], m.ag, m.hg, false, settings, m.ot);
    });
    order.forEach(function (r) {
      r.form = r.form.slice(-5);
      r.ppg = r.p ? Math.round((r.pts / r.p) * 100) / 100 : 0;
      r.winPct = r.p ? (r.w + r.d * 0.5) / r.p : 0;
    });
    return sortTable(order, used, settings);
  }

  function sortTable(rows, matches, settings) {
    var mode = settings.tiebreak || 'gd';

    if (settings.rankBy === 'winpct') {
      var byPct = rows.slice().sort(function (x, y) {
        if (y.winPct !== x.winPct) return y.winPct - x.winPct;
        if (y.w !== x.w) return y.w - x.w;
        if (y.gd !== x.gd) return y.gd - x.gd;
        return x.team.name.localeCompare(y.team.name);
      });
      byPct.forEach(function (r, i) { r.pos = i + 1; });
      return byPct;
    }

    var sorted = rows.slice().sort(function (x, y) {
      if (y.pts !== x.pts) return y.pts - x.pts;
      if (mode === 'gf') { if (y.gf !== x.gf) return y.gf - x.gf; if (y.gd !== x.gd) return y.gd - x.gd; }
      else { if (y.gd !== x.gd) return y.gd - x.gd; if (y.gf !== x.gf) return y.gf - x.gf; }
      return x.team.name.localeCompare(y.team.name);
    });

    if (mode === 'h2h') {
      // re-sort blocks of teams level on points using their mini-table
      var out = [], i = 0;
      while (i < sorted.length) {
        var j = i;
        while (j + 1 < sorted.length && sorted[j + 1].pts === sorted[i].pts) j++;
        var block = sorted.slice(i, j + 1);
        if (block.length > 1) {
          var mini = headToHead(block, matches, settings);
          block.sort(function (x, y) {
            var mx = mini[x.id], my = mini[y.id];
            if (my.pts !== mx.pts) return my.pts - mx.pts;
            if (my.gd !== mx.gd) return my.gd - mx.gd;
            if (my.gf !== mx.gf) return my.gf - mx.gf;
            if (y.gd !== x.gd) return y.gd - x.gd;
            if (y.gf !== x.gf) return y.gf - x.gf;
            return x.team.name.localeCompare(y.team.name);
          });
        }
        out = out.concat(block);
        i = j + 1;
      }
      sorted = out;
    }
    sorted.forEach(function (r, i) { r.pos = i + 1; });
    return sorted;
  }

  // Position of every team after every matchday — powers the progression chart.
  function positionHistory(teams, matches, settings) {
    var mds = {}, maxMd = -1;
    matches.forEach(function (m) { if (m.played && m.md > maxMd) maxMd = m.md; });
    var series = {};
    teams.forEach(function (t) { series[t.id] = []; });
    for (var md = 0; md <= maxMd; md++) {
      (function (upto) {
        var table = computeTable(teams, matches, settings, function (m) { return m.md <= upto; });
        table.forEach(function (r) { series[r.id].push({ md: upto + 1, pos: r.pos, pts: r.pts }); });
      })(md);
    }
    return { series: series, matchdays: maxMd + 1 };
  }

  /* -------------------------------------------------------- season stats */

  // phase: 'all' (default) | 'qual' | 'finals'. A World Cup's finals figures are
  // the campaign total minus whatever was scored in qualifying.
  function playerPhase(p, phase) {
    var qg = p.qg || 0, qa = p.qa || 0, qapps = p.qapps || 0;
    if (phase === 'qual') return { g: qg, a: qa, apps: qapps };
    if (phase === 'finals') return { g: p.g - qg, a: p.a - qa, apps: p.apps - qapps };
    return { g: p.g, a: p.a, apps: p.apps };
  }

  function topScorers(teams, limit, phase) {
    var all = [];
    teams.forEach(function (t) {
      t.players.forEach(function (p) {
        var s = playerPhase(p, phase);
        if (s.g > 0 || s.a > 0) all.push({ p: p, t: t, g: s.g, a: s.a, apps: s.apps });
      });
    });
    all.sort(function (x, y) {
      if (y.g !== x.g) return y.g - x.g;
      if (y.a !== x.a) return y.a - x.a;
      return x.p.name.localeCompare(y.p.name);
    });
    return limit ? all.slice(0, limit) : all;
  }

  function careerScorers(teams, limit) {
    var all = [];
    teams.forEach(function (t) {
      t.players.forEach(function (p) { if (p.cg > 0) all.push({ p: p, t: t }); });
    });
    all.sort(function (x, y) { return y.p.cg - x.p.cg || y.p.ca - x.p.ca; });
    return limit ? all.slice(0, limit) : all;
  }

  /* ---------------------------------------------------- season lifecycle */

  function newSeason(comp, number) {
    var rng = new RNG(comp.rngState);
    var season = {
      number: number,
      stage: comp.format === 'league' ? 'league'
        : comp.format === 'worldcup' ? 'qual'
        : comp.format === 'groups' ? 'group' : 'ko',
      matches: [],
      groups: null,
      round: 0,
      complete: false,
      champion: null,
      runnerUp: null,
      minorPremier: null,
      finals: null,
      qualifying: null,
      qualified: null
    };

    if (comp.format === 'league') {
      season.matches = buildLeagueFixtures(comp.teams, comp.settings, rng);
    } else if (comp.format === 'worldcup') {
      var auto = comp.autoQualified || [];
      var q = buildQualifying(comp, rng);
      if (q && q.matches.length) {
        season.matches = q.matches;
        season.qualifying = { plan: q.plan, auto: auto, host: comp.host || null };
      } else {
        // nobody left to play a qualifier — either there is no confederation data
        // or every place is already spoken for, so go straight to the finals
        var map = teamsById(comp);
        var field = auto.length
          ? auto.map(function (a) { return map[a.id]; }).filter(Boolean)
          : comp.teams;
        season.qualifying = auto.length ? { plan: [], auto: auto, host: comp.host || null } : null;
        season.qualified = auto.length
          ? auto.map(function (a) {
              return { id: a.id, conf: (map[a.id] || {}).conf || null, via: a.via, note: a.note };
            })
          : null;
        season.stage = 'group';
        var fg = makeGroups(field, comp.settings.groupSize || 4, rng, seedStrength(comp));
        season.groups = fg.map(function (g) { return g.map(function (t) { return t.id; }); });
        season.matches = buildGroupFixtures(fg, comp.settings, rng, 0);
      }
    } else if (comp.format === 'groups') {
      var groups = makeGroups(comp.teams, comp.settings.groupSize || 4, rng);
      season.groups = groups.map(function (g) { return g.map(function (t) { return t.id; }); });
      season.matches = buildGroupFixtures(groups, comp.settings, rng);
    } else {
      var seeded = comp.teams.slice().sort(function (x, y) { return (y.att + y.def) - (x.att + x.def); });
      var r = buildKoRound(seeded.map(function (t) { return t.id; }), 0, comp.settings);
      season.matches = r.matches;
      season.byes = r.byes;
      season.koRound = 0;
    }
    comp.rngState = rng.s;
    return season;
  }

  function matchdaysOf(season) {
    var max = -1;
    season.matches.forEach(function (m) { if (m.md > max) max = m.md; });
    return max + 1;
  }

  function pendingInRound(season, md) {
    return season.matches.filter(function (m) { return m.md === md && !m.played; });
  }

  function teamsById(comp) {
    var map = {};
    comp.teams.forEach(function (t) { map[t.id] = t; });
    return map;
  }

  // Anything that wants to read a match the moment it is played (the
  // milestone engine) registers here. Hooks see the state either side of a
  // batch of matches and never touch the RNG, so results are unchanged.
  var hooks = {};
  function hookBefore(comp, due) { return hooks.before ? hooks.before(comp, due) : null; }
  function hookAfter(comp, due, snap) { if (hooks.after) hooks.after(comp, due, snap); }

  // Simulate every unplayed match in the current round. Returns the matches played.
  function playRound(comp) {
    var season = comp.season;
    if (season.complete) return [];
    var rng = new RNG(comp.rngState);
    var map = teamsById(comp);
    var due = pendingInRound(season, season.round);
    if (!due.length) { advance(comp, rng); comp.rngState = rng.s; return []; }
    var sport = sportOf(comp), norm = leagueNorm(comp.teams);
    var snap = hookBefore(comp, due);
    due.forEach(function (m) { simulateMatch(m, map, comp.settings, rng, sport, norm); });
    resolveTies(season, due, rng);
    rankMatches(comp, due);
    advance(comp, rng);
    comp.rngState = rng.s;
    hookAfter(comp, due, snap);
    return due;
  }

  // Play a single specific match (used by "sim next match").
  function playMatch(comp, matchId) {
    var season = comp.season;
    var m = null;
    for (var i = 0; i < season.matches.length; i++) if (season.matches[i].id === matchId) m = season.matches[i];
    if (!m || m.played) return null;
    var rng = new RNG(comp.rngState);
    var snap = hookBefore(comp, [m]);
    simulateMatch(m, teamsById(comp), comp.settings, rng, sportOf(comp), leagueNorm(comp.teams));
    resolveTies(season, [m], rng);
    rankMatches(comp, [m]);
    advance(comp, rng);
    comp.rngState = rng.s;
    hookAfter(comp, [m], snap);
    return m;
  }

  function nextMatch(comp) {
    var season = comp.season;
    for (var i = 0; i < season.matches.length; i++) {
      var m = season.matches[i];
      if (!m.played && m.md === season.round) return m;
    }
    return null;
  }

  // Ties need a winner. A single game decides itself; a two-legged tie is settled
  // on aggregate, and on penalties if that is level too.
  function resolveTies(season, played, rng) {
    played.forEach(function (m) {
      if (m.stage === 'finals') {
        m.winner = m.shootoutWinner || (m.hg > m.ag ? m.h : m.a);
        m.tieWinner = m.winner;
        return;
      }
      if (m.stage !== 'ko') return;
      var legs = season.matches.filter(function (x) { return x.tie === m.tie; });
      var allPlayed = legs.every(function (x) { return x.played; });
      if (!allPlayed) return;
      var agg = {};
      agg[legs[0].h] = 0; agg[legs[0].a] = 0;
      legs.forEach(function (x) {
        agg[x.h] = (agg[x.h] || 0) + x.hg;
        agg[x.a] = (agg[x.a] || 0) + x.ag;
      });
      var ids = Object.keys(agg);
      var last = legs[legs.length - 1];
      if (last.shootoutWinner) {
        last.winner = last.shootoutWinner;
      } else if (agg[ids[0]] === agg[ids[1]]) {
        var pens = shootout(rng);
        // pens are recorded on the decisive leg, home side first
        last.pens = pens;
        last.winner = pens[0] > pens[1] ? last.h : last.a;
      } else {
        last.winner = agg[ids[0]] > agg[ids[1]] ? ids[0] : ids[1];
      }
      legs.forEach(function (x) { x.tieWinner = last.winner; });
    });
  }

  // Move the season on: next matchday, next knockout round, or finish.
  function advance(comp, rng) {
    var season = comp.season;
    var total = matchdaysOf(season);
    while (season.round < total && pendingInRound(season, season.round).length === 0) season.round++;
    if (season.round < total) return;

    if (season.stage === 'league') {
      var fset = comp.settings.finals;
      if (fset && fset.enabled) {
        var ftable = computeTable(comp.teams, season.matches, comp.settings);
        var size = finalsSize(comp.settings, ftable.length);
        var spec = size >= 2
          ? finalsWeek(fset.system, 0, ftable.map(function (r) { return r.id; }), [], size)
          : null;
        if (spec && spec.pairs.filter(Boolean).length) {
          season.minorPremier = ftable[0].id;
          season.finals = {
            system: fset.system, size: size, week: 0,
            seeds: ftable.map(function (r) { return r.id; })
          };
          appendFinalsWeek(season, spec);
          season.stage = 'finals';
          return;
        }
      }
      finishSeason(comp);
      return;
    }

    if (season.stage === 'finals') {
      var f = season.finals;
      var all = finalsMatches(season);
      f.week++;
      var next = finalsWeek(f.system, f.week, f.seeds, all, f.size);
      if (!next || !next.pairs.filter(Boolean).length) {
        var decider = null;
        all.forEach(function (m) { if (m.played) decider = m; });
        finishSeason(comp, decider ? decider.tieWinner : null,
          decider ? (decider.tieWinner === decider.h ? decider.a : decider.h) : null);
        return;
      }
      appendFinalsWeek(season, next);
      return;
    }

    if (season.stage === 'qual') {
      // qualifying is done: draw the finals from whoever came through
      var through = qualifiedTeams(comp);
      season.qualified = through;
      var qmap = teamsById(comp);
      var qTeams = through.map(function (q) { return qmap[q.id]; }).filter(Boolean);
      if (qTeams.length < 4) { finishSeason(comp); return; }
      var fgroups = makeGroups(qTeams, comp.settings.groupSize || 4, rng, seedStrength(comp));
      season.groups = fgroups.map(function (g) { return g.map(function (t) { return t.id; }); });
      season.matches = season.matches.concat(
        buildGroupFixtures(fgroups, comp.settings, rng, total));
      season.stage = 'group';
      return;
    }

    if (season.stage === 'group') {
      // build the knockout bracket from the group winners
      var qualifiers = groupQualifiers(comp);
      if (qualifiers.length < 2) { finishSeason(comp); return; }
      var r = buildKoRound(qualifiers, total, comp.settings);
      season.matches = season.matches.concat(r.matches);
      season.stage = 'ko';
      season.byes = r.byes;
      return;
    }

    if (season.stage === 'ko') {
      var lastRound = season.matches.filter(function (m) { return m.stage === 'ko' && m.md === season.round - 1; });
      if (!lastRound.length) { finishSeason(comp); return; }
      var winners = [], seen = {};
      (season.byes || []).forEach(function (b) { if (!seen[b]) { seen[b] = 1; winners.push(b); } });
      lastRound.forEach(function (m) {
        if (m.tieWinner && !seen[m.tieWinner]) { seen[m.tieWinner] = 1; winners.push(m.tieWinner); }
      });
      if (winners.length <= 1) {
        var final = lastRound[lastRound.length - 1];
        finishSeason(comp, final ? final.tieWinner : null, final ? (final.tieWinner === final.h ? final.a : final.h) : null);
        return;
      }
      var nr = buildKoRound(winners, season.round, comp.settings);
      season.matches = season.matches.concat(nr.matches);
      season.byes = nr.byes;
    }
  }

  function groupQualifiers(comp) {
    var season = comp.season;
    var perGroup = comp.settings.qualifyPerGroup || 2;
    var bestThirds = comp.settings.qualifyBestThirds || 0;
    var map = teamsById(comp);
    var out = [], spare = [];
    (season.groups || []).forEach(function (g, gi) {
      var gTeams = g.map(function (id) { return map[id]; });
      var table = computeTable(gTeams, season.matches, comp.settings, function (m) {
        return m.stage === 'group' && m.group === gi;
      });
      table.slice(0, perGroup).forEach(function (r, ri) {
        out.push({ id: r.id, rank: ri, pts: r.pts, gd: r.gd, gf: r.gf });
      });
      // the 48-team format also takes the best third-placed sides
      if (bestThirds && table[perGroup]) {
        var r3 = table[perGroup];
        spare.push({ id: r3.id, rank: perGroup, pts: r3.pts, gd: r3.gd, gf: r3.gf });
      }
    });
    if (bestThirds) {
      spare.sort(function (x, y) { return y.pts - x.pts || y.gd - x.gd || y.gf - x.gf; });
      spare.slice(0, bestThirds).forEach(function (s) { out.push(s); });
    }
    // seed across groups: all group winners first, then all runners-up
    out.sort(function (x, y) { return x.rank - y.rank || y.pts - x.pts || y.gd - x.gd || y.gf - x.gf; });
    return out.map(function (o) { return o.id; });
  }

  function finishSeason(comp, championId, runnerUpId) {
    var season = comp.season;
    season.complete = true;
    if (comp.format === 'league') {
      var table = computeTable(comp.teams, season.matches, comp.settings);
      // the table always crowns a minor premier; a finals series decides the title
      season.minorPremier = table[0] ? table[0].id : null;
      if (championId) {
        season.champion = championId;
        season.runnerUp = runnerUpId || null;
      } else {
        season.champion = table[0] ? table[0].id : null;
        season.runnerUp = table[1] ? table[1].id : null;
      }
    } else {
      season.champion = championId || null;
      season.runnerUp = runnerUpId || null;
    }
  }

  // opts.stopAtFinals pauses the moment a league season hands over to its finals
  // series, so the run home can be played week by week.
  function simulateSeason(comp, opts) {
    if (typeof opts === 'number') opts = { guard: opts };
    opts = opts || {};
    var played = 0, limit = opts.guard || 5000;
    var startStage = comp.season.stage;
    while (!comp.season.complete && limit-- > 0) {
      if (opts.beforeRound) opts.beforeRound(comp, comp.season.round);
      var r = playRound(comp);
      played += r.length;
      if (!r.length && comp.season.complete) break;
      if (opts.stopAtFinals && comp.season.stage === 'finals' && startStage !== 'finals') break;
    }
    return played;
  }

  /* ---------------------------------------------------- skill evolution */

  var EVOLUTION = {
    fixed: 'Skills stay exactly as you set them',
    semi: 'Small random drift of up to ±3 each season',
    random: 'Wild swings of up to ±8 each season',
    performance: 'Beat what your rating expected and you improve; fall short and you slip',
    balanced: 'Ratings drift towards the league average, so the field tightens'
  };

  /* ------------------------------------------------------------ wildcards */

  // Every so often a squad clicks — a generation comes through together — or it
  // falls apart. A run lasts a few seasons and then most of it fades, which is
  // what actually happens to a golden generation.
  var WILD_CHANCE = 0.05, WILD_GOOD = 0.6, WILD_KEEP = 0.4;

  // How far a team can sit from the field before the pull back starts, how hard
  // it pulls once it does, and the ends of the scale nothing settles past.
  var EVO_BAND = 24, EVO_PULL = 0.35, EVO_BEAT = 2.4, EVO_TILT = 2, EVO_NOISE = 0.8;
  var EVO_CEIL = 90, EVO_FLOOR = 30, EVO_EDGE = 0.5;

  function bandPull(gap) {
    if (gap > EVO_BAND) return -(gap - EVO_BAND) * EVO_PULL;
    if (gap < -EVO_BAND) return -(gap + EVO_BAND) * EVO_PULL;
    return 0;
  }

  function edgePull(v) {
    if (v > EVO_CEIL) return -(v - EVO_CEIL) * EVO_EDGE;
    if (v < EVO_FLOOR) return (EVO_FLOOR - v) * EVO_EDGE;
    return 0;
  }

  function wildStar(rng, team, sport) {
    var slots = sport.positions || LS.data.sports.football.positions;
    // the star arrives in whichever position scores the most in this sport
    var best = slots[0];
    slots.forEach(function (s) { if (s[2] > best[2]) best = s; });
    var pool = team.players.filter(function (p) { return p.pos === best[0]; });
    if (!pool.length) pool = team.players;
    pool.sort(function (x, y) { return x.skill - y.skill; });
    var out = pool[0];
    out.name = rng.pick(LS.data.firstNames) + ' ' + rng.pick(LS.data.lastNames);
    out.skill = clamp(Math.round(88 + rng.int(0, 8)), 25, 99);
    out.wild = true;
    out.seasons = 0;
    return out;
  }

  // How much of a run's lift a side keeps once it is over. Every setting but
  // Fixed lets some of it stick, because ratings are meant to move there. Under
  // Fixed the whole thing is handed back, so a wildcard is a loan and the
  // ratings you set are the ratings you end up with.
  function wildKeep(comp) {
    return (comp.settings.evolution || 'fixed') === 'fixed' ? 0 : WILD_KEEP;
  }

  function wildcardsOn(comp) {
    return comp.settings.wildcards !== false;
  }

  function rollWildcards(comp, rng, season) {
    // Switching the setting off stops new runs; one already going still winds
    // down properly, so its lift is handed back rather than left on the books.
    var allow = wildcardsOn(comp);
    var keep = wildKeep(comp);
    var sport = sportOf(comp);
    comp.teams.forEach(function (t) {
      if (t.surge) {
        t.surge.left--;
        if (t.surge.left > 0) return;
        // The run ends. Hand back what was actually applied rather than what was
        // rolled, so a side that hit the top or bottom of the scale on the way up
        // returns to where it started instead of drifting.
        var got = t.surge.applied || [t.surge.size, t.surge.size];
        t.att = clamp(t.att - (got[0] - Math.round(got[0] * keep)), 20, 99);
        t.def = clamp(t.def - (got[1] - Math.round(got[1] * keep)), 20, 99);
        t.players.forEach(function (p) {
          if (!p.wild) return;
          p.wild = false;
          p.skill = clamp(p.skill - rng.int(8, 16), 25, 99);
        });
        t.surge = null;
        return;
      }
      if (!allow || rng.next() >= WILD_CHANCE) return;
      var good = rng.next() < WILD_GOOD;
      var size = good ? rng.int(5, 10) : -rng.int(4, 8);
      var wasA = t.att, wasD = t.def;
      t.att = clamp(t.att + size, 20, 99);
      t.def = clamp(t.def + size, 20, 99);
      t.surge = {
        kind: good ? 'golden' : 'slump',
        size: size, left: rng.int(2, 4), from: season, star: null,
        applied: [t.att - wasA, t.def - wasD]
      };
      if (good) t.surge.star = wildStar(rng, t, sport).name;
    });
  }

  function evolveTeams(comp, finalTable) {
    var rng = new RNG(comp.rngState);
    var mode = comp.settings.evolution || 'fixed';
    var n = comp.teams.length;
    var rows = {};
    (finalTable || []).forEach(function (r) { rows[r.id] = r; });

    var meanAtt = 0, meanDef = 0;
    comp.teams.forEach(function (t) { meanAtt += t.att; meanDef += t.def; });
    meanAtt /= n; meanDef /= n;

    // What each side did against what a side of its rating usually does. Fitting
    // results to ratings and reading the residual keeps the measure honest at the
    // ends of the table: finishing top when you were rated top is meeting
    // expectations, not beating them, and the strong are not quietly punished for
    // having nowhere left to climb.
    var pts = [], rate = [], ids = [];
    (finalTable || []).forEach(function (r) {
      var t = null;
      comp.teams.forEach(function (x) { if (x.id === r.id) t = x; });
      if (!t || !r.p) return;
      ids.push(r.id); rate.push((t.att + t.def) / 2); pts.push(r.pts / r.p);
    });
    var beatOf = {};
    if (ids.length > 2) {
      var mx = 0, my = 0, i;
      for (i = 0; i < ids.length; i++) { mx += rate[i]; my += pts[i]; }
      mx /= ids.length; my /= ids.length;
      var sxy = 0, sxx = 0, syy = 0;
      for (i = 0; i < ids.length; i++) {
        sxy += (rate[i] - mx) * (pts[i] - my);
        sxx += (rate[i] - mx) * (rate[i] - mx);
        syy += (pts[i] - my) * (pts[i] - my);
      }
      var slope = sxx > 0 ? sxy / sxx : 0;
      var sd = Math.sqrt(syy / ids.length) || 1;
      for (i = 0; i < ids.length; i++) {
        beatOf[ids[i]] = (pts[i] - (my + slope * (rate[i] - mx))) / sd;
      }
    }

    // the field's own scoring rate, so attack and defence are judged against it
    var gfTotal = 0, gaTotal = 0, played = 0;
    (finalTable || []).forEach(function (r) { gfTotal += r.gf; gaTotal += r.ga; played += r.p; });
    var perMatch = played ? gfTotal / played : 0;

    comp.teams.forEach(function (t) {
      var dA = 0, dD = 0;
      if (mode === 'semi') { dA = rng.int(-3, 3); dD = rng.int(-3, 3); }
      else if (mode === 'random') { dA = rng.int(-8, 8); dD = rng.int(-8, 8); }
      else if (mode === 'performance') {
        var row = rows[t.id];
        var beat = beatOf[t.id] || 0;
        var scored = 0, conceded = 0;
        if (row && row.p && perMatch > 0) {
          scored = (row.gf / row.p) / perMatch - 1;
          conceded = 1 - (row.ga / row.p) / perMatch;
        }
        // Beating expectation sets how much a side moves. Whether it scored more
        // than it let in only decides which end of the side the change lands on —
        // a dominant team that merely meets expectations is not rewarded for
        // outscoring a field it is already better than.
        var move = clamp(beat, -2, 2) * EVO_BEAT + rng.gauss() * EVO_NOISE;
        var tilt = clamp(scored - conceded, -1, 1) * EVO_TILT;
        // No pull towards the middle inside the normal band — a strong side that
        // keeps meeting expectations has no reason to fall back. Past the band, and
        // near the ends of the scale, the pull bites.
        dA = move + tilt + bandPull(t.att - meanAtt) + edgePull(t.att);
        dD = move - tilt + bandPull(t.def - meanDef) + edgePull(t.def);
        dA = Math.round(dA); dD = Math.round(dD);
      } else if (mode === 'balanced') {
        dA = Math.round((meanAtt - t.att) * 0.18) + rng.int(-2, 2);
        dD = Math.round((meanDef - t.def) * 0.18) + rng.int(-2, 2);
      }
      t.att = clamp(t.att + dA, 20, 99);
      t.def = clamp(t.def + dD, 20, 99);
    });

    // Every setting can have wildcards, Fixed included — there the whole run is
    // handed back at the end, so "skills stay exactly as you set them" still holds.
    rollWildcards(comp, rng, comp.season ? comp.season.number : 0);

    // squads move on too: a little drift, and the weakest two make way for new faces
    comp.teams.forEach(function (t) {
      t.players.forEach(function (p) {
        p.skill = clamp(p.skill + rng.int(-3, 3), 25, 99);
        p.seasons++;
        p.g = 0; p.a = 0; p.apps = 0;
        p.qg = 0; p.qa = 0; p.qapps = 0;
        // the summer clears bans and bookings and heals all but the worst
        p.sus = 0; p.yc = 0;
        if (p.inj) p.inj = Math.max(0, p.inj - 8);
      });
