      '</div><div class="card-body"><div class="bracket">' + cols + '</div></div></div>';
  }

  /* --------------------------------------------------------- qualifying */

  function qualifyingCard(comp) {
    var season = comp.season;
    var plan = (season.qualifying || {}).plan || [];
    if (!plan.length) return heldPlacesCard(comp);
    var map = E.teamsById(comp);
    var done = season.stage !== 'qual';
    var totalSlots = plan.reduce(function (s, e) { return s + e.slots; }, 0);
    var played = season.matches.filter(function (m) { return m.stage === 'qual' && m.played; }).length;
    var all = season.matches.filter(function (m) { return m.stage === 'qual'; }).length;

    var anyPlayed = played > 0;
    var cards = plan.map(function (entry) {
      var through = {};
      E.qualifiedFromConf(comp, entry).forEach(function (q) { through[q.id] = true; });
      var tables = E.qualifyingTables(comp, entry);
      var multi = tables.length > 1;
      var body = tables.map(function (t, gi) {
        return (multi ? '<div class="section-title" style="padding:11px 14px 0">Group ' +
            String.fromCharCode(65 + gi) + '</div>' : '') +
          // nothing is highlighted until a ball has been kicked
          standingsTable(comp, t, { compact: true, through: anyPlayed ? through : null });
      }).join('');
      var namesThrough = Object.keys(through).map(function (id) {
        return map[id] ? map[id].abbr : '';
      }).filter(Boolean);
      return '<div class="card">' +
        '<div class="card-head"><h3>' + esc(entry.name) + '</h3>' +
        '<span class="badge">' + entry.slots + ' place' + (entry.slots > 1 ? 's' : '') + '</span>' +
        (done ? '<span class="badge badge-accent">' + esc(namesThrough.join(' ')) + '</span>' : '') +
        '</div>' + body +
        '<div class="zone-key">' + (multi
          ? 'Group winners go through, then the best of the rest fill the remaining places.'
          : 'One league — the top ' + entry.slots + ' go through.') +
          (anyPlayed && !done ? ' Highlighted as it stands.' : '') + '</div>' +
      '</div>';
    }).join('');

    var head =
      '<div class="card"><div class="card-body">' +
        '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px">' +
          '<h2>Qualifying</h2>' +
          '<span class="badge">' + (comp.continental
            ? ((comp.settings.qualifying || {}).entrants || []).length + ' ' + (comp.osg ? 'campuses' : 'clubs')
            : comp.teams.length + ' nations') + ' chasing ' + totalSlots + ' places</span>' +
        '</div>' +
        '<div class="progress"><i style="width:' + pct(played, all) + '%"></i></div>' +
        '<div class="small muted" style="margin-top:8px">' +
        (done ? 'Qualifying complete — the finals draw is made.'
              : played + ' of ' + all + ' qualifiers played across ' + plan.length + ' regions.') +
        '</div>' +
      '</div></div>';

    // a continental cup shows who is already through on its own field card
    var held = comp.continental ? '' : heldPlacesCard(comp) + qualifiedSummary(comp);
    return '<div class="stack">' + head + held +
      '<div class="grid grid-2">' + cards + '</div>' +
      (comp.rankings ? rankingsCard(comp, 10, true) : '') + '</div>';
  }

  function qualifiedSummary(comp) {
    var season = comp.season;
    if (!season.qualified || !season.qualified.length) return '';
    var map = E.teamsById(comp);
    var plan = (season.qualifying || {}).plan || [];
    var byConf = {};
    season.qualified.forEach(function (q) { (byConf[q.conf] = byConf[q.conf] || []).push(q); });

    // who was here last time, so newcomers stand out
    var last = comp.history.length ? comp.history[comp.history.length - 1] : null;
    var wasThere = {};
    if (last && last.qualified) {
      last.qualified.forEach(function (q) {
        var t = comp.teams[q.t];
        if (t) wasThere[t.id] = true;
      });
    }

    var rows = plan.map(function (entry) {
      var list = byConf[entry.conf] || [];
      return '<div class="honour" style="align-items:flex-start">' +
        '<span class="tiny muted" style="min-width:96px;padding-top:3px">' + esc(entry.name) + '</span>' +
        '<span style="display:flex;flex-wrap:wrap;gap:5px">' + list.map(function (q) {
          var t = map[q.id];
          if (!t) return '';
          var isNew = last && !wasThere[t.id];
          return '<span class="badge' + (isNew ? ' badge-accent' : '') + '" title="' +
            esc(t.name) + (isNew ? ' — first time back since last cycle' : '') + '">' +
            kit(t) + ' ' + esc(t.abbr) + (isNew ? ' ★' : '') + '</span>';
        }).join('') + '</span></div>';
    }).join('');

    var newcomers = season.qualified.filter(function (q) {
      return last && !wasThere[q.id];
    }).length;

    return '<div class="card"><div class="card-head"><h3>Through to the finals</h3>' +
      '<span class="badge">' + season.qualified.length + ' nations</span>' +
      (last ? '<span class="badge badge-accent">★ ' + newcomers + ' new since last time</span>' : '') +
      '</div><div class="card-body">' + rows + '</div></div>';
  }

  /* -------------------------------------------------------- wildcard runs */

  function surgeLabel(t) {
    if (!t.surge) return '';
    return t.surge.kind === 'golden' ? 'Golden generation' : 'Bad run';
  }

  function surgeNote(t) {
    if (!t.surge) return '';
    var s = t.surge;
    var left = s.left + ' more season' + (s.left === 1 ? '' : 's');
    return s.kind === 'golden'
      ? 'A generation has come through together \u2014 ' + (s.size > 0 ? '+' + s.size : s.size) +
        ' since season ' + s.from + (s.star ? ', led by ' + s.star : '') + '. ' + left + ' of it.'
      : 'The squad has fallen away \u2014 ' + s.size + ' since season ' + s.from + '. ' + left + ' of it.';
  }

  function surgeBadge(t) {
    if (!t.surge) return '';
    return '<span class="badge ' + (t.surge.kind === 'golden' ? 'badge-accent' : 'badge-amber') +
      ' tiny" title="' + esc(surgeNote(t)) + '">' +
      (t.surge.kind === 'golden' ? '\u2605 ' : '\u25bc ') + esc(surgeLabel(t)) + '</span>';
  }

  /* --------------------------------------------------------- manager mode */

  // A small coloured chip wherever a claimed team's name appears \u2014 the badge
  // is the only thing that tells the two sides of the table apart.
  function managerBadge(comp, teamId) {
    if (!M) return '';
    var m = M.managerFor(comp, teamId);
    if (!m) return '';
    return '<span class="badge tiny mgr-badge" style="background:' +
      'color-mix(in srgb, ' + esc(m.color) + ' 20%, transparent);color:' + esc(m.color) +
      '" title="' + esc(m.name) + '\u2019s team">' + esc(m.name) + '</span>';
  }

  function managerRow(comp, m) {
    var map = E.teamsById(comp);
    var t = m.teamId ? map[m.teamId] : null;
    var teamOpts = '<option value="">\u2014 pick a team \u2014</option>' + comp.teams.map(function (x) {
      var taken = M.managerFor(comp, x.id);
      return '<option value="' + x.id + '"' + (m.teamId === x.id ? ' selected' : '') +
        (taken && taken.id !== m.id ? ' disabled' : '') + '>' +
        esc(x.name) + (taken && taken.id !== m.id ? ' \u2014 ' + esc(taken.name) : '') + '</option>';
    }).join('');
    return '<div class="mgr-row">' +
      '<span class="mgr-dot" style="background:' + esc(m.color) + '"></span>' +
      '<input type="text" value="' + esc(m.name) + '" data-act="manager-name" data-id="' + m.id +
        '" aria-label="Manager name" style="max-width:150px">' +
      (t ? kit(t) : '') +
      '<select data-act="manager-team" data-id="' + m.id + '" aria-label="' + esc(m.name) + '\u2019s team">' +
        teamOpts + '</select>' +
      '<button class="btn btn-sm btn-ghost" data-act="manager-remove" data-id="' + m.id + '" ' +
        'aria-label="Remove ' + esc(m.name) + '">\u2715</button>' +
      '</div>';
  }

  function managersCard(comp) {
    if (!M) return '';
    var list = M.ensure(comp);
    var draft = comp.managerDraft;
    var rows = list.map(function (m) { return managerRow(comp, m); }).join('');
    var addBtn = list.length < M.MAX_MANAGERS
      ? '<button class="btn btn-sm" data-act="manager-add">+ Add a manager</button>' : '';
    var draftBtn = (list.length === M.MAX_MANAGERS && list.every(function (m) { return !m.teamId; }) && !draft)
      ? '<button class="btn btn-sm btn-primary" data-act="manager-draft-start">Start a draft instead</button>' : '';

    var draftBox = draft ? (function () {
      var turn = M.draftTurn(comp);
      return '<div class="mgr-draft-live"><p class="small strong" style="margin:0 0 8px">' +
        (turn ? esc(turn.name) + '\u2019s pick' : 'Draft in progress') + '</p>' +
        '<button class="btn btn-sm" data-act="manager-draft-open">Open the draft board</button> ' +
        '<button class="btn btn-sm btn-ghost" data-act="manager-draft-cancel">Cancel draft</button></div>';
    })() : '';

    return '<div class="card"><div class="card-head"><h3>Two-player mode</h3>' +
      (M.ready(comp) ? '<span class="badge badge-accent">Ready</span>' : '') +
      '</div><div class="card-body">' +
      '<p class="small" style="margin:0 0 14px">Name two managers and give each one a team to follow. ' +
      'There is no in-match control \u2014 every fixture plays out the same way regardless \u2014 but their ' +
      'results, table position and head-to-head record are tracked apart from everyone else\u2019s, ' +
      'so a couch head-to-head has something to actually watch.</p>' +
      (rows || '<p class="small muted" style="margin:0 0 12px">No managers yet.</p>') +
      '<div class="btn-row" style="margin-top:' + (rows ? '14px' : '0') + '">' + addBtn + draftBtn + '</div>' +
      draftBox +
      '</div></div>';
  }

  function showManagerDraft(comp) {
    var draft = comp.managerDraft;
    if (!draft) { closeModal(); return; }
    var turn = M.draftTurn(comp);
    var body = '<p class="small" style="margin:0 0 14px">' +
      (turn ? '<b>' + esc(turn.name) + '</b>\u2019s pick \u2014 choose a team.' : 'Draft complete.') + '</p>' +
      '<div class="preset-grid">' + comp.teams.map(function (t) {
        var taken = M.managerFor(comp, t.id);
        return '<button class="preset" data-act="manager-draft-pick" data-id="' + t.id + '"' +
          (taken ? ' disabled' : '') + '>' +
          '<div class="flag">' + kit(t, true) + '</div>' +
          '<div class="nm">' + esc(t.name) + '</div>' +
          '<div class="sub">' + (taken ? 'Taken by ' + esc(taken.name) : esc(t.abbr)) + '</div></button>';
      }).join('') + '</div>';
    modal('The draft', body,
      '<div class="btn-row" style="margin-top:16px">' +
      '<button class="btn btn-ghost" data-act="manager-draft-cancel">Cancel draft</button></div>');
  }

  // Only rendered once both managers hold a team \u2014 half a manager battle
  // is not a battle.
  function managerBattleCard(comp) {
    if (!M || !M.ready(comp)) return '';
    var list = M.ensure(comp);
    var map = E.teamsById(comp);
    var table = liveTable(comp);
    var posOf = {}; table.forEach(function (r) { posOf[r.id] = r; });
    var idx = {}; comp.teams.forEach(function (t, i) { idx[t.id] = i; });
    var h2h = S.headToHead(comp, idx[list[0].teamId], idx[list[1].teamId]);

    var rows = list.map(function (m) {
      var t = map[m.teamId];
      var r = posOf[t.id];
      return '<div class="honour" style="padding:8px 0">' +
        '<span class="mgr-dot" style="background:' + esc(m.color) + '"></span>' +
        kit(t) + '<span><span class="strong">' + esc(m.name) + '</span> ' +
        '<span class="tiny muted">' + esc(t.name) + '</span></span>' +
        '<span class="small muted" style="margin-left:auto">' +
        (r && r.p ? r.pos + (r.pos === 1 ? 'st' : r.pos === 2 ? 'nd' : r.pos === 3 ? 'rd' : 'th') +
          ' \u00b7 ' + r.pts + ' pts' : 'not started') + '</span></div>';
    }).join('');

    var next = null;
    comp.season.matches.forEach(function (m) {
      if (next || m.played) return;
      if ((m.h === list[0].teamId && m.a === list[1].teamId) ||
          (m.h === list[1].teamId && m.a === list[0].teamId)) next = m;
    });

    var record = h2h.p
      ? list[0].name + ' ' + h2h.aw + ' · ' + h2h.d + ' draw' + (h2h.d === 1 ? '' : 's') +
        ' · ' + h2h.bw + ' ' + list[1].name
      : 'They have not met yet.';

    return '<div class="card"><div class="card-head"><h3>Manager battle</h3>' +
      (h2h.p ? '<span class="badge">' + h2h.p + ' meeting' + (h2h.p === 1 ? '' : 's') + '</span>' : '') +
      '</div><div class="card-body">' + rows +
      '<p class="small" style="margin:12px 0 0">' + esc(record) + '</p>' +
      (next ? '<p class="small muted" style="margin:6px 0 0">Next meeting: matchday ' +
        (next.md + 1) + '.</p>' : '') +
      '</div></div>';
  }

  /* ------------------------------------------------------------ the story */

  var STORY_ICON = {
    title: '\u{1F3C6}', record: '\u{1F4C8}', h2h: '⚔️', haul: '\u{1F3A9}', career: '\u{1F4AF}',
    'club-record': '\u{1F451}', apps: '\u{1F455}', minor: '\u{1F947}',
    heartbreak: '\u{1F494}', decider: '⚖️', unbeaten: '\u{1F6E1}️', finish: '⬆️',
    fall: '⬇️', qual: '✈️', retire: '\u{1F44B}', rank: '\u{1F30D}',
    comeback: '\u{1F504}', dynasty: '\u{1F451}', drought: '⏳', nearly: '\u{1F948}', stake: '\u{1F525}'
  };
  function storyIcon(k) { return STORY_ICON[k] || '\u{1F4F0}'; }

  // Where in the season a moment landed, as a reader would say it.
  function storyWhen(comp, e) {
    if (e.at === 'season') return 'S' + e.n + ' · season’s end';
    return 'S' + e.n + (e.md != null ? ' · MD ' + (e.md + 1) : '');
  }

  function storyRow(comp, e) {
    var open = e.mid && comp.season && e.n === comp.season.number && matchById(comp, e.mid);
    return '<div class="story-row w' + (e.w || 1) + (open ? ' clickable' : '') + '"' +
      (open ? ' data-act="match" data-id="' + esc(e.mid) + '"' : '') + '>' +
      '<span class="si" aria-hidden="true">' + storyIcon(e.k) + '</span>' +
      '<span class="st">' + esc(e.text) + '</span>' +
      (e.n != null ? '<span class="story-meta">' + esc(storyWhen(comp, e)) + '</span>' : '') +
      '</div>';
  }

  function arcRow(a) {
    return '<div class="arc"><span aria-hidden="true">' + storyIcon(a.k) + '</span>' +
      '<span>' + esc(a.text) + '</span></div>';
  }

  // "On the line": stakes named before kick-off, so the result lands.
  function stakesBlock(list) {
    if (!list || !list.length) return '';
    return '<div class="stakes"><div class="lbl">\u{1F525} On the line</div>' +
      list.map(function (x) { return '<p>' + esc(x.text) + '</p>'; }).join('') + '</div>';
  }

  function storyCard(comp) {
    if (!MS) return '';
    var s = comp.season;
    var list = MS.forSeason(comp, s.number).slice().reverse();
    var heads = list.filter(function (e) { return e.w >= 2; });
    var shown = (heads.length ? heads : list).slice(0, 7);
    var arcs = MS.arcs(comp);
    var on = MS.roundStakes(comp);
    var body;
    if (!shown.length && !arcs.length && !on.length) {
      body = '<p class="small muted" style="margin:0">Headlines land here as they happen: a first ' +
        'title, a drought ending, a record win, a player’s hundredth. The longer the competition ' +
        'runs, the more there is to measure against.</p>';
    } else {
      body = arcs.map(arcRow).join('') + stakesBlock(on) +
        (shown.length ? '<div>' + shown.map(function (e) { return storyRow(comp, e); }).join('') + '</div>' : '');
    }
    return '<div class="card" data-tour="story"><div class="card-head"><h2>Season story</h2>' +
      (list.length ? '<span class="badge">' + list.length + (list.length === 1 ? ' moment' : ' moments') + '</span>' : '') +
      '<button class="btn btn-sm" data-act="story-all">The full story</button></div>' +
      '<div class="card-body">' + body + '</div></div>';
  }

  // Every season's headlines, newest first; the live one in full.
  function storyBody(comp) {
    var s = comp.season, out = '';
    var arcs = MS.arcs(comp);
    if (arcs.length) out += '<div class="section-title">Running stories</div>' + arcs.map(arcRow).join('');
    var seasons = [s.number];
    comp.history.slice().reverse().forEach(function (r) { seasons.push(r.n); });
    seasons.slice(0, 40).forEach(function (n) {
      var list = n === s.number
        ? MS.forSeason(comp, n).slice().reverse()
        : MS.seasonHeadlines(comp, n).filter(function (e) { return e.w >= 2; });
      if (!list.length) return;
      out += '<div class="section-title" style="margin-top:16px">Season ' + n +
        (n === s.number && !s.complete ? ' · in progress' : '') + '</div>' +
        list.slice(0, n === s.number ? 60 : 8).map(function (e) {
          if (e.n == null) e = { w: e.w, k: e.k, text: e.text, teams: e.teams, n: n, at: 'season' };
          return storyRow(comp, e);
        }).join('');
    });
    return out || '<p class="small muted" style="margin:0">Nothing worth a headline yet. Play on.</p>';
  }

  function showStory(comp) {
    modal('The story of ' + comp.name, storyBody(comp));
  }

  function histStory(comp) {
    return '<div class="card"><div class="card-head"><h2>The story so far</h2></div>' +
      '<div class="card-body">' + storyBody(comp) + '</div></div>';
  }

  // The full-time pop-up, kept for the genuinely rare. Anything since `seq`
  // that carries the top weight gets the stage; the rest waits in the feed.
  function popMoments(comp, seq) {
    if (!MS || !comp) return;
    var fresh = MS.since(comp, seq).filter(function (e) { return e.w >= MS.POP; });
    if (!fresh.length) return;
    var shown = MS.byWeight(fresh).slice(0, 3).sort(function (x, y) { return x.id - y.id; });
    var more = fresh.length - shown.length;
    modal(shown.length > 1 ? 'Moments for the history books' : 'A moment for the history books',
      shown.map(function (e) {
        return '<div class="moment"><div class="mi" aria-hidden="true">' + storyIcon(e.k) + '</div>' +
          '<div class="mt">' + esc(e.text) + '</div>' +
          '<div class="mm">' + esc(storyWhen(comp, e)) + '</div></div>';
      }).join('') +
      (more > 0 ? '<p class="small muted center" style="margin:8px 0 0">And ' + more + ' more in the season story.</p>' : '') +
      '<div class="btn-row" style="margin-top:16px;justify-content:center">' +
      '<button class="btn btn-primary" data-act="close-modal">Carry on</button>' +
      '<button class="btn" data-act="story-all">The full story</button></div>');
  }

  /* ---------------------------------------------------------- club history */

  function showClubHistory(comp, id) {
    var map = E.teamsById(comp), team = map[id];
    if (!team || !MS) return;
    var idx = comp.teams.indexOf(team);
    var H = comp.history, s = comp.season;
    var titles = [], runners = [], minors = [], finals = 0, finalWins = 0;
    var bestRun = 0, run = 0;
    H.forEach(function (rec) {
      if (rec.champion === idx) { titles.push(rec.n); run++; bestRun = Math.max(bestRun, run); } else run = 0;
      if (rec.runnerUp === idx) runners.push(rec.n);
      if (rec.finalsSystem && rec.minorPremier === idx) minors.push(rec.n);
      if ((rec.format !== 'league' || rec.finalsSystem) && (rec.champion === idx || rec.runnerUp === idx)) {
        finals++;
        if (rec.champion === idx) finalWins++;
      }
    });
    // a season that is over but not yet archived still counts on the board
    if (s.complete && s.champion === id) titles.push(s.number);
    if (s.complete && s.runnerUp === id) runners.push(s.number);
    var all = S.allTimeTable(comp, false).filter(function (r) { return r.team.id === id; })[0];
    var chips = function (list) {
      return list.length ? '<div class="honour-chips">' + list.map(function (n) {
        return n === s.number ? '<span class="badge badge-accent">S' + n + '</span>'
          : '<button class="badge" data-act="season" data-n="' + n + '">S' + n + '</button>';
      }).join('') + '</div>' : '';
    };

    var board = '<div class="section-title">Honours board</div>' +
      '<div class="grid club-grid" style="margin-bottom:16px">' +
        '<div class="stat-tile"><div class="k">\u{1F3C6} Titles</div><div class="v">' + titles.length + '</div>' +
          '<div class="s">' + (titles.length ? (bestRun > 1 ? 'best run: ' + bestRun + ' in a row' : 'never back to back') : 'still waiting') + '</div>' +
          chips(titles) + '</div>' +
        '<div class="stat-tile"><div class="k">\u{1F948} Runners-up</div><div class="v">' + runners.length + '</div>' +
          '<div class="s">' + (finals ? 'finals: won ' + finalWins + ' of ' + finals : 'second place finishes') + '</div>' +
          chips(runners) + '</div>' +
        (minors.length ? '<div class="stat-tile"><div class="k">\u{1F947} Minor premierships</div><div class="v">' +
          minors.length + '</div>' + chips(minors) + '</div>' : '') +
        (all && all.positions.length && comp.format === 'league'
          ? tile('Best / worst finish', ordinalOf(all.best) + ' / ' + ordinalOf(all.worst),
                 'average ' + all.avgPos + ' across ' + all.seasons + ' seasons') : '') +
      '</div>';

    // records the archive can answer: the club's own scorers and its extremes
    var scorers = MS.clubScorers(comp, id, 8);
    var R = MS.ensure(comp);
    var scorerHtml = scorers.length
      ? '<div class="section-title">All-time leading scorers for the ' + (comp.format === 'worldcup' ? 'nation' : 'club') + '</div>' +
        '<div class="table-wrap"><table class="data"><tbody>' + scorers.map(function (x, i) {
          return '<tr><td class="pos l">' + (i + 1) + '</td><td class="l strong">' + esc(x.name) + '</td>' +
            '<td class="strong">' + x.g + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        (R.partial ? '<p class="tiny muted" style="margin:6px 0 14px">Seasons archived before the milestone ' +
          'engine count each season’s top scorers only; everything since is counted in full.</p>'
          : '<div style="height:14px"></div>')
      : '';

    var bestWin = null, worstLoss = null;
    function consider(n, us, them, opp) {
      var m = us - them;
      if (m > 0 && (!bestWin || m > bestWin.m)) bestWin = { m: m, s: us + '–' + them, opp: opp, n: n };
      if (m < 0 && (!worstLoss || m < worstLoss.m)) worstLoss = { m: m, s: us + '–' + them, opp: opp, n: n };
    }
    H.forEach(function (rec) {
      rec.results.forEach(function (r) {
        if (r[0] === idx) consider(rec.n, r[2], r[3], rec.names[r[1]]);
        else if (r[1] === idx) consider(rec.n, r[3], r[2], rec.names[r[0]]);
      });
    });
    s.matches.forEach(function (m) {
      if (!m.played) return;
      if (m.h === id) consider(s.number, m.hg, m.ag, (map[m.a] || {}).name);
      else if (m.a === id) consider(s.number, m.ag, m.hg, (map[m.h] || {}).name);
    });
    var extremes = (bestWin || worstLoss)
      ? '<div class="grid club-grid" style="margin-bottom:16px">' +
        (bestWin ? tile('Biggest win', bestWin.s, 'v ' + esc(bestWin.opp || '?') + ', S' + bestWin.n) : '') +
        (worstLoss ? tile('Heaviest defeat', worstLoss.s, 'v ' + esc(worstLoss.opp || '?') + ', S' + worstLoss.n) : '') +
        '</div>' : '';

    // the club's own timeline, season by season
    var rows = [];
    var liveList = MS.teamSeason(comp, id, s.number);
    if (liveList.length) {
      rows.push(timelineSeason(comp, s.number, !s.complete ? 'In progress'
        : s.champion === id ? '\u{1F3C6} ' + (s.finals ? 'Premiers' : 'Champions')
        : s.runnerUp === id ? '\u{1F948} Runners-up' : 'Season complete', liveList));
    }
    H.slice().reverse().slice(0, 40).forEach(function (rec) {
      var mine = null;
      rec.table.forEach(function (x) { if (x.t === idx) mine = x; });
      var label = rec.champion === idx ? '\u{1F3C6} ' + (rec.finalsSystem ? 'Premiers' : 'Champions')
        : rec.runnerUp === idx ? '\u{1F948} Runners-up'
        : comp.format === 'worldcup'
          ? ((rec.qualified || []).some(function (q) { return q.t === idx; }) ? 'Reached the finals' : 'Did not qualify')
        : comp.format === 'league' && mine ? ordinalOf(mine.pos)
        : mine ? 'Took part' : '—';
      rows.push(timelineSeason(comp, rec.n, label, MS.teamSeason(comp, id, rec.n)));
    });
    var timeline = rows.length
      ? '<div class="section-title" style="margin-top:4px">Timeline</div>' + rows.join('')
      : '<p class="small muted">No seasons on record yet. The timeline fills in as they are played.</p>';

    var head = '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">' +
      kit(team, true) + '<div><div style="font-size:1.15rem;font-weight:700">' + esc(team.name) + '</div>' +
      '<div class="tiny muted">' + H.length + ' season' + (H.length === 1 ? '' : 's') + ' on record</div></div>' +
      '<button class="btn btn-sm" style="margin-left:auto" data-act="team" data-id="' + esc(id) + '">Squad and form</button></div>';

    modal(team.name + ' · club history', head + board + scorerHtml + extremes + timeline);
  }

  function ordinalOf(n) { return n == null ? '—' : MS.ordinal(n); }

  function timelineSeason(comp, n, label, list) {
    return '<div class="timeline-season">' +
      '<div class="ts-head">' + (comp.history.some(function (r) { return r.n === n; })
        ? '<button class="badge" data-act="season" data-n="' + n + '">S' + n + '</button>'
        : '<span class="badge badge-accent">S' + n + '</span>') +
      '<span class="strong small">' + esc(label) + '</span></div>' +
      (list.length ? '<ul>' + list.slice(0, 5).map(function (e) {
        return '<li class="' + (e.w >= 3 ? 'strong' : '') + '">' + storyIcon(e.k) + ' ' + esc(e.text) + '</li>';
      }).join('') + '</ul>' : '') +
      '</div>';
  }

  /* ------------------------------------------------ injuries & suspensions */

  var INC_ICON = { inj: '\u{1F691}', red: '\u{1F7E5}', ban: '\u{1F7E8}' };

  function incNote(x) {
    return x.k === 'inj' ? esc(x.what || 'injury') + ' · out ' + x.out + (x.out === 1 ? ' match' : ' matches')
      : x.k === 'red' ? 'sent off · banned ' + x.out + (x.out === 1 ? ' match' : ' matches')
      : 'booking number ' + (x.yc || 5) + ' · banned 1 match';
  }

  function whyOut(p) {
    return p.sus > 0 ? 'Suspended · ' + p.sus + (p.sus === 1 ? ' match' : ' matches')
      : (p.inj > 15 ? 'Long-term injury' : p.inj > 2 ? 'Injured' : 'Knock') + ' · ' +
        p.inj + (p.inj === 1 ? ' match' : ' matches');
  }

  // Everyone missing right now, best players first.
  function absentees(comp, teamId) {
    var list = [];
    comp.teams.forEach(function (t) {
      if (teamId && t.id !== teamId) return;
      t.players.forEach(function (p) { if (E.isOut(p)) list.push({ p: p, t: t }); });
    });
    return list.sort(function (x, y) { return y.p.skill - x.p.skill; });
  }

  function treatmentCard(comp) {
    if (!E.injuriesOn(comp.settings) || comp.season.complete) return '';
    var list = absentees(comp);
    if (!list.length) return '';
    return '<div class="card" data-tour="treatment"><div class="card-head"><h3>\u{1F691} Treatment room</h3>' +
      '<span class="badge">' + list.length + ' out</span></div>' +
      '<div class="table-wrap"><table class="data"><tbody>' + list.slice(0, 8).map(function (x) {
        return '<tr class="clickable" data-act="team" data-id="' + esc(x.t.id) + '">' +
          '<td class="l"><span class="team-cell">' + kit(x.t) + '<span><span class="strong">' +
          esc(x.p.name) + '</span> <span class="tiny muted">' + esc(x.t.abbr) + ' · ' + x.p.pos +
          ' · ' + x.p.skill + '</span></span></span></td>' +
          '<td class="small muted">' + (x.p.sus > 0 ? INC_ICON.red : INC_ICON.inj) + ' ' + esc(whyOut(x.p)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (list.length > 8 ? '<div class="zone-key">and ' + (list.length - 8) + ' more across the league</div>' : '') +
      '</div>';
  }

  // Who each side is missing before kick-off.
  function missingBlock(comp, m) {
    if (!E.injuriesOn(comp.settings) || m.played) return '';
    var map = E.teamsById(comp);
    var rows = [map[m.h], map[m.a]].map(function (t) {
      var out = absentees(comp, t.id);
      if (!out.length) return '';
      return '<div class="small" style="margin-top:4px"><span class="strong">' + esc(t.abbr) + '</span> without ' +
        out.slice(0, 4).map(function (x) {
          return esc(x.p.name) + ' <span class="muted">(' + (x.p.sus > 0 ? 'suspended' : 'injured') + ')</span>';
        }).join(', ') + (out.length > 4 ? ' and ' + (out.length - 4) + ' more' : '') + '</div>';
    }).join('');
    return rows ? '<div class="rival-callout" data-tour="news"><div class="section-title" style="margin:0">Team news</div>' + rows + '</div>' : '';
  }

  // What happened besides the scoring.
  function incidentBlock(comp, m) {
    if (!m.played || !m.inc || !m.inc.length) return '';
    var map = E.teamsById(comp), players = {};
    comp.teams.forEach(function (t) { t.players.forEach(function (p) { players[p.id] = p; }); });
    var sp = sportOf(comp);
    return '<div class="section-title" style="margin-top:16px">Injuries &amp; cards</div>' +
      '<div class="table-wrap"><table class="data"><tbody>' + m.inc.map(function (x) {
        var p = players[x.p], t = x.side === 'h' ? map[m.h] : map[m.a];
        return '<tr><td class="l muted nowrap" style="width:54px">' + esc(E.clockLabel(sp, x.min)) + '</td>' +
          '<td class="l">' + kit(t) + '</td><td class="l">' + INC_ICON[x.k] + ' <span class="strong">' +
          esc(p ? p.name : 'Unknown') + '</span></td><td class="l muted tiny">' + incNote(x) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function absenceSection(comp, team) {
    if (!E.injuriesOn(comp.settings)) return '';
    var out = absentees(comp, team.id);
    if (!out.length) return '';
    return '<div class="section-title">Unavailable</div>' +
      '<div class="table-wrap" style="margin-bottom:14px"><table class="data"><tbody>' + out.map(function (x) {
        return '<tr><td class="l strong">' + esc(x.p.name) + '</td><td class="l muted">' + x.p.pos + '</td>' +
          '<td class="muted">' + x.p.skill + '</td><td class="l small">' +
          (x.p.sus > 0 ? INC_ICON.red : INC_ICON.inj) + ' ' + esc(whyOut(x.p)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  /* ------------------------------------------------------------ continental */

  var CT = LS.continental;

  // Who is in this season's field, league by league, and where it came from.
  function contFieldCard(comp) {
    var s = comp.season, map = E.teamsById(comp);
    // with a qualifying round, until it is played the card shows who is trying:
    // champions already through, everyone else in qualifying
    var qualMode = !!comp.continental.qualify && !(s.qualified && s.qualified.length);
    var field = (s.qualified && s.qualified.length) ? s.qualified
      : qualMode ? (comp.autoQualified || []).map(function (a) { return { id: a.id, note: a.note, champ: true }; })
          .concat(((comp.settings.qualifying || {}).entrants || []).map(function (id) { return { id: id, note: 'In qualifying' }; }))
      : (comp.autoQualified || []);
    var placesTotal = CT.leagues(comp).reduce(function (n, L) { return n + CT.placesFor(comp.continental, L.id); }, 0);
    var byLeague = {}, order = [];
    field.forEach(function (q) {
      var t = map[q.id];
      if (!t) return;
      var k = t.conf || 'Other';
      if (!byLeague[k]) { byLeague[k] = []; order.push(k); }
      byLeague[k].push({ t: t, champ: q.champ || q.via === 'champion',
        note: q.note || (comp.autoQualified || []).filter(function (a) { return a.id === q.id; }).map(function (a) { return a.note; })[0] || '' });
    });
    var last = comp.history.length ? comp.history[comp.history.length - 1] : null;
    var wasThere = {};
    if (last && last.qualified) last.qualified.forEach(function (q) { if (comp.teams[q.t]) wasThere[comp.teams[q.t].id] = true; });
    var started = s.matches.some(function (m) { return m.played; });
    var leagues = CT.leagues(comp);
    var draw = comp.continental.lastDraw;
    // a feeder still mid-season means the field is provisional
    var unfinished = draw && draw.from && draw.from.some(function (f) { return !f.done; });
    var from = draw && draw.from ? draw.from.map(function (f) {
      return esc(f.name) + ' ' + (f.done ? 'S' + f.n + ' final table' : f.live ? 'S' + f.n + ' as it stands' : 'on paper');
    }).join(' · ') : '';
    var noun = comp.osg ? 'campuses' : 'clubs';
    return '<div class="card" data-tour="field"><div class="card-head"><h2>' + (qualMode ? 'Qualifying draw' : 'The field') + '</h2>' +
      '<span class="badge">' + (qualMode
        ? placesTotal + ' places \u00b7 ' + field.length + ' ' + noun + ' trying'
        : field.length + ' ' + noun + ' from ' + leagues.length + (leagues.length === 1 ? ' league' : ' leagues')) + '</span>' +
      (!started && unfinished ? '<button class="btn btn-sm btn-primary" data-act="cont-playall">Play the ' +
        (comp.osg ? 'national' : 'league') + ' seasons</button>' : '') +
      (!started ? '<button class="btn btn-sm" data-act="cont-redraw">Redraw from latest tables</button>' : '') +
      '<button class="btn btn-sm" data-act="cont-leagues">Feeder leagues</button></div>' +
      '<div class="card-body">' + (order.length ? order.map(function (k) {
        var L = leagues.filter(function (x) { return x.name === k; })[0];
        return '<div class="honour" style="align-items:flex-start">' +
          '<span class="tiny muted" style="min-width:110px;padding-top:3px">' +
          (L ? '<a href="#" data-act="open-comp" data-id="' + esc(L.id) + '">' + esc(k) + '</a>' : esc(k)) + '</span>' +
          '<span style="display:flex;flex-wrap:wrap;gap:5px">' + byLeague[k].map(function (x) {
            if (qualMode) {
              return '<span class="badge' + (x.champ ? ' badge-amber' : '') + '" title="' + esc(x.t.name + ' \u2014 ' + x.note) + '">' +
                kit(x.t) + ' ' + esc(x.t.abbr) + (x.champ ? ' \u{1F3C6}' : '') + '</span>';
            }
            var isNew = last && !wasThere[x.t.id];
            return '<span class="badge' + (isNew ? ' badge-accent' : '') + '" title="' + esc(x.t.name + ' \u2014 ' + x.note) + '">' +
              kit(x.t) + ' ' + esc(x.t.abbr) + (isNew ? ' \u2605' : '') + '</span>';
          }).join('') + '</span>' +
          (qualMode && L ? '<span class="tiny muted" style="margin-left:auto;white-space:nowrap;padding-top:3px">' +
            CT.placesFor(comp.continental, L.id) + (CT.placesFor(comp.continental, L.id) === 1 ? ' place' : ' places') + '</span>' : '') +
          '</div>';
      }).join('') : '<p class="small muted" style="margin:0">No clubs drawn. Pick the feeder leagues to fill the field.</p>') +
      '</div>' +
      (from ? '<div class="zone-key">Drawn from: ' + from + (last && !qualMode ? ' \u00b7 \u2605 not here last season' : '') + '</div>' : '') +
      (qualMode ? '<div class="zone-key"><p style="margin:0;color:inherit">\u{1F3C6} National champions go straight through' +
        (comp.continental.champAuto === false ? ' (switched off)' : '') + '. ' +
        (comp.osg ? 'Every other campus' : 'Everyone else') + ' plays a qualifying round, home and away, ' +
        'for the rest of their country\u2019s places. A country with a single place plays it out, champions included. Then the qualifiers and champions are drawn into the finals groups.</p></div>' : '') +
      (unfinished && !started ? '<div class="zone-key"><p style="margin:0;color:inherit">Some ' + (comp.osg ? 'national competitions' : 'leagues') +
        ' have not finished a season yet, so their places are provisional. Play them first, or press ' +
        '<b>Play the ' + (comp.osg ? 'national' : 'league') + ' seasons</b>, and the field is redrawn from the final tables.</p></div>' : '') +
      '</div>';
  }

  function showContLeagues(comp) {
    var mine = comp.continental.leagues || [];
    var list = CT.candidates(comp.sport);
    var started = comp.season.matches.some(function (m) { return m.played; });
    modal('Feeder leagues',
      '<p class="small">Each season the top finishers from these leagues are drawn into ' + esc(comp.name) +
      '. A league that has not finished a season yet sends its clubs as the table stands.</p>' +
      (list.length ? list.map(function (L) {
        var q = LS.continental.placesFor(comp.continental, L.id);
        return '<div class="cont-league"><label class="check" style="margin:0;flex:1"><input type="checkbox" class="cont-pick" value="' + esc(L.id) + '"' +
          (mine.indexOf(L.id) >= 0 ? ' checked' : '') + '> ' + esc(L.name) +
          ' <span class="tiny muted">\u00b7 season ' + L.season.number + ', ' + L.teams.length + ' teams</span></label>' +
          '<select class="cont-places" data-id="' + esc(L.id) + '" aria-label="Places for ' + esc(L.name) + '">' +
          [1, 2, 3, 4, 5, 6, 8].map(function (n) {
            return '<option value="' + n + '"' + (n === q ? ' selected' : '') + '>Top ' + n + '</option>';
          }).join('') + '</select></div>';
      }).join('') : '<p class="small muted">You have no other ' + esc(sportOf(comp).name.toLowerCase()) + ' leagues yet.</p>') +
      '<label class="check" style="margin-top:12px"><input type="checkbox" id="contQualify"' +
        (comp.continental.qualify ? ' checked' : '') + '> Qualifying round before the finals</label>' +
      '<label class="check"><input type="checkbox" id="contChampAuto"' +
        (comp.continental.champAuto !== false ? ' checked' : '') + '> National champions go straight through</label>' +
      '<label class="check"><input type="checkbox" id="contEnterAll"' +
        ((comp.continental.enterAll === true || (comp.continental.enterAll !== false && comp.osg)) ? ' checked' : '') +
        '> Every team enters qualifying (otherwise about twice the places)</label>' +
      '<p class="tiny muted" style="margin:-4px 0 8px">With qualifying on, a qualifying round is played first, World Cup ' +
        'style, and only the winners reach the finals.</p>' +
      '<p class="tiny muted">' + (started ? 'This season has started, so changes apply from the next draw.'
        : 'Nothing has been played yet, so the field is redrawn straight away.') + '</p>' +
      '<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" data-act="cont-save">Save</button>' +
      '<button class="btn" data-act="close-modal">Cancel</button></div>');
  }

  // A league page says which continental competitions it feeds.
  function feedsBadges(comp) {
    if (!CT || comp.format !== 'league') return '';
    return CT.fedBy(comp).map(function (c) {
      return '<button class="badge badge-blue" data-act="open-comp" data-id="' + esc(c.id) + '" title="Open ' +
        esc(c.name) + '">Top ' + CT.placesFor(c.continental, comp.id) + ' \u2192 ' + esc(c.name) + '</button>';
    }).join('');
  }

  // Only worth a card when something is actually going on.
  function storylinesCard(comp) {
    var runs = comp.teams.filter(function (t) { return t.surge; });
    if (!runs.length) return '';
    runs.sort(function (a, b) { return b.surge.size - a.surge.size; });
    return '<div class="card"><div class="card-head"><h3>Squads on a run</h3>' +
      '<span class="badge">' + runs.length + '</span></div><div class="card-body">' +
      runs.map(function (t) {
        return '<div class="honour" style="align-items:flex-start">' + kit(t) +
          '<span style="min-width:0"><span class="strong">' + esc(t.name) + '</span> ' +
          surgeBadge(t) +
          '<div class="tiny muted" style="margin-top:2px">' + esc(surgeNote(t)) + '</div></span></div>';
      }).join('') +
      '</div><div class="zone-key">A squad can click for a few seasons or fall away. Most of what ' +
      'a good run builds fades when it ends. Switch this off in Settings if you want ratings to ' +
      'move on results alone.</div></div>';
  }

  /* ----------------------------------------------------- world rankings */

  var VIA_WORDS = {
    host: 'Hosts', champion: 'National champions', pool: 'Pool place', ko: 'Knockout place', stay: 'Stayed up',
    winner: 'Group winner', best: 'Best of the rest', table: 'Through the table',
    league: 'Through the league'
  };

  function movementCell(r) {
    if (r.was == null) return '<span class="muted">—</span>';
    var d = r.was - r.pos;
    if (!d) return '<span class="muted">–</span>';
    return '<span class="move ' + (d > 0 ? 'up' : 'down') + '">' +
      (d > 0 ? '\u25b2' : '\u25bc') + Math.abs(d) + '</span>';
  }

  function rankingsCard(comp, limit, compact) {
    var rows = E.rankingTable(comp);
    if (!rows.length) return '';
    var cfg = E.rankingCfg(comp);
    var shown = limit ? rows.slice(0, limit) : rows;
    var held = {};
    (comp.autoQualified || []).forEach(function (a) { held[a.id] = a; });

    var body = '<div class="table-wrap"><table class="data sticky-team"><thead><tr>' +
      '<th class="l" style="width:34px">#</th>' +
      (compact ? '' : '<th class="l" style="width:52px" title="Places moved since the last cycle">+/-</th>') +
      '<th class="l stick">Nation</th>' +
      (compact ? '' : '<th class="l col-hide-sm">Region</th>') +
      '<th class="strong">Rating</th>' +
      (compact ? '' : '<th class="col-hide-sm" title="Highest rating reached">Peak</th>' +
        '<th class="col-hide-sm" title="Ranked matches played">Played</th>') +
      '</tr></thead><tbody>' +
      shown.map(function (r) {
        return '<tr class="clickable" data-act="team" data-id="' + r.id + '">' +
          '<td class="pos l stick">' + r.pos + '</td>' +
          (compact ? '' : '<td class="l">' + movementCell(r) + '</td>') +
          '<td class="l stick"><span class="rank-name">' + teamCell(r.team) +
            (held[r.id] ? '<span class="badge tiny" title="' + esc(held[r.id].note || '') +
              '">' + esc(VIA_WORDS[held[r.id].via] || 'In') + '</span>' : '') + '</span></td>' +
          (compact ? '' : '<td class="l muted small col-hide-sm">' +
            esc(confName(comp, r.conf) || '') + '</td>') +
          '<td class="strong">' + r.rating.toFixed(2) + '</td>' +
          (compact ? '' : '<td class="muted col-hide-sm">' + r.peak.toFixed(2) + '</td>' +
            '<td class="muted col-hide-sm">' + r.played + '</td>') +
          '</tr>';
      }).join('') + '</tbody></table></div>';

    var note = '<div class="zone-key">Every international moves rating between the two sides. ' +
      'The winner takes what the loser gives up, and how much depends on the gap between them — ' +
      'beat a side ' + cfg.cap + ' points above you and you take the maximum, beat one far below ' +
      'and you take almost nothing. A World Cup match counts double, winning by ' + cfg.bigWin + ' ' +
      'or more is worth half as much again, and 50 is the middle of the ladder.</div>';

    return '<div class="card"><div class="card-head"><h3>World ranking</h3>' +
      '<span class="badge">' + rows.length + ' nations</span>' +
      (limit ? '<button class="btn btn-sm" data-act="go-rankings">Full ranking</button>' : '') +
      '</div>' + body + (compact ? '' : note) + '</div>';
  }

  /* ------------------------------------------------ ranking over time */

  // Every cycle the ladder is snapshotted, so it can be drawn as a line rather
  // than only as a single "moved since last time" arrow.
  function rankChartCard(comp, built) {
    var ui = app.ui;
    var live = E.rankingTable(comp);
    if (built.cycles.length < 2) {
      return '<div class="card"><div class="card-head"><h3>Ranking over time</h3></div>' +
        '<div class="card-body"><p class="small muted" style="margin:0">The ladder is ' +
        'snapshotted at the end of every edition. Finish this one and the chart starts; ' +
        'after two or three cycles it is worth looking at.</p></div></div>';
    }

    var chosen = ui.rankTeams || live.slice(0, 6).map(function (r) { return r.id; });
    var mode = ui.rankMode === 'rating' ? 'rating' : 'position';
    var byId = E.teamsById(comp);

    // the legend offers the current top twenty, plus anything already plotted
    var pool = live.slice(0, 20).map(function (r) { return r.id; });
    chosen.forEach(function (id) { if (pool.indexOf(id) < 0 && byId[id]) pool.push(id); });
    var all = pool.map(function (id, i) {
      return { id: id, name: byId[id].abbr, color: PALETTE[i % PALETTE.length] };
    });

    var series = all.filter(function (x) { return chosen.indexOf(x.id) >= 0; })
      .map(function (x) {
        return {
          id: x.id, name: x.name, color: x.color,
          points: (built.series[x.id] || []).map(function (p) {
            return { x: p.n, y: mode === 'rating' ? p.rating : p.pos };
          })
        };
      });

    var field = built.cycles.reduce(function (m, c) { return Math.max(m, c.size); }, 1);
    var opts;
    if (mode === 'rating') {
      opts = { height: 300, yTicks: 6, label: 'World ranking rating by edition' };
    } else {
      // Six nations out of eighty-eight would sit in the top inch of a full-field
      // axis, so the scale follows what is actually plotted, with a little room
      // either side. It still reads 1st at the top.
      var seen = [];
      series.forEach(function (x) { x.points.forEach(function (p) { seen.push(p.y); }); });
      var lo = seen.length ? Math.min.apply(null, seen) : 1;
      var hi = seen.length ? Math.max.apply(null, seen) : field;
      var pad = Math.max(1, Math.round((hi - lo) * 0.15));
      lo = Math.max(1, lo - pad);
      hi = Math.min(field, hi + pad);
      if (hi - lo < 4) hi = Math.min(field, lo + 4);
      opts = { height: 300, invertY: true, yMin: lo, yMax: hi,
               yTicks: Math.min(hi - lo, 6), label: 'World ranking position by edition' };
    }

    var modeSeg = '<div class="seg">' +
      [['position', 'Position'], ['rating', 'Rating']].map(function (t) {
        return '<button data-act="rank-mode" data-mode="' + t[0] + '" aria-pressed="' +
          (mode === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>';

    var lastCycle = built.cycles[built.cycles.length - 1];
    return '<div class="card"><div class="card-head"><h3>Ranking over time</h3>' + modeSeg +
      '<span class="badge">' + built.cycles.length + ' cycles</span></div>' +
      '<div class="card-body">' +
      lineChart(series, opts) +
      chartLegend(all, chosen) +
      '<p class="tiny muted" style="margin:10px 0 0">' +
      (mode === 'position' ? '1st at the top. ' : '50 is the middle of the ladder. ') +
      'Click a nation to add or remove it. The last point is ' +
      (lastCycle.live ? 'the ladder as it stands now, mid-cycle.'
                      : 'the end of edition ' + lastCycle.n + '.') +
      '</p></div></div>';
  }

  // Where every nation has been: how far it has come since its first snapshot,
  // and the best and worst places it has held.
  function rankSpanTable(comp, built) {
    if (built.cycles.length < 2) return '';
    var live = E.rankingTable(comp);
    var rows = live.map(function (r) {
      var sp = E.rankingSpan(comp, r.id, built);
      return sp ? { r: r, s: sp } : null;
    }).filter(Boolean);
    if (!rows.length) return '';

    function posCell(d) {
      if (!d) return '<span class="muted">–</span>';
      return '<span class="move ' + (d > 0 ? 'up' : 'down') + '">' +
        (d > 0 ? '\u25b2' : '\u25bc') + Math.abs(d) + '</span>';
    }

    return '<div class="card"><div class="card-head"><h3>Where each nation has been</h3>' +
      '<span class="tiny muted">across ' + built.cycles.length + ' cycles</span></div>' +
      '<div class="table-wrap"><table class="data sticky-team" data-table="rankspan"><thead><tr>' +
      '<th class="l" style="width:34px">#</th><th class="l stick">Nation</th>' +
      '<th>Rating</th><th class="col-hide-sm">Started</th><th class="col-hide-sm">Change</th>' +
      '<th title="Highest place held">Best</th><th class="col-hide-sm" title="Lowest place held">Worst</th>' +
      '<th title="Places moved since the first snapshot">Overall</th>' +
      '</tr></thead><tbody>' +
      rows.map(function (x) {
        return '<tr class="clickable" data-act="team" data-id="' + x.r.id + '">' +
          '<td class="pos l stick">' + x.r.pos + '</td>' +
          '<td class="l stick">' + teamCell(x.r.team) + '</td>' +
          '<td class="strong" data-v="' + x.s.last.rating + '">' + x.s.last.rating.toFixed(2) + '</td>' +
          '<td class="muted col-hide-sm" data-v="' + x.s.first.rating + '">' +
            x.s.first.rating.toFixed(2) + '</td>' +
          '<td class="col-hide-sm" data-v="' + x.s.change + '">' +
            '<span class="' + (x.s.change > 0 ? 'up' : x.s.change < 0 ? 'down' : 'muted') + '">' +
            signed(Math.round(x.s.change * 100) / 100) + '</span></td>' +
          '<td data-v="' + x.s.bestPos.pos + '">' + x.s.bestPos.pos +
            '<span class="tiny muted"> \u00b7 S' + x.s.bestPos.n + '</span></td>' +
          '<td class="muted col-hide-sm" data-v="' + x.s.worstPos.pos + '">' + x.s.worstPos.pos +
            '<span class="tiny muted"> \u00b7 S' + x.s.worstPos.n + '</span></td>' +
          '<td data-v="' + x.s.moved + '">' + posCell(x.s.moved) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="zone-key">Started is the first snapshot on record — the ladder keeps the ' +
      'last forty cycles. Click a nation for its own history.</div></div>';
  }

  // The three headline movements of the whole run, not just the last cycle.
  function rankHighlights(comp, built) {
    if (built.cycles.length < 2) return '';
    var rows = E.rankingTable(comp).map(function (r) {
      var sp = E.rankingSpan(comp, r.id, built);
      return sp ? { r: r, s: sp } : null;
    }).filter(Boolean);
    if (!rows.length) return '';

    var risen = rows.slice().sort(function (a, b) { return b.s.moved - a.s.moved; })[0];
    var fallen = rows.slice().sort(function (a, b) { return a.s.moved - b.s.moved; })[0];
    var highest = rows.slice().sort(function (a, b) { return b.s.peak.rating - a.s.peak.rating; })[0];

    return '<div class="grid grid-3">' +
      tile('Biggest climb', risen.s.moved > 0 ? '+' + risen.s.moved : '\u2014',
           esc(risen.r.team.name) + ' \u00b7 ' + risen.s.first.pos + ' \u2192 ' + risen.s.last.pos) +
      tile('Biggest slide', fallen.s.moved < 0 ? String(fallen.s.moved) : '\u2014',
           esc(fallen.r.team.name) + ' \u00b7 ' + fallen.s.first.pos + ' \u2192 ' + fallen.s.last.pos) +
      tile('Highest rating', highest.s.peak.rating.toFixed(2),
           esc(highest.r.team.name) + ' \u00b7 edition ' + highest.s.peak.n) +
    '</div>';
  }

  function rankingHistoryView(comp) {
    var built = E.rankingSeries(comp);
    return '<div class="stack">' + rankHighlights(comp, built) +
      rankChartCard(comp, built) + rankSpanTable(comp, built) + '</div>';
  }

  // A nation's own ladder history, for the team modal.
  function teamRankBlock(comp, id) {
    if (!comp.rankings) return '';
    var built = E.rankingSeries(comp);
    var sp = E.rankingSpan(comp, id, built);
    if (!sp) return '';
    var series = [{ id: id, name: '', color: 'var(--accent)',
      points: sp.points.map(function (p) { return { x: p.n, y: p.pos }; }) }];
    var field = built.cycles.reduce(function (m, c) { return Math.max(m, c.size); }, 1);

    var tiles = '<div class="grid grid-3" style="margin-bottom:14px">' +
      tile('World ranking', sp.last.pos + (sp.last.live ? '' : ''),
           'rating ' + sp.last.rating.toFixed(2)) +
      tile('Best / worst', sp.bestPos.pos + ' / ' + sp.worstPos.pos,
           'peak rating ' + sp.peak.rating.toFixed(2) + ' in S' + sp.peak.n) +
      tile('Since S' + sp.first.n, (sp.moved > 0 ? '+' : '') + sp.moved + ' places',
           signed(Math.round(sp.change * 100) / 100) + ' rating over ' + sp.cycles +
           (sp.cycles === 1 ? ' cycle' : ' cycles')) +
    '</div>';

    if (sp.points.length < 2) return '<div class="section-title">World ranking</div>' + tiles;

    return '<div class="section-title">World ranking</div>' + tiles +
      '<div class="rank-spark">' + lineChart(series, {
        height: 150, invertY: true, yMin: 1, yMax: field,
        yTicks: Math.min(field - 1, 4), label: 'World ranking position by edition'
      }) + '</div>' +
      '<p class="tiny muted" style="margin:6px 0 0">Position by edition, 1st at the top.</p>';
  }


  function rankingMovers(comp) {
    var rows = E.rankingTable(comp).filter(function (r) { return r.was != null; });
    if (!rows.length) return '';
    var moved = rows.filter(function (r) { return r.was !== r.pos; });
    if (!moved.length) return '';
    var up = moved.slice().sort(function (a, b) { return (b.was - b.pos) - (a.was - a.pos); }).slice(0, 5);
    var down = moved.slice().sort(function (a, b) { return (a.was - a.pos) - (b.was - b.pos); }).slice(0, 5);
    function list(set) {
      return set.map(function (r) {
        return '<div class="honour" style="padding:7px 0">' + kit(r.team) +
          '<span>' + esc(r.team.name) + '</span>' +
          '<span class="small muted" style="margin-left:auto">' + r.was + ' \u2192 ' + r.pos + '</span>' +
          '<span style="min-width:46px;text-align:right">' + movementCell(r) + '</span></div>';
      }).join('');
    }
    return '<div class="grid grid-2">' +
      '<div class="card"><div class="card-head"><h3>Biggest risers</h3></div>' +
        '<div class="card-body">' + list(up) + '</div></div>' +
      '<div class="card"><div class="card-head"><h3>Biggest fallers</h3></div>' +
        '<div class="card-body">' + list(down) + '</div></div>' +
    '</div>';
  }

  // Who already has a place in this edition, and how they earned it.
  function heldPlacesCard(comp) {
    var held = comp.autoQualified || [];
    var host = comp.host;
    if (!held.length && !host) return '';
    var map = E.teamsById(comp);
    var byVia = {};
    held.forEach(function (a) { (byVia[a.via] = byVia[a.via] || []).push(a); });

    var rows = Object.keys(byVia).map(function (via) {
      return '<div class="honour" style="align-items:flex-start">' +
        '<span class="tiny muted" style="min-width:104px;padding-top:3px">' +
        esc(VIA_WORDS[via] || via) + '</span>' +
        '<span style="display:flex;flex-wrap:wrap;gap:5px">' + byVia[via].map(function (a) {
          var t = map[a.id];
          if (!t) return '';
          return '<span class="badge" title="' + esc(t.name + ' — ' + (a.note || '')) + '">' +
            kit(t) + ' ' + esc(t.abbr) + '</span>';
        }).join('') + '</span></div>';
    }).join('');

    var rule = (comp.settings.qualifying || {}).autoQualify || {};
    var how = rule.mode === 'pool' || rule.mode === 'groupTop'
        ? 'The top ' + (rule.perGroup || 2) + ' in each pool last time keep their place.'
      : rule.mode === 'reachedKo' ? 'Everyone who reached the knockout stage last time keeps their place.'
      : rule.mode === 'stayUp' ? 'The bottom two go down and the other ' + (rule.keep || 0) +
          ' stay up; the vacancies are filled from qualifying.'
      : 'Nothing is carried over on results — only the hosts have a place waiting.';

    return '<div class="card"><div class="card-head"><h3>Already in</h3>' +
      '<span class="badge">' + held.length + ' of the field</span>' +
      (host && map[host.id] ? '<span class="badge badge-accent">Hosts: ' +
        esc(map[host.id].name) + '</span>' : '') +
      '</div><div class="card-body">' + rows + '</div>' +
      '<div class="zone-key">' + esc(how) + '</div></div>';
  }

  /* ------------------------------------------------------------- finals */

  function finalsCard(comp) {
    var s = comp.season, map = E.teamsById(comp);
    var fm = E.finalsMatches(s);
    var sys = E.FINALS_SYSTEMS[(comp.settings.finals || {}).system] || {};

    if (!fm.length) {
      var size = E.finalsSize(comp.settings, comp.teams.length);
      var table = liveTable(comp);
      var inLine = table.slice(0, size);
      return '<div class="card"><div class="card-head"><h2>Finals series</h2>' +
        '<span class="badge">' + esc(sys.name || 'Finals') + ' · top ' + size + '</span></div>' +
        '<div class="card-body"><p class="small" style="margin:0 0 12px">' +
        esc(sys.note || '') + '. The series starts once the regular season is done — ' +
        'the team on top of the table are minor premiers, but the premiership is won here.</p>' +
        (inLine.length && inLine[0].p ?
          '<div class="section-title">In the eight as it stands</div>' +
          inLine.map(function (r, i) {
            return '<div class="honour" style="padding:6px 0">' +
              '<span class="muted tiny num" style="width:18px">' + (i + 1) + '</span>' +
              kit(r.team) + '<span>' + esc(r.team.name) + '</span>' +
              '<span class="muted small" style="margin-left:auto">' +
              (comp.settings.rankBy === 'winpct' ? winPctStr(r.winPct) : r.pts + ' pts') + '</span></div>';
          }).join('') : '') +
        '</div></div>';
    }

    var byMd = {};
    fm.forEach(function (m) { (byMd[m.md] = byMd[m.md] || []).push(m); });
    var weeks = Object.keys(byMd).map(Number).sort(function (a, b) { return a - b; });

    var cols = weeks.map(function (md) {
      var ms = byMd[md];
      return '<div class="bracket-round"><div class="rn">' + esc(ms[0].weekLabel || 'Finals') + '</div>' +
        '<div class="bracket-ties">' + ms.map(function (m) {
          var h = map[m.h], a = map[m.a];
          function row(t, goals, won) {
            return '<div class="tie-row ' + (m.played ? (won ? 'won' : 'out') : '') + '">' +
              kit(t) + '<span>' + esc(t ? t.abbr : '?') + '</span>' +
              '<span class="g">' + (m.played ? goals : '–') + '</span>' +
              (won ? '<span class="tiny" style="color:var(--accent)">✓</span>' : '') + '</div>';
          }
          return '<div class="tie" data-act="match" data-id="' + esc(m.id) + '" style="cursor:pointer">' +
            (m.round !== m.weekLabel ?
              '<div class="tie-row tiny muted" style="padding-bottom:2px">' + esc(m.round) + '</div>' : '') +
            row(h, m.hg, m.tieWinner === m.h) + row(a, m.ag, m.tieWinner === m.a) +
            (m.pens ? '<div class="tie-row tiny muted">pens ' + m.pens[0] + '–' + m.pens[1] + '</div>' :
              m.ot ? '<div class="tie-row tiny muted">after extra time</div>' : '') +
            '</div>';
        }).join('') + '</div></div>';
    }).join('');

    var champ = s.complete && s.champion ? map[s.champion] : null;
    return '<div class="card"><div class="card-head"><h2>Finals series</h2>' +
      '<span class="badge">' + esc(sys.name || 'Finals') + '</span>' +
      (champ ? '<span class="badge badge-amber">🏆 ' + esc(champ.name) + '</span>' : '') +
      '</div><div class="card-body"><div class="bracket">' + cols + '</div></div></div>';
  }

  function hasFinals(comp) {
    return comp.format === 'league' && comp.settings.finals && comp.settings.finals.enabled;
  }

  /* --------------------------------------------------------- match modal */

  /* ------------------------------------------------- rivalries & derbies */

  // A short badge for a fixture with history behind it. Level 2 is a genuine
  // rivalry, level 1 is worth a mention; anything quieter says nothing.
  function rivalBadge(comp, m) {
    var r = S.rivalryForMatch(comp, m);
    if (!r || r.level < 1) return '';
    return '<span class="rival-badge' + (r.level === 2 ? ' hot' : '') + '" title="' +
      esc(r.note || r.label) + '">' + esc(r.label) + '</span>';
  }

  // The full story of a fixture: what the badge is claiming, and the record.
  function rivalCallout(comp, m) {
    var r = S.rivalryForMatch(comp, m);
    if (!r || r.level < 1) return '';
    var map = E.teamsById(comp), h = map[m.h], a = map[m.a];
    var record = r.aw + ' – ' + r.d + ' – ' + r.bw;
    return '<div class="rival-callout' + (r.level === 2 ? ' hot' : '') + '">' +
      '<div class="rival-line"><span class="rival-badge' + (r.level === 2 ? ' hot' : '') + '">' +
        esc(r.label) + '</span>' +
        '<span class="small muted">' + esc(h.abbr) + ' ' + record + ' ' + esc(a.abbr) +
        ' in ' + r.p + (r.p === 1 ? ' meeting' : ' meetings') + '</span></div>' +
      '<div class="tiny muted">' + r.tags.map(function (t) {
        return esc(t.label) + ' — ' + esc(t.note);
      }).join(' · ') + '</div></div>';
  }

  function rivalriesCard(comp) {
    var list = S.rivalryTable(comp, 10);
    if (!list.length) {
      return '<div class="card"><div class="card-head"><h2>Rivalries</h2></div><div class="card-body">' +
        '<p class="small muted" style="margin:0">Nothing has boiled over yet. Rivalries build as two ' +
        'sides keep meeting — especially when a title is on the line, when one keeps beating the ' +
        'other, or when neither can get away.</p></div></div>';
    }
    return '<div class="card"><div class="card-head"><h2>Rivalries</h2>' +
      '<span class="tiny muted">' + list.length + ' fixture' + (list.length === 1 ? '' : 's') +
      ' with history</span></div>' +
      '<div class="table-wrap"><table class="data" data-table="rivals"><thead><tr>' +
      '<th class="l">Fixture</th><th class="l">Why</th><th>P</th><th>Record</th><th>Heat</th>' +
      '</tr></thead><tbody>' +
      list.map(function (r) {
        var a = comp.teams[r.a], b = comp.teams[r.b];
        return '<tr><td class="l stick"><span class="team-cell">' + kit(a) +
            '<span class="strong">' + esc(a.name) + '</span></span>' +
            '<span class="tiny muted"> v </span><span class="team-cell">' + kit(b) +
            '<span class="strong">' + esc(b.name) + '</span></span></td>' +
          '<td class="l"><span class="rival-badge' + (r.level === 2 ? ' hot' : '') + '">' +
            esc(r.label) + '</span>' +
            (r.note ? '<div class="tiny muted">' + esc(r.note) + '</div>' : '') + '</td>' +
          '<td data-v="' + r.p + '">' + r.p + '</td>' +
          '<td class="nowrap">' + r.aw + '–' + r.d + '–' + r.bw + '</td>' +
          '<td data-v="' + r.score + '">' + r.score + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  /* ---------------------------------------------------------- live ticker */

  /* Watching a match is a replay, not a second simulation: the engine settles
     it in full first, then the ticker walks the clock and reveals each score
     as its minute comes round. Skipping to full time just jumps the clock, so
     the result is the same either way. */
  var live = null;
  var LIVE_FRAMES = 88;    // clock steps between kick-off and the final whistle
  var LIVE_TICK = 190;     // ms per step at 1×

  function clearLiveTimer() {
    if (live && live.timer) { clearInterval(live.timer); live.timer = null; }
  }
  function stopLive() { clearLiveTimer(); live = null; }

  function matchById(comp, id) {
    var found = null;
    comp.season.matches.forEach(function (m) { if (m.id === id) found = m; });
    return found;
  }

  function watchMatch(comp, id) {
    var m = matchById(comp, id);
    if (!m) return;
    stopLive();
    var pending = !m.played;
    // the build-up is read before a ball is kicked, or there would be nothing left to say
    var stakes = pending && MS ? MS.stakes(comp, m) : [];
    var seq = MS ? MS.mark(comp) : 0;
    if (pending) {
      lockTips(comp);
      E.playMatch(comp, id);
      m = matchById(comp, id) || m;
    }
    var sp = sportOf(comp);
    var players = {};
    comp.teams.forEach(function (t) { t.players.forEach(function (p) { players[p.id] = p; }); });

    live = {
      comp: comp, m: m, sp: sp, players: players,
      end: E.fullTime(sp, !!m.ot),
      evs: (m.events || []).slice().sort(function (x, y) { return x.min - y.min; }),
      i: 0, t: 0, hg: 0, ag: 0, speed: 1, paused: false, done: false,
      pending: pending, timer: null,
      stakes: stakes, seq: seq, shown: {},
      incs: (m.inc || []).slice(), ii: 0,
      // moments tied to a scoring play flash up as that play goes in
      flashes: MS ? MS.forMatch(comp, m.id).filter(function (e) { return e.min != null && e.s; }) : []
    };
    drawLiveShell();
    startLiveTimer();
  }

  function drawLiveShell() {
    var comp = live.comp, m = live.m, map = E.teamsById(comp);
    var h = map[m.h], a = map[m.a];
    var body =
      rivalCallout(comp, m) + stakesBlock(live.stakes) +
      '<div class="live-head">' +
        '<div class="lt"><div class="kit-big">' + kit(h, true) + '</div>' +
          '<div class="strong">' + esc(h.name) + '</div></div>' +
        '<div class="live-score" id="liveScore">0 – 0</div>' +
        '<div class="lt"><div class="kit-big">' + kit(a, true) + '</div>' +
          '<div class="strong">' + esc(a.name) + '</div></div>' +
      '</div>' +
      '<div class="live-clock"><span class="lc-time" id="liveTime">' +
        esc(E.clockLabel(live.sp, 0)) + '</span>' +
        '<span class="lc-period" id="livePeriod"></span></div>' +
      '<div id="liveFlash" aria-live="polite"></div>' +
      '<div class="live-bar"><i id="liveBar" style="width:0%"></i></div>' +
      '<div id="liveMoments"></div>' +
      '<div class="live-feed" id="liveFeed"><p class="small muted center" id="liveEmpty">' +
        'Kick-off. Nothing on the board yet.</p></div>' +
      '<div class="btn-row live-controls" id="liveControls" style="margin-top:14px">' +
        '<button class="btn btn-sm" data-act="live-pause" id="livePause">Pause</button>' +
        '<button class="btn btn-sm" data-act="live-speed" id="liveSpeed">Speed 1×</button>' +
        '<button class="btn btn-primary btn-sm" data-act="live-skip">Skip to full time</button>' +
      '</div>';
    modal(h.abbr + ' v ' + a.abbr + ' — live', body);
    drawLiveFrame();
  }

  function startLiveTimer() {
    if (live.timer) clearInterval(live.timer);
    live.timer = setInterval(liveStep, Math.max(30, Math.round(LIVE_TICK / live.speed)));
  }

  function liveStep() {
    if (!live || live.paused || live.done) return;
    live.t += live.end / LIVE_FRAMES;
    if (live.t >= live.end) { live.t = live.end; finishLive(); return; }
    drawLiveFrame();
  }

  // Put every score whose minute has come round onto the board and the feed.
  function revealDue() {
    var out = [];
    while (live.i < live.evs.length && live.evs[live.i].min <= live.t) {
      var ev = live.evs[live.i++];
      if (ev.side === 'h') live.hg += ev.v; else live.ag += ev.v;
      out.push(ev);
    }
    return out;
  }

  function liveFeedRow(ev) {
    var map = E.teamsById(live.comp);
    var team = ev.side === 'h' ? map[live.m.h] : map[live.m.a];
    var p = live.players[ev.s], as = live.players[ev.a];
    var multi = live.sp.units.length > 1;
    return '<div class="live-ev">' +
      '<span class="le-min">' + esc(E.clockLabel(live.sp, ev.min)) + '</span>' +
      '<span class="le-kit">' + kit(team) + '</span>' +
      '<span class="le-name">' + esc(p ? p.name : 'Unknown') +
        (multi ? '<span class="muted tiny"> +' + (ev.v || 1) + '</span>' : '') + '</span>' +
      '<span class="le-note tiny muted">' + (as ? 'assist ' + esc(as.name) : '') + '</span>' +
      '</div>';
  }

  function drawLiveFrame() {
    var fresh = revealDue();
    var t = Math.min(live.end, Math.round(live.t));
    var per = E.periodAt(live.sp, Math.max(1, t));
    var timeEl = $('#liveTime'), perEl = $('#livePeriod'), barEl = $('#liveBar'),
        scoreEl = $('#liveScore'), feed = $('#liveFeed');
    if (timeEl) timeEl.textContent = E.clockLabel(live.sp, Math.max(1, t));
    if (perEl) {
      perEl.textContent = per.ot ? per.word
        : per.word + ' ' + per.n + (per.of > 1 ? ' of ' + per.of : '');
    }
    if (barEl) barEl.style.width = Math.round((live.t / live.end) * 100) + '%';
    if (scoreEl) scoreEl.textContent = live.hg + ' – ' + live.ag;
    if (fresh.length && feed) {
      var empty = $('#liveEmpty');
      if (empty && empty.parentNode) empty.parentNode.removeChild(empty);
      // newest at the top, the way a live blog reads; a moment sits on top of its play
      var flashed = null;
      feed.insertAdjacentHTML('afterbegin', fresh.map(function (ev) {
        var hits = live.flashes.filter(function (f) { return f.min === ev.min && f.s === ev.s; });
        hits.forEach(function (f) { live.shown[f.id] = true; });
        if (hits.length) flashed = hits[hits.length - 1];
        return hits.map(function (f) {
          return '<div class="le-flash">' + storyIcon(f.k) + ' ' + esc(f.text) + '</div>';
        }).join('') + liveFeedRow(ev);
      }).reverse().join(''));
      var flashEl = $('#liveFlash');
      if (flashed && flashEl) {
        flashEl.innerHTML = '<div class="live-flash">' + storyIcon(flashed.k) + ' ' + esc(flashed.text) + '</div>';
      }
    }

    // knocks and cards come up on the clock too
    var incs = [];
    while (live.ii < live.incs.length && live.incs[live.ii].min <= live.t) incs.push(live.incs[live.ii++]);
    if (incs.length && feed) {
      var empty2 = $('#liveEmpty');
      if (empty2 && empty2.parentNode) empty2.parentNode.removeChild(empty2);
      var tmap = E.teamsById(live.comp);
      feed.insertAdjacentHTML('afterbegin', incs.map(function (x) {
        var p = live.players[x.p], team = x.side === 'h' ? tmap[live.m.h] : tmap[live.m.a];
        return '<div class="live-ev live-inc"><span class="le-min">' + esc(E.clockLabel(live.sp, x.min)) + '</span>' +
          '<span class="le-kit">' + kit(team) + '</span>' +
          '<span class="le-name">' + INC_ICON[x.k] + ' ' + esc(p ? p.name : 'Unknown') + '</span>' +
          '<span class="le-note tiny muted">' + incNote(x) + '</span></div>';
      }).reverse().join(''));
    }
  }

  function finishLive() {
    if (!live) return;
    if (live.timer) clearInterval(live.timer);
    live.timer = null;
    live.t = live.end;
    live.done = true;
    drawLiveFrame();

    var m = live.m, comp = live.comp;
    var map = E.teamsById(comp), h = map[m.h], a = map[m.a];
    var verdict = m.pens
      ? (m.shootoutWinner === m.h ? h.name : a.name) + ' win ' +
        m.pens[0] + '–' + m.pens[1] + ' on penalties'
      : m.ot ? 'Settled in ' + (live.sp.otLabel || (E.clockOf(live.sp).ot || {}).word || 'overtime')
      : m.hg === m.ag ? 'Full time — honours even'
      : (m.hg > m.ag ? h.name : a.name) + ' take it';

    var ft = $('#liveTime');
    if (ft) ft.textContent = live.sp.clock && live.sp.clock.unit === 'inning' ? 'Final' : 'FT';
    var per = $('#livePeriod');
    if (per) per.textContent = verdict;
    var controls = $('#liveControls');
    if (controls) {
      controls.innerHTML =
        '<button class="btn btn-sm" data-act="match" data-id="' + esc(m.id) + '">Match details</button>' +
        '<button class="btn btn-primary btn-sm" data-act="close-modal">Done</button>';
    }

    // full time: whatever this match meant, said once the whistle has gone
    if (MS) {
      // what already flashed up in play stays where it is; the rest is said now
      var said = (live.pending ? MS.since(comp, live.seq) : MS.forMatch(comp, m.id))
        .filter(function (e) { return e.w >= 2 && !live.shown[e.id]; });
      var momEl = $('#liveMoments');
      if (momEl && said.length) {
        momEl.innerHTML = '<div class="ft-moments"><div class="lbl">Full time</div>' +
          MS.byWeight(said).slice(0, 4).map(function (e) {
            return '<div class="ftm w' + e.w + '"><span aria-hidden="true">' + storyIcon(e.k) + '</span> ' +
              esc(e.text) + '</div>';
          }).join('') + '</div>';
      }
    }

    if (live.pending) {
      var res = settleBets(comp);
      live.pending = false;
      persist();
      render();
      simToast(comp, res, comp.season.complete ? 'Season complete' : null);
    }
  }

  function toggleLivePause() {
    if (!live || live.done) return;
    live.paused = !live.paused;
    var b = $('#livePause');
    if (b) b.textContent = live.paused ? 'Resume' : 'Pause';
  }

  function cycleLiveSpeed() {
    if (!live) return;
    live.speed = live.speed === 1 ? 2 : live.speed === 2 ? 4 : 1;
    var b = $('#liveSpeed');
    if (b) b.textContent = 'Speed ' + live.speed + '×';
    if (!live.done) startLiveTimer();
  }

  function skipLive() {
    if (!live || live.done) return;
    live.t = live.end;
    finishLive();
  }

  function showMatch(comp, id) {
    var s = comp.season, map = E.teamsById(comp);
    var m = null;
    for (var i = 0; i < s.matches.length; i++) if (s.matches[i].id === id) m = s.matches[i];
    if (!m) return;
    var h = map[m.h], a = map[m.a];
    var playersById = {};
    comp.teams.forEach(function (t) { t.players.forEach(function (p) { playersById[p.id] = p; }); });

    var head =
      '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;text-align:center">' +
        '<div><div style="font-size:1.6rem">' + kit(h, true) + '</div>' +
        '<div class="strong" style="margin-top:6px">' + esc(h.name) + '</div>' +
        '<div class="tiny muted">ATT ' + h.att + ' · DEF ' + h.def + '</div></div>' +
        '<div style="font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums">' +
          (m.played ? m.hg + ' – ' + m.ag : 'v') + '</div>' +
        '<div><div style="font-size:1.6rem">' + kit(a, true) + '</div>' +
        '<div class="strong" style="margin-top:6px">' + esc(a.name) + '</div>' +
        '<div class="tiny muted">ATT ' + a.att + ' · DEF ' + a.def + '</div></div>' +
      '</div>';

    var meta = '<div class="center small muted" style="margin:12px 0">' +
      (m.stage === 'qual' ? esc(m.round || 'Qualifying') + ' qualifying · round ' + (m.md + 1) :
       m.stage === 'finals' ? esc(m.round) +
         (m.weekLabel && m.weekLabel !== m.round ? ' · ' + esc(m.weekLabel) : '') :
       m.stage === 'ko' ? esc(m.round) + (m.leg ? ' · leg ' + m.leg : '') :
       m.stage === 'group' ? 'Group ' + String.fromCharCode(65 + m.group) + ' · matchday ' + (m.md + 1) :
       'Matchday ' + (m.md + 1)) +
      (m.pens ? ' · won ' + m.pens[0] + '–' + m.pens[1] + ' on penalties' : '') +
      (m.ot ? ' · decided in ' + esc(sportOf(comp).otLabel || 'overtime') : '') +
      '</div>';

    var sp = sportOf(comp);
    var multiValue = sp.units.length > 1;
    var events = m.played && m.events.length ?
      '<div class="section-title">' + esc(sp.scoreWord) + '</div>' +
      '<div class="table-wrap"><table class="data"><tbody>' +
      m.events.map(function (ev) {
        var p = playersById[ev.s], as = playersById[ev.a];
        var team = ev.side === 'h' ? h : a;
        return '<tr><td class="l muted nowrap" style="width:54px">' +
            esc(E.clockLabel(sp, ev.min)) + '</td>' +
          '<td class="l">' + kit(team) + '</td>' +
          '<td class="l strong">' + esc(p ? p.name : 'Unknown') + '</td>' +
          (multiValue ? '<td class="l muted tiny nowrap">+' + (ev.v || 1) + '</td>' : '') +
          '<td class="l muted tiny">' + (as ? 'assist ' + esc(as.name) : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' :
      (m.played ? '<p class="small muted center">Nothing scored.</p>' :
        '<p class="small muted center">Not played yet.</p>');

    var foot = '<div class="btn-row" style="margin-top:16px;justify-content:center">' +
      (m.played
        ? '<button class="btn" data-act="watch" data-id="' + esc(m.id) + '">Watch it back</button>'
        : '<button class="btn btn-primary" data-act="watch" data-id="' + esc(m.id) + '">Watch it live</button>' +
          '<button class="btn" data-act="sim-this" data-id="' + esc(m.id) + '">Skip to the result</button>') +
      '</div>';

    var story = '';
    if (MS && !m.played) story = stakesBlock(MS.stakes(comp, m));
    else if (MS) {
      var moments = MS.forMatch(comp, m.id);
      if (moments.length) {
        story = '<div class="section-title" style="margin-top:16px">Moments</div>' +
          MS.byWeight(moments).map(function (e) { return storyRow(comp, e); }).join('');
      }
    }
    modal(h.abbr + ' v ' + a.abbr, head + rivalCallout(comp, m) + (m.played ? '' : story) +
      missingBlock(comp, m) + meta + events + incidentBlock(comp, m) + (m.played ? story : '') + foot);
  }

  /* ------------------------------------------------------------ stats view */

  function viewStats(comp) {
    var ui = app.ui, s = comp.season;
    var phase = statPhase(comp);
    var filter = phaseFilter(comp, phase);
    var table = phaseTable(comp, phase);
    var played = s.matches.filter(function (m) {
      return m.played && m.stage !== 'finals' && (!filter || filter(m));
    });

    var tabList = [['players', 'Players'], ['teams', 'Teams'], ['charts', 'Charts'], ['records', 'Records']];
    if (comp.rankings) tabList.push(['ranking', 'Ranking']);
    var tabs = '<div class="seg">' +
      tabList.map(function (t) {
        return '<button data-act="stat-tab" data-tab="' + t[0] + '" aria-pressed="' +
          (ui.statTab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>';

    // a World Cup keeps its qualifying figures apart from the finals
    var phaseSeg = isWorldCup(comp) && ui.statTab !== 'ranking' ? '<div class="seg">' +
      [['finals', 'Finals'], ['qual', 'Qualifying'], ['all', 'Both']].map(function (t) {
        return '<button data-act="stat-phase" data-phase="' + t[0] + '" aria-pressed="' +
          (phase === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>' : '';

    // the ranking splits into where the ladder stands and how it got there
    var rankSeg = ui.statTab === 'ranking' && comp.rankings ? '<div class="seg">' +
      [['ladder', 'Ladder'], ['history', 'History']].map(function (t) {
        return '<button data-act="rank-tab" data-tab="' + t[0] + '" aria-pressed="' +
          (ui.rankTab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>' : '';

    var body;
    if (ui.statTab === 'ranking' && comp.rankings) {
      body = ui.rankTab === 'history'
        ? rankingHistoryView(comp)
        : '<div class="stack">' + rankingMovers(comp) + rankingsCard(comp) + '</div>';
    } else if (ui.statTab === 'players') body = statsPlayers(comp, phase);
    else if (ui.statTab === 'teams') body = statsTeams(comp, table, phase);
    else if (ui.statTab === 'charts') body = statsCharts(comp, liveTable(comp));
    else body = statsRecords(comp, played, table, phase);

    return '<div class="stack">' +
      '<div class="card"><div class="card-head"><h2>Season ' + s.number + ' statistics</h2>' +
      tabs + phaseSeg + rankSeg +
      '<span class="badge">' + (ui.statTab === 'ranking'
        ? 'world ranking'
        : played.length + ' matches' +
          (isWorldCup(comp) ? ' \u00b7 ' + esc(phaseLabel(phase).toLowerCase()) : ' played')) + '</span>' +
      '</div></div>' + body + '</div>';
  }

  function statsPlayers(comp, phase) {
    var sp = sportOf(comp);
    var scorers = E.topScorers(comp.teams, 25, phase);
    if (!scorers.length) {
      return '<div class="card"><div class="card-body"><p class="muted small" style="margin:0">' +
        'No player has scored yet in ' +
        (isWorldCup(comp) ? phaseLabel(phase).toLowerCase() : 'this season') + '.</p></div></div>';
    }
    var assists = E.topScorers(comp.teams, 0, phase)
      .filter(function (x) { return x.a > 0; })
      .sort(function (x, y) { return y.a - x.a || y.g - x.g; }).slice(0, 12);

    var contrib = scorers.slice().sort(function (x, y) {
      return (y.g + y.a) - (x.g + x.a);
    }).slice(0, 12);

    function plist(rows, valFn, valHead) {
      return '<div class="table-wrap"><table class="data"><thead><tr>' +
