const el = id => document.getElementById(id);
const reqVal = el('reqVal'), popVal = el('popVal'), timeVal = el('timeVal'),
      missionTag = el('missionTag'), rosterEl = el('roster'), abEl = el('abilities'),
      ovl = el('ovl'), toastEl = el('toast'), bannerEl = el('bannerTxt'),
      hqPFill = el('hqP').querySelector('.hqfill'), hqEFill = el('hqE').querySelector('.hqfill'),
      hqPName = el('hqPName'), hqEName = el('hqEName');

let toastT = 0, bannerT = 0, aimX = null;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); toastT = 2.2; }
function banner(msg){ bannerEl.textContent = msg; bannerEl.classList.add('show'); bannerT = 3.4; }

const cardRefs = [];
const SPRITE = {};
function sprite(def, w, h){
  const k = def.id + '_' + w + '_' + h;
  if (!SPRITE[k]) SPRITE[k] = unitSprite(def, w, h);
  return SPRITE[k];
}
function buildBars(){
  rosterEl.innerHTML = ''; abEl.innerHTML = ''; cardRefs.length = 0;
  const ord = document.createElement('button');
  ord.className = 'card ab ord'; ord.dataset.ord = '1';
  ord.title = 'Hold the line — click the battlefield to set where your units stop and dig in. Click again to release.';
  ord.innerHTML = '<span class="key">R</span><span class="ic">HOLD</span>' +
    '<span class="nm">Set Line</span><span class="ft"><span class="cst">Free</span></span>';
  ord.addEventListener('click', toggleHold);
  abEl.appendChild(ord);
  cardRefs.push({ kind:'ord', el:ord });
  ABILITIES.forEach(a => {
    const b = document.createElement('button');
    b.className = 'card ab'; b.dataset.ab = a.id; b.title = a.name + ' — ' + a.desc;
    b.innerHTML = '<span class="key">' + a.key + '</span><span class="ic">' + a.ic + '</span>' +
      '<span class="nm">' + a.name + '</span>' +
      '<span class="ft"><span class="cst">$' + a.cost + '</span></span>' +
      '<span class="cdfill" style="top:0"></span><span class="cdnum"></span>';
    b.addEventListener('click', () => armAbility(a.id));
    abEl.appendChild(b);
    cardRefs.push({ kind:'ab', id:a.id, el:b, fill:b.querySelector('.cdfill'), num:b.querySelector('.cdnum') });
  });
  UNITS.forEach((def, i) => {
    const unlocked = G.M && G.M.roster.indexOf(def.id) >= 0;
    const b = document.createElement('button');
    b.className = 'card' + (unlocked ? '' : ' locked');
    b.dataset.id = def.id;
    b.title = unlocked ? def.name + ' — ' + def.desc : def.name + ' — not available in this sector';
    b.innerHTML = '<span class="key">' + (i+1) + '</span><span class="spr"></span>' +
      '<span class="nm">' + def.name + '</span>' +
      '<span class="ft"><span class="cst">$' + def.cost + '</span><span class="pp">' + def.pop + ' POP</span></span>' +
      '<span class="cdfill" style="top:0"></span><span class="cdnum"></span>';
    const narrow = window.innerWidth < 620;
    const holder = b.querySelector('.spr');
    const spr = sprite(def, narrow ? 54 : 62, narrow ? 22 : 28);
    holder.appendChild(spr);
    spr.style.filter = unlocked ? 'none' : 'grayscale(1) brightness(.8)';
    if (unlocked) b.addEventListener('click', () => deploy(def.id));
    rosterEl.appendChild(b);
    cardRefs.push({ kind:'u', id:def.id, el:b, fill:b.querySelector('.cdfill'), num:b.querySelector('.cdnum'), def, unlocked });
  });
}

function updateHUD(){
  reqVal.textContent = fmtMoney(G.cash);
  const p = popOf(0);
  popVal.textContent = p + '/' + G.popCap;
  popVal.classList.toggle('full', p >= G.popCap);
  timeVal.textContent = fmtTime(G.t);
  if (G.hqP) hqPFill.style.transform = 'scaleX(' + clamp(G.hqP.hp/G.hqP.maxHp,0,1) + ')';
  if (G.hqE) hqEFill.style.transform = 'scaleX(' + (G.M && G.M.endless ? 1 : clamp(G.hqE.hp/G.hqE.maxHp,0,1)) + ')';
  for (const c of cardRefs){
    if (c.kind === 'ord'){
      c.el.classList.toggle('holding', G.rally != null);
      c.el.classList.toggle('armed', G.armed === 'hold');
      c.el.querySelector('.cst').textContent = G.rally != null ? 'Holding' : 'Free';
      continue;
    }
    if (c.kind === 'ab'){
      const ab = ABILITIES.find(a => a.id === c.id);
      const cd = G.abCool[c.id] || 0;
      c.fill.style.transform = 'scaleY(' + clamp(cd / abCd(ab.cool),0,1) + ')';
      c.num.textContent = cd > 0 ? Math.ceil(cd) : '';
      c.el.classList.toggle('poor', G.cash < ab.cost && cd <= 0);
      c.el.classList.toggle('armed', G.armed === c.id);
      c.el.classList.toggle('ready', cd <= 0 && G.cash >= ab.cost);
    } else {
      if (!c.unlocked) continue;
      const cd = G.cool[c.id] || 0;
      c.fill.style.transform = 'scaleY(' + clamp(cd / unitCool(c.def),0,1) + ')';
      c.num.textContent = cd > 0 ? Math.ceil(cd) : '';
      const afford = G.cash >= c.def.cost && p + c.def.pop <= G.popCap;
      c.el.classList.toggle('poor', !afford);
      c.el.classList.toggle('ready', cd <= 0 && afford);
    }
  }
}

/* ---------------- abilities arming ---------------- */

function toggleHold(){
  if (!G.live) return;
  if (G.rally != null){
    G.rally = null; G.armed = null;
    stage.classList.remove('targeting');
    toast('Advance — units push for the enemy command post');
    Audio_.play('ui');
    return;
  }
  G.armed = G.armed === 'hold' ? null : 'hold';
  stage.classList.toggle('targeting', !!G.armed);
  if (G.armed){ toast('Click the ground where your line should hold'); Audio_.play('ui'); }
}

function armAbility(id){
  const ab = ABILITIES.find(a => a.id === id);
  if (!G.live || G.paused) return;
  if ((G.abCool[id] || 0) > 0){ Audio_.play('deny'); toast(ab.name + ' is not ready'); return; }
  if (G.cash < ab.cost){ Audio_.play('deny'); toast('Not enough requisition'); return; }
  G.armed = G.armed === id ? null : id;
  stage.classList.toggle('targeting', !!G.armed);
  if (G.armed){ toast('Pick a target point on the line'); Audio_.play('ui'); }
}

/* ---------------- input ---------------- */

let dragging = false, dragX = 0, dragMoved = 0, lastPx = 0;
const sx2wx = px => G.cam.x + (px - stage.getBoundingClientRect().left) / S;

stage.addEventListener('pointerdown', e => {
  Audio_.resume();
  if (!G.live) return;
  if (G.armed){
    const wx = clamp(sx2wx(e.clientX), 120, WORLD_LEN - 120);
    if (G.armed === 'hold'){
      G.rally = wx;
      toast('Holding here — press R or the HOLD card to advance again');
      Audio_.play('ui');
    } else {
      useAbility(G.armed, wx);
    }
    G.armed = null; aimX = null;
    stage.classList.remove('targeting');
    return;
  }
  dragging = true; dragMoved = 0; lastPx = e.clientX;
  stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (G.armed){ aimX = clamp(sx2wx(e.clientX), 60, WORLD_LEN - 60); return; }
  if (!dragging) return;
  const dx = e.clientX - lastPx; lastPx = e.clientX;
  dragMoved += Math.abs(dx);
  G.cam.x = clamp(G.cam.x - dx/S, 0, maxCam());
  G.cam.manual = 5;
});
function endDrag(){ dragging = false; stage.classList.remove('dragging'); }
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!G.live) return;
  G.rally = clamp(sx2wx(e.clientX), 120, WORLD_LEN - 120);
  G.armed = null; stage.classList.remove('targeting');
  toast('Holding here — press R to advance again');
  Audio_.play('ui');
});
stage.addEventListener('wheel', e => {
  if (!G.live) return;
  e.preventDefault();
  G.cam.x = clamp(G.cam.x + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 1.1 / S, 0, maxCam());
  G.cam.manual = 5;
}, { passive:false });

const panKeys = { left:false, right:false };
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'escape'){
    if (G.armed){ G.armed = null; aimX = null; stage.classList.remove('targeting'); }
    else if (!ovl.hidden && ovl.dataset.closable === '1') closeOverlay();
    return;
  }
  if (k === 'h'){ toggleManual(); return; }
  if (!G.live) return;
  if (k >= '1' && k <= '8'){ const def = UNITS[+k - 1]; if (def) deploy(def.id); e.preventDefault(); return; }
  if (k === 'q') armAbility('arty');
  if (k === 'w') armAbility('air');
  if (k === 'e') armAbility('sup');
  if (k === 'r') toggleHold();
  if (k === ' '){ togglePause(); e.preventDefault(); }
  if (k === 'a' || k === 'arrowleft') panKeys.left = true;
  if (k === 'd' || k === 'arrowright') panKeys.right = true;
  if (k === 'f'){ G.cam.manual = 0; toast('Camera following the front'); }
  if (k === '+' || k === '=') setSpeed(G.speed % 3 + 1);
  if (k === '-') setSpeed(Math.max(1, G.speed - 1));
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'arrowleft') panKeys.left = false;
  if (k === 'd' || k === 'arrowright') panKeys.right = false;
});

/* ---------------- camera ---------------- */

function maxCam(){ return Math.max(0, WORLD_LEN - viewW); }

function autoCam(dt){
  if (panKeys.left){ G.cam.x -= 520*dt; G.cam.manual = 5; }
  if (panKeys.right){ G.cam.x += 520*dt; G.cam.manual = 5; }
  if (G.cam.manual > 0){ G.cam.manual -= dt; }
  else if (G.live){
    let pf = G.hqP.x, ef = G.hqE.x;
    for (const u of G.units){
      if (u.dead || u.structure) continue;
      if (u.side === 0) pf = Math.max(pf, u.x);
      else ef = Math.min(ef, u.x);
    }
    const gap = ef - pf;
    const focus = gap > viewW*.8 ? pf + viewW*.3 : (pf + ef)/2;
    const want = clamp(focus - viewW/2, 0, maxCam());
    G.cam.x = lerp(G.cam.x, want, clamp(dt*2.2, 0, 1));
  }
  G.cam.x = clamp(G.cam.x, 0, maxCam());
}

/* ---------------- battle lifecycle ---------------- */

function layoutCovers(M){
  G.covers = [];
  const mid = WORLD_LEN/2;
  const spots = [mid - 480, mid - 240, mid, mid + 240, mid + 480];
  for (const x of spots) G.covers.push({ x, w: 84 });
  if (hasPerk('sappers')){
    G.covers.push({ x: mid - 120, w: 80 });
    G.covers.push({ x: mid - 360, w: 80 });
  }
}

function startBattle(M, index, endless){
  G.M = M; G.mIndex = index; G.endless = !!endless;
  G.units = []; G.projs = []; G.parts = []; G.craters = []; G.corpses = []; G.planes = []; G.timers = [];
  G.decals = []; G.rally = null;
  G.cool = {}; G.abCool = {}; G.armed = null; aimX = null;
  G.t = 0; G.cash = M.cash; G.income = M.income;
  G.popCap = POP_BASE + (hasPerk('logi') ? 5 : 0);
  G.stats = { kills:0, losses:0, spent:0, peak:0 };
  G.ai = { cash: 120, next: 3.2, artCd: 52, wave:0 };
  G.shake = 0; G.over = null; G.paused = false; G.live = true;
  bgSeed = (index + 1) * 977 + 13;
  buildLayers();
  setSpeed(1);
  el('btnPause').textContent = 'Pause'; el('btnPause').classList.remove('on');

  const hqHp = M.hq * (hasPerk('fort') ? 1.25 : 1);
  G.hqP = makeHQ(0, 78, hqHp);
  G.hqE = makeHQ(1, WORLD_LEN - 78, M.ehq);
  G.units.push(G.hqP, G.hqE);
  layoutCovers(M);

  missionTag.textContent = M.name + ' · ' + M.loc;
  hqPName.textContent = 'Allied CP';
  hqEName.textContent = endless ? 'Endless' : 'Axis CP';
  buildBars();
  G.cam.x = 0; G.cam.manual = 2.5;
  closeOverlay();
  banner(M.endless ? 'Hold the line.' : 'Advance when ready.');
}

function checkEnd(){
  if (G.over) return;
  if (G.hqP.hp <= 0){ endBattle(false); return; }
  if (!G.M.endless && G.hqE.hp <= 0){ endBattle(true); return; }
}

function endBattle(win){
  G.over = win ? 'win' : 'lose';
  G.live = false;
  G.armed = null; stage.classList.remove('targeting');
  Audio_.play(win ? 'win' : 'lose');
  if (G.M.endless){
    const score = Math.round(G.t * 10 + G.stats.kills * 25);
    if (score > (G.save.best || 0)){ G.save.best = score; }
    save();
    showResult(false, score);
    return;
  }
  if (win){
    G.save.progress = Math.max(G.save.progress || 0, G.mIndex + 1);
    G.save.wins = (G.save.wins || 0) + 1;
    save();
    setTimeout(() => showPerks(), 900);
  } else {
    setTimeout(() => showResult(false), 900);
  }
}

/* ---------------- main loop ---------------- */

function step(dt){
  G.t += dt;
  G.cash += G.income * (hasPerk('quarter') ? 1.18 : 1) * dt;
  for (const k in G.cool) if (G.cool[k] > 0) G.cool[k] -= dt;
  for (const k in G.abCool) if (G.abCool[k] > 0) G.abCool[k] -= dt;

  for (let i = G.timers.length - 1; i >= 0; i--){
    G.timers[i].t -= dt;
    if (G.timers[i].t <= 0){ G.timers[i].fn(); G.timers.splice(i,1); }
  }
  for (const u of G.units) updateUnit(u, dt);
  updateProjs(dt);
  updatePlanes(dt);
  updateParts(dt);
  aiUpdate(dt);
  for (const c of G.corpses) c.t += dt;
  for (let i = G.units.length - 1; i >= 0; i--){
    const u = G.units[i];
    if (u.dead && !u.structure && u.deadT > 1.5) G.units.splice(i,1);
  }
  G.stats.peak = Math.max(G.stats.peak, popOf(0));
  checkEnd();
}

let lastT = performance.now();
function frame(now){
  const real = Math.min(.08, (now - lastT)/1000 || 0);
  lastT = now;

  if (G.live && !G.paused){
    const base = Math.min(1/30, real);
    for (let i=0;i<G.speed;i++) step(base);
  }
  autoCam(real);

  G.shake = Math.max(0, G.shake - real*34);
  const sh = G.shake;
  shakeX = rnd(sh,-sh); shakeY = rnd(sh,-sh)*.6;

  if (toastT > 0){ toastT -= real; if (toastT <= 0) toastEl.classList.remove('show'); }
  if (bannerT > 0){ bannerT -= real; if (bannerT <= 0) bannerEl.classList.remove('show'); }

  render();
  renderMini();
  updateHUD();
  requestAnimationFrame(frame);
}

        '<div class="stats">' +
          (endless ? '<div class="stat"><div class="sl">Score</div><div class="sv" style="color:var(--brass)">' + score + '</div></div>' +
                     '<div class="stat"><div class="sl">Best</div><div class="sv">' + (G.save.best||0) + '</div></div>' : '') +
          '<div class="stat"><div class="sl">Enemy lost</div><div class="sv">' + s.kills + '</div></div>' +
          '<div class="stat"><div class="sl">Own lost</div><div class="sv">' + s.losses + '</div></div>' +
          '<div class="stat"><div class="sl">Held for</div><div class="sv">' + fmtTime(G.t) + '</div></div>' +
        '</div>' +
        '<div class="rowbtns">' +
          '<button class="btn primary" data-act="retry">Try Again</button>' +
          '<button class="btn ghost" data-act="title">Operations Board</button>' +
        '</div>' +
      '</div>' +
    '</div>', false);
  ovl.querySelector('[data-act="retry"]').onclick = () => {
    if (endless) startBattle(Object.assign({}, ENDLESS), MISSIONS.length, true);
    else startBattle(MISSIONS[G.mIndex], G.mIndex, false);
  };
  ovl.querySelector('[data-act="title"]').onclick = showTitle;
}

let manualBack = null;
function toggleManual(){
  if (!ovl.hidden && ovl.dataset.manual === '1'){ closeManual(); return; }
  if (!ovl.hidden && ovl.dataset.closable !== '1') return;
  showManual(null);
}
function closeManual(){
  ovl.dataset.manual = '0';
  if (manualBack){ const f = manualBack; manualBack = null; f(); }
  else closeOverlay();
}
function showManual(back){
  manualBack = back || null;
  const rows = UNITS.map(u => '<tr><td>' + u.name + '</td><td>$' + u.cost + '</td><td>' + u.pop + '</td><td>' +
    (u.veh ? u.hp : u.hp + '×' + u.n) + '</td><td>' + u.range + '</td><td>' + (u.armor || 0) + '</td><td>' + u.desc + '</td></tr>').join('');
  openOverlay(
    '<div class="panel">' +
      '<div class="panel-hd"><div class="eyebrow">Issued to all section commanders</div><h2>Field Manual</h2></div>' +
      '<div class="panel-bd"><div class="manual">' +
        '<div><h3>The idea</h3><p>Requisition ticks up every second. Spend it on squads, they walk toward the enemy command post on their own, stop when something is in range, and fight. Kill the enemy CP before they kill yours. You never move a unit by hand — you choose <em>what</em> to buy and <em>when</em>.</p></div>' +
        '<div><h3>Three things that decide fights</h3><ul>' +
          '<li><strong>Cover.</strong> Sandbag lines cut incoming damage by nearly half. A squad that stops inside one is worth two in the open.</li>' +
          '<li><strong>Suppression.</strong> Machine guns pin infantry flat. Pinned squads crawl, shoot badly, and cannot close — but they are harder to kill, so finish them with mortars.</li>' +
          '<li><strong>Armour.</strong> Rifles barely scratch a tank. Bazookas and tank guns tear through one. Send the right tool or waste the money.</li>' +
        '</ul></div>' +
        '<div><h3>Holding ground</h3><p>Units walk forward until something is in range. That is fine when you outgun them and terrible when you do not. Set a hold line on a sandbag position and your squads stop there, in cover, and make the enemy cross the open ground instead. Release it when you are ready to push.</p></div>' +
        '<div><h3>Veterancy</h3><p>Squads earn a chevron every few kills, up to three, and each one adds 10% damage. A veteran rifle squad sitting in cover is the cheapest thing on the field.</p></div>' +
        '<div><h3>Controls</h3><ul>' +
          '<li><span class="kbd">1</span>–<span class="kbd">8</span> deploy a unit · click a card does the same</li>' +
          '<li><span class="kbd">Q</span> barrage · <span class="kbd">W</span> air strike · <span class="kbd">E</span> resupply, then click the ground to aim</li>' +
          '<li><span class="kbd">R</span> or the HOLD card, then click the ground — your units stop there and dig in instead of walking into the guns. Right-click does it in one step; press <span class="kbd">R</span> again to advance.</li>' +
          '<li><span class="kbd">A</span><span class="kbd">D</span> or drag to pan · <span class="kbd">F</span> follow the front · <span class="kbd">Space</span> pause · <span class="kbd">+</span><span class="kbd">-</span> speed</li>' +
          '<li><span class="kbd">FX</span> in the top bar drops bloom and grading if the frame rate suffers</li>' +
        '</ul></div>' +
        '<div><h3>Order of battle</h3><div class="scroll-x"><table class="utable"><thead><tr><th>Unit</th><th>Cost</th><th>Pop</th><th>HP</th><th>Range</th><th>Armour</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '</div>' +
      '<div class="rowbtns"><button class="btn primary" data-act="close">Close</button></div></div>' +
    '</div>', true);
  ovl.dataset.manual = '1';
  ovl.querySelector('[data-act="close"]').onclick = closeManual;
}

/* ---------------- boot ---------------- */

function start(snapshot){
  load();
  if (snapshot && snapshot.perks) G.perks = snapshot.perks;
  resize();
  setSpeed(1);
  showTitle();
  lastT = performance.now();
  requestAnimationFrame(frame);
}

try {
  if (window.claude && window.claude.hot){
    window.claude.hot.snapshot(() => ({ perks: G.perks, progress: G.save.progress }));
  }
} catch(e){}

if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start({});
</script>
</body>
</html>
