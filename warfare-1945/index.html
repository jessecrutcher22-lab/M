const G = {
  screen:'title', M:null, mIndex:0, endless:false,
  live:false, paused:false, speed:1, over:null,
  t:0, cash:0, income:0, popCap:POP_BASE,
  units:[], projs:[], parts:[], craters:[], corpses:[], covers:[], planes:[], timers:[], decals:[],
  rally:null,
  hqP:null, hqE:null,
  cool:{}, abCool:{}, armed:null,
  cam:{ x:0, manual:0 }, shake:0,
  stats:{ kills:0, losses:0, spent:0, peak:0 },
  ai:{ cash:0, next:2, artCd:50, wave:0 },
  perks:[], save:{ progress:0, perks:[], best:0, wins:0 }
};

const hasPerk = id => G.perks.indexOf(id) >= 0;

/* ---------------- save ---------------- */

function load(){
  try {
    const raw = localStorage.getItem('warfare1945');
    if (raw) Object.assign(G.save, JSON.parse(raw));
  } catch(e){}
  G.perks = Array.isArray(G.save.perks) ? G.save.perks.slice() : [];
}
function save(){
  try {
    G.save.perks = G.perks.slice();
    localStorage.setItem('warfare1945', JSON.stringify(G.save));
  } catch(e){}
}

/* ---------------- unit construction ---------------- */

function infHpMult(side){
  let m = 1;
  if (side === 0 && hasPerk('rations')) m *= 1.14;
  if (side === 1) m *= G.M.eSkill * .55 + .72;
  return m;
}
function vehHpMult(side){
  let m = 1;
  if (side === 0 && hasPerk('steel')) m *= 1.18;
  if (side === 1) m *= G.M.eSkill * .55 + .72;
  return m;
}
function dmgMult(u){
  let m = 1 + u.vet * .1;
  if (u.side === 0){
    if (u.def.pen === 0 && !u.def.veh && hasPerk('marks')) m *= 1.12;
    if ((u.def.pen === 2 || u.def.veh) && hasPerk('ap')) m *= 1.18;
  } else {
    m *= .78 + G.M.eSkill * .34;
  }
  return m;
}

function makeUnit(def, side, x){
  const dir = side === 0 ? 1 : -1;
  const u = {
    def, side, dir, x, lane:(Math.random()*3)|0,
    dead:false, deadT:0, vet:0, kills:0, supp:0, moving:true,
    cd: def.rof * rnd(.9,.1), cd2: rnd(.4), recoil:0, flash:0, walk:rnd(9),
    target:null, hitBy:0, structure:false, hp:0, maxHp:0, members:null
  };
  if (def.veh){
    u.maxHp = def.hp * vehHpMult(side); u.hp = u.maxHp;
  } else {
    const per = def.hp * infHpMult(side);
    u.members = [];
    for (let i=0;i<def.n;i++){
      u.members.push({ ox: i*8.5 + rnd(3), oy: rnd(9)-4.5, hp:per, max:per, walk:rnd(9), flash:0 });
    }
    u.maxHp = per * def.n; u.hp = u.maxHp;
  }
  return u;
}

function makeHQ(side, x, hp){
  const def = { id:'hq', name:'Command Post', armor:1, range:210, rof:.14, dmg:4.2, pen:0, acc:.5, wep:'mg', veh:true, pop:0, cost:0 };
  const u = makeUnit(def, side, x);
  u.structure = true; u.maxHp = hp; u.hp = hp; u.moving = false;
  return u;
}

const isAlive = u => !u.dead;
function aliveMen(u){
  if (u.def.veh) return u.hp > 0 ? 1 : 0;
  let n = 0; for (const m of u.members) if (m.hp > 0) n++;
  return n;
}
function unitY(u){ return GROUND - 2 + (u.lane - 1) * 5; }

/* ---------------- cover ---------------- */

function inCover(x){
  for (const c of G.covers) if (x > c.x - c.w/2 && x < c.x + c.w/2) return true;
  return false;
}

/* ---------------- damage ---------------- */

function applyDamage(u, raw, pen, fromSide, opts){
  if (u.dead) return 0;
  opts = opts || {};
  const armor = u.def.armor || 0;
  let d = raw * PEN[pen][armor];
  if (!u.def.veh){
    if (!opts.ignoreCover && inCover(u.x)) d *= .55;
    if (u.supp > .45) d *= .82;
  } else if (u.structure){
    d *= .9;
  }
  u.hitBy = fromSide;
  let dealt = 0;
  if (u.def.veh){
    dealt = Math.min(u.hp, d); u.hp -= d;
    if (u.hp <= 0) killUnit(u, fromSide);
  } else {
    if (opts.splash){
      const live = u.members.filter(m => m.hp > 0);
      for (const m of live){ const part = d / Math.max(1, live.length) * rnd(1.3,.7); m.hp -= part; dealt += part; if (m.hp <= 0) manDown(u, m); }
    } else {
      const live = u.members.filter(m => m.hp > 0);
      if (!live.length) return 0;
      const m = pick(live);
      dealt = Math.min(m.hp, d); m.hp -= d;
      if (m.hp <= 0) manDown(u, m);
    }
    u.hp = u.members.reduce((s,m) => s + Math.max(0,m.hp), 0);
    if (u.hp <= 0) killUnit(u, fromSide);
  }
  return dealt;
}

function manDown(u, m){
  const y = unitY(u) + m.oy;
  G.corpses.push({ x: u.x - u.dir*m.ox, y, side:u.side, t:0, r: rnd(.5,-.5) });
  if (G.corpses.length > 90) G.corpses.shift();
  for (let i=0;i<5;i++) spark(u.x - u.dir*m.ox, y - 8, '#7a1d16', 1.6);
}

function killUnit(u, fromSide){
  if (u.dead) return;
  u.dead = true; u.deadT = 0;
  if (u.structure) return;
  if (u.def.veh){
    boom(u.x, unitY(u) - 8, 46, 26, u.side, 1, true);
    for (let i=0;i<16;i++) smoke(u.x + rnd(16,-16), unitY(u) - rnd(20), rnd(1.6,.6));
    G.corpses.push({ x:u.x, y:unitY(u), side:u.side, t:0, veh:true, r:0 });
  }
  if (fromSide === 0 && u.side === 1){
    let bounty = (u.def.cost || 0) * .3;
    if (hasPerk('salvage')) bounty *= 1.7;
    G.cash += bounty;
    G.stats.kills++;
    floatText(u.x, unitY(u) - 26, '+' + Math.round(bounty), '#d9a441');
  } else if (u.side === 0){
    G.stats.losses++;
  }
  // veterancy for the killer
  if (u.killerRef && !u.killerRef.dead){
    const k = u.killerRef; k.kills++;
    const need = hasPerk('vets') && k.side === 0 ? 2 : 4;
    k.vet = Math.min(3, Math.floor(k.kills / need));
  }
}

/* ---------------- effects ---------------- */

function spark(x,y,col,scale){
  G.parts.push({ k:'sp', x, y, vx:rnd(70,-70)*scale, vy:rnd(-20,-110)*scale, life:rnd(.5,.2), max:.5, col, s:rnd(2.2,.8) });
}
function dirt(x,y,n,scale){
  for (let i=0;i<n;i++)
    G.parts.push({ k:'dt', x, y, vx:rnd(150,-150)*scale, vy:rnd(-60,-260)*scale, life:rnd(1.1,.4), max:1.1,
      col: terr() === 'snow' ? '#b9c3cd' : '#5c4a33', s:rnd(3.4,1.2)*scale, rot:rnd(6), vr:rnd(9,-9) });
}
function smoke(x,y,scale){
  G.parts.push({ k:'sm', x, y, vx:rnd(16,-16), vy:rnd(-12,-40), life:rnd(2.4,1.1), max:2.4, col:'#8b8b86', s:rnd(11,5)*scale });
}
function floatText(x,y,txt,col){
  G.parts.push({ k:'tx', x, y, vx:0, vy:-26, life:1.1, max:1.1, col, txt });
}
function tracer(x0,y0,x1,y1,col,w){
  G.parts.push({ k:'tr', x0, y0, x1, y1, life:.075, max:.075, col, w:w||1 });
}

function boom(x, y, r, dmg, side, pen, noSound){
  if (!noSound) Audio_.play('boom', clamp(r/60,.5,1.4));
  const sc = clamp(r/44, .6, 1.7);
  G.parts.push({ k:'fb', x, y, life:.38, max:.38, s:r });
  G.parts.push({ k:'ring', x, y: Math.min(y + 4, GROUND), life:.42, max:.42, s:r*1.5 });
  dirt(x, y, 14, sc);
  for (let i=0;i<7;i++) smoke(x + rnd(r*.45,-r*.45), y - rnd(14), sc*rnd(1.3,.7));
  for (let i=0;i<3;i++) G.parts.push({ k:'fire', x:x + rnd(r*.3,-r*.3), y:y - rnd(6), life:rnd(.5,.2), max:.5, s:r*.3 });
  if (y > GROUND - 26){
    G.craters.push({ x, r: Math.min(20, r*.3), a: rnd(1) });
    if (G.craters.length > 70) G.craters.shift();
    G.decals.push({ k:'scorch', x, y: GROUND + 2, r: r*.62, a:.5 });
    if (G.decals.length > 110) G.decals.shift();
    for (let i=0;i<6;i++) dust(x + rnd(r*.7,-r*.7), GROUND, sc*.9);
  }
  const view = G.cam.x + viewW/2;
  const near = clamp(1 - Math.abs(x - view)/(viewW*.8), 0, 1);
  G.shake = Math.min(16, G.shake + near * clamp(r/12, 1, 7));
  for (const u of G.units){
    if (u.dead || u.side === side) continue;
    const uy = unitY(u);
    const d = Math.hypot(u.x - x, uy - y);
    if (d > r) continue;
    const f = Math.pow(1 - d/r, .8);
    applyDamage(u, dmg * f, pen, side, { splash:true, ignoreCover:true });
  }
}

/* ---------------- weapons ---------------- */

const TRACER_COL = ['#ffd98a','#ffb36b'];

function shooterPositions(u){
  const out = [];
  const y = unitY(u);
  if (u.def.veh){ out.push({ x: u.x + u.dir*(u.structure ? 16 : 22), y: y - (u.structure ? 26 : 17), m:null }); return out; }
  for (const m of u.members) if (m.hp > 0) out.push({ x: u.x - u.dir*m.ox, y: y - 9 + m.oy*.2, m });
  return out;
}

function hitChance(u, target, dist){
  const def = u.def;
  let c = (def.acc != null ? def.acc : .7);
  c *= lerp(1, .58, clamp(dist/def.range, 0, 1));
  if (u.supp > .45) c *= .55;
  if (!def.ignoreCover && !target.def.veh && inCover(target.x)) c *= .62;
  if (target.def.veh) c = Math.min(.98, c + .3);
  if (u.side === 1) c *= .72 + G.M.eSkill * .3;
  return clamp(c, .06, .98);
}

function fireWeapon(u, target){
  const def = u.def;
  const ty = unitY(target) - (target.def.veh ? (target.structure ? 22 : 13) : 8);
  const dm = dmgMult(u);
  const shooters = shooterPositions(u);
  if (!shooters.length) return;
  u.flash = .07;
  target.killerRef = u;

  if (def.wep === 'mortar'){
    const s = shooters[0];
    const tx = target.x + target.dir * -1 * (target.moving ? 26 : 0) + rnd(30,-30);
    const T = 1.5;
    G.projs.push({ k:'shell', x:s.x, y:s.y - 4, vx:(tx - s.x)/T, vy:-(900*T)/2, g:900,
      side:u.side, dmg:def.dmg*dm, splash:def.splash, pen:def.pen, trail:[] });
    Audio_.play('cannon', .5);
    for (let i=0;i<4;i++) smoke(s.x, s.y, .5);
    return;
  }
  if (def.wep === 'rocket'){
    const s = shooters[0];
    const ang = Math.atan2(ty - s.y, target.x - s.x);
    G.projs.push({ k:'rocket', x:s.x, y:s.y, vx:Math.cos(ang)*430, vy:Math.sin(ang)*430,
      side:u.side, dmg:def.dmg*dm, splash:def.splash, pen:def.pen, sm:0 });
    Audio_.play('rocket');
    for (let i=0;i<5;i++) smoke(s.x - u.dir*8, s.y, .5);
    return;
  }
  if (def.wep === 'cannon'){
    const s = shooters[0];
    const ang = Math.atan2(ty - s.y, target.x - s.x);
    G.projs.push({ k:'shell2', x:s.x, y:s.y, vx:Math.cos(ang)*900, vy:Math.sin(ang)*900,
      side:u.side, dmg:def.dmg*dm, splash:def.splash, pen:def.pen });
    u.recoil = 1;
    Audio_.play('cannon');
    G.parts.push({ k:'mf', x:s.x + u.dir*6, y:s.y, life:.09, max:.09, s:11 });
    return;
  }

  // hitscan small arms — every man in the squad takes his shot
  const col = def.wep === 'sniper' ? '#fff3c4' : pick(TRACER_COL);
  for (const s of shooters){
    const dist = Math.abs(target.x - s.x);
    if (s.m) s.m.flash = .06;
    const miss = Math.random() > hitChance(u, target, dist);
    const endX = miss ? target.x + rnd(22,-22) : target.x + rnd(7,-7);
    const endY = miss ? ty + rnd(16,-10) : ty + rnd(5,-5);
    tracer(s.x + u.dir*7, s.y, endX, endY, col, def.wep === 'sniper' ? 1.8 : 1);
    if (miss){
      if (Math.random() < .4) dirt(endX, Math.min(GROUND, endY + 8), 1, .4);
      continue;
    }
    applyDamage(target, def.dmg * dm, def.pen, u.side, { ignoreCover: !!def.ignoreCover });
    if (def.supp) target.supp = Math.min(1.4, target.supp + def.supp * (target.def.veh ? .15 : 1));
    Audio_.play('hit', .5);
    spark(endX, endY, target.def.veh ? '#ffd27a' : '#8d2419', 1);
  }
  Audio_.play(def.wep === 'smg' ? 'smg' : def.wep === 'mg' ? 'mg' : def.wep === 'sniper' ? 'sniper' : 'rifle',
    clamp(shooters.length/3, .4, 1));
}

function fireCoax(u, target){
  const s = shooterPositions(u)[0];
  const ty = unitY(target) - 8;
  const dist = Math.abs(target.x - s.x);
  const hit = Math.random() < clamp(.55 * lerp(1,.6,dist/180) * (u.side===1?.8:1), .1, .9);
  tracer(s.x + u.dir*8, s.y + 4, target.x + rnd(9,-9), ty + rnd(6,-6), '#ffd98a', 1);
  if (hit){
    applyDamage(target, 4.2 * dmgMult(u), 0, u.side, {});
    target.supp = Math.min(1.4, target.supp + .03);
    target.killerRef = u;
  }
  Audio_.play('mg', .5);
}

/* ---------------- targeting & movement ---------------- */

function findTarget(u, infantryOnly, maxRange){
  let best = null, bd = 1e9;
  for (const e of G.units){
    if (e.dead || e.side === u.side) continue;
    if (infantryOnly && e.def.veh) continue;
    const d = Math.abs(e.x - u.x);
    if (maxRange && d > maxRange) continue;
    // prefer things in front
    const score = d + ((e.x - u.x) * u.dir < 0 ? 240 : 0);
    if (score < bd){ bd = score; best = e; }
  }
  return best;
}

function blockedAhead(u){
  const gap = u.def.veh ? 46 : 30;
  for (const f of G.units){
    if (f === u || f.dead || f.side !== u.side || f.structure) continue;
    const dx = (f.x - u.x) * u.dir;
    if (dx > 0 && dx < gap && Math.abs(f.lane - u.lane) < 2) return true;
  }
  return false;
}

function updateUnit(u, dt){
  const def = u.def;
  if (u.dead){ u.deadT += dt; return; }
  u.supp = Math.max(0, u.supp - dt * .34);
  u.recoil = Math.max(0, u.recoil - dt * 4);
  u.flash = Math.max(0, u.flash - dt);
  if (u.members) for (const m of u.members) m.flash = Math.max(0, m.flash - dt);

  if (!u.structure){
    const t = findTarget(u, false, null);
    u.target = t;
    const d = t ? Math.abs(t.x - u.x) : 1e9;
    const canShoot = t && d <= def.range && d >= (def.min || 0);
    const wantsBack = t && def.min && d < def.min;   // mortars shuffle back
    const held = u.side === 0 && G.rally != null && (u.x >= G.rally - 3);
    u.moving = !canShoot && !held;
    if (u.moving && !blockedAhead(u)){
      const spd = def.spd * (u.supp > .45 ? .28 : 1) * (wantsBack ? -.6 : 1);
      u.x += u.dir * spd * dt;
      u.walk += dt * spd * .16;
      if (u.members) for (const m of u.members) m.walk += dt * spd * .16;
      if (def.veh){
        u.trk = (u.trk || 0) + dt * spd;
        if (u.trk > 9){
          u.trk = 0;
          G.decals.push({ k:'track', x:u.x - u.dir*14, y: unitY(u) + 1, a:.5 });
          if (G.decals.length > 110) G.decals.shift();
        }
      }
    }
    u.x = clamp(u.x, 40, WORLD_LEN - 40);
    u.cd -= dt;
    if (canShoot && u.cd <= 0){
      u.cd = def.rof * rnd(1.15,.88) * (u.supp > .45 ? 1.6 : 1);
      fireWeapon(u, t);
    }
  } else {
    const t = findTarget(u, false, def.range);
    u.target = t;
    u.cd -= dt;
    if (t && u.cd <= 0){ u.cd = def.rof * rnd(1.2,.9); fireWeapon(u, t); }
  }

  if (def.coax){
    u.cd2 -= dt;
    const it = findTarget(u, true, 180);
    if (it && u.cd2 <= 0){ u.cd2 = .13 * rnd(1.4,.8); fireCoax(u, it); }
  }
}

/* ---------------- projectiles ---------------- */

function updateProjs(dt){
  for (let i = G.projs.length - 1; i >= 0; i--){
    const p = G.projs[i];
    p.age = (p.age || 0) + dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.g) p.vy += p.g * dt;
    if (p.k === 'shell'){
      p.trail.push(p.x, p.y);
      if (p.trail.length > 26) p.trail.splice(0,2);
    }
    if (p.k === 'rocket'){
      p.sm -= dt;
      if (p.sm <= 0){ p.sm = .02; smoke(p.x, p.y, .28); }
    }
    let hit = false;
    if (p.y >= GROUND - 2) hit = true;
    if (!hit && p.k !== 'shell'){
      for (const u of G.units){
        if (u.dead || u.side === p.side) continue;
        const uy = unitY(u), h = u.def.veh ? (u.structure ? 46 : 26) : 20;
        const w = u.def.veh ? (u.structure ? 44 : 34) : 30;
        if (Math.abs(u.x - p.x) < w/2 && p.y > uy - h && p.y < uy + 4){ hit = true; break; }
      }
    }
    if (p.x < 10 || p.x > WORLD_LEN - 10) hit = true;
    if (p.k !== 'shell' && p.age > 1.3) hit = true;
    if (hit){
      boom(p.x, Math.min(p.y, GROUND), p.splash || 20, p.dmg, p.side, p.pen);
      G.projs.splice(i,1);
    }
  }
}

function updateParts(dt){
  if (G.parts.length > 340) G.parts.splice(0, G.parts.length - 340);
  for (let i = G.parts.length - 1; i >= 0; i--){
    const p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0){ G.parts.splice(i,1); continue; }
    if (p.k === 'dt' || p.k === 'sp'){ p.vy += 620*dt; p.x += p.vx*dt; p.y += p.vy*dt; if (p.vr) p.rot += p.vr*dt; if (p.y > GROUND){ p.y = GROUND; p.vy *= -.28; p.vx *= .5; if (p.vr) p.vr *= .4; } }
    else if (p.k === 'sm'){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy *= .985; p.s += dt*9; }
    else if (p.k === 'tx'){ p.y += p.vy*dt; p.vy *= .96; }
  }
}

/* ---------------- abilities ---------------- */

function abCd(base){ return hasPerk('radio') ? base * .7 : base; }

function useAbility(id, x){
  const ab = ABILITIES.find(a => a.id === id);
  if (!ab) return;
  if (G.cash < ab.cost || (G.abCool[id] || 0) > 0){ Audio_.play('deny'); return; }
  G.cash -= ab.cost; G.stats.spent += ab.cost;
  G.abCool[id] = abCd(ab.cool);
  if (id === 'arty'){
    banner('Fire mission — shot, over.');
    for (let i=0;i<6;i++){
      G.timers.push({ t: i*.32 + rnd(.12), fn: (() => { const tx = x + rnd(78,-78); return () => {
        G.projs.push({ k:'shell', x:tx + rnd(60,-60), y:-40, vx:rnd(40,-40), vy:300, g:900,
          side:0, dmg:86, splash:74, pen:1, trail:[] });
      };})() });
    }
  } else if (id === 'air'){
    banner('Air support inbound.');
    Audio_.play('plane');
    G.planes.push({ x: x - 900, y: 96 + rnd(30), tx: x, dropped:0, t:0 });
  } else if (id === 'sup'){
    banner('Resupply on the line.');
    G.covers.push({ x, w:120, fresh:1 });
    for (const u of G.units){
      if (u.dead || u.side !== 0) continue;
      if (Math.abs(u.x - x) > 190) continue;
      u.supp = 0;
      if (u.def.veh){ u.hp = Math.min(u.maxHp, u.hp + u.maxHp*.3); }
      else {
        for (const m of u.members) if (m.hp > 0) m.hp = Math.min(m.max, m.hp + m.max*.45);
        // one man back on his feet
        const down = u.members.find(m => m.hp <= 0);
        if (down) down.hp = down.max * .5;
        u.hp = u.members.reduce((s,m) => s + Math.max(0,m.hp), 0);
        if (u.hp > 0) u.dead = false;
      }
      floatText(u.x, unitY(u) - 30, 'RESUPPLIED', '#79ac5f');
    }
  }
}

function updatePlanes(dt){
  for (let i = G.planes.length - 1; i >= 0; i--){
    const p = G.planes[i];
    p.t += dt;
    p.x += 620 * dt;
    if (p.dropped < 4 && p.x > p.tx - 150 + p.dropped*70){
      p.dropped++;
      G.projs.push({ k:'shell', x:p.x, y:p.y + 6, vx:300, vy:70, g:700, side:0, dmg:110, splash:80, pen:1, trail:[] });
    }
    if (p.x > p.tx - 260 && p.x < p.tx + 180 && Math.random() < 18*dt){
      const tx = p.x + 180;
      tracer(p.x, p.y + 4, tx, GROUND - rnd(16), '#ffd98a', 1.4);
      for (const u of G.units){
        if (u.dead || u.side === 0) continue;
        if (Math.abs(u.x - tx) < 34) applyDamage(u, 15, 1, 0, { ignoreCover:true });
      }
      Audio_.play('mg', .8);
    }
    if (p.x > WORLD_LEN + 300) G.planes.splice(i,1);
  }
}

/* ---------------- enemy AI ---------------- */

function popOf(side){
  let p = 0;
  for (const u of G.units) if (!u.dead && u.side === side && !u.structure) p += u.def.pop || 0;
  return p;
}

function aiUpdate(dt){
  const M = G.M, ai = G.ai;
  let rate = M.eIncome;
  if (M.endless){ ai.wave = Math.floor(G.t / 90); rate = M.eIncome * (1 + ai.wave * .34); }
  ai.cash += rate * dt;
  ai.next -= dt;
  ai.artCd -= dt;

  if (G.mIndex >= 3 && ai.artCd <= 0 && ai.cash > 320){
    // shell the thickest part of the player's line
    let bx = null, bestN = 0;
    for (const u of G.units){
      if (u.dead || u.side !== 0 || u.structure) continue;
      let n = 0;
      for (const o of G.units) if (!o.dead && o.side === 0 && Math.abs(o.x - u.x) < 90) n++;
      if (n > bestN){ bestN = n; bx = u.x; }
    }
    if (bx != null && bestN >= 3){
      ai.cash -= 300; ai.artCd = 46 - G.mIndex*3;
      banner('Incoming — take cover!');
      for (let i=0;i<5;i++){
        const tx = bx + rnd(80,-80);
        G.timers.push({ t:i*.34 + 1.1, fn: () => {
          G.projs.push({ k:'shell', x:tx, y:-40, vx:rnd(30,-30), vy:300, g:900, side:1, dmg:72, splash:70, pen:1, trail:[] });
        }});
      }
    }
  }

  if (ai.next > 0) return;

  const cap = POP_BASE - 2 + G.mIndex * 2 + (M.endless ? ai.wave*2 : 0);
  const usedPop = popOf(1);
  let pArmor = 0, pInf = 0, eArmor = 0, eAt = 0;
  for (const u of G.units){
    if (u.dead || u.structure) continue;
    if (u.side === 0){ if (u.def.veh) pArmor += 1; else pInf += 1; }
    else { if (u.def.veh) eArmor += 1; if (u.def.pen === 2) eAt += 1; }
  }

  const options = [];
  for (const id of M.ePool){
    const def = U[id];
    if (def.cost > ai.cash) continue;
    if (usedPop + def.pop > cap) continue;
    let w = 1;
    if (id === 'rifle') w = 2.4;
    if (id === 'assault') w = 1.5 + (pInf > 4 ? .8 : 0);
    if (id === 'mg') w = 1.1 + (pInf > 3 ? 1.4 : 0);
    if (id === 'sniper') w = .7 + (pInf > 4 ? .6 : 0);
    if (id === 'mortar') w = .9 + (pInf > 5 ? .9 : 0);
    if (id === 'at') w = .35 + pArmor * 2.2 - eAt * .5;
    if (id === 'light') w = .9 + (pArmor > 0 ? .4 : 0);
    if (id === 'heavy') w = .8 - eArmor * .25;
    options.push({ def, w: Math.max(.05, w) });
  }
  if (!options.length){ ai.next = .7; return; }

  let total = 0; for (const o of options) total += o.w;
  let r = Math.random() * total, chosen = options[0];
  for (const o of options){ r -= o.w; if (r <= 0){ chosen = o; break; } }

  // hold back for a heavy punch when it is close to affording one
  const dear = M.ePool.map(id => U[id]).filter(d => d.cost <= ai.cash * 1.5 && d.cost > chosen.def.cost * 1.7);
  if (dear.length && Math.random() < .3 * G.M.eSkill){ ai.next = 1.4; return; }

  ai.cash -= chosen.def.cost;
  spawn(chosen.def, 1);
  ai.next = lerp(2.6, 1.0, G.M.eSkill) * rnd(1.25,.75);
}

/* ---------------- spawning ---------------- */

function spawn(def, side){
  const x = side === 0 ? G.hqP.x + 46 : G.hqE.x - 46;
  const u = makeUnit(def, side, x);
  G.units.push(u);
  return u;
}

function unitCool(def){ return def.cool * (hasPerk('rapid') ? .75 : 1); }

function deploy(id){
  const def = U[id];
  if (!def || !G.live || G.paused) return;
  if (G.M.roster.indexOf(id) < 0) return;
  if ((G.cool[id] || 0) > 0){ Audio_.play('deny'); toast(def.name + ' is still forming up'); return; }
  if (G.cash < def.cost){ Audio_.play('deny'); toast('Not enough requisition'); return; }
  if (popOf(0) + def.pop > G.popCap){ Audio_.play('deny'); toast('Manpower cap reached'); return; }
  G.cash -= def.cost; G.stats.spent += def.cost;
  G.cool[id] = unitCool(def);
  spawn(def, 0);
  Audio_.play('ui');
}

/* ============================================================
   RENDER
   ============================================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');
let DPR = 1, cw = 800, ch = 500, S = 1, viewW = 800, shakeX = 0, shakeY = 0;
let QUAL = true, bgSeed = 1;

/* glow buffer for bloom */
let glowCv = null, gctx = null, GS = .3;
function ensureGlow(){
  if (!QUAL){ glowCv = null; gctx = null; return; }
  if (!glowCv){ glowCv = document.createElement('canvas'); gctx = glowCv.getContext('2d'); }
  glowCv.width = Math.max(1, Math.round(cw*GS));
  glowCv.height = Math.max(1, Math.round(ch*GS));
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = stage.getBoundingClientRect();
  cw = Math.max(200, r.width); ch = Math.max(180, r.height);
  cv.width = Math.round(cw*DPR); cv.height = Math.round(ch*DPR);
  S = ch / VH;
  viewW = cw / S;
  const mr = mini.getBoundingClientRect();
  mini.width = Math.round(mr.width*DPR); mini.height = Math.round(mr.height*DPR);
  ensureGlow();
  buildVignette();
  if (G.M) buildLayers();
}
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(resize, 90); });

function setCam(f){
  const k = S*DPR;
  ctx.setTransform(k, 0, 0, k, (-G.cam.x*f*S + shakeX)*DPR, shakeY*DPR);
}
function screenSpace(){ ctx.setTransform(DPR,0,0,DPR,0,0); }
function setGlowCam(){
  if (!gctx) return;
  const k = S*GS;
  gctx.setTransform(k, 0, 0, k, (-G.cam.x*S + shakeX)*GS, shakeY*GS);
}
/* draw a bright element into both the frame and the bloom buffer */
function bright(fn){ fn(ctx); if (gctx) fn(gctx); }

/* ---------------- palettes ---------------- */

const SKIES = {
  dawn:{ band:[[0,'#0b1124'],[.42,'#1d2946'],[.70,'#413f5e'],[.88,'#8a5a57'],[1,'#d2925c']],
         sun:'#ffd9a0', sunY:.88, haze:'#a5765f', hill:'#1d2740', cloud:'#57485f', cloudLit:'#c98c62' },
  day: { band:[[0,'#2c5e9b'],[.45,'#5789bb'],[.72,'#8fb3d2'],[.90,'#bcd2df'],[1,'#dde5e8']],
         sun:'#fffbe8', sunY:.18, haze:'#b7c8d6', hill:'#5d7590', cloud:'#ffffff', cloudLit:'#ffffff' },
  dusk:{ band:[[0,'#120f26'],[.40,'#2a1c3d'],[.68,'#5c2a46'],[.87,'#a44a3c'],[1,'#dd8447']],
         sun:'#ffc07a', sunY:.9,  haze:'#96543e', hill:'#221a33', cloud:'#33253f', cloudLit:'#c4703f' },
  rain:{ band:[[0,'#1a2028'],[.45,'#28313a'],[.72,'#3a444e'],[.90,'#4e5963'],[1,'#69747e']],
         sun:'#9aa6b0', sunY:.34, haze:'#68737d', hill:'#2c353e', cloud:'#333c45', cloudLit:'#5d666f' },
  snow:{ band:[[0,'#2f3b52'],[.45,'#4a5870'],[.72,'#6f7d90'],[.90,'#95a2b1'],[1,'#c0c9d4']],
         sun:'#f2f7ff', sunY:.3,  haze:'#a9b6c3', hill:'#4c5a6e', cloud:'#7a8898', cloudLit:'#c6d2de' }
};
const GROUNDS = {
  bocage:['#525a3b','#3e4429','#292d1e','#6a7342'],
  town:  ['#78705f','#575043','#3b352c','#8f8874'],
  forest:['#434b32','#313826','#212619','#58613d'],
  snow:  ['#d3dbe3','#b0bbc7','#7f8b98','#eef3f8'],
  ruins: ['#6c6456','#4e483d','#332e27','#847b6b']
};
const GRADE = {
  dawn:{ mode:'soft-light', col:'#ff9a52', a:.15 },
  day: { mode:'soft-light', col:'#a9cbec', a:.10 },
  dusk:{ mode:'soft-light', col:'#ff6f33', a:.17 },
  rain:{ mode:'multiply',   col:'#9dadbb', a:.14 },
  snow:{ mode:'soft-light', col:'#cde3fa', a:.13 }
};
const sky = () => SKIES[(G.M && G.M.sky) || 'dusk'];
const terr = () => (G.M && G.M.terrain) || 'ruins';
const gpal = () => GROUNDS[terr()];
/* sun sits right of centre, so everything is rim-lit from the right */
const LIT = 1;

function mix(a, b, t){
  const pa = hexrgb(a), pb = hexrgb(b);
  return 'rgb(' + Math.round(lerp(pa[0],pb[0],t)) + ',' + Math.round(lerp(pa[1],pb[1],t)) + ',' + Math.round(lerp(pa[2],pb[2],t)) + ')';
}
function hexrgb(h){
  if (h[0] !== '#') { const m = h.match(/[\d.]+/g); return [ +m[0], +m[1], +m[2] ]; }
  if (h.length === 4) h = '#' + h[1]+h[1] + h[2]+h[2] + h[3]+h[3];
  return [ parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16) ];
}
function rgba(h, a){ const p = hexrgb(h); return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + a + ')'; }

/* ---------------- cached sprites ---------------- */

const SPRC = {};
function radialSprite(key, stops, size){
  if (SPRC[key]) return SPRC[key];
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  stops.forEach(st => g.addColorStop(st[0], st[1]));
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  SPRC[key] = c; return c;
}
const puffSprite = col => radialSprite('p' + col,
  [[0, rgba(col,.9)], [.5, rgba(col,.44)], [1, rgba(col,0)]], 64);
const fballSprite = () => radialSprite('fb',
  [[0,'rgba(255,252,228,1)'], [.22,'rgba(255,206,104,.95)'], [.55,'rgba(226,110,32,.68)'], [1,'rgba(90,36,10,0)']], 96);
const fireSprite = () => radialSprite('fi',
  [[0,'rgba(255,238,170,.92)'], [.5,'rgba(255,146,40,.58)'], [1,'rgba(160,50,10,0)']], 64);

let vigCv = null;
function buildVignette(){
  vigCv = document.createElement('canvas');
  vigCv.width = Math.max(2, Math.round(cw)); vigCv.height = Math.max(2, Math.round(ch));
  const x = vigCv.getContext('2d');
  const vg = x.createRadialGradient(cw/2, ch*.46, Math.min(cw,ch)*.3, cw/2, ch*.5, Math.max(cw,ch)*.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(.62, 'rgba(0,0,0,.12)');
  vg.addColorStop(1, 'rgba(0,0,0,.42)');
  x.fillStyle = vg; x.fillRect(0, 0, cw, ch);
}

/* ---------------- cached parallax layers ---------------- */

const LAY = {};
function makeLayer(f, h, y0){
  const w = Math.ceil(Math.max(0, WORLD_LEN - viewW)*f + viewW) + 8;
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.min(8192, Math.ceil(w)));
  c.height = Math.max(2, Math.ceil(h));
  return { cv:c, c:c.getContext('2d'), f, y0: y0 || 0, w:c.width, h:c.height };
}
function blit(L){
  if (!L) return;
  const sx = clamp(G.cam.x * L.f, 0, Math.max(0, L.w - 2));
  const sw = Math.min(L.w - sx, viewW + 4);
  if (sw <= 0) return;
  ctx.drawImage(L.cv, sx, 0, sw, L.h, G.cam.x, L.y0, sw, L.h);
}

function buildLayers(){
  const sk = sky(), g = gpal(), t = terr();
  LAY.sky  = makeLayer(.05, GROUND + 4, 0);      paintSky(LAY.sky, sk);
  LAY.far  = makeLayer(.15, GROUND + 4, 0);      paintFar(LAY.far, sk, g, bgSeed);
  LAY.mid  = makeLayer(.32, GROUND + 6, 0);      paintMid(LAY.mid, sk, g, t, bgSeed + 17);
  LAY.near = makeLayer(.60, GROUND + 10, 0);     paintNear(LAY.near, sk, g, t, bgSeed + 41);
  LAY.grd  = makeLayer(1,   VH - GROUND + 24, GROUND - 24); paintGround(LAY.grd, g, t, bgSeed + 61);
  LAY.fore = makeLayer(1.3, VH - GROUND + 10, GROUND - 6);  paintFore(LAY.fore, g, t, bgSeed + 91);
}

function paintSky(L, sk){
  const c = L.c, w = L.w, h = L.h;
  const grd = c.createLinearGradient(0, 0, 0, h);
  sk.band.forEach(st => grd.addColorStop(st[0], st[1]));
  c.fillStyle = grd; c.fillRect(0, 0, w, h);

  // sun / moon with a wide atmospheric bloom
  const sx = w*.66, sy = h*sk.sunY, rad = G.M && G.M.sky === 'day' ? 9 : 15;
  const gg = c.createRadialGradient(sx, sy, 0, sx, sy, rad*9);
  gg.addColorStop(0, rgba(sk.sun, .85));
  gg.addColorStop(.18, rgba(sk.sun, .34));
  gg.addColorStop(1, rgba(sk.sun, 0));
  c.fillStyle = gg; c.beginPath(); c.arc(sx, sy, rad*9, 0, 7); c.fill();
  if (G.M && G.M.sky !== 'rain'){
    c.fillStyle = sk.sun; c.beginPath(); c.arc(sx, sy, rad, 0, 7); c.fill();
  }

  // cloud bank — stacked soft lobes, lit from the sun side
  const rr = mulberry(bgSeed + 3);
  for (let n = 0; n < Math.round(w/70); n++){
    const cx = rr()*w, cy = h*(.08 + rr()*.52), sc = .6 + rr()*1.5;
    const lit = cx > sx - 260 && cx < sx + 460;
    for (let k = 0; k < 6; k++){
      const ox = (rr()-.5)*46*sc, oy = (rr()-.5)*9*sc, r = (7 + rr()*13)*sc;
      const cg = c.createRadialGradient(cx+ox, cy+oy-r*.3, 0, cx+ox, cy+oy, r);
      cg.addColorStop(0, rgba(lit ? sk.cloudLit : sk.cloud, .3));
      cg.addColorStop(1, rgba(sk.cloud, 0));
      c.fillStyle = cg; c.beginPath(); c.arc(cx+ox, cy+oy, r, 0, 7); c.fill();
    }
  }
  // horizon haze
  const hz = c.createLinearGradient(0, h - 34, 0, h);
  hz.addColorStop(0, rgba(sk.haze, 0));
  hz.addColorStop(1, rgba(sk.haze, .26));
  c.fillStyle = hz; c.fillRect(0, h - 34, w, 34);
}

function ridge(c, w, yBase, amp, step, rr, fill){
  c.beginPath(); c.moveTo(0, c.canvas.height);
  let y = yBase;
  for (let x = 0; x <= w; x += step){
    y += (rr()-.5)*amp;
    y = clamp(y, yBase - amp*2.4, yBase + amp*1.5);
    c.lineTo(x, y);
  }
  c.lineTo(w, c.canvas.height); c.closePath();
  c.fillStyle = fill; c.fill();
}

function paintFar(L, sk, g, seed){
  const c = L.c, w = L.w, rr = mulberry(seed);
  const col = mix(sk.hill, sk.haze, .3);
  ridge(c, w, GROUND - 74, 11, 64, rr, col);
  const rr2 = mulberry(seed + 5);
  ridge(c, w, GROUND - 50, 8, 48, rr2, mix(sk.hill, g[2], .4));
  // haze wash so distance reads as distance
  const hz = c.createLinearGradient(0, GROUND - 78, 0, GROUND);
  hz.addColorStop(0, rgba(sk.haze, .2));
  hz.addColorStop(1, rgba(sk.haze, .04));
  c.fillStyle = hz; c.fillRect(0, GROUND - 78, w, 78);
}

function paintMid(L, sk, g, t, seed){
  const c = L.c, w = L.w, rr = mulberry(seed);
  const base = mix(g[1], sk.hill, .34);
  ridge(c, w, GROUND - 32, 7, 40, rr, base);

  // field strips / hedgerow grid on the slope
  c.save();
  c.beginPath(); c.rect(0, GROUND - 40, w, 40); c.clip();
  for (let x = 0; x < w; x += 22 + rr()*30){
    const y = GROUND - 14 - rr()*18, ww = 14 + rr()*26;
    c.globalAlpha = .13 + rr()*.14;
    c.fillStyle = rr() > .5 ? g[1] : g[2];
    c.beginPath(); c.ellipse(x, y, ww, 2.6 + rr()*2, -.06, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  c.restore();

  // a landmark on the horizon — church spire, water tower or shattered stack
  const lx = w*.42, ly = GROUND - 30;
  c.fillStyle = mix(base, '#0b0e14', .3);
  if (t === 'forest' || t === 'bocage'){
    c.fillRect(lx, ly - 22, 7, 24);
    c.beginPath(); c.moveTo(lx - 2.5, ly - 22); c.lineTo(lx + 3.5, ly - 40); c.lineTo(lx + 9.5, ly - 22); c.closePath(); c.fill();
  } else if (t === 'snow'){
    c.fillRect(lx, ly - 16, 5, 18);
    c.beginPath(); c.moveTo(lx - 4, ly - 16); c.lineTo(lx + 2.5, ly - 30); c.lineTo(lx + 9, ly - 16); c.closePath(); c.fill();
  } else {
    c.fillRect(lx, ly - 34, 6, 36);
    c.fillRect(lx - 1.5, ly - 36, 9, 3);
    c.fillStyle = mix(base, '#0b0e14', .45);
    c.fillRect(lx + 1, ly - 30, 4, 4);
  }
  // distant smoke columns — the war is wider than this sector
  const sm = mulberry(seed + 9);
  for (let n = 0; n < 3; n++){
    const x = sm()*w, top = GROUND - 56 - sm()*58;
    for (let k = 0; k < 10; k++){
      const p = k/9, y = lerp(GROUND - 28, top, p);
      c.globalAlpha = .1*(1 - p*.7);
      c.fillStyle = mix(sk.cloud, '#2a2a2a', .4);
      c.beginPath(); c.arc(x + Math.sin(p*4 + n)*6*p, y, 1.6 + p*5, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
  }
}

/* --- procedural props for the near layer --- */

function coneTree(c, x, y, h, w, col, snowCap){
  c.fillStyle = mix(col, '#0a0d12', .1);
  c.fillRect(x - w*.11, y - h*.28, w*.22, h*.3);
  c.fillStyle = col;
  for (let i = 0; i < 3; i++){
    const p = i/2, yy = y - h*.24 - h*.24*i, ww = w*(1 - p*.42), hh = h*.34;
    c.beginPath(); c.moveTo(x - ww, yy); c.lineTo(x, yy - hh); c.lineTo(x + ww, yy); c.closePath(); c.fill();
  }
  if (snowCap){
    c.fillStyle = 'rgba(226,236,246,.62)';
    for (let i = 0; i < 3; i++){
      const yy = y - h*.24 - h*.24*i, ww = w*(1 - (i/2)*.42)*.72, hh = h*.3;
      c.beginPath(); c.moveTo(x - ww, yy - hh*.12); c.lineTo(x, yy - hh); c.lineTo(x + ww, yy - hh*.12); c.closePath(); c.fill();
    }
  }
  // sun-side edge
  c.fillStyle = 'rgba(255,214,160,.13)';
  c.beginPath(); c.moveTo(x + w*.2, y - h*.24); c.lineTo(x + w*.02, y - h*.9); c.lineTo(x + w*.42, y - h*.3); c.closePath(); c.fill();
}
function roundTree(c, x, y, h, w, col, rr){
  c.fillStyle = mix(col, '#0a0d12', .22);
  c.fillRect(x - w*.09, y - h*.46, w*.18, h*.48);
  c.strokeStyle = mix(col, '#0a0d12', .22); c.lineWidth = w*.09;
  c.beginPath(); c.moveTo(x, y - h*.5); c.lineTo(x - w*.3, y - h*.72);
  c.moveTo(x, y - h*.5); c.lineTo(x + w*.32, y - h*.7); c.stroke();
  c.fillStyle = col;
  for (let k = 0; k < 4; k++){
    const ox = (rr()-.5)*w*.9, oy = -h*.62 - rr()*h*.22, r = w*(.42 + rr()*.28);
    c.beginPath(); c.arc(x + ox, y + oy, r, 0, 7); c.fill();
  }
  c.fillStyle = 'rgba(255,216,160,.16)';
  c.beginPath(); c.arc(x + w*.34, y - h*.78, w*.3, 0, 7); c.fill();
}
function hedgeBank(c, x, y, len, h, col, rr){
  c.fillStyle = mix(col, '#0a0d12', .3);
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y - h*.55, len, h*.6, 3); else c.rect(x, y - h*.55, len, h*.6);
  c.fill();
  c.fillStyle = col;
  for (let k = 0; k < len/5; k++){
    const px = x + k*5 + rr()*3, r = h*(.26 + rr()*.26);
    c.beginPath(); c.arc(px, y - h*.5 - rr()*h*.2, r, 0, 7); c.fill();
  }
  c.fillStyle = 'rgba(255,214,160,.12)';
  for (let k = 0; k < len/9; k++){
    c.beginPath(); c.arc(x + k*9 + 4, y - h*.72, h*.16, 0, 7); c.fill();
  }
}
function building(c, x, y, w, h, col, rr, ruined){
  const wall = mix(col, '#0a0d12', .18);
  c.fillStyle = wall;
  if (ruined){
    c.beginPath();
    c.moveTo(x, y); c.lineTo(x, y - h);
    c.lineTo(x + w*.34, y - h*.86); c.lineTo(x + w*.52, y - h*1.02);
    c.lineTo(x + w*.7, y - h*.62); c.lineTo(x + w, y - h*.78);
    c.lineTo(x + w, y); c.closePath(); c.fill();
  } else {
    c.fillRect(x, y - h, w, h);
    c.fillStyle = mix(col, '#0a0d12', .34);
    c.beginPath(); c.moveTo(x - 2, y - h); c.lineTo(x + w*.5, y - h - w*.26); c.lineTo(x + w + 2, y - h); c.closePath(); c.fill();
  }
  // windows
  const cols = Math.max(1, Math.round(w/9)), rows = Math.max(1, Math.round(h/12));
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
    if (rr() < .22) continue;
    const wx = x + 3 + i*(w - 6)/cols, wy = y - h + 6 + j*(h - 10)/rows;
    if (ruined && wy < y - h*.72 && rr() < .5) continue;
    c.fillStyle = rr() < .12 ? 'rgba(255,196,110,.5)' : 'rgba(12,14,19,.72)';
    c.fillRect(wx, wy, 3.4, 4.4);
  }
  // sun-lit face
  c.fillStyle = 'rgba(255,208,150,.1)';
  c.fillRect(x + w - 3.5, y - h, 3.5, h);
  if (ruined){
    c.strokeStyle = 'rgba(20,20,24,.55)'; c.lineWidth = .7;
    for (let k = 0; k < 4; k++){
      const bx = x + w*.4 + rr()*w*.4;
      c.beginPath(); c.moveTo(bx, y - h*.8); c.lineTo(bx + (rr()-.5)*4, y - h*.95); c.stroke();
    }
  }
}
function pole(c, x, y, h, col){
  c.fillStyle = mix(col, '#0a0d12', .45);
  c.fillRect(x, y - h, 1.8, h);
  c.fillRect(x - 4, y - h + 3, 10, 1.4);
  c.fillRect(x - 3, y - h + 8, 8, 1.2);
}
function rubble(c, x, y, w, col, rr){
  c.fillStyle = mix(col, '#0a0d12', .28);
  c.beginPath(); c.moveTo(x - w, y);
  for (let k = 0; k <= 7; k++){
    c.lineTo(x - w + (2*w)*(k/7), y - (Math.sin(k/7*Math.PI))*w*(.4 + rr()*.3));
  }
  c.closePath(); c.fill();
  for (let k = 0; k < w/2; k++){
    c.fillStyle = rr() > .5 ? mix(col,'#0a0d12',.14) : mix(col,'#0a0d12',.4);
    c.fillRect(x - w + rr()*w*2, y - rr()*w*.5, 1.6 + rr()*2.4, 1.2 + rr()*1.6);
  }
}

function paintNear(L, sk, g, t, seed){
  const c = L.c, w = L.w, rr = mulberry(seed);
  const y = GROUND - 2;
  const treeCol = mix(g[1], '#0a0d12', .46);
  let x = 0;
  while (x < w){
    x += 14 + rr()*30;
    if (t === 'town' || t === 'ruins'){
      const r = rr();
      if (r < .62) building(c, x, y, 22 + rr()*28, 34 + rr()*46, g[1], rr, t === 'ruins' && rr() > .35);
      else if (r < .78) rubble(c, x, y, 7 + rr()*9, g[2], rr);
      else if (r < .88) pole(c, x, y, 26 + rr()*14, g[2]);
      else roundTree(c, x, y, 30 + rr()*18, 9 + rr()*5, treeCol, rr);
      x += 16 + rr()*22;
    } else if (t === 'forest'){
      coneTree(c, x, y, 34 + rr()*30, 7 + rr()*5, treeCol, false);
      if (rr() > .82) coneTree(c, x + 6, y + 2, 16 + rr()*10, 4 + rr()*2, mix(treeCol,'#000',.15), false);
    } else if (t === 'snow'){
      if (rr() > .2) coneTree(c, x, y, 30 + rr()*28, 7 + rr()*5, mix(treeCol, '#2a3340', .38), true);
      else pole(c, x, y, 20 + rr()*10, '#4d5560');
    } else { // bocage
      const r = rr();
      if (r < .5) hedgeBank(c, x, y, 30 + rr()*44, 26 + rr()*12, treeCol, rr), x += 26;
      else if (r < .86) roundTree(c, x, y, 34 + rr()*22, 10 + rr()*6, treeCol, rr);
      else pole(c, x, y, 24 + rr()*10, g[2]);
    }
  }
  // ground shadow the props cast toward the camera
  const sh = c.createLinearGradient(0, GROUND - 16, 0, GROUND + 8);
  sh.addColorStop(0, 'rgba(0,0,0,0)');
  sh.addColorStop(1, 'rgba(0,0,0,.3)');
  c.fillStyle = sh; c.fillRect(0, GROUND - 16, w, 24);
}

function paintGround(L, g, t, seed){
  const c = L.c, w = L.w, h = L.h, top = 24;   // layer y0 is GROUND-24
  const grd = c.createLinearGradient(0, top - 6, 0, h);
  grd.addColorStop(0, mix(g[0], '#0a0d12', .18));
  grd.addColorStop(.28, g[0]);
  grd.addColorStop(.72, g[1]);
  grd.addColorStop(1, g[2]);
  c.fillStyle = grd; c.fillRect(0, top - 2, w, h - top + 2);

  const rr = mulberry(seed);
  // broad mud / snow patches
  for (let n = 0; n < w/26; n++){
    const x = rr()*w, yy = top + rr()*(h - top), rw = 10 + rr()*36;
    c.globalAlpha = .12 + rr()*.16;
    c.fillStyle = rr() > .5 ? g[3] : g[2];
    c.beginPath(); c.ellipse(x, yy, rw, rw*.2, 0, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  // grass tufts / stones, denser and darker toward the camera
  for (let n = 0; n < w*2.2; n++){
    const x = rr()*w, p = rr(), yy = top + p*(h - top);
    const sc = .7 + p*1.9;
    c.globalAlpha = t === 'snow' ? .1 + p*.16 : .34 + p*.46;
    if (t === 'snow'){
      if (rr() > .55) continue;
      c.fillStyle = rr() > .35 ? '#f4f8fc' : mix(g[2], '#5a6675', .5);
      c.beginPath(); c.ellipse(x, yy, (2 + rr()*9)*sc, (.6 + rr()*1.4)*sc, 0, 0, 7); c.fill();
    } else if (rr() > .55){
      c.strokeStyle = mix(g[3], '#0a0d12', .04 + p*.42);
      c.lineWidth = .62*sc;
      c.beginPath();
      for (let k = 0; k < 3; k++){
        c.moveTo(x + k*.9*sc, yy);
        c.lineTo(x + k*.9*sc + (rr()-.5)*2.4*sc, yy - (2.2 + rr()*3.4)*sc);
      }
      c.stroke();
    } else {
      c.fillStyle = mix(g[2], '#0a0d12', .1 + p*.3);
      c.fillRect(x, yy, (1 + rr()*4)*sc, (.6 + rr()*1.2)*sc);
    }
  }
  c.globalAlpha = 1;
  // cart ruts running the length of the field
  c.globalAlpha = .2;
  c.strokeStyle = mix(g[2], '#0a0d12', .45);
  for (let k = 0; k < 3; k++){
    const yy = top + 10 + k*16 + rr()*6;
    c.lineWidth = 1.2 + rr();
    c.beginPath();
    for (let x = 0; x <= w; x += 30) c.lineTo(x, yy + Math.sin(x*.01 + k)*2.2);
    c.stroke();
  }
  c.globalAlpha = 1;
}

function paintFore(L, g, t, seed){
  const c = L.c, w = L.w, h = L.h, rr = mulberry(seed);
  const col = mix(g[2], '#070a0e', .55);
  // out-of-focus foreground fringe along the very bottom
  for (let n = 0; n < w/7; n++){
    const x = rr()*w, base = h - rr()*10;
    c.fillStyle = col;
    c.globalAlpha = .5 + rr()*.4;
    if (t === 'snow'){
      c.beginPath(); c.ellipse(x, base, 6 + rr()*16, 2 + rr()*3, 0, 0, 7); c.fill();
    } else if (rr() > .45){
      c.strokeStyle = col; c.lineWidth = .9 + rr()*1.1;
      c.beginPath();
      for (let k = 0; k < 4; k++){
        c.moveTo(x + k*1.4, base);
        c.lineTo(x + k*1.4 + (rr()-.5)*6, base - 4 - rr()*11);
      }
      c.stroke();
    } else {
      c.beginPath(); c.ellipse(x, base, 3 + rr()*9, 1.6 + rr()*3, 0, 0, 7); c.fill();
    }
  }
  c.globalAlpha = 1;
}

/* ---------------- troop rendering ---------------- */

const COL = {
  0:{ uni:'#77824f', uniD:'#525a35', uniL:'#96a066', helm:'#5b6338', helmD:'#3f4526',
      skin:'#c8a077', skinD:'#9b7854', kit:'#8a7c56', hull:'#5f6d43', hullD:'#3d4629',
      hullL:'#7c8a58', mark:'#e6e2d4', flag:'#41639b' },
  1:{ uni:'#626c78', uniD:'#434b55', uniL:'#7d8894', helm:'#454e58', helmD:'#2f363e',
      skin:'#c19a74', skinD:'#95714f', kit:'#5c5344', hull:'#5b6672', hullD:'#3a424c',
      hullL:'#76818d', mark:'#d8d2c4', flag:'#9a3f2c' }
};
/* who is in each squad and how they stand */
const CREW = {
  rifle:   ['rifle','rifle','rifle','rifle'],
  assault: ['smg','smg','smg'],
  mg:      ['mg','ammo'],
  sniper:  ['sniper'],
  mortar:  ['mortar','ammo'],
  at:      ['bazooka','ammo'],
  hq:      ['rifle']
};
const POSE = { mg:'prone', sniper:'prone', mortar:'kneel', bazooka:'kneel', ammo:'kneel', rifle:'stand', smg:'stand' };

function limb(c, x1, y1, x2, y2, w, col){
  c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
}

function helmet(c, x, y, f, side, P){
  c.fillStyle = P.helm;
  c.beginPath(); c.arc(x, y, 3.1, Math.PI*1.02, Math.PI*2.06); c.fill();
  if (side === 0){                       // M1 pot — shallow all-round brim
    c.fillStyle = P.helmD;
    c.beginPath(); c.ellipse(x, y + .2, 3.9, 1.1, 0, 0, 7); c.fill();
  } else {                               // Stahlhelm — flared neck skirt
    c.fillStyle = P.helmD;
    c.beginPath();
    c.moveTo(x - f*3.2, y - .4); c.lineTo(x - f*4.3, y + 1.6);
    c.lineTo(x + f*3.1, y + 1.1); c.lineTo(x + f*3.3, y - .4);
    c.closePath(); c.fill();
  }
  c.fillStyle = 'rgba(255,224,176,.3)';  // rim light from the sun side
  c.beginPath(); c.arc(x + LIT*1.1, y - .9, 2.1, Math.PI*1.15, Math.PI*1.75); c.fill();
}

function torso(c, x, hipY, shY, f, P, lean){
  const lx = lean || 0;
  c.fillStyle = P.uni;
  c.beginPath();
  c.moveTo(x - 2.7 + lx, shY); c.lineTo(x + 2.7 + lx, shY);
  c.lineTo(x + 2.3, hipY + .6); c.lineTo(x - 2.3, hipY + .6);
  c.closePath(); c.fill();
  c.fillStyle = P.uniD;                                  // shadow side
  c.fillRect(x - 2.7 + lx*.6, shY, 1.5, hipY - shY + .6);
  c.fillStyle = 'rgba(255,220,170,.22)';                 // rim
  c.fillRect(x + 1.6 + lx*.6, shY, 1.1 + lx*.2, hipY - shY + .3);
  c.fillStyle = P.kit;                                   // webbing
  c.fillRect(x - 2.5, hipY - 1.6, 5, 1.1);
  c.fillRect(x - .5 + lx*.4, shY + .4, .9, hipY - shY - 2);
  c.fillStyle = P.uniD;                                  // pack
  c.beginPath();
  if (c.roundRect) c.roundRect(x - f*4.4 + lx, shY + .8, 2.6, 4.6, 1); else c.rect(x - f*4.4 + lx, shY + .8, 2.6, 4.6);
  c.fill();
}

function weapon(c, x, y, f, kind, fire, P){
  const st = '#2e2a22', mt = '#4a4237';
  if (kind === 'rifle' || kind === 'sniper'){
    const L = kind === 'sniper' ? 13 : 10.5;
    c.fillStyle = st; c.fillRect(f > 0 ? x : x - L, y - .5, L, 1.1);
    c.fillStyle = mt; c.fillRect(f > 0 ? x - 3 : x + L - 4.6, y - .9, 4.4, 2.2);
    if (kind === 'sniper'){
      c.fillStyle = '#20242a'; c.fillRect(f > 0 ? x + 1.6 : x - 4.4, y - 2.4, 3.4, 1.5);
    }
  } else if (kind === 'smg'){
    c.fillStyle = st; c.fillRect(f > 0 ? x : x - 7, y - .5, 7, 1.1);
    c.fillStyle = mt; c.fillRect(f > 0 ? x - 2.4 : x + 5, y - .8, 3.2, 1.9);
    c.fillStyle = '#26221c'; c.fillRect(f > 0 ? x + 1.6 : x - 2.8, y + .4, 1.2, 3.2);
  } else if (kind === 'bazooka'){
    c.fillStyle = '#3b4232'; c.fillRect(f > 0 ? x - 6 : x - 11, y - 1.5, 17, 3);
    c.fillStyle = '#2b3125';
    c.beginPath();
    c.moveTo(x - f*6, y - 1.5); c.lineTo(x - f*8.5, y - 3); c.lineTo(x - f*8.5, y + 3); c.lineTo(x - f*6, y + 1.5);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,220,170,.2)'; c.fillRect(f > 0 ? x - 6 : x - 11, y - 1.5, 17, .8);
  }
  if (fire && (kind === 'rifle' || kind === 'smg' || kind === 'sniper')){
    const mx = x + f*(kind === 'sniper' ? 13.4 : kind === 'smg' ? 7.4 : 10.9);
    bright(cc => {
      cc.fillStyle = 'rgba(255,232,168,' + fire + ')';
      cc.beginPath();
      cc.moveTo(mx, y); cc.lineTo(mx + f*3.4, y - 1.7); cc.lineTo(mx + f*2.2, y);
      cc.lineTo(mx + f*3.4, y + 1.7); cc.closePath(); cc.fill();
      cc.beginPath(); cc.arc(mx, y, 1.9*fire + .6, 0, 7); cc.fill();
    });
  }
}

function drawMan(c, x, y, side, o){
  const P = COL[side], f = side === 0 ? 1 : -1;
  const pose = o.pose, fire = o.flash > 0 ? clamp(o.flash/.07, 0, 1) : 0;

  c.fillStyle = 'rgba(0,0,0,.32)';
  c.beginPath();
  c.ellipse(x, y, pose === 'prone' ? 8 : 4.2, pose === 'prone' ? 1.5 : 1.4, 0, 0, 7);
  c.fill();

  if (pose === 'prone'){
    const by = y - 2.4;
    limb(c, x - f*2, by + 1.4, x - f*7.5, by + 2.2, 2, P.uniD);      // legs
    limb(c, x - f*2, by + 1.4, x - f*7, by + .2, 2, P.uni);
    c.fillStyle = P.uni;                                             // body
    c.beginPath();
    if (c.roundRect) c.roundRect(x - f*4.5, by - 1.4, f*7.5, 3.4, 1.4); else c.rect(Math.min(x, x - f*4.5), by - 1.4, 7.5, 3.4);
    c.fill();
    c.fillStyle = P.uniD; c.fillRect(Math.min(x - f*4.5, x + f*3), by + .8, 7.5, 1.2);
    c.fillStyle = 'rgba(255,220,170,.2)'; c.fillRect(Math.min(x - f*4.5, x + f*3), by - 1.4, 7.5, .9);
    helmet(c, x + f*3.6, by - 1.6, f, side, P);
    if (o.wep === 'mg'){
      c.fillStyle = '#2e2a22'; c.fillRect(f > 0 ? x + 4 : x - 14, by - .7, 10, 1.3);
      c.fillStyle = '#3c372d'; c.fillRect(f > 0 ? x + 3 : x - 5.6, by - 2.4, 2.6, 2);
      limb(c, x + f*9, by + .2, x + f*7.6, y, 1, '#33302a');          // bipod
      limb(c, x + f*9, by + .2, x + f*10.6, y, 1, '#33302a');
      if (fire) bright(cc => {
        cc.fillStyle = 'rgba(255,230,160,' + fire + ')';
        const mx = x + f*14.2;
        cc.beginPath(); cc.moveTo(mx - f*1, by - .6); cc.lineTo(mx + f*4.2, by - 2.4);
        cc.lineTo(mx + f*2.6, by); cc.lineTo(mx + f*4.2, by + 2.4); cc.closePath(); cc.fill();
      });
    } else {
      weapon(c, x + f*4, by - .6, f, o.wep === 'sniper' ? 'sniper' : 'rifle', fire, P);
    }
    return;
  }

  const kneel = pose === 'kneel', crouch = pose === 'crouch';
  const drop = kneel ? 4 : crouch ? 2.6 : 0;
  const hipY = y - 9.2 + drop, shY = y - 15.4 + drop;
  const ph = Math.sin(o.walk) * (o.moving ? 1 : .08);

  if (kneel){
    limb(c, x, hipY, x - f*3.4, y - 1.4, 2.4, P.uniD);
    limb(c, x - f*3.4, y - 1.4, x - f*5.6, y, 2.2, P.uniD);
    limb(c, x, hipY, x + f*3, y - 4.6, 2.4, P.uni);
    limb(c, x + f*3, y - 4.6, x + f*2.4, y, 2.2, P.uni);
  } else {
    const swing = ph*3.2, lift = o.moving ? Math.max(0, -ph)*1.6 : 0;
    limb(c, x, hipY, x + swing, y - 3.6 - lift, 2.3, P.uniD);
    limb(c, x + swing, y - 3.6 - lift, x + swing*1.35, y - lift, 2.1, P.uniD);
    limb(c, x, hipY, x - swing, y - 3.6, 2.3, P.uni);
    limb(c, x - swing, y - 3.6, x - swing*1.35, y, 2.1, P.uni);
    c.fillStyle = '#26221c';
    c.fillRect(x + swing*1.35 - 1.5, y - 1, 3.2, 1.1);
    c.fillRect(x - swing*1.35 - 1.5, y - 1, 3.2, 1.1);
  }

  torso(c, x, hipY, shY, f, P, crouch ? f*.8 : 0);

  const gripY = shY + (fire ? 1.4 : 2.6);
  const gripX = x + f*4.6;
  limb(c, x + f*1.4, shY + 1.4, gripX, gripY, 1.9, P.uni);          // lead arm
  weapon(c, gripX, gripY, f, o.wep === 'ammo' ? null : o.wep, fire, P);
  if (o.wep === 'ammo'){
    c.fillStyle = '#6a6347';
    c.beginPath();
    if (c.roundRect) c.roundRect(gripX - 2.2, gripY - 1.6, 4.6, 3.4, .8); else c.rect(gripX - 2.2, gripY - 1.6, 4.6, 3.4);
    c.fill();
    c.fillStyle = 'rgba(255,220,170,.18)'; c.fillRect(gripX - 2.2, gripY - 1.6, 4.6, .9);
  }
  limb(c, x - f*.6, shY + 1.6, gripX - f*2.6, gripY + .6, 1.8, P.uniL);  // support arm

  c.fillStyle = P.skin;
  c.beginPath(); c.arc(x + f*.6, shY - 2.4, 2.1, 0, 7); c.fill();
  c.fillStyle = P.skinD;
  c.beginPath(); c.arc(x + f*.6 - LIT*.9, shY - 2.4, 1.7, 0, 7); c.fill();
  helmet(c, x + f*.6, shY - 3.1, f, side, P);
}

function drawSquad(c, u){
  const y = unitY(u);
  const pinned = u.supp > .45;
  const crew = CREW[u.def.id] || CREW.rifle;
  const men = u.members.map((m, i) => ({ m, i })).filter(o => o.m.hp > 0);
  men.sort((a,b) => a.m.oy - b.m.oy);
  for (const o of men){
    const wep = crew[o.i % crew.length];
    const pose = pinned ? 'prone' : (POSE[wep] || 'stand');
    drawMan(c, u.x - u.dir*o.m.ox, y + o.m.oy*.4, u.side,
      { pose, wep, walk:o.m.walk, moving:u.moving && !pinned, flash:o.m.flash });
  }
  if (u.def.id === 'mortar' && !pinned){
    const bx = u.x + u.dir*4, by = y;
    c.strokeStyle = '#34372c'; c.lineWidth = 1.9; c.lineCap = 'round';
    c.beginPath(); c.moveTo(bx, by - .5); c.lineTo(bx + u.dir*5.5, by - 12); c.stroke();
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(bx + u.dir*3.6, by - 7.5); c.lineTo(bx + u.dir*7, by); c.stroke();
    c.fillStyle = '#3f4436'; c.fillRect(bx - 3, by - 1.4, 6.5, 1.6);
    if (u.flash > 0) bright(cc => {
      cc.fillStyle = 'rgba(255,232,170,' + clamp(u.flash/.07,0,1) + ')';
      cc.beginPath(); cc.arc(bx + u.dir*6, by - 13, 3.6, 0, 7); cc.fill();
    });
  }
}

/* ---------------- vehicle rendering ---------------- */

const VEH = {
  light: { len:19, hullH:7,  wheels:5, turret:'round', gun:15, brake:false, cupola:true },
  heavy: { len:24, hullH:8.5,wheels:7, turret:'box',   gun:21, brake:true,  cupola:true }
};

function drawTank(c, u){
  const P = COL[u.side], V = VEH[u.def.id] || VEH.light;
  const y = unitY(u), f = u.dir, L = V.len, H = V.hullH;
  const bob = u.moving ? Math.sin(u.x*.22)*.35 : 0;
  const hurt = 1 - clamp(u.hp/u.maxHp, 0, 1);

  c.save();
  c.translate(u.x, y + bob);
  c.scale(f, 1);                    // draw facing right, mirror for the other side

  c.fillStyle = 'rgba(0,0,0,.36)';
  c.beginPath(); c.ellipse(0, 1 - bob, L + 2, 2.6, 0, 0, 7); c.fill();

  // running gear
  c.fillStyle = '#23241f';
  c.beginPath();
  if (c.roundRect) c.roundRect(-L, -8.6, L*2, 8.6, 4); else c.rect(-L, -8.6, L*2, 8.6);
  c.fill();
  c.fillStyle = '#34352e';
  for (let i = 0; i < V.wheels; i++){
    const wx = -L + 4 + i*((L*2 - 8)/(V.wheels - 1));
    c.beginPath(); c.arc(wx, -4, 2.7, 0, 7); c.fill();
    c.fillStyle = '#1e1f1b';
    c.beginPath(); c.arc(wx, -4, 1.1, 0, 7); c.fill();
    c.fillStyle = '#34352e';
  }
  c.fillStyle = '#3d3e36';                              // sprocket + idler
  c.beginPath(); c.arc(L - 2.4, -5.4, 3.2, 0, 7); c.fill();
  c.beginPath(); c.arc(-L + 2.4, -5.4, 2.8, 0, 7); c.fill();
  c.fillStyle = '#2a2b25';
  for (let i = 0; i < 2; i++) { c.beginPath(); c.arc(-L*.4 + i*L*.8, -8.2, 1.3, 0, 7); c.fill(); }
  c.fillStyle = '#15161a';                              // track links, scrolling
  const links = Math.round(L*1.1);
  for (let i = 0; i < links; i++){
    const t = ((u.x*f*.55 + i*(L*2/links)) % (L*2)) - L;
    c.fillRect(t, -9.1, 2.1, 1.5);
    c.fillRect(t, -1.4, 2.1, 1.5);
  }

  // hull with sloped glacis
  c.fillStyle = P.hull;
  c.beginPath();
  c.moveTo(-L + 1, -H - 7);
  c.lineTo(L - 7, -H - 7);
  c.lineTo(L, -H - 2.6);
  c.lineTo(L, -7.2);
  c.lineTo(-L + 1, -7.2);
  c.closePath(); c.fill();
  c.fillStyle = P.hullD;
  c.fillRect(-L + 1, -9.4, L*2 - 1, 2.2);                // shadow under the sponson
  c.fillStyle = P.hullL;
  c.fillRect(-L + 1, -H - 7, L*2 - 7, 1.3);              // top highlight
  c.fillStyle = P.hullD;                                 // engine deck louvres
  for (let i = 0; i < 4; i++) c.fillRect(-L + 3 + i*2.6, -H - 6.4, 1.5, 2.6);
  c.fillStyle = mix(P.hullD, '#000', .2);                // fender
  c.fillRect(-L - 1.5, -8.2, 4, 1.2); c.fillRect(L - 2.5, -8.2, 4, 1.2);
  c.fillStyle = P.kit;                                   // stowage
  c.beginPath();
  if (c.roundRect) c.roundRect(-L + 2.5, -H - 10, 6, 3, 1); else c.rect(-L + 2.5, -H - 10, 6, 3);
  c.fill();
  c.strokeStyle = mix(P.hullD, '#000', .3); c.lineWidth = .7;
  c.beginPath(); c.arc(-L + 6, -H - 3.4, 2.6, Math.PI*.9, Math.PI*2.1); c.stroke();  // tow cable

  // turret
  const rec = u.recoil * (V.brake ? 4.4 : 3.2);
  c.save();
  c.translate(-rec*.3, 0);
  c.fillStyle = P.hull;
  if (V.turret === 'round'){
    c.beginPath();
    c.moveTo(-8.5, -H - 7); c.lineTo(7.5, -H - 7);
    c.quadraticCurveTo(10.5, -H - 8.4, 9.5, -H - 13.4);
    c.quadraticCurveTo(2, -H - 16.6, -6, -H - 14.6);
    c.quadraticCurveTo(-9.5, -H - 12, -8.5, -H - 7);
    c.closePath(); c.fill();
  } else {
    c.beginPath();
    c.moveTo(-9.5, -H - 7); c.lineTo(9.5, -H - 7); c.lineTo(9.5, -H - 14.2);
    c.lineTo(5.5, -H - 16); c.lineTo(-8, -H - 16); c.lineTo(-9.5, -H - 13);
    c.closePath(); c.fill();
  }
  c.fillStyle = P.hullL;
  c.fillRect(-7.5, -H - 15.6, 12, 1.2);
  c.fillStyle = P.hullD;
  c.fillRect(-9, -H - 8.4, 17, 1.4);
  if (V.cupola){
    c.fillStyle = P.hullD;
    c.beginPath(); c.ellipse(-4.5, -H - 16.2, 2.6, 1.5, 0, 0, 7); c.fill();
    c.fillStyle = P.hullL;
    c.beginPath(); c.ellipse(-4.5, -H - 16.7, 2.4, 1.2, 0, 0, 7); c.fill();
  }
  c.strokeStyle = mix(P.hullD, '#000', .4); c.lineWidth = .7;   // aerial
  c.beginPath(); c.moveTo(6, -H - 15); c.quadraticCurveTo(9, -H - 22, 7, -H - 28); c.stroke();
  // mantlet + gun
  c.fillStyle = P.hullD;
  c.beginPath();
  if (c.roundRect) c.roundRect(7, -H - 13.4, 4, 5.4, 1.6); else c.rect(7, -H - 13.4, 4, 5.4);
  c.fill();
  c.fillStyle = '#41483a';
  c.fillRect(10, -H - 11.6, V.gun, 2.1);
  c.fillStyle = '#343b2e';
  c.fillRect(10, -H - 11.6, V.gun, .8);
  if (V.brake){
    c.fillStyle = '#2f352a';
    c.fillRect(10 + V.gun - 2.6, -H - 12.4, 3.4, 3.6);
  }
  c.restore();

  // national marking
  c.globalAlpha = .82;
  if (u.side === 0){
    c.fillStyle = P.mark;
    c.beginPath();
    for (let i = 0; i < 5; i++){
      const a = -Math.PI/2 + i*Math.PI*2/5;
      c.lineTo(-L*.45 + Math.cos(a)*2.6, -H - 3 + Math.sin(a)*2.6);
      const b = a + Math.PI/5;
      c.lineTo(-L*.45 + Math.cos(b)*1.1, -H - 3 + Math.sin(b)*1.1);
    }
    c.closePath(); c.fill();
  } else {
    c.fillStyle = P.mark;
    c.fillRect(-L*.45 - 2.6, -H - 3.6, 5.2, 1.3);
    c.fillRect(-L*.45 - .7, -H - 5.5, 1.3, 5.2);
    c.fillStyle = '#20242a';
    c.fillRect(-L*.45 - 1.7, -H - 3.2, 3.4, .6);
    c.fillRect(-L*.45 - .3, -H - 4.6, .6, 3.4);
  }
  c.globalAlpha = 1;

  // battle damage
  if (hurt > .3){
    c.fillStyle = 'rgba(18,16,14,' + (hurt*.5) + ')';
    c.beginPath(); c.ellipse(L*.2, -H - 5, 5*hurt, 3*hurt, .3, 0, 7); c.fill();
    c.beginPath(); c.ellipse(-L*.5, -9, 4*hurt, 2*hurt, 0, 0, 7); c.fill();
  }
  c.restore();

  if (u.flash > 0){
    const bx = u.x + f*(10 + V.gun + 2)*1, by = y + bob - VEH[u.def.id].hullH - 10.6;
    const a = clamp(u.flash/.07, 0, 1);
    bright(cc => {
      cc.fillStyle = 'rgba(255,226,150,' + a + ')';
      cc.beginPath();
      cc.moveTo(bx - f*2, by); cc.lineTo(bx + f*9, by - 4.4); cc.lineTo(bx + f*6, by);
      cc.lineTo(bx + f*9, by + 4.4); cc.closePath(); cc.fill();
      cc.beginPath(); cc.arc(bx, by, 4.4*a + 1, 0, 7); cc.fill();
    });
  }
  if (u.moving && Math.random() < .35) dust(u.x - f*L, y, .5);
  if (hurt > .6 && Math.random() < .25) smoke(u.x - f*L*.5, y - 14, .55);
}

/* ---------------- command post ---------------- */

function drawHQ(c, u){
  const P = COL[u.side], f = u.dir, y = GROUND + 2;
  const frac = clamp(u.hp/u.maxHp, 0, 1), hurt = 1 - frac;
  c.save();
  c.translate(u.x, y);
  c.scale(f, 1);

  c.fillStyle = 'rgba(0,0,0,.4)';
  c.beginPath(); c.ellipse(0, 0, 34, 3.6, 0, 0, 7); c.fill();

  // concrete casemate
  c.fillStyle = '#6a665b';
  c.beginPath();
  c.moveTo(-26, 0); c.lineTo(-22, -32); c.lineTo(20, -32); c.lineTo(26, 0);
  c.closePath(); c.fill();
  c.fillStyle = '#7a7568';
  c.beginPath(); c.moveTo(-24, -32); c.lineTo(22, -32); c.lineTo(24, -38); c.lineTo(-25, -38); c.closePath(); c.fill();
  c.fillStyle = '#585448';
  c.fillRect(-26, -4, 52, 4);
  c.strokeStyle = 'rgba(40,38,33,.45)'; c.lineWidth = .7;   // formwork seams
  for (let i = 1; i < 4; i++){ c.beginPath(); c.moveTo(-25, -i*8); c.lineTo(25, -i*8); c.stroke(); }
  c.fillStyle = 'rgba(255,220,170,.12)';
  c.fillRect(14, -32, 6, 32);

  // embrasure with an MG
  c.fillStyle = '#191b1e';
  c.beginPath();
  c.moveTo(6, -26); c.lineTo(21, -26); c.lineTo(21, -20); c.lineTo(6, -21); c.closePath(); c.fill();
  c.fillStyle = '#2e2a22'; c.fillRect(16, -24.4, 13, 1.5);
  c.fillStyle = '#4b4438'; c.fillRect(14, -25.6, 4, 3);

  // sandbag revetment
  for (let row = 0; row < 3; row++){
    for (let i = 0; i < 6 - row; i++){
      const bx = -32 + row*5 + i*11, by = -row*5.2;
      c.fillStyle = (i + row) % 2 ? '#7d7157' : '#6d6249';
      c.beginPath();
      if (c.roundRect) c.roundRect(bx, by - 5.4, 10.4, 5.4, 2.4); else c.rect(bx, by - 5.4, 10.4, 5.4);
      c.fill();
      c.fillStyle = 'rgba(38,32,22,.3)';
      c.fillRect(bx, by - 1.2, 10.4, 1.2);
      c.fillStyle = 'rgba(255,224,176,.16)';
      c.fillRect(bx + 1, by - 5.2, 8.4, 1);
    }
  }
  // camo netting over the roof
  c.strokeStyle = 'rgba(78,84,54,.55)'; c.lineWidth = .8;
  for (let i = 0; i < 9; i++){
    c.beginPath();
    c.moveTo(-24 + i*5.6, -38);
    c.quadraticCurveTo(-22 + i*5.6, -33 - (i%2)*3, -26 + i*5.6, -28 - (i%3)*2);
    c.stroke();
  }
  // mast and colours
  c.strokeStyle = '#3a3a34'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(-16, -38); c.lineTo(-16, -60); c.stroke();
  const wave = Math.sin(G.t*2.2)*1.8;
  c.fillStyle = P.flag;
  c.beginPath();
  c.moveTo(-16, -60); c.lineTo(-16 + 16, -58.5 + wave); c.lineTo(-16 + 16, -51.5 + wave); c.lineTo(-16, -50);
  c.closePath(); c.fill();
  c.fillStyle = 'rgba(0,0,0,.2)';
  c.fillRect(-16, -55, 16, 1.2);

  if (hurt > .25){
    c.strokeStyle = 'rgba(24,22,19,' + clamp(hurt,0,.8) + ')'; c.lineWidth = 1.1;
    for (let i = 0; i < 5; i++){
      const bx = -20 + i*9;
      c.beginPath(); c.moveTo(bx, -30 + i*2); c.lineTo(bx + 5, -16 - i*2); c.lineTo(bx + 1, -6); c.stroke();
    }
    c.fillStyle = 'rgba(30,26,22,' + clamp(hurt*.5,0,.5) + ')';
    c.beginPath(); c.moveTo(-22, -32); c.lineTo(-10, -32); c.lineTo(-16, -22); c.closePath(); c.fill();
  }
  c.restore();

  if (hurt > .3 && Math.random() < hurt*.4) smoke(u.x + rnd(20,-20), y - 38, 1.4);
  if (hurt > .7){
    if (Math.random() < .3) G.parts.push({ k:'fire', x:u.x + rnd(18,-18), y:y - 30, life:.6, max:.6, s:rnd(7,3) });
  }
}

/* ---------------- ground dressing ---------------- */

function dust(x, y, s){
  G.parts.push({ k:'sm', x, y, vx:rnd(14,-14), vy:rnd(-6,-20), life:rnd(1.3,.6), max:1.3,
    col: terr() === 'snow' ? '#dfe7ef' : '#9a8b6e', s:rnd(6,2.5)*s });
}

function drawDecals(c){
  for (const d of G.decals){
    if (d.x < G.cam.x - 60 || d.x > G.cam.x + viewW + 60) continue;
    c.globalAlpha = d.a;
    if (d.k === 'track'){
      c.fillStyle = 'rgba(30,26,20,.5)';
      c.fillRect(d.x - 1.6, d.y - .7, 3.2, 1.4);
    } else {
      c.fillStyle = 'rgba(22,18,14,.62)';
      c.beginPath(); c.ellipse(d.x, d.y, d.r, d.r*.26, 0, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
  }
}

function drawCraters(c){
  const g = gpal();
  for (const cr of G.craters){
    if (cr.x < G.cam.x - 60 || cr.x > G.cam.x + viewW + 60) continue;
    const y = GROUND + 2 + cr.a*7;
    c.globalAlpha = .7;
    c.fillStyle = mix(g[2], '#0a0d12', .1);              // thrown-up rim
    c.beginPath(); c.ellipse(cr.x, y, cr.r*1.12, cr.r*.34, 0, 0, 7); c.fill();
    c.fillStyle = 'rgba(24,19,13,.5)';                   // bowl
    c.beginPath(); c.ellipse(cr.x, y - cr.r*.04, cr.r*.8, cr.r*.22, 0, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,222,176,.09)';               // lit far lip
    c.beginPath(); c.ellipse(cr.x + LIT*cr.r*.3, y - cr.r*.12, cr.r*.34, cr.r*.08, 0, 0, 7); c.fill();
    c.globalAlpha = 1;
  }
}

function drawCovers(c){
  for (const cv2 of G.covers){
    if (cv2.x < G.cam.x - 80 || cv2.x > G.cam.x + viewW + 80) continue;
    const y = GROUND + 2.5, n = Math.round(cv2.w/11);
    c.fillStyle = 'rgba(0,0,0,.3)';
    c.beginPath(); c.ellipse(cv2.x, y + 1, cv2.w*.55, 2.4, 0, 0, 7); c.fill();
    for (let row = 0; row < 2; row++){
      for (let i = 0; i < n - row; i++){
        const bx = cv2.x - cv2.w/2 + row*5.5 + i*11;
        const by = y - row*5.4;
        c.fillStyle = (i + row) % 2 ? '#7d7157' : '#6d6249';
        c.beginPath();
        if (c.roundRect) c.roundRect(bx, by - 5.6, 10.4, 5.6, 2.4); else c.rect(bx, by - 5.6, 10.4, 5.6);
        c.fill();
        c.fillStyle = 'rgba(40,33,22,.32)';
        c.fillRect(bx, by - 1.3, 10.4, 1.3);
        c.fillStyle = 'rgba(255,226,180,.18)';
        c.fillRect(bx + 1.2, by - 5.4, 8, 1);
      }
    }
    // a couple of stakes and a strand of wire
    c.strokeStyle = 'rgba(48,42,32,.8)'; c.lineWidth = .9;
    for (let i = 0; i < 3; i++){
      const sx = cv2.x - cv2.w/2 + i*(cv2.w/2);
      c.beginPath(); c.moveTo(sx, y); c.lineTo(sx - 1, y - 9); c.stroke();
    }
    c.strokeStyle = 'rgba(60,54,42,.55)';
    c.beginPath();
    c.moveTo(cv2.x - cv2.w/2, y - 8);
    c.quadraticCurveTo(cv2.x, y - 5.6, cv2.x + cv2.w/2, y - 8.6);
    c.stroke();
  }
}

function drawCorpses(c){
  for (const p of G.corpses){
    const a = clamp(1 - (p.t - 16)/9, 0, 1);
    if (a <= 0 || p.x < G.cam.x - 40 || p.x > G.cam.x + viewW + 40) continue;
    c.globalAlpha = a;
    if (p.veh){
      c.fillStyle = '#1f1e1a';
      c.beginPath();
      if (c.roundRect) c.roundRect(p.x - 20, p.y - 11, 40, 11, 3); else c.rect(p.x - 20, p.y - 11, 40, 11);
      c.fill();
      c.fillStyle = '#2a2822';
      c.fillRect(p.x - 11, p.y - 17, 20, 7);
      c.fillStyle = '#171613';
      c.fillRect(p.x + 6, p.y - 15.5, 14, 1.8);
      c.fillStyle = 'rgba(255,150,60,' + (a*.25) + ')';
      c.beginPath(); c.arc(p.x + rnd(6,-6), p.y - 9, 3.4, 0, 7); c.fill();
    } else {
      const P = COL[p.side];
      c.fillStyle = 'rgba(0,0,0,.28)';
      c.beginPath(); c.ellipse(p.x, p.y, 7, 1.4, 0, 0, 7); c.fill();
      c.fillStyle = P.uniD;
      c.beginPath();
      if (c.roundRect) c.roundRect(p.x - 6.5, p.y - 3.4, 13, 3.4, 1.4); else c.rect(p.x - 6.5, p.y - 3.4, 13, 3.4);
      c.fill();
      c.fillStyle = P.helmD;
      c.beginPath(); c.arc(p.x + (p.side === 0 ? 7.4 : -7.4), p.y - 2.6, 2.4, 0, 7); c.fill();
      c.fillStyle = 'rgba(70,16,12,.35)';
      c.beginPath(); c.ellipse(p.x - 2, p.y + .4, 5.5, 1.2, 0, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
  }
}

function drawBars(c, u){
  const frac = clamp(u.hp/u.maxHp, 0, 1);
  if (frac < .999){
    const w = u.def.veh ? 26 : 22;
    const y = unitY(u) - (u.def.veh ? 32 : 24);
    c.fillStyle = 'rgba(8,10,14,.8)';
    c.fillRect(u.x - w/2 - .7, y - .7, w + 1.4, 3.6);
    c.fillStyle = frac > .55 ? '#79ac5f' : frac > .28 ? '#d9a441' : '#c2402f';
    c.fillRect(u.x - w/2, y, w*frac, 2.2);
    c.fillStyle = 'rgba(255,255,255,.18)';
    c.fillRect(u.x - w/2, y, w*frac, .8);
  }
  if (u.vet){
    const y = unitY(u) - (u.def.veh ? 37 : 29);
    c.strokeStyle = '#e0b055'; c.lineWidth = 1.1; c.lineCap = 'round';
    for (let i = 0; i < u.vet; i++){
      const x = u.x - 3.4 + i*3.4;
      c.beginPath(); c.moveTo(x - 1.5, y + 1.4); c.lineTo(x, y - .8); c.lineTo(x + 1.5, y + 1.4); c.stroke();
    }
  }
  if (u.supp > .45){
    c.fillStyle = 'rgba(214,80,60,.9)';
    c.font = '600 5.4px Oswald, sans-serif'; c.textAlign = 'center';
    c.fillText('PINNED', u.x, unitY(u) - 15);
    c.textAlign = 'left';
  }
}

function drawUnit(c, u){
  if (u.x < G.cam.x - 80 || u.x > G.cam.x + viewW + 80) return;
  if (u.structure){ drawHQ(c, u); return; }
  if (u.dead) return;
  // depth: the back rank sits slightly smaller and hazier
  const depth = (u.lane - 1);
  c.save();
  if (depth !== 0){
    const sc = 1 - depth*.055;
    c.translate(u.x, unitY(u)); c.scale(sc, sc); c.translate(-u.x, -unitY(u));
  }
  if (depth < 0) c.globalAlpha = .88;
  if (u.def.veh) drawTank(c, u); else drawSquad(c, u);
  c.globalAlpha = 1;
  c.restore();
  drawBars(c, u);
}

/* ---------------- ordnance & effects ---------------- */

function drawProjs(c){
  for (const p of G.projs){
    if (p.k === 'shell'){
      c.strokeStyle = 'rgba(214,214,204,.22)'; c.lineWidth = .9;
      c.beginPath();
      for (let i = 0; i < p.trail.length; i += 2){
        if (i === 0) c.moveTo(p.trail[i], p.trail[i+1]); else c.lineTo(p.trail[i], p.trail[i+1]);
      }
      c.stroke();
      c.save(); c.translate(p.x, p.y); c.rotate(Math.atan2(p.vy, p.vx));
      c.fillStyle = '#23262b';
      c.beginPath();
      c.moveTo(3.4, 0); c.lineTo(-1.2, -1.5); c.lineTo(-3, -1.3); c.lineTo(-3, 1.3); c.lineTo(-1.2, 1.5);
      c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,220,170,.3)'; c.fillRect(-1.6, -1.4, 4, .7);
      c.restore();
    } else if (p.k === 'rocket'){
      c.save(); c.translate(p.x, p.y); c.rotate(Math.atan2(p.vy, p.vx));
      c.fillStyle = '#c9c3a4';
      c.beginPath(); c.moveTo(5.4, 0); c.lineTo(-3.4, -1.6); c.lineTo(-3.4, 1.6); c.closePath(); c.fill();
      c.fillStyle = '#5a6247';
      c.beginPath(); c.moveTo(-3.4, 0); c.lineTo(-6, -2.4); c.lineTo(-6, 2.4); c.closePath(); c.fill();
      c.restore();
      bright(cc => {
        cc.fillStyle = 'rgba(255,190,90,.85)';
        cc.beginPath(); cc.arc(p.x - p.vx*.012, p.y - p.vy*.012, 2.4, 0, 7); cc.fill();
      });
    } else {
      const n = Math.hypot(p.vx, p.vy) || 1;
      bright(cc => {
        const gd = cc.createLinearGradient(p.x, p.y, p.x - p.vx/n*13, p.y - p.vy/n*13);
        gd.addColorStop(0, 'rgba(255,244,196,.95)');
        gd.addColorStop(1, 'rgba(255,160,60,0)');
        cc.strokeStyle = gd; cc.lineWidth = 2; cc.lineCap = 'round';
        cc.beginPath(); cc.moveTo(p.x, p.y); cc.lineTo(p.x - p.vx/n*13, p.y - p.vy/n*13); cc.stroke();
      });
    }
  }
}

function drawParts(c){
  for (const p of G.parts){
    const a = clamp(p.life/p.max, 0, 1);
    switch (p.k){
      case 'tr': {
        const hx = lerp(p.x0, p.x1, .62), hy = lerp(p.y0, p.y1, .62);
        bright(cc => {
          cc.lineCap = 'round';
          cc.strokeStyle = rgba(p.col, a*.34); cc.lineWidth = p.w*.8;
          cc.beginPath(); cc.moveTo(p.x0, p.y0); cc.lineTo(p.x1, p.y1); cc.stroke();
          cc.strokeStyle = rgba(p.col, a); cc.lineWidth = p.w*1.5;
          cc.beginPath(); cc.moveTo(hx, hy); cc.lineTo(p.x1, p.y1); cc.stroke();
        });
        break;
      }
      case 'sm': {
        const r = p.s*(1.6 - a*.6);
        c.globalAlpha = a*.36;
        c.drawImage(puffSprite(p.col), p.x - r, p.y - r, r*2, r*2);
        c.globalAlpha = 1;
        break;
      }
      case 'fb': {
        const r = p.s*(1.3 - a*.72);
        bright(cc => {
          cc.globalAlpha = a;
          cc.drawImage(fballSprite(), p.x - r, p.y - r, r*2, r*2);
          cc.globalAlpha = 1;
        });
        break;
      }
      case 'ring': {
        const r = p.s*(1 - a)*1.5 + 4;
        c.strokeStyle = 'rgba(255,238,200,' + (a*a*.55) + ')';
        c.lineWidth = 1 + a*2.4;
        c.beginPath(); c.ellipse(p.x, p.y, r, r*.34, 0, 0, 7); c.stroke();
        break;
      }
      case 'fire': {
        const r = p.s*(.6 + a*.7);
        bright(cc => {
          cc.globalAlpha = a;
          cc.drawImage(fireSprite(), p.x - r, p.y - r, r*2, r*2);
          cc.globalAlpha = 1;
        });
        break;
      }
      case 'mf': {
        bright(cc => {
          cc.fillStyle = 'rgba(255,230,160,' + a + ')';
          cc.beginPath(); cc.arc(p.x, p.y, p.s*a, 0, 7); cc.fill();
        });
        break;
      }
      case 'tx': {
        c.globalAlpha = clamp(a*1.7, 0, 1);
        c.fillStyle = p.col;
        c.font = '600 6.4px Oswald, sans-serif'; c.textAlign = 'center';
        c.fillText(p.txt, p.x, p.y);
        c.textAlign = 'left'; c.globalAlpha = 1;
        break;
      }
      case 'dt': {
        c.save();
        c.globalAlpha = a;
        c.translate(p.x, p.y); c.rotate(p.rot || 0);
        c.fillStyle = p.col;
        c.fillRect(-p.s*.5, -p.s*.4, p.s, p.s*.8);
        c.restore();
        c.globalAlpha = 1;
        break;
      }
      default: {
        c.globalAlpha = a;
        c.fillStyle = p.col;
        c.fillRect(p.x, p.y, p.s, p.s);
        c.globalAlpha = 1;
      }
    }
  }
}

function drawPlanes(c){
  for (const p of G.planes){
    // shadow tracking along the ground
    c.fillStyle = 'rgba(0,0,0,.18)';
    c.beginPath(); c.ellipse(p.x + 40, GROUND + 3, 16, 2.4, 0, 0, 7); c.fill();
    c.save();
    c.translate(p.x, p.y);
    c.fillStyle = '#8d9aa3';
    c.beginPath();
    c.moveTo(-20, 0); c.lineTo(-14, -3); c.lineTo(12, -2.6); c.lineTo(20, 0); c.lineTo(12, 2.6); c.lineTo(-14, 3);
    c.closePath(); c.fill();
    c.fillStyle = '#6d7a83';
    c.beginPath(); c.moveTo(-5, -1); c.lineTo(3, -11); c.lineTo(7, -11); c.lineTo(4, -1); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-5, 1); c.lineTo(3, 11); c.lineTo(7, 11); c.lineTo(4, 1); c.closePath(); c.fill();
    c.fillStyle = '#5c686f';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-16, -6); c.lineTo(-12, -5.4); c.closePath(); c.fill();
    c.fillStyle = '#e8e4d8';                            // invasion stripes
    c.fillRect(-9, -3, 1.8, 6); c.fillRect(-5.4, -3, 1.8, 6);
    c.fillStyle = '#9fc0dd';
    c.beginPath(); c.ellipse(4, -2.4, 3.4, 1.6, 0, 0, 7); c.fill();
    c.fillStyle = 'rgba(210,220,230,.16)';              // prop disc
    c.beginPath(); c.ellipse(19, 0, 2.2, 7.6, 0, 0, 7); c.fill();
    c.restore();
  }
}

/* ---------------- screen-space passes ---------------- */

function drawWeather(){
  const w = G.M && G.M.weather;
  if (!w) return;
  screenSpace();
  const t = G.t;
  if (w === 'rain'){
    for (let L = 0; L < 2; L++){
      const n = L ? 120 : 90, sp = L ? 1500 : 980, len = L ? 19 : 12;
      ctx.strokeStyle = L ? 'rgba(186,206,224,.4)' : 'rgba(170,190,210,.22)';
      ctx.lineWidth = L ? 1.1 : .8;
      ctx.beginPath();
      for (let i = 0; i < n; i++){
        const x = ((i*(137.5 + L*40) + t*sp*.55) % (cw + 140)) - 70;
        const y = ((i*(211.3 + L*30) + t*sp) % (ch + 70)) - 35;
        ctx.moveTo(x, y); ctx.lineTo(x - len*.35, y + len);
      }
      ctx.stroke();
    }
    // splashes along the ground line
    ctx.strokeStyle = 'rgba(200,220,236,.25)'; ctx.lineWidth = .9;
    ctx.beginPath();
    for (let i = 0; i < 26; i++){
      const x = ((i*167.7 + Math.floor(t*7)*93) % cw);
      const y = GROUND*S + ((i*53) % (ch - GROUND*S));
      const r = 1.6 + ((i*37 + Math.floor(t*7)) % 5);
      ctx.moveTo(x - r, y); ctx.quadraticCurveTo(x, y - r*.7, x + r, y);
    }
    ctx.stroke();
  } else if (w === 'snow'){
    for (let L = 0; L < 3; L++){
      const n = [70, 60, 40][L], sz = [1.3, 2.1, 3.2][L], sp = [28, 52, 86][L];
      ctx.fillStyle = 'rgba(236,244,252,' + [.4,.6,.8][L] + ')';
      for (let i = 0; i < n; i++){
        const x = ((i*97.3 + t*sp*.4 + Math.sin(t*.6 + i)*(12 + L*10)) % (cw + 40)) - 20;
        const y = ((i*163.7 + t*sp) % (ch + 40)) - 20;
        ctx.beginPath(); ctx.arc(x, y, sz, 0, 7); ctx.fill();
      }
    }
  }
}

function drawOrders(c){
  // rally line — where your units stop and dig in
  if (G.rally != null && G.rally < WORLD_LEN - 90){
    const x = G.rally;
    c.strokeStyle = 'rgba(122,168,220,.5)'; c.lineWidth = 1; c.setLineDash([4,4]);
    c.beginPath(); c.moveTo(x, GROUND - 58); c.lineTo(x, GROUND + 10); c.stroke();
    c.setLineDash([]);
    c.fillStyle = 'rgba(122,168,220,.85)';
    c.beginPath();
    c.moveTo(x, GROUND - 58); c.lineTo(x + 12, GROUND - 54.5); c.lineTo(x, GROUND - 51);
    c.closePath(); c.fill();
    c.fillStyle = 'rgba(122,168,220,.14)';
    c.fillRect(x - 3, GROUND - 6, 6, 8);
  }
  if (!G.armed || aimX == null) return;
  const ab = ABILITIES.find(a => a.id === G.armed);
  const r = ab.id === 'arty' ? 100 : ab.id === 'air' ? 170 : 150;
  c.save();
  c.strokeStyle = 'rgba(224,176,85,.85)'; c.lineWidth = 1;
  c.setLineDash([5,4]);
  c.beginPath(); c.moveTo(aimX - r, GROUND + 6); c.lineTo(aimX + r, GROUND + 6); c.stroke();
  c.beginPath(); c.moveTo(aimX, GROUND - 74); c.lineTo(aimX, GROUND + 6); c.stroke();
  c.setLineDash([]);
  c.beginPath(); c.arc(aimX, GROUND - 16, 8, 0, 7); c.stroke();
  c.beginPath(); c.moveTo(aimX - 12, GROUND - 16); c.lineTo(aimX - 4, GROUND - 16);
  c.moveTo(aimX + 4, GROUND - 16); c.lineTo(aimX + 12, GROUND - 16); c.stroke();
  const gd = c.createLinearGradient(0, GROUND - 60, 0, GROUND + 6);
  gd.addColorStop(0, 'rgba(224,176,85,0)');
  gd.addColorStop(1, 'rgba(224,176,85,.16)');
  c.fillStyle = gd; c.fillRect(aimX - r, GROUND - 60, r*2, 66);
  c.restore();
}

function postFX(){
  screenSpace();
  if (gctx){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = .34;
    ctx.drawImage(glowCv, 0, 0, cw, ch);
    ctx.globalAlpha = .26;
    ctx.drawImage(glowCv, -3, -3, cw + 6, ch + 6);
    ctx.restore();
  }
  const gr = GRADE[(G.M && G.M.sky) || 'dusk'];
  ctx.save();
  ctx.globalCompositeOperation = gr.mode;
  ctx.globalAlpha = gr.a;
  ctx.fillStyle = gr.col;
  ctx.fillRect(0, 0, cw, ch);
  ctx.restore();
  if (!vigCv || vigCv.width !== Math.round(cw)) buildVignette();
  ctx.drawImage(vigCv, 0, 0, cw, ch);
}

/* ---------------- frame ---------------- */

function render(){
  screenSpace();
  ctx.clearRect(0, 0, cw, ch);
  if (gctx){
    gctx.setTransform(1,0,0,1,0,0);
    gctx.clearRect(0, 0, glowCv.width, glowCv.height);
    setGlowCam();
  }
  if (!LAY.sky) buildLayers();
  setCam(1);
  blit(LAY.sky); blit(LAY.far); blit(LAY.mid); blit(LAY.near);
  blit(LAY.grd);
  drawDecals(ctx);
  drawCraters(ctx);
  drawCorpses(ctx);
  drawCovers(ctx);
  const list = G.units.slice().sort((a,b) => (a.lane - b.lane) || (a.x - b.x));
  for (const u of list) drawUnit(ctx, u);
  drawProjs(ctx);
  drawPlanes(ctx);
  drawParts(ctx);
  drawOrders(ctx);
  blit(LAY.fore);
  drawWeather();
  postFX();
}

/* ---------------- minimap ---------------- */

function renderMini(){
  const w = mini.width/DPR, h = mini.height/DPR;
  mctx.setTransform(DPR,0,0,DPR,0,0);
  const g = gpal(), sk = sky();
  const bg = mctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, mix(sk.band[1][1], '#0a0d12', .55));
  bg.addColorStop(.62, mix(g[1], '#0a0d12', .55));
  bg.addColorStop(1, mix(g[2], '#0a0d12', .4));
  mctx.fillStyle = bg; mctx.fillRect(0, 0, w, h);
  const sx = w/WORLD_LEN, gy = h*.68;

  for (const cvr of G.covers){
    mctx.fillStyle = 'rgba(160,146,110,.34)';
    mctx.fillRect(cvr.x*sx - cvr.w*sx/2, gy - 1, cvr.w*sx, 2.4);
  }
  mctx.fillStyle = 'rgba(217,164,65,.1)';
  mctx.fillRect(G.cam.x*sx, 0, viewW*sx, h);
  mctx.strokeStyle = 'rgba(217,164,65,.5)'; mctx.lineWidth = 1;
  mctx.strokeRect(G.cam.x*sx + .5, .5, Math.max(2, viewW*sx - 1), h - 1);

  for (const u of G.units){
    if (u.dead) continue;
    const x = u.x*sx;
    if (u.structure){
      mctx.fillStyle = u.side === 0 ? '#6fa3d8' : '#c9714a';
      mctx.fillRect(x - 2.5, h*.2, 5, h*.6);
      continue;
    }
    const sz = u.def.veh ? 4 : 2.4;
    mctx.fillStyle = u.side === 0 ? (u.def.veh ? '#a9cdf0' : '#6fa3d8') : (u.def.veh ? '#e8a67d' : '#c9714a');
    mctx.fillRect(x - sz/2, gy - sz - u.lane*1.4, sz, sz);
  }
  if (G.rally != null && G.rally < WORLD_LEN - 90){
    mctx.strokeStyle = 'rgba(122,168,220,.85)'; mctx.lineWidth = 1;
    mctx.beginPath(); mctx.moveTo(G.rally*sx + .5, 1); mctx.lineTo(G.rally*sx + .5, h - 1); mctx.stroke();
  }
  for (const p of G.projs){
    mctx.fillStyle = '#ffe7ae';
    mctx.fillRect(p.x*sx - 1, h*.14, 2, 2);
  }
}

/* ---------------- card sprites ---------------- */

function unitSprite(def, wpx, hpx){
  const c = document.createElement('canvas');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.round(wpx*dpr); c.height = Math.round(hpx*dpr);
  c.style.width = wpx + 'px'; c.style.height = hpx + 'px';
  const x = c.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const scale = def.veh ? hpx/34 : hpx/26;
  x.translate(wpx/2, hpx - 2);
  x.scale(scale, scale);
  const fake = { def, side:0, dir:1, x:0, lane:1, hp:1, maxHp:1, recoil:0, flash:0,
                 moving:false, supp:0, vet:0, dead:false, structure:false, walk:0 };
  x.translate(0, -unitY(fake));
  fake.x = 0;
  if (def.veh){
    x.translate(0, 2);
    drawTank(x, fake);
  } else {
    const crew = CREW[def.id] || CREW.rifle;
    const n = Math.min(2, crew.length);
    for (let i = n - 1; i >= 0; i--){
      drawMan(x, -6 + i*11, unitY(fake) + i*1.4, 0,
        { pose: POSE[crew[i]] || 'stand', wep: crew[i], walk:0, moving:false, flash:0 });
    }
  }
  return c;
}
