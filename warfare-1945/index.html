  if (toastT > 0){ toastT -= real; if (toastT <= 0) toastEl.classList.remove('show'); }
  if (bannerT > 0){ bannerT -= real; if (bannerT <= 0) bannerEl.classList.remove('show'); }

  render();
  renderMini();
  updateHUD();
  requestAnimationFrame(frame);
}

/* ---------------- screens ---------------- */

function openOverlay(html, closable){
  ovl.innerHTML = html;
  ovl.dataset.closable = closable ? '1' : '0';
  ovl.hidden = false;
}
function closeOverlay(){ ovl.hidden = true; ovl.innerHTML = ''; }

function ambientScene(){
  // idle battlefield behind the menus so the first frame is never an empty shell
  G.M = MISSIONS[Math.min(MISSIONS.length-1, G.save.progress || 0)];
  bgSeed = 313;
  G.units = []; G.projs = []; G.parts = []; G.corpses = []; G.craters = []; G.planes = []; G.timers = [];
  G.hqP = makeHQ(0, 78, 1000); G.hqE = makeHQ(1, WORLD_LEN - 78, 1000);
  G.units.push(G.hqP, G.hqE);
  layoutCovers(G.M);
  G.live = false;
  for (let i=0;i<5;i++){
    const u = makeUnit(U[pick(['rifle','assault','mg'])], 0, 520 + i*46);
    u.moving = false; G.units.push(u);
  }
  for (let i=0;i<5;i++){
    const u = makeUnit(U[pick(['rifle','assault','mg'])], 1, 830 + i*46);
    u.moving = false; G.units.push(u);
  }
  for (let i=0;i<14;i++) G.craters.push({ x: rnd(1250,220), r: rnd(22,8), a: rnd(1) });
  G.cam.x = clamp(WORLD_LEN/2 - viewW/2, 0, maxCam());
  G.cam.manual = 1e9;
  missionTag.textContent = 'Warfare 1945';
  buildBars();
}

function showTitle(){
  G.screen = 'title';
  ambientScene();
  const prog = G.save.progress || 0;
  const done = prog >= MISSIONS.length;
  openOverlay(
    '<div class="panel">' +
      '<div class="panel-hd">' +
        '<div class="eyebrow">Combined Operations · Western Front</div>' +
        '<h1>Warfare 1945</h1>' +
        '<div class="sub">Buy squads with requisition, feed them into the line, and break the enemy command post before they break yours.</div>' +
      '</div>' +
      '<div class="panel-bd">' +
        '<div class="rowbtns">' +
          '<button class="btn primary" data-act="campaign">' + (prog > 0 ? 'Continue Campaign' : 'Start Campaign') + '</button>' +
          '<button class="btn" data-act="endless">Endless Front</button>' +
          '<button class="btn ghost" data-act="manual">Field Manual</button>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="sl">Sectors cleared</div><div class="sv">' + prog + ' / ' + MISSIONS.length + '</div></div>' +
          '<div class="stat"><div class="sl">Commendations</div><div class="sv">' + G.perks.length + '</div></div>' +
          '<div class="stat"><div class="sl">Endless best</div><div class="sv">' + (G.save.best || 0) + '</div></div>' +
        '</div>' +
        (done ? '<div class="foot">Campaign complete. The Endless Front is still open, and your commendations carry over.</div>' : '') +
        (prog > 0 ? '<div class="rowbtns"><button class="btn ghost" data-act="reset">Reset campaign</button></div>' : '') +
      '</div>' +
    '</div>', false);
  ovl.querySelector('[data-act="campaign"]').onclick = () => { Audio_.resume(); showMissions(); };
  ovl.querySelector('[data-act="endless"]').onclick = () => { Audio_.resume(); startBattle(Object.assign({}, ENDLESS), MISSIONS.length, true); };
  ovl.querySelector('[data-act="manual"]').onclick = () => showManual(showTitle);
  const rst = ovl.querySelector('[data-act="reset"]');
  if (rst) rst.onclick = () => {
    G.save = { progress:0, perks:[], best:G.save.best||0, wins:0 }; G.perks = []; save(); showTitle();
  };
}

function showMissions(){
  G.screen = 'missions';
  const prog = G.save.progress || 0;
  let cards = '';
  MISSIONS.forEach((m, i) => {
    const locked = i > prog;
    cards += '<button class="mcard' + (i < prog ? ' done' : '') + '" data-i="' + i + '"' + (locked ? ' disabled' : '') + '>' +
      '<span class="mno">Sector ' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="mnm">' + m.name + '</span>' +
      '<span class="mlc">' + (locked ? 'Locked' : m.loc) + '</span>' +
    '</button>';
  });
  openOverlay(
    '<div class="panel">' +
      '<div class="panel-hd"><div class="eyebrow">Operations Board</div><h2>Select a Sector</h2>' +
        '<div class="sub">' + (G.perks.length ? 'Commendations in effect: ' + G.perks.map(p => PERK[p].n).join(' · ') : 'No commendations yet — win a sector to earn one.') + '</div>' +
      '</div>' +
      '<div class="panel-bd"><div class="msel">' + cards + '</div>' +
      '<div class="rowbtns"><button class="btn ghost" data-act="back">Back</button></div></div>' +
    '</div>', true);
  ovl.querySelectorAll('.mcard').forEach(b => {
    if (b.disabled) return;
    b.onclick = () => showBrief(+b.dataset.i);
  });
  ovl.querySelector('[data-act="back"]').onclick = showTitle;
}

function showBrief(i){
  G.screen = 'brief';
  const m = MISSIONS[i];
  const roster = m.roster.map(id => U[id].name).join(' · ');
  openOverlay(
    '<div class="panel">' +
      '<div class="panel-hd"><div class="eyebrow">Sector ' + String(i+1).padStart(2,'0') + ' · ' + m.loc + '</div>' +
      '<h2>' + m.name + '</h2></div>' +
      '<div class="panel-bd">' +
        '<div class="brief">' + m.brief + '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="sl">Starting funds</div><div class="sv">' + fmtMoney(m.cash) + '</div></div>' +
          '<div class="stat"><div class="sl">Income / sec</div><div class="sv">' + m.income + '</div></div>' +
          '<div class="stat"><div class="sl">Enemy CP</div><div class="sv">' + m.ehq + '</div></div>' +
        '</div>' +
        '<div class="foot"><strong style="color:var(--brass)">Available:</strong> ' + roster + '</div>' +
        '<div class="rowbtns">' +
          '<button class="btn primary" data-act="go">Move Out</button>' +
          '<button class="btn ghost" data-act="back">Back</button>' +
        '</div>' +
      '</div>' +
    '</div>', true);
  ovl.querySelector('[data-act="go"]').onclick = () => { Audio_.resume(); startBattle(m, i, false); };
  ovl.querySelector('[data-act="back"]').onclick = showMissions;
}

function showPerks(){
  G.screen = 'perk';
  const avail = PERKS.filter(p => G.perks.indexOf(p.id) < 0);
  const offer = [];
  const pool = avail.slice();
  while (offer.length < 3 && pool.length){
    offer.push(pool.splice((Math.random()*pool.length)|0, 1)[0]);
  }
  const s = G.stats;
  let cards = offer.map(p => '<button class="perk" data-id="' + p.id + '"><span class="pn">' + p.n + '</span><span class="pd">' + p.d + '</span></button>').join('');
  if (!offer.length) cards = '<div class="foot">Every commendation has been awarded. Nothing left to pin on.</div>';
  openOverlay(
    '<div class="panel">' +
      '<div class="panel-hd"><div class="eyebrow">Sector cleared · ' + G.M.name + '</div><h2>Objective Taken</h2>' +
      '<div class="sub">The command post is ours. Pick one commendation — it carries through the rest of the campaign.</div></div>' +
      '<div class="panel-bd">' +
        '<div class="stats">' +
          '<div class="stat"><div class="sl">Enemy units lost</div><div class="sv">' + s.kills + '</div></div>' +
          '<div class="stat"><div class="sl">Own units lost</div><div class="sv">' + s.losses + '</div></div>' +
          '<div class="stat"><div class="sl">Time</div><div class="sv">' + fmtTime(G.t) + '</div></div>' +
          '<div class="stat"><div class="sl">Spent</div><div class="sv">' + fmtMoney(s.spent) + '</div></div>' +
        '</div>' +
        '<div class="perks">' + cards + '</div>' +
        (offer.length ? '' : '<div class="rowbtns"><button class="btn primary" data-act="on">Continue</button></div>') +
      '</div>' +
    '</div>', false);
  ovl.querySelectorAll('.perk').forEach(b => {
    b.onclick = () => {
      G.perks.push(b.dataset.id); save();
      if (G.mIndex + 1 >= MISSIONS.length) showVictory(); else showMissions();
    };
  });
  const on = ovl.querySelector('[data-act="on"]');
  if (on) on.onclick = () => { if (G.mIndex + 1 >= MISSIONS.length) showVictory(); else showMissions(); };
}

function showVictory(){
  openOverlay(
    '<div class="panel">' +
      '<div class="panel-hd"><div class="eyebrow">24 March 1945 · Rhine crossed</div><h1>The Line Holds</h1>' +
      '<div class="sub">Every sector is cleared. Your commendations stay with you — take them to the Endless Front and see how far they carry.</div></div>' +
      '<div class="panel-bd">' +
        '<div class="stats">' +
          '<div class="stat"><div class="sl">Sectors</div><div class="sv">' + MISSIONS.length + '</div></div>' +
          '<div class="stat"><div class="sl">Commendations</div><div class="sv">' + G.perks.length + '</div></div>' +
          '<div class="stat"><div class="sl">Endless best</div><div class="sv">' + (G.save.best||0) + '</div></div>' +
        '</div>' +
        '<div class="rowbtns">' +
          '<button class="btn primary" data-act="endless">Endless Front</button>' +
          '<button class="btn ghost" data-act="title">Operations Board</button>' +
        '</div>' +
      '</div>' +
    '</div>', false);
  ovl.querySelector('[data-act="endless"]').onclick = () => startBattle(Object.assign({}, ENDLESS), MISSIONS.length, true);
  ovl.querySelector('[data-act="title"]').onclick = showTitle;
}

function showResult(win, score){
  G.screen = 'result';
  const s = G.stats;
  const endless = !!G.M.endless;
  openOverlay(
    '<div class="panel">' +
      '<div class="panel-hd"><div class="eyebrow">' + G.M.name + ' · ' + G.M.loc + '</div>' +
      '<h2>' + (endless ? 'The Line Broke' : 'Command Post Overrun') + '</h2>' +
      '<div class="sub">' + (endless
        ? 'They got through in the end — they always do. Score counts every second held and every unit destroyed.'
        : 'Your CP is gone and the sector is lost. Re-form and go again; the commendations you earned still stand.') + '</div></div>' +
      '<div class="panel-bd">' +
        '<div class="stats">' +
          (endless ? '<div class="stat"><div class="sl">Score</div><div class="sv" style="color:var(--brass)">' + score + '</div></div>' +
                     '<div class="stat"><div class="sl">Best</div><div class="sv">' + (G.save.best||0) + '</div></div>' : '') +
          '<div class="stat"><div class="sl">Enemy lost</div><div class="sv">' + s.kills + '</div></div>' +
          '<div class="stat"><div class="sl">Own lost</div><div class="sv">' + s.losses + '</div></div>' +
          '<div class="stat"><div class="sl">Held for</div><div class="sv">' + fmtTime(G.t) + '</div></div>' +
        '</div>' +
        '<div class="rowbtns">' +
          '<button class="btn primary" data-act="retry">Try Again</button>' +
          '<button class="btn ghost" data-act="title">Operations Board</button>' +
        '</div>' +
      '</div>' +
    '</div>', false);
  ovl.querySelector('[data-act="retry"]').onclick = () => {
    if (endless) startBattle(Object.assign({}, ENDLESS), MISSIONS.length, true);
    else startBattle(MISSIONS[G.mIndex], G.mIndex, false);
  };
  ovl.querySelector('[data-act="title"]').onclick = showTitle;
}

let manualBack = null;
function toggleManual(){
  if (!ovl.hidden && ovl.dataset.manual === '1'){ closeManual(); return; }
  if (!ovl.hidden && ovl.dataset.closable !== '1') return;
  showManual(null);
}
function closeManual(){
  ovl.dataset.manual = '0';
  if (manualBack){ const f = manualBack; manualBack = null; f(); }
  else closeOverlay();
}
function showManual(back){
  manualBack = back || null;
  const rows = UNITS.map(u => '<tr><td>' + u.name + '</td><td>$' + u.cost + '</td><td>' + u.pop + '</td><td>' +
    (u.veh ? u.hp : u.hp + '×' + u.n) + '</td><td>' + u.range + '</td><td>' + (u.armor || 0) + '</td><td>' + u.desc + '</td></tr>').join('');
  openOverlay(
    '<div class="panel">' +
      '<div class="panel-hd"><div class="eyebrow">Issued to all section commanders</div><h2>Field Manual</h2></div>' +
      '<div class="panel-bd"><div class="manual">' +
        '<div><h3>The idea</h3><p>Requisition ticks up every second. Spend it on squads, they walk toward the enemy command post on their own, stop when something is in range, and fight. Kill the enemy CP before they kill yours. You never move a unit by hand — you choose <em>what</em> to buy and <em>when</em>.</p></div>' +
        '<div><h3>Three things that decide fights</h3><ul>' +
          '<li><strong>Cover.</strong> Sandbag lines cut incoming damage by nearly half. A squad that stops inside one is worth two in the open.</li>' +
          '<li><strong>Suppression.</strong> Machine guns pin infantry flat. Pinned squads crawl, shoot badly, and cannot close — but they are harder to kill, so finish them with mortars.</li>' +
          '<li><strong>Armour.</strong> Rifles barely scratch a tank. Bazookas and tank guns tear through one. Send the right tool or waste the money.</li>' +
        '</ul></div>' +
        '<div><h3>Veterancy</h3><p>Squads earn a chevron every few kills, up to three, and each one adds 10% damage. A veteran rifle squad sitting in cover is the cheapest thing on the field.</p></div>' +
        '<div><h3>Controls</h3><ul>' +
          '<li><span class="kbd">1</span>–<span class="kbd">8</span> deploy a unit · click a card does the same</li>' +
          '<li><span class="kbd">Q</span> barrage · <span class="kbd">W</span> air strike · <span class="kbd">E</span> resupply, then click the ground to aim</li>' +
          '<li><span class="kbd">A</span><span class="kbd">D</span> or drag to pan · <span class="kbd">F</span> follow the front · <span class="kbd">Space</span> pause · <span class="kbd">+</span><span class="kbd">-</span> speed</li>' +
        '</ul></div>' +
        '<div><h3>Order of battle</h3><div class="scroll-x"><table class="utable"><thead><tr><th>Unit</th><th>Cost</th><th>Pop</th><th>HP</th><th>Range</th><th>Armour</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '</div>' +
      '<div class="rowbtns"><button class="btn primary" data-act="close">Close</button></div></div>' +
    '</div>', true);
  ovl.dataset.manual = '1';
  ovl.querySelector('[data-act="close"]').onclick = closeManual;
}

/* ---------------- boot ---------------- */

function start(snapshot){
  load();
  if (snapshot && snapshot.perks) G.perks = snapshot.perks;
  resize();
  setSpeed(1);
  showTitle();
  lastT = performance.now();
  requestAnimationFrame(frame);
}

try {
  if (window.claude && window.claude.hot){
    window.claude.hot.snapshot(() => ({ perks: G.perks, progress: G.save.progress }));
  }
} catch(e){}

if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start({});
</script>
